<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLD — Hospital 121,000 SF — 3 Stories + Roof</title>
<style>
:root{
  /* Dark palette — matches the golden viewer. */
  --bg:#161c2e;--bg-panel:#1d2638;--bg-card:#243049;--border:#324666;
  --text:#d4dce8;--text-dim:#7d8fab;--accent:#00e5ff;
  --canvas-bg:#1c2438;
  --sld-line:#00FFFF;--sld-feeder:#8899aa;--sld-pink:#FF69B4;
  --sld-section:#39FF14;--sld-text:#FFFFFF;
  --sld-tag-bg:rgba(0,229,255,0.12);--sld-tag-border:rgba(0,229,255,0.5);
  --sld-em:#FFAA00;
}
/* Light theme — cool off-white canvas; sidebar/tooltip stay dark
   (drafting-surface-only light mode, same as the golden viewer). */
:root[data-theme="light"]{
  --canvas-bg:#eef2f8;
  --sld-line:#0a1424;--sld-feeder:#5a6680;--sld-pink:#b82d61;
  --sld-section:#2a8a2f;--sld-text:#0a1424;
  --sld-tag-bg:rgba(10,20,36,0.06);--sld-tag-border:rgba(10,20,36,0.45);
  --sld-em:#b25900;
}
#canvas-wrap{transition:background-color .15s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;overscroll-behavior:none}
#app{display:flex;height:100vh}
#sidebar{width:260px;min-width:260px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
#sidebar h1{font-size:13px;padding:16px 14px 8px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.ver-tag{font-size:9px;color:var(--text-dim);padding:0 14px 8px;margin-top:-8px}
/* Sections are cards with tappable collapse headers */
.sidebar-section{padding:0;border:1px solid var(--border);border-radius:8px;margin:6px 8px;background:var(--bg-card)}
.sec-head{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;min-height:40px;background:transparent;border:0;color:var(--text-dim);font:11px 'Courier New',monospace;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;text-align:left}
.sec-head h2{margin:0;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
.sec-head .chev{font-size:10px;transition:transform .15s}
.sec-head:hover h2,.sec-head:hover .chev{color:var(--accent)}
.sec-body{padding:0 12px 10px}
.sidebar-section.collapsed .sec-body{display:none}
.sidebar-section.collapsed .chev{transform:rotate(-90deg)}
.sheet-btn{display:block;width:100%;margin:4px 0;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text);font:12px 'Courier New',monospace;cursor:pointer;text-align:left;transition:all .15s}
.sheet-btn:hover{border-color:var(--accent);background:#172033}
.sheet-btn.active{border-color:var(--accent);background:rgba(0,229,255,.08);color:var(--accent)}
.sh-num{font-weight:700}.sh-desc{display:block;font-size:10px;color:var(--text-dim);margin-top:3px}
.stat-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
.stat-row .val{color:var(--accent);font-weight:700}
.legend-item{display:flex;align-items:center;gap:8px;font-size:10px;padding:3px 0}
.legend-swatch{width:20px;height:3px;border-radius:1px}
:root[data-theme="light"] .legend-swatch{box-shadow:0 0 0 3px #ffffff;margin:0 3px}
.ctrl-btn{display:inline-block;padding:5px 10px;margin:2px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:10px 'Courier New',monospace;cursor:pointer;transition:all .15s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.render-cov{font-size:10px;color:var(--text-dim);padding:8px 14px;border-top:1px solid var(--border)}
.render-cov .ok{color:#39ff14;font-weight:700}
.render-cov .miss{color:#ff4444;font-weight:700}
.render-cov .warn{color:#ffb347;font-weight:700}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--canvas-bg);touch-action:none}
#canvas-wrap svg{position:absolute;top:0;left:0;transform-origin:0 0}
#tooltip{display:none;position:fixed;z-index:999;background:#0e1420ee;border:1px solid var(--accent);border-radius:6px;padding:10px 14px;font:11px 'Courier New',monospace;color:var(--text);max-width:340px;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#tooltip .tt-title{color:var(--accent);font-weight:700;margin-bottom:4px}
#tooltip .tt-row{display:flex;gap:8px;padding:1px 0}
#tooltip .tt-label{color:var(--text-dim);min-width:80px}
#zoom-ind{position:absolute;bottom:12px;right:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font:10px 'Courier New',monospace;color:var(--text-dim)}
/* Hamburger — floats over the canvas; collapses the rail (wide) or opens
   the off-canvas drawer (narrow). */
#sidebar-toggle{position:absolute;top:10px;left:10px;z-index:60;width:42px;height:42px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-size:18px;cursor:pointer;transition:border-color .15s}
#sidebar-toggle:hover{border-color:var(--accent)}
#app.sidebar-hidden #sidebar{display:none}
#sidebar-backdrop{display:none}
@media (max-width:720px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:100;width:min(84vw,320px);min-width:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 32px rgba(0,0,0,.5)}
  #app.drawer-open #sidebar{transform:none}
  #app.sidebar-hidden #sidebar{display:flex}
  #sidebar-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5)}
}
@media (max-width:720px),(pointer:coarse){
  .ctrl-btn{min-height:40px;font-size:12px;padding:8px 12px}
  .sheet-btn{min-height:44px;font-size:13px}
  .sec-head{min-height:44px;font-size:12px}
  .sec-head h2{font-size:12px}
  .legend-item{min-height:36px;font-size:12px}
  #zoom-ind{font-size:12px;padding:6px 12px}
}
/* ---- ported functional shell: clipboard · copy-toast · layers · audit · help ----
   All of this is UI over the ALREADY-rendered SVG; none of it touches
   buildSheet / the renderers / the geometry. */
.head-meta{font-size:9px;color:var(--text-dim);font-weight:400;text-transform:none;letter-spacing:0}
.clip-list{max-height:160px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:var(--bg);padding:4px 6px;margin-bottom:6px;font-size:10px;line-height:1.5}
.clip-item{padding:1px 0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-empty{color:var(--text-dim);opacity:.7}
.clip-clear{display:block;width:100%;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:10px 'Courier New',monospace;cursor:pointer;transition:all .15s}
.clip-clear:hover{border-color:#ff4444;color:#ff4444}
.clip-clear:disabled{opacity:.4;cursor:not-allowed}
.clip-clear:disabled:hover{border-color:var(--border);color:var(--text-dim)}
label.legend-item{cursor:pointer}
.legend-item input{accent-color:var(--accent);cursor:pointer;margin:0}
/* Hidden layers use VISIBILITY (not display) so extent/getBBox is unchanged. */
#sld-svg .ly-hide{visibility:hidden}
#copy-toast{position:fixed;z-index:1500;transform:translate(-50%,-140%);background:#0e1420ee;border:1px solid var(--accent);border-radius:6px;padding:6px 12px;font:11px 'Courier New',monospace;color:var(--text);pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#copy-toast.show{opacity:1}
#copy-toast.err{border-color:#ff4444;color:#ff9a9a}
#audit-panel .ok{color:#39ff14;font-weight:700}
#audit-panel .miss{color:#ff4444;font-weight:700}
#audit-panel .warn{color:#ffb347;font-weight:700}
#help-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(10,15,25,.82);align-items:center;justify-content:center;padding:20px}
#help-overlay-card{background:var(--bg-panel);border:1px solid var(--accent);border-radius:8px;padding:20px 24px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.6)}
#help-overlay-card h2{font-size:14px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#help-overlay-close{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:11px 'Courier New',monospace;padding:3px 8px;cursor:pointer}
#help-overlay-close:hover,#help-overlay-close:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#help-overlay-body{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;font-size:11px}
#help-overlay-body .help-group h3{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px}
#help-overlay-body dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
#help-overlay-body dt{color:var(--accent);font-weight:700;white-space:nowrap}
#help-overlay-body dd{color:var(--text)}
@media (max-width:720px){#help-overlay-body{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
  <h1 id="app-heading">Hospital SLD</h1>
  <div id="app-version" class="ver-tag">bad example · sld_topology/v1</div>
  <div class="sidebar-section" data-sec="project">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Project</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <div style="font-size:10px;color:var(--text-dim);line-height:1.5">
        Hospital — 121,000 SF<br>
        3 stories + roof<br>
        2500 kVA service<br>
        NFPA 99 Type I EES<br>
        NFPA 110 Level 1
      </div>
    </div>
  </div>
  <div class="sidebar-section" data-sec="sheets">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Sheets</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <button class="sheet-btn active" data-sheet="S1" onclick="selectSheet('S1')">
        <span class="sh-num">E-501</span>
        <span class="sh-desc">Normal power — 4MDP-1-A</span>
      </button>
      <button class="sheet-btn" data-sheet="S2" onclick="selectSheet('S2')">
        <span class="sh-num">E-502</span>
        <span class="sh-desc">Emergency power — E4MDP-1-A</span>
      </button>
    </div>
  </div>
  <div class="sidebar-section" id="stats-section" data-sec="stats">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Composition</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body" id="stats-body"></div>
  </div>
  <div class="sidebar-section" id="clipboard-section" data-sec="clipboard">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Clipboard</h2><span class="head-meta clip-count" id="clip-count">0 items</span>
    </button>
    <div class="sec-body">
      <div class="clip-list" id="clip-list"></div>
      <button type="button" class="clip-clear" id="clip-clear" disabled>Clear</button>
    </div>
  </div>
  <div class="sidebar-section" data-sec="legend">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Legend / Layers</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="bus" checked><div class="legend-swatch" style="background:var(--sld-line);height:3px"></div>Buses (main / secondary)</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="feeder" checked><div class="legend-swatch" style="background:var(--sld-feeder);height:1.5px"></div>Feeders 1.5pt</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="section" checked><div class="legend-swatch" style="background:var(--sld-section)"></div>Section boundaries</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="squiggle" checked><div class="legend-swatch" style="background:var(--sld-pink)"></div>Bus tees / squiggles</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="annotation" checked><div class="legend-swatch" style="background:var(--sld-tag-border)"></div>Annotations (A-1 tags)</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="device" checked><div class="legend-swatch" style="background:var(--sld-text)"></div>Device glyphs</label>
    </div>
  </div>
  <div class="sidebar-section" data-sec="controls">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Controls</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <button type="button" class="ctrl-btn" onclick="zoomIn()">Zoom +</button>
      <button type="button" class="ctrl-btn" onclick="zoomOut()">Zoom −</button>
      <button type="button" class="ctrl-btn" onclick="fitView()">Fit</button>
      <button type="button" class="ctrl-btn" onclick="resetView()">Reset</button>
      <button type="button" class="ctrl-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Switch to light theme">☾ Dark</button>
      <button type="button" class="ctrl-btn" id="snapshot-btn" title="Save a clean PNG of this sheet (full diagram, ignores pan/zoom). Key: S · Shift+S saves the SVG">📷 Snapshot</button>
      <button type="button" class="ctrl-btn" id="element-snap-btn" title="Save a cropped PNG of the last-clicked device (tap a device first; key: L)">🔍 Element</button>
      <button type="button" class="ctrl-btn" id="page-dl-btn" title="Save a PNG of the composed Arch E1 sheet (diagram + title-block frame; ignores pan/zoom). Key: P">🗎 Page PNG</button>
      <button type="button" class="ctrl-btn" id="export-geom-btn" title="Export the computed (deliberately-flawed) geometry as a JSON block. Key: G">⤓ Export Geometry</button>
      <button type="button" class="ctrl-btn" id="audit-btn" title="Run the geometry audit and toggle red finding boxes (key: V)">✓ Check</button>
      <button type="button" class="ctrl-btn" id="help-btn" title="Show keyboard shortcuts (key: ?)">? Help</button>
    </div>
  </div>
  <div class="render-cov" id="render-cov"></div>
  <div class="render-cov" id="audit-panel" style="display:none"></div>
</div>
<div id="canvas-wrap">
  <svg id="sld-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="zoom-ind">100%</div>
</div>
  <button type="button" id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
</div>
<div id="sidebar-backdrop" hidden></div>
<div id="tooltip"></div>
<div id="copy-toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="help-overlay" role="dialog" aria-modal="true" aria-labelledby="help-overlay-title" aria-hidden="true">
  <div id="help-overlay-card">
    <h2 id="help-overlay-title">Keyboard Shortcuts
      <button type="button" id="help-overlay-close" aria-label="Close help">Close (Esc)</button>
    </h2>
    <div id="help-overlay-body"><!-- populated by showHelpOverlay() --></div>
  </div>
</div>

// MANIFEST — strict 1:1, no fake-marking

class RenderManifest {
  constructor(sheetId, intentionalSkips) {
    this.expected = new Map();
    this.intentionalSkips = new Set(intentionalSkips || []);
    this.done = new Set();
    TOPO.devices.filter(d => d.sheet_id === sheetId && !this.intentionalSkips.has(d.id))
      .forEach(d => this.expected.set(d.id, {type:'device', obj:d, label:d.designation||d.node_type}));
    TOPO.routed_elements.filter(r => r.sheet_id === sheetId && r.edge_type === 'R-1' && !this.intentionalSkips.has(r.id))
      .forEach(r => this.expected.set(r.id, {type:'re', obj:r, label:r.designation || r.id}));
    TOPO.annotations.filter(a => a.sheet_id === sheetId && !this.intentionalSkips.has(a.id))
      .forEach(a => this.expected.set(a.id, {type:'ann', obj:a, label:a.annotation_type+' on '+a.bound_to}));
  }
  rendered(id) {
    // Only count rendered events for IDs in the expected set — no inflation from non-visual entities
    if (this.expected.has(id)) this.done.add(id);
  }
  audit() {
    const misses = [];
    for (const [id, meta] of this.expected) { if (!this.done.has(id)) misses.push({id, ...meta}); }
    return {
      total: this.expected.size,
      rendered: this.done.size,
      ok: misses.length === 0,
      misses,
      intentionalSkips: this.intentionalSkips.size,
    };
  }
}
let manifest = null;
let renderedIds = {
  _set: new Set(),
  add(id) { this._set.add(id); if (manifest) manifest.rendered(id); },
  has(id) { return this._set.has(id); },
  get size() { return this._set.size; }
};

function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function orthoPath(x1, y1, x2, y2, bias) {
  if (x1 === x2 || y1 === y2) return `${x1},${y1} ${x2},${y2}`;
  if (bias === 'h-first') return `${x1},${y1} ${x2},${y1} ${x2},${y2}`;
  return `${x1},${y1} ${x1},${y2} ${x2},${y2}`;
}

  if (df.nfpa_level) s += `<text x="${txtX}" y="${cy+22}" font-family="'Courier New',monospace" font-size="9" fill="var(--sld-text)">${esc(df.nfpa_level)}</text>`;
  s += `</g>`;
  return s;
};

// L2-4 Panelboard — anchor at top-left
RENDER['L2-4'] = (d, g) => {
  const px = g.x, py = g.y;
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  s += `<rect x="${px}" y="${py}" width="${DIM.panel_S}" height="${DIM.panel_S}" fill="rgba(0,0,0,.3)" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  if (d.designation) s += `<text x="${px+70}" y="${py+26}" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(d.designation)}</text>`;
  const df = d.data_fields || {};
  const lines = [];
  if (df.voltage) lines.push(df.voltage);
  if (df.mlo) lines.push('MLO');
  else if (df.mcb) lines.push('MCB');
  if (df.rating) lines.push(df.rating);
  lines.slice(0,3).forEach((ln, i) => {
    s += `<text x="${px+70}" y="${py+50+i*16}" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="var(--sld-text)">${esc(ln)}</text>`;
  });
  // Floor badge from designation pattern e.g. 4S-1-A, 2L-R-A
  if (d.designation) {
    const parts = d.designation.split('-');
    if (parts.length >= 2) {
      const lv = parts[1];
      if (['B','1','2','3','4','5','6','7','8','R'].includes(lv)) {
        const bl = lv === 'B' ? 'B' : lv === 'R' ? 'R' : 'L'+lv;
        s += `<rect x="${px+DIM.panel_S-30}" y="${py+DIM.panel_S-22}" width="26" height="18" rx="3" fill="rgba(57,255,20,0.12)" stroke="rgba(57,255,20,0.4)" stroke-width="0.6"/>`;
        s += `<text x="${px+DIM.panel_S-17}" y="${py+DIM.panel_S-8}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="700" fill="#39FF14" opacity=".7">${bl}</text>`;
      }
    }
  }
  s += `</g>`;
  return s;
};

// L2-3 ATS — anchor at top-left, 140x140 box
RENDER['L2-3'] = (d, g) => {

  const S = DIM.ats_S;
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  s += `<rect x="${ax}" y="${ay}" width="${S}" height="${S}" fill="rgba(0,0,0,.3)" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  // Three nodes: load (top), source1 (bottom-left), source2 (bottom-right)
  s += `<circle cx="${ax+70}" cy="${ay+28}" r="10" fill="none" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  s += `<circle cx="${ax+35}" cy="${ay+108}" r="10" fill="none" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  s += `<circle cx="${ax+105}" cy="${ay+108}" r="10" fill="none" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  // Default throw to source1 (normal)
  const dx1 = 35-70, dy1 = 108-28, len = Math.sqrt(dx1*dx1+dy1*dy1);
  const ex1 = 70 + dx1*10/len, ey1 = 28 + dy1*10/len;
  const ex2 = 35 - dx1*10/len, ey2 = 108 - dy1*10/len;
  s += `<line x1="${ax+ex1}" y1="${ay+ey1}" x2="${ax+ex2}" y2="${ay+ey2}" stroke="var(--sld-line)" stroke-width="2.5"/>`;

  s += `</g>`;
  return s;
};

// ============================================================
// TAG RENDERING
// ============================================================
function renderTag(ann, fx, fy, side, orient) {
  const txt = getTagText(ann);
  const textLen = txt.length;
  const w = textLen<=4 ? 76 : (textLen<=5 ? 90 : (textLen<=8 ? 108 : Math.min(160, textLen*11)));
  let s = '';
  if (orient === 'horizontal') {
    s += `<line x1="${fx-8}" y1="${fy+10}" x2="${fx+8}" y2="${fy-10}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    const pillY = fy-32-31;
    s += `<line x1="${fx}" y1="${fy}" x2="${fx}" y2="${pillY+31}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${fx-w/2}" y="${pillY}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${fx}" y="${pillY+20}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  } else if (side === 'right') {
    s += `<line x1="${fx-10}" y1="${fy+8}" x2="${fx+10}" y2="${fy-8}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    const pillX = fx+32;
    s += `<line x1="${fx}" y1="${fy}" x2="${pillX}" y2="${fy}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${pillX}" y="${fy-15.5}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${pillX+w/2}" y="${fy+5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  } else {
    s += `<line x1="${fx-10}" y1="${fy+8}" x2="${fx+10}" y2="${fy-8}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    const px = fx-32-w;
    s += `<line x1="${fx}" y1="${fy}" x2="${px+w}" y2="${fy}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${px}" y="${fy-15.5}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${px+w/2}" y="${fy+5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  }
  renderedIds.add(ann.id);
  // Wrap in an identifiable group so the "Annotations" layer can toggle A-1
  // tags. The group carries no transform, so geometry is unchanged.
  return `<g class="ann-tag" data-id="${ann.id}">${s}</g>`;
}

function renderR1Tags(r, fx, fy, side, orient) {
  let svg = '';
  const a1s = [], a2s = [];
  (annByBound[r.id] || []).forEach(ann => {
    if (ann.annotation_type === 'A-1') a1s.push(ann);
    else if (ann.annotation_type === 'A-2') a2s.push(ann);
  });
  let off = 0;
  a1s.forEach(ann => {
    if (orient === 'horizontal') { svg += renderTag(ann, fx+off, fy, side, 'horizontal'); off += 100; }
    else { svg += renderTag(ann, fx, fy-off, side); off += 40; }
  });
  // A-2 callouts indexed rendered (visible in tooltip but not drawn to avoid clutter)
  a2s.forEach(ann => renderedIds.add(ann.id));
  return svg;
}

// A-3 Squiggle
function renderSquiggle(x, y, text, textSide, orient) {
  let s = '';
  const hs = 20, amp = 16;
  const o = orient || 'horizontal';
  if (o === 'vertical') {
    s += `<path d="M${x},${y-hs} C${x+amp},${y-hs} ${x+amp},${y-hs/2} ${x},${y} C${x-amp},${y+hs/2} ${x-amp},${y+hs} ${x},${y+hs}" fill="none" stroke="var(--sld-pink)" stroke-width="2.5" stroke-linecap="round"/>`;
    if (textSide === 'left') s += `<text x="${x-28}" y="${y+4}" text-anchor="end" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else s += `<text x="${x+28}" y="${y+4}" text-anchor="start" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
  } else {
    s += `<path d="M${x-hs},${y} C${x-hs},${y+amp} ${x-hs/2},${y+amp} ${x},${y} C${x+hs/2},${y-amp} ${x+hs},${y-amp} ${x+hs},${y}" fill="none" stroke="var(--sld-pink)" stroke-width="2.5" stroke-linecap="round"/>`;
    if (textSide === 'above') s += `<text x="${x}" y="${y-24}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else s += `<text x="${x}" y="${y+28}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
  }
  return s;
}

// Switchboard text (right-aligned, left of lineup)
function swText(x, y, sw) {
  let s = '';
  const df = sw.data_fields || {};
  const lines = [sw.designation, df.rating||'', df.voltage||'', df.wires||'', df.aic||''];
  lines.filter(Boolean).forEach((line, i) => {
    const style = i===0 ? 'font-weight:700;text-decoration:underline;font-size:13px' : 'font-size:11px';
    s += `<text x="${x}" y="${y+i*18}" text-anchor="end" font-family="'Courier New',monospace" fill="var(--sld-text)" style="${style}">${esc(line)}</text>`;
  });
  return s;
}

// ============================================================
// PLACE ALL CHAINS — unified dispatch by R-1 end device type
// Adapted from 7-story golden §placeAllChains (lines 1493-1600)
// ============================================================
function placeAllChains(sheetId, secBusY, mainBusY) {
  let svg = '';
  const sheetR1s = TOPO.routed_elements.filter(r => r.sheet_id === sheetId && r.edge_type === 'R-1');

  sheetR1s.forEach(r => {
    if (!r.start) return;  // stub-exempt: handled by destination-side rendering
    const srcDev = devMap[r.start.device_id];
    if (!srcDev || srcDev.node_type !== 'L2-1') return;
    // Skip internal breakers — they don't have geometry (their chains emerge from parent panel)
    if (srcDev.data_fields && srcDev.data_fields.internal_to) return;
    if (!G[r.start.device_id]) return;

    const bx = G[r.start.device_id].x;
    const topY = secBusY - DIM.cb_height;

    // Cross-sheet source-side: either r.end===null OR r.end points to a device on a different sheet
    const isCrossSheetSource = (r.end === null)
      || (r.end && devMap[r.end.device_id] && devMap[r.end.device_id].sheet_id !== sheetId);
    if (isCrossSheetSource) {
      // Get A-3 from this R-1, or from the paired cross-sheet R-1
      let a3 = (annByBound[r.id] || []).find(a => a.annotation_type === 'A-3');
      let squigText = a3 ? a3.content.text : null;
      if (!squigText && r.end) {
        // Look up dest designation from the cross-ref
        const dstDev = devMap[r.end.device_id];
        if (dstDev) squigText = 'TO ' + (dstDev.designation || dstDev.node_type);
      }
      if (!squigText) squigText = 'TO (cross-sheet)';
      const stubEndY = topY - DIM.chain_h_min + DIM.cb_height;
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${stubEndY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      svg += renderSquiggle(bx, stubEndY, squigText, 'above', 'horizontal');
      if (a3) renderedIds.add(a3.id);
      svg += renderR1Tags(r, bx, topY - DIM.tag_gap, 'right');
      renderedIds.add(r.id);
      return;
    }

    const dstDev = devMap[r.end.device_id];
    if (!dstDev || dstDev.sheet_id !== sheetId) return;

    if (dstDev.node_type === 'L2-4') {
      // Chain A: breaker → panel feed_top
      const eqY = topY - DIM.chain_h_min + DIM.cb_height - DIM.panel_S;
      G[dstDev.id] = { x: bx - DIM.panel_S/2, y: eqY };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${eqY + DIM.panel_S}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L2-2') {
      // Chain B head: breaker → transformer primary_in
      const txY = topY - DIM.tag_gap - DIM.equip_gap;
      G[dstDev.id] = { x: bx - DIM.xfmr_S/2, y: txY };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${txY + DIM.xfmr_S}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      renderedIds.add(dstDev.id);
      // Secondary → panel
      const secR1 = TOPO.routed_elements.find(r2 => r2.edge_type === 'R-1' && r2.start && r2.start.device_id === dstDev.id && r2.start.port === 'secondary_out');
      if (secR1 && secR1.end) {
        const secP = devMap[secR1.end.device_id];
        if (secP && secP.sheet_id === sheetId) {
          const spY = txY - DIM.tag_gap - DIM.equip_gap - DIM.equip_stub - DIM.panel_S;
          G[secP.id] = { x: bx - DIM.panel_S/2, y: spY };
          svg += renderDevice(secP, G[secP.id]);
          svg += `<line x1="${bx}" y1="${txY}" x2="${bx}" y2="${spY + DIM.panel_S}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
          renderedIds.add(secP.id);
          svg += renderR1Tags(secR1, bx, txY - 30, 'right');
          renderedIds.add(secR1.id);
        }
      }
    } else if (dstDev.node_type === 'L2-6') {
      // Chain E: breaker → SPD line_in
      const lineInY = topY - DIM.chain_h_min + DIM.cb_height;
      G[dstDev.id] = { x: bx - 31, y: lineInY - 26 };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${lineInY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L3-1') {
      // Chain D: breaker → Fire Pump (motor + starter box)
      const eqY = topY - DIM.chain_h_min + DIM.cb_height - 12;
      G[dstDev.id] = { x: bx, y: eqY };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${eqY-26}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L3-3') {
      // Chain F: breaker → Equipment Connection
      const eqY = topY - DIM.chain_h_min + DIM.cb_height;
      G[dstDev.id] = { x: bx, y: eqY };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<line x1="${bx}" y1="${topY}" x2="${bx}" y2="${eqY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L2-3') {
      // Chain C on S2: breaker → ATS source2_in (normal-side feed on NP sheet handled as cross-sheet)
      // Only draw if ATS is on this sheet (which it is for S2 hospital)
      if (G[dstDev.id]) {
        // ATS source2_in end position (pre-placed in placeATSsAndGen)
        const atsSrc2X = G[dstDev.id].x + 105;
        const atsSrc2Y = G[dstDev.id].y + DIM.ats_S + DIM.ats_stub_bottom;
        // L-path: up from breaker, then down from above into ATS source2 stub
        const jogY = Math.min(topY, atsSrc2Y) - DIM.equip_gap;
        svg += `<polyline points="${bx},${topY} ${bx},${jogY} ${atsSrc2X},${jogY} ${atsSrc2X},${atsSrc2Y}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
        // Tags just above breaker
        svg += renderR1Tags(r, bx, topY - DIM.tag_gap, 'right');
        renderedIds.add(r.id);
      }
      return;  // already rendered
    } else {
      console.warn('[Chain] Unknown dest type', dstDev.node_type, 'for', r.id);
      return;
    }

    // Feeder tags for this R-1
    svg += renderR1Tags(r, bx, topY - DIM.tag_gap, 'right');
    renderedIds.add(r.id);
  });

  return svg;
}

// ============================================================
// PLACE SUB-FEEDS — panel feed_bottom → panel feed_top
// Mirrors lab golden's placeRiser but as horizontal stagger
// For hospital: 4M-R-A → 4M-R-B/4M-R-C, E4S-1-X → E4B-1-X, etc.
// ============================================================
function placeSubFeeds(sheetId) {
  let svg = '';
  // Group sub-feeds by parent device
  const byParent = {};
  TOPO.routed_elements.filter(r => r.edge_type === 'R-1' && r.sheet_id === sheetId).forEach(r => {
    if (!r.start || !r.end) return;
    const srcDev = devMap[r.start.device_id];
    const dstDev = devMap[r.end.device_id];
    if (!srcDev || !dstDev) return;
    if (srcDev.node_type !== 'L2-4' || dstDev.node_type !== 'L2-4') return;
    if (r.start.port !== 'feed_bottom') return;
    if (!G[srcDev.id]) return;
    if (!byParent[srcDev.id]) byParent[srcDev.id] = [];
    byParent[srcDev.id].push({r, src:srcDev, dst:dstDev});
  });

  Object.values(byParent).forEach(group => {
    const pg = G[group[0].src.id];
    const parentBotX = pg.x + DIM.panel_S/2;
    const parentBotY = pg.y + DIM.panel_S;
    // Place children in a row below parent, spread horizontally
    const n = group.length;
    const spacing = DIM.panel_S + 60;
    const totalW = n * spacing;
    const startX = parentBotX - totalW/2 + spacing/2 - DIM.panel_S/2;
    const childY = parentBotY + 120;
    group.forEach((item, i) => {
      const childX = startX + i*spacing;
      const childTopX = childX + DIM.panel_S/2;
      G[item.dst.id] = { x: childX, y: childY };
      svg += renderDevice(item.dst, G[item.dst.id]);
      renderedIds.add(item.dst.id);
      // L-path: parent bottom → (down) → (horizontal) → child top
      svg += `<polyline points="${parentBotX},${parentBotY} ${parentBotX},${parentBotY+50} ${childTopX},${parentBotY+50} ${childTopX},${childY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      // Tag on the horizontal segment
      svg += renderR1Tags(item.r, (parentBotX+childTopX)/2, parentBotY+50, 'right', 'horizontal');
      renderedIds.add(item.r.id);
    });
  });

  return svg;
}

// ============================================================
// PLACE PANEL-INTERNAL CHAINS — internal_to breakers
// Hospital's 4S-N-A has internal CBs (CB-A, CB-B) feeding 4T → 2L chains
// Render: hide internal breaker, chain emerges from parent panel feed_bottom
// As a compact TX + 2L panel pair below the parent
// ============================================================
function placeInternalChains(sheetId) {
  let svg = '';
  // Find all internal breakers on this sheet and their chains
  const internals = TOPO.devices.filter(d => d.sheet_id === sheetId
    && d.node_type === 'L2-1'
    && d.data_fields && d.data_fields.internal_to);

  // Group by parent panel
  const byParent = {};
  internals.forEach(cb => {
    const parentDesig = cb.data_fields.internal_to;
    if (!byParent[parentDesig]) byParent[parentDesig] = [];
    byParent[parentDesig].push(cb);
  });

  Object.entries(byParent).forEach(([parentDesig, cbs]) => {
    const parent = TOPO.devices.find(d => d.designation === parentDesig && d.sheet_id === sheetId);
    if (!parent || !G[parent.id]) return;
    const pg = G[parent.id];
    // Parent feed_bottom port: bottom-center of parent panel box
    // BUT — in the topology, the parent is UPSTREAM from the internal chain.
    // Power flows from parent → internal CB → TX → 2L panel.
    // On the sheet, power flow is visually bottom-to-top (bus at high Y, loads at low Y).
    // So the internal chain must grow UPWARD (toward smaller Y) from the parent.
    // Feeder exits the parent from feed_TOP (top-center), not feed_bottom — treating parent's
    // top as the "downstream connection point" for the internal sub-chain.
    // Actually: parent panel already sits above its feeding breaker. The INTERNAL chain
    // is further downstream still, so it sits ABOVE the parent (smaller Y).
    const parentTopX = pg.x + DIM.panel_S/2;
    const parentTopY = pg.y;  // top of parent panel

    const n = cbs.length;
    const spacing = DIM.panel_S + 80;
    const totalW = n * spacing;
    // Center the internal chains over the parent, slightly offset to avoid feeder overlap
    const startX = parentTopX - totalW/2 + spacing/2;

    // Each internal chain (above parent): TX + 2L panel
    // Chain layout (bottom-up): parent top → feeder → TX → secondary → 2L panel
    // TX sits at parentTopY - tag_gap - equip_gap - xfmr_S
    // 2L panel sits at TX_top - tag_gap - equip_gap - equip_stub - panel_S
    const txY = parentTopY - DIM.tag_gap - DIM.equip_gap - DIM.xfmr_S;
    const panelY = txY - DIM.tag_gap - DIM.equip_gap - DIM.equip_stub - DIM.panel_S;

    cbs.forEach((cb, i) => {
      renderedIds.add(cb.id);  // internal CB has no visible symbol
      const cbR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === cb.id);
      if (!cbR1 || !cbR1.end) return;
      const tx = devMap[cbR1.end.device_id];
      if (!tx || tx.node_type !== 'L2-2') return;

      const cbX = startX + i*spacing;  // column X for this internal chain
      G[tx.id] = { x: cbX - DIM.xfmr_S/2, y: txY };
      svg += renderDevice(tx, G[tx.id]);
      renderedIds.add(tx.id);

      // Feeder from parent top center → TX primary_in (bottom center of TX)
      // L-path: from parent top up to chain-bottom Y, across to cbX, up into TX
      const txPrimX = G[tx.id].x + DIM.xfmr_S/2;
      const txPrimY = G[tx.id].y + DIM.xfmr_S;  // TX bottom-center = primary_in
      svg += `<polyline points="${parentTopX},${parentTopY} ${parentTopX},${txPrimY + DIM.equip_stub} ${txPrimX},${txPrimY + DIM.equip_stub} ${txPrimX},${txPrimY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      svg += renderR1Tags(cbR1, txPrimX, txPrimY + DIM.tag_gap, 'right');
      renderedIds.add(cbR1.id);

      // Secondary: TX secondary_out (top center of TX) → 2L panel feed_top
      const secR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === tx.id && r.start.port === 'secondary_out');
      if (secR1 && secR1.end) {
        const panel = devMap[secR1.end.device_id];
        if (panel && panel.sheet_id === sheetId) {
          G[panel.id] = { x: cbX - DIM.panel_S/2, y: panelY };
          svg += renderDevice(panel, G[panel.id]);
          renderedIds.add(panel.id);
          // Secondary feeder: TX top center → panel bottom center (vertical straight line)
          const txTopX = cbX;
          const txTopY = G[tx.id].y;
          const panelBotY = panelY + DIM.panel_S;
          svg += `<line x1="${txTopX}" y1="${txTopY}" x2="${txTopX}" y2="${panelBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
          svg += renderR1Tags(secR1, txTopX, txTopY - DIM.tag_gap, 'right');
          renderedIds.add(secR1.id);
        }
      }
    });
  });

  return svg;
}

// ============================================================
// PLACE RISER — floors 2/3 emergency chains
// Mirrors 7-story golden's placeRiser (lines 1639-1744)
// Each floor steps UP from previous (lower Y), with floor module beside it
// ============================================================
function placeRiser(sheetId, homePanelDesig, subDesigs) {
  let svg = '';
  const homePanel = TOPO.devices.find(d => d.designation === homePanelDesig);
  if (!homePanel || !G[homePanel.id]) return svg;
  const hg = G[homePanel.id];
  let prevCX = hg.x + DIM.panel_S/2;
  let prevTopY = hg.y;

  subDesigs.forEach((sd, fi) => {
    const subDev = TOPO.devices.find(d => d.designation === sd);
    if (!subDev) return;
    // Grow upward
    const subY = prevTopY - DIM.chain_h_min - DIM.riser_gap;
    const subX = prevCX - DIM.panel_S/2;
    G[subDev.id] = { x: subX, y: subY };
    svg += renderDevice(subDev, G[subDev.id]);
    // Riser feeder: from upstream panel top to new panel bottom
    svg += `<line x1="${prevCX}" y1="${prevTopY}" x2="${prevCX}" y2="${subY + DIM.panel_S}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
    renderedIds.add(subDev.id);

    // Riser R-1 tags
    const riserR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.end && r.end.device_id === subDev.id && r.sheet_id === sheetId);
    if (riserR1) {
      svg += renderR1Tags(riserR1, prevCX, prevTopY - DIM.tag_gap, 'right');
      renderedIds.add(riserR1.id);
    }

    prevCX = subX + DIM.panel_S/2;
    prevTopY = subY;
  });
  return svg;
}

// ============================================================
// PLACE ATS + GENERATOR on S2 per §3.8 convention
// ATS: left of EM switchboard, vertically centered on switchboard
// Generator: left of ATS, vertically centered on ATS
// ATS load_out → L-path UP/RIGHT/DOWN to EM bus tap
// ATS source1_in → squiggle "FROM 4MDP-1-A" below
// ATS source2_in → L-path from gen (DOWN/RIGHT/UP)
// ============================================================
function placeATSsAndGenerator(sheetId, emSwbdStartX, swAnchorY, sectionH, incSecX) {
  if (sheetId !== 'S2') return '';
  let svg = '';

  // Find all ATSs on S2 ordered by designation (reasonable NEC-class ordering)
  const atsOrder = ['FP-ATS','E4A-1-A','E4A-1-B','E4A-1-C','E4A-1-D','O4A-1-A','4A-1-E'];
  const atsDevs = TOPO.devices.filter(d => d.sheet_id === sheetId && d.node_type === 'L2-3');
  const ordered = atsOrder
    .map(desig => atsDevs.find(a => a.designation === desig))
    .filter(Boolean);
  // Append any unordered (safety)
  atsDevs.forEach(a => { if (!ordered.includes(a)) ordered.push(a); });

  // Stack ATSs vertically to the left of EM switchboard, each feeding its own bus tap
  // The EM switchboard has 3 sections (700, 701, 702) — ATSs feed per-class
  // For layout simplicity: ATSs in a vertical column, each at progressively higher Y (further right along EM bus)
  // BUT spec convention says load_out goes UP to switchboard. So ATSs must all be BELOW the switchboard.
  // Strategy: horizontal row of ATSs ALL below the EM switchboard (like single-ATS case, but multiple).
  // Each ATS positioned directly below its target bus tap (a distribution breaker on EM bus).

  // The EM switchboard bus Y is at swAnchorY + sw_dist_bus_offset (MLO)
  const emBusY = swAnchorY + DIM.sw_dist_bus_offset;

  // Each ATS's load_out goes UP to feed a distribution breaker on the EM bus (not a bus tap directly).
  // Wait — my topology has each dist breaker on EM bus → ATS source2_in, and ATS load_out → an E4S/O4S panel.
  // So it's Pattern 4 "Multiple ATS, separate switchboards" — or more accurately, ATS load_out feeds a
  // downstream panel, not the EM switchboard bus.
  //
  // Actually looking at hospital topology: ATS load_out → E4S-1-A (emergency sub-distribution).
  // The EM switchboard feeds the ATS source2 (emergency side) via its distribution breakers.
  // So: EMSB distribution CB → ATS source2_in (Chain C)
  //     ATS load_out → E4S-1-X (separate panel, not bussed into EMSB)
  // ATS is a hop between EMSB and the sub-dist panel.
  //
  // Placement: ATSs sit BETWEEN the EMSB (below) and their downstream E4S panels (above).
  // EMSB sits at bottom of S2.
  // ATS row sits above EMSB.
  // E4S/O4S panels sit above the ATSs.

  // ATS Y: above EMSB top, with enough room for the Chain C feeder (breaker top → ATS source2)
  const atsY = swAnchorY - DIM.chain_h_min;  // chain_h_min above switchboard

  // Horizontal layout: ATSs spread across the width of the EMSB distribution area
  // Use same X as the dist breaker feeding each ATS source2_in (center the ATS on its feeding breaker)
  // For now, space ATSs evenly and let the Chain C polyline math handle the connection.
  const atsSpacing = DIM.ats_S + 280;  // generous spacing for readability
  const totalATSWidth = ordered.length * atsSpacing;
  // Center the ATS row horizontally over the distribution section(s)
  // We'll compute this relative to switchboard position
  const emCenterX = emSwbdStartX + 800;  // rough center of EM switchboard lineup (will be refined)
  const atsStartX = emCenterX - totalATSWidth/2 + atsSpacing/2 - DIM.ats_S/2;

  ordered.forEach((ats, i) => {
    const ax = atsStartX + i * atsSpacing;
    const ay = atsY;
    G[ats.id] = { x: ax, y: ay };
    svg += renderDevice(ats, G[ats.id]);
    renderedIds.add(ats.id);

    // Cross-sheet source1 squiggle BELOW ATS (normal source arriving from NP sheet)
    // source1_in bottom stub endpoint: (ax + 35, ay + ats_S + ats_stub_bottom)
    const s1X = ax + 35;
    const s1Y = ay + DIM.ats_S + DIM.ats_stub_bottom;
    // Find the paired cross-sheet R-1 (this ATS is the dest)
    // My topology uses two R-1s: source-sheet R-1 (rendered on S1) + dest-sheet R-1 (has sheet_id=S2)
    const destR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1'
      && r.sheet_id === sheetId
      && r.end && r.end.device_id === ats.id
      && r.end.port === 'source1_in');
    if (destR1) {
      const a3 = (annByBound[destR1.id] || []).find(a => a.annotation_type === 'A-3');
      const squigText = a3 ? a3.content.text : `FROM 4MDP-1-A`;
      svg += renderSquiggle(s1X, s1Y, squigText, 'below', 'horizontal');
      if (a3) renderedIds.add(a3.id);
      renderedIds.add(destR1.id);
      // Mark any A-1/A-2 on the dest-side R-1 as rendered (they're stub-exempt per spec but still listed)
      (annByBound[destR1.id] || []).forEach(a => renderedIds.add(a.id));
    }

    // Generator feeder: one shared generator feeds all ATSs (Pattern 4 with single gen, N R-1s)
    // We render the gen feeder segments per-ATS here; generator itself placed separately below
  });

  // === Generator placement ===
  // Gen feeds EMSB main bus directly (r-039: GEN -> EM bus bus_tap_bi)
  // Place gen to the LEFT of the EMSB, with gen_out feeder rising to EM bus incoming tap
  const gen = TOPO.devices.find(d => d.node_type === 'L1-5' && d.sheet_id === sheetId);
  if (gen) {
    const genX = emSwbdStartX - 500;
    const genY = swAnchorY + DIM.sw_section_h - DIM.sw_section_h_mlo/2 - DIM.gen_r;
    G[gen.id] = { x: genX, y: genY };
    svg += renderDevice(gen, G[gen.id]);
    renderedIds.add(gen.id);

    // Gen feeder: gen_out → EMSB incoming bus tap (r-039)
    const genR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.sheet_id === sheetId
      && r.start && r.start.device_id === gen.id && r.start.port === 'gen_out');
    if (genR1) {
      // gen_out at bottom of gen circle (per L1-5 spec port): center + (0, gen_r) then stub 20 below
      const genOutX = genX + DIM.gen_r;
      const genOutY = genY + 2*DIM.gen_r + 20;  // after stub
      // Route: down from gen_out to a low rail, right to incoming bus tap X, up to bus Y
      const incX = (incSecX != null ? incSecX : emSwbdStartX + 100);
      const emBusY = swAnchorY + DIM.sw_dist_bus_offset;
      const jogY = genOutY + 80;  // below gen, above bus clutter
      svg += `<polyline points="${genOutX},${genOutY} ${genOutX},${jogY} ${incX},${jogY} ${incX},${emBusY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      svg += `<circle cx="${incX}" cy="${emBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      // Tags on the gen feeder (will be COMPOSITOR_HALT placeholder text)
      svg += renderR1Tags(genR1, genOutX, genOutY + DIM.tag_gap, 'right');
      renderedIds.add(genR1.id);
    }
  }

  // === ATS load_out feeders → E4S/O4S panels ===
  // Each ATS load_out stub goes UP, then to an emergency sub-distribution panel placed above it
  ordered.forEach(ats => {
    const loadR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.sheet_id === sheetId
      && r.start && r.start.device_id === ats.id && r.start.port === 'load_out');
    if (!loadR1 || !loadR1.end) return;
    const dst = devMap[loadR1.end.device_id];
    if (!dst) return;
    const atsLoadX = G[ats.id].x + 70;
    const atsLoadY = G[ats.id].y - DIM.ats_stub_top;  // stub endpoint ABOVE the ATS

    if (dst.node_type === 'L2-4') {
      // Panel above ATS
      const panelY = atsLoadY - DIM.tag_gap - DIM.equip_gap - DIM.equip_stub - DIM.panel_S;
      G[dst.id] = { x: atsLoadX - DIM.panel_S/2, y: panelY };
      svg += renderDevice(dst, G[dst.id]);
      renderedIds.add(dst.id);
      svg += `<line x1="${atsLoadX}" y1="${atsLoadY}" x2="${atsLoadX}" y2="${panelY + DIM.panel_S}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      svg += renderR1Tags(loadR1, atsLoadX, atsLoadY - DIM.tag_gap, 'right');
      renderedIds.add(loadR1.id);
    } else if (dst.node_type === 'L3-1' || dst.node_type === 'L3-3') {
      // Fire pump or equipment connection above ATS
      const eqY = atsLoadY - DIM.tag_gap - DIM.equip_gap - 54;
      G[dst.id] = { x: atsLoadX, y: eqY };
      svg += renderDevice(dst, G[dst.id]);
      renderedIds.add(dst.id);
      svg += `<line x1="${atsLoadX}" y1="${atsLoadY}" x2="${atsLoadX}" y2="${eqY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      svg += renderR1Tags(loadR1, atsLoadX, atsLoadY - DIM.tag_gap, 'right');
      renderedIds.add(loadR1.id);
    }
  });

  return svg;
}

// ============================================================
// BUILD ONE SHEET
// ============================================================
function buildSheet(sheetId) {
  G = {};
  // Intentional skips for compact rendering of floors 2/3 on S2
  const intentionalSkips = new Set();
  if (sheetId === 'S2') {
    TOPO.devices.filter(d => d.sheet_id === sheetId).forEach(d => {
      if (d.designation && /[-][23][-]/.test(d.designation)) {
        intentionalSkips.add(d.id);
      }
    });
    TOPO.routed_elements.filter(r => r.sheet_id === sheetId).forEach(r => {
      if (!r.start || !r.end) return;
      const srcDev = devMap[r.start.device_id];
      const dstDev = devMap[r.end.device_id];
      const involves23 = (srcDev && srcDev.designation && /[-][23][-]/.test(srcDev.designation))
                      || (dstDev && dstDev.designation && /[-][23][-]/.test(dstDev.designation));
      if (involves23) {
        intentionalSkips.add(r.id);
        (annByBound[r.id] || []).forEach(a => intentionalSkips.add(a.id));
      }
    });
    // Also skip annotations bound to skipped R-1s
    TOPO.annotations.filter(a => a.sheet_id === sheetId).forEach(a => {
      if (intentionalSkips.has(a.bound_to)) intentionalSkips.add(a.id);
    });
  }

  manifest = new RenderManifest(sheetId, intentionalSkips);
  renderedIds = { _set: new Set(), add(id){this._set.add(id); if(manifest) manifest.rendered(id)}, has(id){return this._set.has(id)}, get size(){return this._set.size} };

  let svg = '';
  const sw = TOPO.switchboards.find(s => s.sheet_id === sheetId);
  if (!sw) return '<text x="100" y="100" fill="white">No switchboard on sheet '+sheetId+'</text>';

  // Switchboard position: anchored to bottom of content area
  // Use a fixed Y baseline per sheet; content grows upward from there
  const SW_Y = 4800 - DIM.sw_section_h;  // switchboard top
  const MAIN_BUS_Y = SW_Y + DIM.sw_main_bus_offset;
  const SEC_BUS_Y = SW_Y + DIM.sw_sec_bus_offset;
  const DIST_BUS_Y = SW_Y + DIM.sw_dist_bus_offset;  // for MLO variant (EM)

  // Choose which bus Y to use for downstream chains
  const chainBusY = (sw.variant === 'EM' && sw.bus_architecture === 'single') ? DIST_BUS_Y : SEC_BUS_Y;
  const chainMainBusY = MAIN_BUS_Y;

  // --- Sections layout ---
  const secs = TOPO.sections.filter(s => s.switchboard_id === sw.id).sort((a,b) => a.order - b.order);
  let sx = DIM.sw_text_zone_w + 40;
  const SEC_POS = {};
  secs.forEach(s => {
    let w;
    const bkrCount = s.device_ids.filter(did => {
      const d = devMap[did];
      return d && (d.node_type === 'L2-1' || d.node_type === 'L2-7');
    }).length;
    if (s.type === 'distribution' || s.type === 'fire_pump') {
      w = Math.max(bkrCount * P + 2*DIM.section_margin, 210);
    } else {
      w = 210;
    }
    SEC_POS[s.id] = { x: sx, w, type: s.type };
    sx += w;
  });

  // Draw section boundaries
  secs.forEach(s => {
    const p = SEC_POS[s.id];
    const h = (sw.variant === 'EM') ? DIM.sw_section_h_mlo : DIM.sw_section_h;
    const y = (sw.variant === 'EM') ? (SW_Y + DIM.sw_section_h - DIM.sw_section_h_mlo) : SW_Y;
    const label = s.type.toUpperCase().replace('_',' ') + (s.nec_class ? ' ('+s.nec_class+')' : '');
    svg += `<rect x="${p.x}" y="${y}" width="${p.w}" height="${h}" fill="none" stroke="var(--sld-section)" stroke-width="1.2" stroke-dasharray="8,5" opacity=".5"/>`;
    svg += `<text x="${p.x+p.w/2}" y="${y+14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="var(--sld-section)" opacity=".45">${esc(label)}</text>`;
  });

  // Switchboard text block
  const swTextY = (sw.variant === 'EM') ? (SW_Y + DIM.sw_section_h - DIM.sw_section_h_mlo/2 - 40) : (SW_Y + DIM.sw_section_h/2 - 40);
  svg += swText(DIM.sw_text_zone_w + 20, swTextY, sw);

  // --- Buses ---
  const incSec = secs.find(s => s.type === 'incoming');
  const meterSec = secs.find(s => s.type === 'metering');
  const fpSec = secs.find(s => s.type === 'fire_pump');
  const mbSec = secs.find(s => s.type === 'main_breaker');
  const distSecs = secs.filter(s => s.type === 'distribution');

  if (sw.variant === 'NP' && sw.bus_architecture === 'two-level') {
    // Main bus: incoming → main_breaker
    const mainBusStartX = (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x) + DIM.section_margin;
    const mainBusEndX = mbSec ? (SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2) : (SEC_POS[secs[secs.length-1].id].x + SEC_POS[secs[secs.length-1].id].w);
    svg += `<line x1="${mainBusStartX}" y1="${MAIN_BUS_Y}" x2="${mainBusEndX}" y2="${MAIN_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.main_bus_stroke}"/>`;
    // Secondary bus: main_breaker → last distribution
    if (mbSec && distSecs.length > 0) {
      const secBusStartX = SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2;
      const secBusEndX = SEC_POS[distSecs[distSecs.length-1].id].x + SEC_POS[distSecs[distSecs.length-1].id].w - DIM.section_margin;
      svg += `<line x1="${secBusStartX}" y1="${SEC_BUS_Y}" x2="${secBusEndX}" y2="${SEC_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.secondary_bus_stroke}"/>`;
    }
  } else if (sw.variant === 'EM') {
    // Single distribution bus spanning distribution sections
    const distBusStartX = (incSec ? SEC_POS[incSec.id].x + SEC_POS[incSec.id].w/2 : SEC_POS[distSecs[0].id].x + DIM.section_margin);
    const distBusEndX = SEC_POS[distSecs[distSecs.length-1].id].x + SEC_POS[distSecs[distSecs.length-1].id].w - DIM.section_margin;
    svg += `<line x1="${distBusStartX}" y1="${DIST_BUS_Y}" x2="${distBusEndX}" y2="${DIST_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.secondary_bus_stroke}"/>`;
  }

  // --- Main breaker / GFP ---
  if (mbSec) {
    const mainBkr = mbSec.device_ids.map(id => devMap[id]).find(d => d && (d.node_type === 'L1-1' || d.node_type === 'L2-1'));
    if (mainBkr) {
      const mbX = SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2;
      if (mainBkr.node_type === 'L1-1') {
        G[mainBkr.id] = { x: mbX, y: MAIN_BUS_Y, secBusY: SEC_BUS_Y };
        svg += renderDevice(mainBkr, G[mainBkr.id]);
      } else {
        // EM main breaker as L2-1 — draw between main bus and dist bus
        G[mainBkr.id] = { x: mbX, y: DIST_BUS_Y };
        svg += `<line x1="${mbX}" y1="${DIST_BUS_Y - DIM.cb_height - 40}" x2="${mbX}" y2="${DIST_BUS_Y - DIM.cb_height}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
        svg += renderDevice(mainBkr, G[mainBkr.id]);
      }
      renderedIds.add(mainBkr.id);
    }
  }

  // --- Meter ---
  if (meterSec) {
    const meterDev = meterSec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L1-4');
    if (meterDev) {
      const mx = SEC_POS[meterSec.id].x + SEC_POS[meterSec.id].w/2;
      G[meterDev.id] = { x: mx, y: MAIN_BUS_Y + 25, busY: MAIN_BUS_Y };
      svg += renderDevice(meterDev, G[meterDev.id]);
      renderedIds.add(meterDev.id);
    }
  }

  // --- Fire pump breaker (S1 only, taps main bus per NEC 695.4(B)) ---
  if (fpSec) {
    const fpBkr = fpSec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L2-1');
    if (fpBkr) {
      const fbx = SEC_POS[fpSec.id].x + SEC_POS[fpSec.id].w/2;
      G[fpBkr.id] = { x: fbx, y: MAIN_BUS_Y };
      svg += `<circle cx="${fbx}" cy="${MAIN_BUS_Y}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      svg += renderDevice(fpBkr, G[fpBkr.id]);
      renderedIds.add(fpBkr.id);
    }
  }

  // --- Utility transformer (S1 only) ---
  if (sheetId === 'S1') {
    const utDev = TOPO.devices.find(d => d.node_type === 'L0-1');
    if (utDev && incSec) {
      const swLeftEdge = DIM.sw_text_zone_w + 40;
      const utX = swLeftEdge - 140 - 280;
      const utY = 4800 + 60 - 120;  // aligned with bottom of sheet
      G[utDev.id] = { x: utX, y: utY };
      svg += renderDevice(utDev, G[utDev.id]);
      renderedIds.add(utDev.id);
      // Secondary feeder to incoming bus tap
      const incX = SEC_POS[incSec.id].x + SEC_POS[incSec.id].w/2;
      const txSecOutX = utX + 100;
      const txSecOutY = utY + 120;
      const jogY = txSecOutY + DIM.equip_stub;
      svg += `<polyline points="${txSecOutX},${txSecOutY} ${txSecOutX},${jogY} ${incX},${jogY} ${incX},${MAIN_BUS_Y+DIM.bus_r_dot}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      svg += `<circle cx="${incX}" cy="${MAIN_BUS_Y}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      const incR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === utDev.id);
      if (incR1) {
        renderedIds.add(incR1.id);
        svg += renderR1Tags(incR1, incX, jogY - 60, 'right');
      }
      // Primary squiggle "TO UTILITY"
      const primX = utX + 40;
      const sqX = primX - DIM.tag_gap - DIM.equip_stub;
      svg += `<polyline points="${primX},${utY+120} ${primX},${jogY} ${sqX},${jogY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      svg += renderSquiggle(sqX, jogY, 'TO UTILITY', 'left', 'vertical');
    }
  }

  // --- Distribution breakers (and L1-3 N-G Bond) ---
  distSecs.forEach(sec => {
    const p = SEC_POS[sec.id];
    const bkrDevs = sec.device_ids.map(id => devMap[id]).filter(d => d && (d.node_type === 'L2-1' || d.node_type === 'L2-7'));
    const n = bkrDevs.length;
    if (n === 0) return;
    const pitch = (p.w - 2*DIM.section_margin) / n;
    bkrDevs.forEach((dev, i) => {
      const bx = p.x + DIM.section_margin + (i+0.5)*pitch;
      G[dev.id] = { x: bx, y: chainBusY };
      svg += `<circle cx="${bx}" cy="${chainBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      svg += renderDevice(dev, G[dev.id]);
      renderedIds.add(dev.id);
    });
    // N-G bond if this section has one
    const ngBond = sec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L1-3');
    if (ngBond) {
      G[ngBond.id] = { x: p.x + p.w - 60, y: SW_Y + DIM.sw_section_h - 130 };
      svg += renderDevice(ngBond, G[ngBond.id]);
      renderedIds.add(ngBond.id);
    }
  });

  // Mark L1-2 section placeholders rendered
  secs.forEach(s => s.device_ids.forEach(did => {
    const d = devMap[did];
    if (d && d.node_type === 'L1-2') renderedIds.add(did);
  }));

  // Mark non-visual entities rendered (they're cross-referenced by other structures)
  TOPO.port_assignments.forEach(pa => renderedIds.add(pa.id));
  TOPO.measurement_attachments.forEach(ma => renderedIds.add(ma.id));
  TOPO.cross_sheet_refs.forEach(csr => renderedIds.add(csr.id));
  // R-2 buses rendered visually as the main bus lines above
  TOPO.routed_elements.filter(r => r.sheet_id === sheetId && r.edge_type === 'R-2').forEach(r => renderedIds.add(r.id));

  // --- On S2, place ATSs + Generator (BEFORE placeAllChains so Chain C can reference G[ATS]) ---
  if (sheetId === 'S2') {
    const emStartX = (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x);
    const incSecX = incSec ? (SEC_POS[incSec.id].x + SEC_POS[incSec.id].w/2) : null;
    svg += placeATSsAndGenerator(sheetId, emStartX, SW_Y, DIM.sw_section_h_mlo, incSecX);
  }

  // --- Place chains from distribution breakers ---
  svg += placeAllChains(sheetId, chainBusY, chainMainBusY);

  // --- Place sub-feeds first so parent panels (e.g., E4B-1-A) have geometry before internal chains look them up ---
  svg += placeSubFeeds(sheetId);

  // --- Place internal-breaker Chain B (4S-N-A + E4B-1-X internal CBs) ---
  svg += placeInternalChains(sheetId);

  // --- SPD-EMSB: spur attachment to EM bus (L2-6 Mode A) ---
  if (sheetId === 'S2') {
    const spd = TOPO.devices.find(d => d.sheet_id === sheetId && d.node_type === 'L2-6');
    if (spd && !G[spd.id] && distSecs.length > 0) {
      // Place directly above the EM bus in the last distribution section
      const lastDist = distSecs[distSecs.length-1];
      const p = SEC_POS[lastDist.id];
      const spdX = p.x + p.w - 80;
      const spdY = chainBusY - 26 - 20;  // 20px above bus
      G[spd.id] = { x: spdX, y: spdY };
      svg += renderDevice(spd, G[spd.id]);
      // Connection line from SPD box bottom to bus
      svg += `<line x1="${spdX+31}" y1="${spdY+26}" x2="${spdX+31}" y2="${chainBusY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/>`;
      svg += `<circle cx="${spdX+31}" cy="${chainBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      renderedIds.add(spd.id);
    }
  }

  // --- Fire pump chain: CB-FP goes to cross-sheet squiggle (already handled by placeAllChains) ---
  // On S2, FP-ATS load_out → fire pump symbol (handled by placeATSsAndGenerator load-side logic)

  return svg;
}

// TOOLTIP
// ============================================================
function findDev(target) { if (!target || typeof target.closest !== 'function') return null; return target.closest('.dev'); }
// Tracks the last pointer input type (set in the pointerdown handler below).
// A touch TAP synthesizes a mouseover, which would pop the hover tooltip box
// on a phone — unwanted. On touch, the tap already copies + toasts, so the
// hover tooltip is mouse-only.
let lastPointerType = 'mouse';
document.addEventListener('mouseover', e => {
  if (lastPointerType === 'touch') return;   // no hover tooltip on touch taps
  const el = findDev(e.target); if (!el) return;
  const dev = devMap[el.dataset.id]; if (!dev) return;
  const tip = document.getElementById('tooltip');
  let h = `<div class="tt-title">${esc(dev.designation||dev.node_type)}</div>`;
  h += `<div class="tt-row"><span class="tt-label">Type</span><span>${dev.node_type}</span></div>`;
  if (dev.data_fields) Object.entries(dev.data_fields).forEach(([k,v]) => {
    if (v != null && v !== '' && typeof v !== 'object') h += `<div class="tt-row"><span class="tt-label">${k}</span><span>${esc(v)}</span></div>`;
  });
  if (dev.calc_fields) Object.entries(dev.calc_fields).forEach(([k,v]) => {
    if (v != null && v !== '' && typeof v !== 'object') h += `<div class="tt-row"><span class="tt-label">${k}</span><span>${v}</span></div>`;
  });
  tip.innerHTML = h; tip.style.display = 'block'; tip.style.left = (e.clientX+16)+'px'; tip.style.top = (e.clientY-10)+'px';
}, true);
document.addEventListener('mouseout', e => { if (findDev(e.target)) document.getElementById('tooltip').style.display = 'none'; }, true);
document.addEventListener('mousemove', e => { const tip = document.getElementById('tooltip'); if (tip.style.display === 'block') { tip.style.left = (e.clientX+16)+'px'; tip.style.top = (e.clientY-10)+'px'; } });

// ============================================================
// PAN / ZOOM  (pointer-based: mouse, touch + PINCH, and pen — unified,
// ported from the golden viewer. This is what makes two-finger pinch-zoom
// work on a phone; the old build wired mouse wheel + mousedown only.)
// ============================================================
let scale = 0.12, panX = 100, panY = 50, dragging = false, dsx, dsy;
function upd() { document.getElementById('sld-svg').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`; document.getElementById('zoom-ind').textContent = Math.round(scale*100)+'%'; }
// Single zoom clamp shared by wheel, pinch, button, and keyboard zoom.
const MIN_SCALE = 0.03, MAX_SCALE = 3;
function clampScale(s) { return Math.max(MIN_SCALE, Math.min(MAX_SCALE, s)); }
// Anchored zoom: the canvas-wrap-local point (cx,cy) stays fixed on screen.
// Clamp BEFORE updating pan so a rejected step can't drift the diagram away.
function zoomAt(cx, cy, f) {
  const newScale = clampScale(scale * f);
  const ratio = newScale / scale;
  panX = cx - ratio * (cx - panX);
  panY = cy - ratio * (cy - panY);
  scale = newScale;
  upd();
}
function zoomAtCanvasCenter(f) {
  const w = document.getElementById('canvas-wrap');
  zoomAt(w.clientWidth / 2, w.clientHeight / 2, f);
}
function zoomIn()  { zoomAtCanvasCenter(1.25); }
function zoomOut() { zoomAtCanvasCenter(1 / 1.25); }
function resetView() { fitView(); }
function fitView() {

  const vbAttr = sv.getAttribute('viewBox');

  const sw2 = vb ? vb[2] : NaN, sh = vb ? vb[3] : NaN;
  const ww = w.clientWidth, wh = w.clientHeight;
  if (!isFinite(sw2) || !isFinite(sh) || sw2 <= 0 || sh <= 0 || !ww || !wh) {
    scale = 0.12; panX = 100; panY = 50; upd(); return;
  }
  scale = clampScale(Math.min(ww / sw2, wh / sh) * 0.9);

}
const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const r2 = wrap.getBoundingClientRect();
  zoomAt(e.clientX - r2.left, e.clientY - r2.top, e.deltaY > 0 ? 0.9 : 1.1);
}, { passive: false });
// ---- Pointer-based pan / pinch ----

    gesture = 'pan'; suppressClick = true; dragging = true;

    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
  }
  if (gesture === 'pan') {

window.addEventListener('blur', resetGesture);
// Consume the click synthesized after a drag/pinch (capture phase runs
// before the #sld-svg copy handler). Taps that never crossed the threshold
// leave suppressClick false and click through to copy.
wrap.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); }
}, true);
wrap.style.cursor = 'grab';

// SHEET SWITCHING
// ============================================================
function selectSheet(id) {
  currentSheet = id;
  document.querySelectorAll('.sheet-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet === id));
  renderCurrentSheet();
}

function renderCurrentSheet() {
  const svgContent = buildSheet(currentSheet);
  const svg = document.getElementById('sld-svg');
  svg.innerHTML = svgContent;
  // Compute extent from SVG bbox (captures feeders and text, not just device anchors)
  const bb = svg.getBBox();
  const pad = 120;
  svg.setAttribute('viewBox', `${bb.x-pad} ${bb.y-pad} ${bb.width+pad*2} ${bb.height+pad*2}`);
  svg.setAttribute('width', bb.width+pad*2);
  svg.setAttribute('height', bb.height+pad*2);
  fitView();
  // Manifest audit
  const audit = manifest.audit();
  const el = document.getElementById('render-cov');
  const cls = audit.ok ? 'ok' : 'miss';
  let cov = `<b>Render Manifest</b><br><span class="${cls}">${audit.rendered}/${audit.total}</span>`;
  if (audit.intentionalSkips > 0) cov += ` <span style="opacity:.6">(+${audit.intentionalSkips} compact-skipped)</span>`;
  if (!audit.ok) {
    const devMiss = audit.misses.filter(m => m.type === 'device').map(m => m.label);
    const reMiss = audit.misses.filter(m => m.type === 're').map(m => m.label);
    const annMiss = audit.misses.filter(m => m.type === 'ann').map(m => m.label);
    if (devMiss.length) cov += `<br><span class="miss">Dev miss: ${devMiss.slice(0,4).join(', ')}${devMiss.length>4?' +'+(devMiss.length-4):''}</span>`;
    if (reMiss.length) cov += `<br><span class="miss">R-1 miss: ${reMiss.slice(0,3).join(', ')}${reMiss.length>3?' +'+(reMiss.length-3):''}</span>`;
    if (annMiss.length) cov += `<br><span class="miss">Ann miss: ${annMiss.length}</span>`;
  }
  el.innerHTML = cov;
  // Post-render UI passes — layer hooks + audit overlay. Pure DOM decoration
  // over the just-rendered SVG; the drawing itself is untouched.
  classifyLayers();
  applyLayerToggles();
  if (typeof auditOverlayOn !== 'undefined' && auditOverlayOn) {

    renderAuditOverlay(res.findings);

}

// ---- Toasts ------------------------------------------------
function showCopyToast(clientX, clientY, text, isError) {
  const t = document.getElementById('copy-toast');

  t.className = isError ? 'err' : '';

}
function _toast(text, isError) {

}

// ---- Clipboard (click-to-copy accumulator) -----------------
// Devices are the only identified groups (<g class="dev" data-id>); feeders,
// tags and squiggles are ungrouped linework, so copy targets devices.
function resolveCopyTextForDevice(dev) {
  if (dev.designation) return dev.designation;
  const f = dev.data_fields || {};
  const kind = f.kind || f.meter_type || f.sds || f.type || dev.node_type;
  return dev.node_type + (kind && kind !== dev.node_type ? ' (' + kind + ')' : '');
}
function copyTextToClipboard(copyText, clientX, clientY, displayLabel) {
  const toastText = displayLabel || copyText;
  function tryLegacyCopy() {
    try {
      const ta = document.createElement('textarea');
      ta.value = copyText; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, copyText.length);
      const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(copyText)
      .then(() => showCopyToast(clientX, clientY, '✓ Copied: ' + toastText, false))
      .catch(() => showCopyToast(clientX, clientY, tryLegacyCopy() ? '✓ Copied: ' + toastText : '✗ Copy failed — retry', !tryLegacyCopy()));
  } else {
    showCopyToast(clientX, clientY, tryLegacyCopy() ? '✓ Copied: ' + toastText : '✗ Copy failed — retry', false);
  }
}
let clipboardItems = [];
let lastClickedElementId = null;
function appendToClipboardList(text, clientX, clientY) {
  clipboardItems.push(text);
  const countLabel = clipboardItems.length === 1 ? '1 item' : `${clipboardItems.length} items`;
  copyTextToClipboard(clipboardItems.join(', '), clientX, clientY, `${text} (${countLabel})`);
  renderClipboardList();
}
function clearClipboard() { clipboardItems = []; renderClipboardList(); }
function renderClipboardList() {
  const list = document.getElementById('clip-list');

  if (!list || !count || !clearBtn) return;
  count.textContent = clipboardItems.length === 1 ? '1 item' : `${clipboardItems.length} items`;
  if (clipboardItems.length === 0) {
    list.innerHTML = '<div class="clip-empty">Click any device to add</div>';
    clearBtn.disabled = true;
  } else {
    list.innerHTML = clipboardItems.slice().reverse()
      .map(t => `<div class="clip-item" title="${esc(t)}">${esc(t)}</div>`).join('');

}
function bindClickToCopy() {
  const svg = document.getElementById('sld-svg');

const LAYER_KEYS = ['bus', 'feeder', 'section', 'squiggle', 'annotation', 'device'];
function classifyLayers() {

// ---- Snapshot / element PNG (live-DOM rasterize) -----------
// The live SVG carries a content-extent viewBox already; we clone it, drop
// the audit overlay, resolve the theme's CSS vars into concrete colors (a
// data-URI SVG has no stylesheet), and rasterize — so the capture is the
// clean full sheet regardless of pan/zoom or hidden layers.
const _SNAP_VARS = ['--sld-line', '--sld-feeder', '--sld-pink', '--sld-section', '--sld-text',
  '--sld-tag-bg', '--sld-tag-border', '--sld-em', '--canvas-bg'];
function collectCssVars() {
  const cs = getComputedStyle(document.documentElement);
  const m = {};
  _SNAP_VARS.forEach(n => { m[n] = cs.getPropertyValue(n).trim(); });
  return m;
}
// Shared rasterizer: adaptive-DPI SVG-string → PNG download. `{dim}` in the
// name is replaced with the pixel dimensions. Used by snapshot, element, page.
function _rasterize(svgStr, wUnits, hUnits, name) {
  if (!(wUnits > 0 && hUnits > 0)) { _toast('✗ Nothing to render', true); return; }
  const MAX_DIM = 8192, MAX_PIXELS = 33e6;
  const sc = Math.min(2, MAX_DIM / Math.max(wUnits, hUnits), Math.sqrt(MAX_PIXELS / (wUnits * hUnits)));
  const pw = Math.ceil(wUnits * sc), ph = Math.ceil(hUnits * sc);
  const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = pw; c.height = ph;
      c.getContext('2d').drawImage(img, 0, 0, pw, ph);
      c.toBlob(b => {
        if (!b) { _toast('✗ Render failed (canvas memory?)', true); return; }
        const fname = name.replace('{dim}', pw + 'x' + ph);
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fname;
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
        _toast('✓ Saved ' + fname);
      }, 'image/png');
    } finally { URL.revokeObjectURL(url); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); _toast('✗ Render failed (SVG load)', true); };
  img.src = url;
}
// Serialize the live sheet's inner markup with theme CSS vars resolved to
// concrete colors (a data-URI SVG has no stylesheet) and the audit overlay
// stripped. Shared by snapshot + page composition.
function _resolvedBody(vars) {
  const clone = document.getElementById('sld-svg').cloneNode(true);
  const ov = clone.querySelector('#audit-overlay'); if (ov) ov.remove();
  return clone.innerHTML.replace(/var\((--[\w-]+)\)/g, (m, n) => (vars[n] ? vars[n] : m));
}
function snapshotToPng(opts) {
  opts = (opts && (opts.region || opts.suffix)) ? opts : {};
  const live = document.getElementById('sld-svg');
  const va = (live.getAttribute('viewBox') || '0 0 100 100').split(/\s+/).map(Number);
  const vb = opts.region || { x: va[0], y: va[1], w: va[2], h: va[3] };
  if (!(vb.w > 0 && vb.h > 0)) { _toast('✗ Nothing to snapshot', true); return; }
  const vars = collectCssVars();
  const bg = vars['--canvas-bg'] || '#1c2438';
  const svgStr =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}"`
    + ` width="${Math.ceil(vb.w)}" height="${Math.ceil(vb.h)}" font-family="'Courier New',monospace">`
    + `<rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${vb.h}" fill="${bg}"/>`
    + _resolvedBody(vars) + `</svg>`;
  _rasterize(svgStr, vb.w, vb.h, `hospital_bad_${currentSheet}${opts.suffix || ''}_{dim}.png`);
}
// Shift+S: save the resolved SVG itself (vector parity artifact), same body
// as the PNG path but not rasterized.
function snapshotSvgDownload() {
  const live = document.getElementById('sld-svg');
  const va = (live.getAttribute('viewBox') || '0 0 100 100').split(/\s+/).map(Number);
  const vb = { x: va[0], y: va[1], w: va[2], h: va[3] };
  if (!(vb.w > 0 && vb.h > 0)) { _toast('✗ Nothing to save', true); return; }
  const vars = collectCssVars();

  const svgStr =

    + ` width="${Math.ceil(vb.w)}" height="${Math.ceil(vb.h)}" font-family="'Courier New',monospace">`

function snapshotElementPng() {
  if (!lastClickedElementId) { _toast('✗ Tap a device first, then press L', true); return; }
  const el = document.querySelector('#sld-svg g.dev[data-id="' + lastClickedElementId + '"]');
  if (!el || typeof el.getBBox !== 'function') { _toast('✗ Element not on this sheet', true); return; }
  let b; try { b = el.getBBox(); } catch (e) { b = null; }

  const pad = 40;
