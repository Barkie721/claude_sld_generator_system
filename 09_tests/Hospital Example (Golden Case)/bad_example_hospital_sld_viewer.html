// ---- Export Geometry (JSON) --------------------------------
// Serializes the COMPUTED geometry this counter-example produced: device
// anchors from G[] plus feeder/bus polylines harvested from each sheet's
// markup, per sheet. Self-contained (the golden's exportGeometry depends on
// hook-armed renderers this file doesn't have). Clearly stamped as the bad
// example's deliberately-flawed geometry — NOT a production/Revit artifact.
function _harvestRoutes(markup, sheetId, geometry, r2, ext) {
  const routes = [];
  markup.replace(/<polyline\b[^>]*\bpoints="([^"]+)"[^>]*>/g, (m, pts) => {
    if (!/--sld-(feeder|line)/.test(m)) return m;
    const v = pts.trim().split(/\s+/).map(p => { const c = p.split(',').map(Number); return { x: c[0], y: c[1] }; })
      .filter(p => isFinite(p.x) && isFinite(p.y));
    v.forEach(p => ext(p.x, p.y));
    routes.push({ kind: /--sld-feeder/.test(m) ? 'feeder' : 'bus', vertices: v.map(p => ({ x: r2(p.x), y: r2(p.y) })) });
    return m;
  });
  markup.replace(/<line\b([^>]*)>/g, (m, attrs) => {
    if (!/--sld-(feeder|line)/.test(m)) return m;
    const gv = n => { const r = new RegExp(n + '="([^"]+)"').exec(attrs); return r ? parseFloat(r[1]) : NaN; };
    const x1 = gv('x1'), y1 = gv('y1'), x2 = gv('x2'), y2 = gv('y2');
    if ([x1, y1, x2, y2].every(isFinite)) {
      ext(x1, y1); ext(x2, y2);
      routes.push({ kind: /--sld-feeder/.test(m) ? 'feeder' : 'bus', vertices: [{ x: r2(x1), y: r2(y1) }, { x: r2(x2), y: r2(y2) }] });
    }
    return m;
  });
  geometry.routed_elements[sheetId] = routes;
}
function exportGeometry() {
  const r2 = v => Math.round(v * 100) / 100;
  const geometry = {
    note: 'BAD EXAMPLE — deliberately-flawed geometry from the counter-example viewer. NOT a production or Revit artifact.',
    effective_px_per_inch: 96, content_area: {}, devices: {}, routed_elements: {}, coverage: {}
  };
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const ext = (x, y) => { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; };
  const saved = currentSheet;
  try {
    TOPO.sheets.forEach(sh => {
      const markup = buildSheet(sh.sheet_id);   // fills global G[] + manifest for this sheet
      TOPO.devices.filter(d => d.sheet_id === sh.sheet_id).forEach(d => {
        const g = G[d.id];
        if (!g || !isFinite(g.x) || !isFinite(g.y)) return;
        ext(g.x, g.y);
        geometry.devices[d.id] = { sheet: sh.sheet_id, node_type: d.node_type, anchor: { x: r2(g.x), y: r2(g.y) } };
      });
      _harvestRoutes(markup, sh.sheet_id, geometry, r2, ext);
      if (manifest) { const a = manifest.audit(); geometry.coverage[sh.sheet_id] = { rendered: a.rendered, total: a.total, ok: a.ok }; }
    });
    if (isFinite(minX)) geometry.content_area = { min_x: r2(minX), min_y: r2(minY), width_px: r2(maxX - minX), height_px: r2(maxY - minY) };
  } finally {
    // buildSheet() clobbered the G[]/manifest globals but never touched the
    // DOM (renderCurrentSheet does that). Rebuild them for the live sheet
    // WITHOUT re-rendering, so the user's pan/zoom is preserved.
    buildSheet(currentSheet);
  }
  const blob = new Blob([JSON.stringify({ geometry }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hospital_bad_geometry.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  _toast('✓ Exported geometry JSON');
}

// ---- Page PNG (composed Arch E1 sheet) ---------------------
// Composes the diagram into a 42×30" (Arch E1, 4032×2880 @ 96px/in) sheet
// with a border and a lower-right title block from TOPO.metadata. This is a
// lightweight, self-contained composition (the golden ports a full title-
// block template); it carries a BAD-EXAMPLE / not-for-construction stamp.
function pageToPng() {
  const live = document.getElementById('sld-svg');
  const va = (live.getAttribute('viewBox') || '0 0 100 100').split(/\s+/).map(Number);
  const cvb = { x: va[0], y: va[1], w: va[2], h: va[3] };
  if (!(cvb.w > 0 && cvb.h > 0)) { _toast('✗ Nothing to compose', true); return; }
  const vars = collectCssVars();
  const bg = vars['--canvas-bg'] || '#1c2438';
  const ink = vars['--sld-text'] || '#ffffff';
  const line = vars['--sld-line'] || '#00ffff';
  const dim = vars['--sld-feeder'] || '#8899aa';
  const PW = 4032, PH = 2880, M = 60, TBW = 1180, TBH = 520;
  const drawX = M, drawY = M, drawW = PW - 2 * M, drawH = PH - 2 * M;
  const sc = Math.min(drawW / cvb.w, drawH / cvb.h) * 0.97;
  const dx = drawX + (drawW - cvb.w * sc) / 2 - cvb.x * sc;
  const dy = drawY + (drawH - cvb.h * sc) / 2 - cvb.y * sc;
  const meta = TOPO.metadata || {};
  const sheet = TOPO.sheets.find(s => s.sheet_id === currentSheet) || {};
  const tbX = PW - M - TBW, tbY = PH - M - TBH;
  const T = (x, y, t, o) => `<text x="${x}" y="${y}" font-family="'Courier New',monospace" ${o || ''} fill="${ink}">${esc(t)}</text>`;
  const svgStr =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${PW} ${PH}" width="${PW}" height="${PH}" font-family="'Courier New',monospace">`
    + `<rect x="0" y="0" width="${PW}" height="${PH}" fill="${bg}"/>`
    + `<rect x="${M/2}" y="${M/2}" width="${PW-M}" height="${PH-M}" fill="none" stroke="${dim}" stroke-width="4"/>`
    + `<g transform="translate(${dx},${dy}) scale(${sc})">${_resolvedBody(vars)}</g>`
    + `<rect x="${tbX}" y="${tbY}" width="${TBW}" height="${TBH}" fill="${bg}" stroke="${line}" stroke-width="3"/>`
    + `<line x1="${tbX}" y1="${tbY+70}" x2="${tbX+TBW}" y2="${tbY+70}" stroke="${line}" stroke-width="2"/>`
    + `<line x1="${tbX}" y1="${tbY+TBH-120}" x2="${tbX+TBW}" y2="${tbY+TBH-120}" stroke="${line}" stroke-width="2"/>`

    + T(tbX + 24, tbY + 180, 'NEC ' + (meta.nec_edition || '—') + '  ·  ' + (meta.sheet_template || '30x42'), 'font-size="26"')
    + T(tbX + 24, tbY + 246, (sheet.title || 'SINGLE-LINE DIAGRAM'), 'font-size="28" font-weight="700"')
    + T(tbX + 24, tbY + 300, 'Scale: ' + (sheet.scale || 'NTS'), 'font-size="26"')
    + T(tbX + TBW - 24, tbY + 300, (sheet.sheet_number || currentSheet), 'font-size="52" font-weight="700" text-anchor="end"')
    + `<text x="${tbX + 24}" y="${tbY + TBH - 78}" font-family="'Courier New',monospace" font-size="24" font-weight="700" fill="#ff5555">BAD EXAMPLE — NOT FOR CONSTRUCTION</text>`
    + `<text x="${tbX + 24}" y="${tbY + TBH - 44}" font-family="'Courier New',monospace" font-size="19" fill="${dim}">Deliberately-flawed counter-example rendering.</text>`

}

// ---- Geometry audit (live DOM, getBBox) --------------------
// Reimplemented against the live DOM (the golden's headless markup-regex
// audit depends on a helper stack this file doesn't carry). Overlay rects
// are appended to the same SVG, so they share its viewBox + pan/zoom exactly.
const _r2 = v => Math.round(v * 100) / 100;
function _boxesOverlap(a, b, slack) {
  return a.x < b.x + b.w - slack && a.x + a.w > b.x + slack &&
         a.y < b.y + b.h - slack && a.y + a.h > b.y + slack;
}
function _unionBox(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, w: Math.max(a.x + a.w, b.x + b.w) - x, h: Math.max(a.y + a.h, b.y + b.h) - y };
}
function _pointNearBox(p, b, r) {
  return p.x >= b.x - r && p.x <= b.x + b.w + r && p.y >= b.y - r && p.y <= b.y + b.h + r;
}
// Liang-Barsky segment vs (shrunk) AABB — true through the interior, not a graze.
function _segHitsBox(px, py, qx, qy, b, shrink) {
  const x0 = b.x + shrink, y0 = b.y + shrink, x1 = b.x + b.w - shrink, y1 = b.y + b.h - shrink;
  if (x1 <= x0 || y1 <= y0) return false;
  let t0 = 0, t1 = 1; const dx = qx - px, dy = qy - py;
  const clip = (p, q) => {
    if (p === 0) return q >= 0;
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
    else { if (r < t0) return false; if (r < t1) t1 = r; }
    return true;
  };
  return clip(-dx, px - x0) && clip(dx, x1 - px) && clip(-dy, py - y0) && clip(dy, y1 - py) && t0 < t1;
}
function _collectDeviceBoxes(svg) {
  const out = [];
  svg.querySelectorAll('g.dev').forEach(g => {
    let b; try { b = g.getBBox(); } catch (e) { return; }
    if (!b || !isFinite(b.x) || b.width <= 0 || b.height <= 0) return;
    out.push({ id: g.dataset.id || '?', box: { x: b.x, y: b.y, w: b.width, h: b.height } });
  });
  return out;
}
function _collectFeederSegments(svg) {
  const segs = [];
  svg.querySelectorAll('line,polyline').forEach(el => {
    if (el.closest('g.dev')) return;
    if (!(el.getAttribute('stroke') || '').includes('--sld-feeder')) return;
    if (el.tagName.toLowerCase() === 'line') {
      segs.push([{ x: +el.getAttribute('x1'), y: +el.getAttribute('y1') },
                 { x: +el.getAttribute('x2'), y: +el.getAttribute('y2') }]);
    } else {
      const pts = (el.getAttribute('points') || '').trim().split(/\s+/)
        .map(p => { const c = p.split(',').map(Number); return { x: c[0], y: c[1] }; })
        .filter(p => isFinite(p.x) && isFinite(p.y));
      for (let i = 0; i + 1 < pts.length; i++) segs.push([pts[i], pts[i + 1]]);
    }
  });
  return segs;
}
function auditSheetLive() {
  const svg = document.getElementById('sld-svg');
  const findings = [];
  const devBoxes = _collectDeviceBoxes(svg);
  // (a) device glyph collisions (6px slack for shared bus dots / grazing)
  for (let i = 0; i < devBoxes.length; i++) for (let j = i + 1; j < devBoxes.length; j++) {
    const A = devBoxes[i], B = devBoxes[j];
    if (A.id === B.id) continue;
    if (_boxesOverlap(A.box, B.box, 6)) findings.push({ type: 'glyph_collision', severity: 'error',
      ids: [A.id, B.id], bbox: _unionBox(A.box, B.box), note: `device "${A.id}" glyph overlaps "${B.id}"` });
  }
  // (b) out-of-frame: device orphaned far from the device cluster (pad 400)
  if (devBoxes.length) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    devBoxes.forEach(d => { minX = Math.min(minX, d.box.x); minY = Math.min(minY, d.box.y);
      maxX = Math.max(maxX, d.box.x + d.box.w); maxY = Math.max(maxY, d.box.y + d.box.h); });
    const P = 400, fr = { x: minX - P, y: minY - P, w: (maxX - minX) + 2 * P, h: (maxY - minY) + 2 * P };
    devBoxes.forEach(d => { const b = d.box;
      if (b.x < fr.x || b.y < fr.y || b.x + b.w > fr.x + fr.w || b.y + b.h > fr.y + fr.h)
        findings.push({ type: 'out_of_frame', severity: 'warn', ids: [d.id], bbox: b,
          note: `device "${d.id}" sits outside the content cluster` }); });
  }
  // (c) feeder-through-device: a feeder segment crossing a non-endpoint device
  const seen = new Set();
  _collectFeederSegments(svg).forEach(([p, q]) => {
    devBoxes.forEach(d => {
      if (_pointNearBox(p, d.box, 8) || _pointNearBox(q, d.box, 8)) return;  // its own endpoint device
      if (_segHitsBox(p.x, p.y, q.x, q.y, d.box, 4)) {
        if (seen.has(d.id)) return; seen.add(d.id);
        findings.push({ type: 'feeder_crossing', severity: 'error', ids: [d.id], bbox: d.box,
          note: `a feeder crosses device "${d.id}"` });
      }
    });
  });
  // (d) drop report: expected-but-unrendered topology entities. No bbox (they
  // were never drawn), so they surface as panel rows — exactly as the golden's
  // audit does via its RenderManifest.
  if (typeof manifest !== 'undefined' && manifest) {
    (manifest.audit().misses || []).forEach(m => findings.push({
      type: 'dropped_entity', severity: 'error', ids: [m.id], bbox: null,
      note: `DROPPED ${m.type} ${m.id}${m.label ? ' (' + m.label + ')' : ''}` }));
  }
  const counts = { glyph_collision: 0, feeder_crossing: 0, out_of_frame: 0, dropped_entity: 0 };
  findings.forEach(f => { if (counts[f.type] != null) counts[f.type]++; });
  return { ok: findings.every(f => f.severity !== 'error'), sheetId: currentSheet, counts, findings };
}
let auditOverlayOn = false;
function removeAuditOverlay() {
  const old = document.getElementById('audit-overlay');
  if (old && old.remove) old.remove();
}
function renderAuditOverlay(findings) {
  const svg = document.getElementById('sld-svg');
  if (!svg) return;
  removeAuditOverlay();
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('id', 'audit-overlay');
  g.setAttribute('pointer-events', 'none');
  g.innerHTML = findings.filter(f => f.bbox).map(f =>
    `<rect x="${_r2(f.bbox.x)}" y="${_r2(f.bbox.y)}" width="${_r2(f.bbox.w)}" height="${_r2(f.bbox.h)}"`
    + ` fill="none" stroke="#FF3333" stroke-width="2" stroke-dasharray="6 4"/>`).join('');
  svg.appendChild(g);
}
const AUDIT_PANEL_MAX_ROWS = 10;
function renderAuditPanel(res) {
  const el = document.getElementById('audit-panel');
  if (!el) return;
  const sevGlyph = { error: '✗', warn: '⚠', info: 'ℹ' }, sevClass = { error: 'miss', warn: 'warn', info: '' };
  let html = `<b>Geometry Audit</b> — ${esc(res.sheetId)}<br>`;
  if (!res.findings.length) {
    html += `<span class="ok">✓ clean — no findings</span>`;
  } else {
    const worst = res.findings.some(f => f.severity === 'error') ? 'miss'
                : res.findings.some(f => f.severity === 'warn') ? 'warn' : 'ok';
    html += `<span class="${worst}">${res.findings.length} finding(s)</span>`;
    res.findings.slice(0, AUDIT_PANEL_MAX_ROWS).forEach(f => {
      const ids = f.ids && f.ids.length ? ` [${f.ids.join(', ')}]` : '';
      html += `<br><span class="${sevClass[f.severity] || ''}">${sevGlyph[f.severity] || 'ℹ'}</span> ${esc(f.type)}: ${esc(f.note + ids)}`;
    });
    if (res.findings.length > AUDIT_PANEL_MAX_ROWS) html += `<br>+${res.findings.length - AUDIT_PANEL_MAX_ROWS} more`;
  }
  el.innerHTML = html; el.style.display = '';
}
function hideAuditPanel() { const el = document.getElementById('audit-panel'); if (el) el.style.display = 'none'; }
function toggleAuditOverlay() {
  auditOverlayOn = !auditOverlayOn;
  if (!auditOverlayOn) { removeAuditOverlay(); hideAuditPanel(); _toast('Audit overlay off'); return; }
  const res = auditSheetLive();
  renderAuditOverlay(res.findings);
  renderAuditPanel(res);
  const boxed = res.findings.filter(f => f.bbox).length;
  _toast(res.findings.length
    ? `${res.ok ? '⚠' : '✗'} Audit: ${res.findings.length} finding(s), ${boxed} boxed`
    : '✓ Audit clean', !res.ok);
}

// ---- Keyboard shortcuts + help overlay ---------------------
function panBy(dx, dy) { panX += dx; panY += dy; upd(); }
function panStep(base) {
  const w = document.getElementById('canvas-wrap');
  return Math.min(base / Math.max(scale, MIN_SCALE), w.clientWidth || 800);
}
function _sheetIds() { return TOPO.sheets.map(s => s.sheet_id); }
function nextSheet() { const ids = _sheetIds(), i = ids.indexOf(currentSheet); selectSheet(ids[(i + 1) % ids.length]); }
function prevSheet() { const ids = _sheetIds(), i = ids.indexOf(currentSheet); selectSheet(ids[(i - 1 + ids.length) % ids.length]); }
function selectSheetByIndex(n) { const s = TOPO.sheets[n]; if (s) selectSheet(s.sheet_id); }
const KEYMAP = {
  'ArrowLeft':  { fn: () => panBy(panStep(50), 0),  label: 'Pan left' },
  'ArrowRight': { fn: () => panBy(-panStep(50), 0), label: 'Pan right' },
  'ArrowUp':    { fn: () => panBy(0, panStep(50)),  label: 'Pan up' },
  'ArrowDown':  { fn: () => panBy(0, -panStep(50)), label: 'Pan down' },
  'Shift+ArrowLeft':  { fn: () => panBy(panStep(200), 0),  label: 'Pan left (coarse)' },
  'Shift+ArrowRight': { fn: () => panBy(-panStep(200), 0), label: 'Pan right (coarse)' },
  'Shift+ArrowUp':    { fn: () => panBy(0, panStep(200)),  label: 'Pan up (coarse)' },
  'Shift+ArrowDown':  { fn: () => panBy(0, -panStep(200)), label: 'Pan down (coarse)' },
  '+': { fn: zoomIn,  label: 'Zoom in' },
  '=': { fn: zoomIn,  label: 'Zoom in (alt)' },
  '-': { fn: zoomOut, label: 'Zoom out' },
  '0': { fn: fitView, label: 'Fit to view' },
  '[': { fn: prevSheet, label: 'Previous sheet' },
  ']': { fn: nextSheet, label: 'Next sheet' },
  '1': { fn: () => selectSheetByIndex(0), label: 'Sheet 1 (E-501)' },
  '2': { fn: () => selectSheetByIndex(1), label: 'Sheet 2 (E-502)' },
  'c': { fn: () => clearClipboard(),      label: 'Clear clipboard' },
  't': { fn: toggleTheme,                 label: 'Toggle theme' },
  's': { fn: () => snapshotToPng(),       label: 'Snapshot PNG (full sheet)' },
  'Shift+S': { fn: () => snapshotSvgDownload(), label: 'Snapshot SVG (vector artifact)' },
  'l': { fn: () => snapshotElementPng(),  label: 'Snapshot last-clicked device' },
  'p': { fn: () => pageToPng(),           label: 'Page PNG (composed Arch E1 sheet)' },
  'g': { fn: () => exportGeometry(),      label: 'Export computed geometry (JSON)' },
  'v': { fn: () => toggleAuditOverlay(),  label: 'Toggle geometry-audit overlay' },
  '?': { fn: () => showHelpOverlay(),     label: 'Show this help' },
  'Escape': { fn: () => {
      if (document.getElementById('help-overlay').style.display === 'flex') hideHelpOverlay();
      else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }, label: 'Dismiss overlay / blur focus' },
};
function onGlobalKey(e) {
  if (e.target.matches && e.target.matches('input, textarea, select, button')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const overlay = document.getElementById('help-overlay');
  if (overlay && overlay.style.display === 'flex' && e.key === 'Tab') { _trapTabInOverlay(e); return; }
  const entry = KEYMAP['Shift+' + e.key] || KEYMAP[e.key];
  if (entry && entry.fn) { e.preventDefault(); entry.fn(); }
}
let _lastFocusBeforeOverlay = null;
function showHelpOverlay() {
  const ov = document.getElementById('help-overlay');
  if (!ov) return;
  _lastFocusBeforeOverlay = document.activeElement;
  const body = document.getElementById('help-overlay-body');
  if (body) {
    const groups = [
      { title: 'Pan & Zoom', keys: ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Shift+ArrowLeft', '+', '-', '0'] },
      { title: 'Sheets', keys: ['[', ']', '1', '2'] },
      { title: 'Tools', keys: ['c', 't', 's', 'Shift+S', 'l', 'p', 'g', 'v', '?', 'Escape'] },
    ];
    body.innerHTML = groups.map(g =>
      `<div class="help-group"><h3>${g.title}</h3><dl>` +
      g.keys.map(k => { const e = KEYMAP[k]; return e ? `<dt>${esc(k)}</dt><dd>${esc(e.label)}</dd>` : ''; }).join('') +
      `</dl></div>`).join('');
  }
  ov.style.display = 'flex';
  ov.setAttribute('aria-hidden', 'false');
  const close = document.getElementById('help-overlay-close');
  if (close) close.focus();
}
function hideHelpOverlay() {
  const ov = document.getElementById('help-overlay');
  if (!ov) return;
  ov.style.display = 'none';
  ov.setAttribute('aria-hidden', 'true');
  if (_lastFocusBeforeOverlay && _lastFocusBeforeOverlay.focus) _lastFocusBeforeOverlay.focus();
  _lastFocusBeforeOverlay = null;
}
function _trapTabInOverlay(e) {
  const ov = document.getElementById('help-overlay');
  const f = ov.querySelectorAll('button, [tabindex="0"]');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

// ---- Wire the new controls ---------------------------------
function wireFeatures() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
  on('snapshot-btn', () => snapshotToPng());
  on('element-snap-btn', () => snapshotElementPng());
  on('page-dl-btn', () => pageToPng());
  on('export-geom-btn', () => exportGeometry());
  on('audit-btn', () => toggleAuditOverlay());
  on('help-btn', () => showHelpOverlay());
  on('clip-clear', () => clearClipboard());
  on('help-overlay-close', () => hideHelpOverlay());
  document.querySelectorAll('.layer-cb').forEach(cb => cb.addEventListener('change', () => {
    const u = loadUi(), ly = u.layers || {};
    ly[cb.dataset.layer] = cb.checked;
    saveUi({ layers: ly });
    applyLayerToggles();
  }));
  bindClickToCopy();
  renderClipboardList();
  document.addEventListener('keydown', onGlobalKey);
}
