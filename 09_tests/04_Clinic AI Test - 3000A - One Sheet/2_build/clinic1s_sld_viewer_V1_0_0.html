      // L3-1 fire pump: anchor = family-bbox TL (0,0); load_in port at
      // (12, 32) = box bottom-center — the box is the MEASURED 24×32
      // family, so the Revit family's own bottom lands on the feeder-top. Device anchor
      // X = feeder_x − 12 so the box centers on the feeder and the load_in port
      // lands on the feeder-top.
      const W = 24, H = 32;                  // measured family bbox
      const chainH = DIM.tag_gap + DIM.equip_gap + DIM.equip_stub;
      const fyTop = atsLoadY - chainH;       // feeder-top Y = load_in port Y
      G[dst.id] = { x: atsLoadX - W/2, y: fyTop - H };  // TL so box center = fx, load_in = (fx, fyTop)
      svg += renderDevice(dst, G[dst.id]);
      renderedIds.add(dst.id);
      svg += `<g class="feeder" data-id="${loadR1.id}" style="cursor:pointer"><line x1="${atsLoadX}" y1="${atsLoadY}" x2="${atsLoadX}" y2="${fyTop}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      svg += renderR1Tags(loadR1, atsLoadX, atsLoadY - DIM.tag_gap, 'right');
      renderedIds.add(loadR1.id);
    } else if (dst.node_type === 'L3-3') {
      // L3-3 Equipment Connection placement fix (port-anchor conformance).
      // L3-3 equipment connection: anchor = circle center (0,0); load_in at
      // (0, 27) = circle bottom-center. RENDER['L3-3'] treats incoming g as the
      // TL of a 54×54 bbox (circle center = g+(27,27), load_in = g+(27,54)).
      // Previous code set G.x = atsLoadX (bbox TL at feeder X → circle center
      // offset +27 px right, feeder tangent to circle left edge) and terminated
      // the feeder at G.y (bbox TOP, 54 px short of load_in at bbox bottom).
      // Corrected below; also restores the missing equip_stub term in the chain
      // height so the ATS row matches the panel-above-ATS chain (L2-4) spacing.
      const r = 27;                           // circle radius
      const chainH = DIM.tag_gap + DIM.equip_gap + DIM.equip_stub;
      const fyTop = atsLoadY - chainH;        // feeder-top Y = load_in port Y
      G[dst.id] = { x: atsLoadX - r, y: fyTop - 2*r };  // bbox TL so circle center = fx, load_in = (fx, fyTop)
      svg += renderDevice(dst, G[dst.id]);
      renderedIds.add(dst.id);
      svg += `<g class="feeder" data-id="${loadR1.id}" style="cursor:pointer"><line x1="${atsLoadX}" y1="${atsLoadY}" x2="${atsLoadX}" y2="${fyTop}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      svg += renderR1Tags(loadR1, atsLoadX, atsLoadY - DIM.tag_gap, 'right');
      renderedIds.add(loadR1.id);
    }
  });

  return svg;
}

// ============================================================
// A-4 PENNANT RENDERER — JSON-DRIVEN PIPELINE
//
// Scope: A-4 fault-current pennants are first-class annotations baked into
// TOPO.annotations[] with:
//   content.fc_amps : integer (whole amps)
//   content.mode    : 'N' | 'EM' | null
//   content.anchor  : 'bus' | 'primary' | 'secondary' | 'load' | 'default'
//
// Per-pennant identity:
// - Each emitted <g> carries class="fc-pennant" + data-id="a-NNN" matching
//   the annotation ID. Click-to-copy returns a-NNN verbatim.
// - FC_PENNANT_PLACEMENT (keyed by bound device designation) drives
//   placement quirks (utility secondary-feeder-drop, 4M-R-B top-left mirror,
//   EQ4M-1-A left-mirror).
// ============================================================

function renderFcPennant(annId, fc_amps, x, y, side, mode, flip, mirror) {
  // Spec A-4 Fault Current Tag:
  // Red outline (#FF3333), no fill. Single closed <path> (triangle apex +
  // rectangular body). Rotated -30° around apex. Stroke 2.5 pt.
  // Label: whole amps, comma-separated, 'A' suffix. Dual-mode appends ·N / ·EM.
  // Body_w dynamic (8px/char + 16px padding, min 80). EM mode amber outline.
  // `flip` scales(1,-1) after rotation (body DOWN from apex). `mirror` scales(-1,1)
  // (body UP-LEFT). Text counter-transforms to stay upright.
  // The annId parameter threads the A-4 annotation ID through as data-id
  // for click-to-copy and manifest coverage.
  if (!fc_amps || fc_amps < 1) return '';
  const whole = Math.round(fc_amps);
  const amps  = whole.toLocaleString('en-US');
  const label = mode ? `${amps}A·${mode}` : `${amps}A`;
  const body_w  = Math.max(80, label.length * 8 + 16);
  const body_h  = 21;
  const tri_depth = 13;
  const path = `M0,0 L${tri_depth},${-body_h/2} L${tri_depth+body_w},${-body_h/2} L${tri_depth+body_w},${body_h/2} L${tri_depth},${body_h/2} Z`;
  const textX = tri_depth + body_w/2;
  const stroke = (mode === 'EM') ? 'var(--sld-em)' : 'var(--sld-fc)';
  const flipTransform   = flip   ? ' scale(1,-1)' : '';
  const mirrorTransform = mirror ? ' scale(-1,1)' : '';
  const textFlipCompensation = (flip || mirror) ? ` scale(${mirror ? -1 : 1},${flip ? -1 : 1})` : '';
  if (annId) renderedIds.add(annId);
  return `<g class="fc-pennant" data-id="${annId||''}" transform="translate(${x},${y}) rotate(-30)${flipTransform}${mirrorTransform}">
            <path d="${path}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="miter"/>
            <text x="${textX}" y="4" text-anchor="middle"
                  font-family="'Courier New',monospace" font-size="12" font-weight="700"
                  fill="var(--sld-text)" transform="translate(${textX},0)${textFlipCompensation} translate(${-textX},0)">${label}</text>
          </g>`;
}

// ============================================================
// A-4 ANCHOR RESOLVER — derives (x, y, side, flip, mirror) from an
// annotation entry. Honors FC_PENNANT_PLACEMENT by bound device designation
// before falling through to node-type + anchor-kind dispatch.
//
// modeOffsetY cascades EM pennants when both N and EM exist on the same
// host+anchor. For ATS 'load' the cascade is (PAIR_DX, PAIR_DY) diagonal.
// For TX primary/secondary the cascade is also diagonal. For bus tags
// the EM pennant stacks +26 below N (vertical, no X shift).
// ============================================================

const _PAIR_DX = 22;
const _PAIR_DY = 18;

function _resolveA4Anchor(ann, host, modeOffsetY) {
  // ann  — the A-4 annotation object
  // host — devMap[bound_to] or reMap[bound_to]
  // modeOffsetY — stacking offset for this pennant (0 for lone or N pennant)
  const anchor = (ann.content && ann.content.anchor) || 'default';

  // Bus anchor: routed_element host (main bus, or the lone distribution bus of a
  // single-level MLO board). Upper-left corner of incoming section envelope.
  // EM bus tag stacks +26 below N.
  // match distribution_bus_id as well. A bus_architecture "single" board
  // (an MLO emergency board per NEC 700.10(B)(5)(a)) carries main_bus_id: null and its
  // only bus in distribution_bus_id, so a main_bus_id-only lookup silently returned null
  // and the board's A-4 fault-current pennant was dropped by layout. Golden-inert: both
  // golden switchboards are two-level with distribution_bus_id null, which never matches
  // a real bound_to. Mirrors the three-way bus match already used at the R-2 hit test.
  if (anchor === 'bus') {
    const sw = TOPO.switchboards.find(s =>
      s.sheet_id === ann.sheet_id &&
      (s.main_bus_id === ann.bound_to || s.distribution_bus_id === ann.bound_to));
    if (!sw) return null;
    const incSec = TOPO.sections.find(s =>
      s.switchboard_id === sw.id && s.type === 'incoming');
    if (!incSec || !window.__SEC_POS || !window.__SEC_POS[incSec.id]) return null;
    const p = window.__SEC_POS[incSec.id];
    const busTagNudgeY = (sw.variant === 'EM') ? -27 : 0;
    // +10 px downward nudge on a-252 only (EM main-bus
    // FC pennant on E-502). Single-annotation Y nudge; does not
    // affect any other A-4 pennant.
    const a195Nudge = (ann.id === 'a-252') ? 25 : 0;
    return {
      x: p.x,
      y: 4800 - DIM.sw_section_h + busTagNudgeY + a195Nudge + (modeOffsetY || 0),
      side: 'right',
      flip: true,
    };
  }

  // Device-bound anchors from here on
  const dev = host;
  const g = G[dev.id];
  if (!g) return null;

  // TX primary/secondary — on-feeder placement (north/south of TX symbol)
  if (anchor === 'secondary' && dev.node_type === 'L2-2') {
    const feederX = g.x + symbolWidth(dev) / 2;
    return {
      x: feederX + DIM.tx_fc_lateral_offset + (modeOffsetY ? _PAIR_DX : 0),
      y: g.y - DIM.tx_fc_north_gap         + (modeOffsetY ? _PAIR_DY : 0),
      side: 'right',
    };
  }
  if (anchor === 'primary' && dev.node_type === 'L2-2') {
    const feederX = g.x + symbolWidth(dev) / 2;
    return {
      x: feederX + DIM.tx_fc_lateral_offset + (modeOffsetY ? _PAIR_DX : 0),
      y: g.y + bodyHeight(dev) + DIM.tx_fc_south_gap + (modeOffsetY ? _PAIR_DY : 0),
      side: 'right',
      flip: true,
    };
  }

  // ATS load-side — single-corner stacked pair at top-right, EM cascades diagonal
  if (anchor === 'load' && dev.node_type === 'L2-3') {
    const ATS_FC_Y_OFFSET = -25;
    const ATS_FC_X_OFFSET = -40;
    return {
      x: g.x + symbolWidth(dev) + ATS_FC_X_OFFSET + (modeOffsetY ? _PAIR_DX : 0),
      y: g.y + ATS_FC_Y_OFFSET     + (modeOffsetY ? _PAIR_DY : 0),
      side: 'right',
    };
  }

  // Default anchor — per-designation overrides first, then node-type defaults
  const ov = dev.designation
    && (FC_PENNANT_PLACEMENT_CFG[dev.designation] !== undefined
        ? FC_PENNANT_PLACEMENT_CFG[dev.designation]
        : FC_PENNANT_PLACEMENT[dev.designation]);  // config wins
  if (ov) {
    if (ov.anchor === 'secondary-feeder-drop' && dev.node_type === 'L0-1') {
      // secondary_out port moved to +112 on the 168×140 box.
      return {
        x: g.x + 112 + DIM.tx_fc_lateral_offset + 50,
        y: g.y + boxH('L0-1') + 50 + 40 + (modeOffsetY || 0),
        side: 'right',
        flip: true,
      };
    }
    if (ov.anchor === 'top' && dev.node_type === 'L0-1') {
      return { x: g.x + boxW('L0-1')/2, y: g.y - 4 + (modeOffsetY || 0), side: 'right' };
    }
    if (ov.anchor === 'left-mirror' && dev.node_type === 'L2-4') {
      return { x: g.x - 6, y: g.y + 18 + (modeOffsetY || 0),
               side: 'left', mirror: true, flip: !!ov.flip };
    }
    if (ov.anchor === 'top-left-corner-mirror' && dev.node_type === 'L2-4') {
      return { x: g.x, y: g.y + (modeOffsetY || 0),
               side: 'left', mirror: true, flip: !!ov.flip };
    }
  }

  switch (dev.node_type) {
    case 'L0-1':
      return { x: g.x + 140, y: g.y + 230 + (modeOffsetY || 0), side: 'right', flip: true };
    case 'L1-5':
      return { x: g.x + DIM.gen_r, y: g.y + 2*DIM.gen_r + 30 + (modeOffsetY || 0), side: 'right', flip: true };
    case 'L2-4':
      return { x: g.x + symbolWidth(dev) + 6, y: g.y + 18 + (modeOffsetY || 0), side: 'right' };
    case 'L2-6':
      // SPD is a 62×26 rect (per RENDER['L2-6'] spec). Pennant lands just to
      // the right of the body, vertically centered on the rect. modeOffsetY
      // cascades EM below N if both are bound to the same SPD (rare — SPDs
      // typically carry a single-source pennant equal to upstream bus FC).
      return { x: g.x + symbolWidth(dev) + 6, y: g.y + symbolHeight(dev)/2 + (modeOffsetY || 0), side: 'right' };
    case 'L3-1':
    case 'L3-3': {
      // Per-pennant Y-nudge: surgical overrides for specific A-4 annotations.
      // Mirrors the a-252 nudge pattern in the bus-anchor branch above.
      // SVG Y is positive-down, so positive values shift the pennant downward.
      const Y_NUDGE_BY_ID = { 'a-342': 60, 'a-341': 60, 'a-328': 60, 'a-327': 60 };
      // layout_config.fc_pennant_y_nudges extends/overrides the table.
      const idNudge = (FC_PENNANT_Y_NUDGES_CFG[ann.id] !== undefined
        ? FC_PENNANT_Y_NUDGES_CFG[ann.id]
        : Y_NUDGE_BY_ID[ann.id]) || 0;
      return { x: g.x + 30, y: g.y + 80 + idNudge + (modeOffsetY || 0), side: 'right' };
    }
    default:
      return null;
  }
}

// ============================================================
// renderAllFcPennants — JSON-driven.
// Iterates A-4 annotations for this sheet. For each (bound_to + anchor) pair,
// renders N pennant first (modeOffsetY=0), then EM pennant stacked/cascaded.
// Bus tags cascade vertically (+26 Y). Device tags use diagonal cascade.
// ============================================================

function renderAllFcPennants(sheetId) {
  const a4 = TOPO.annotations.filter(a =>
    a.sheet_id === sheetId && a.annotation_type === 'A-4');
  if (a4.length === 0) return '';

  // Group by (bound_to, anchor) so we can detect N/EM pairs and cascade the
  // EM pennant with the correct offset.
  const groups = {};
  a4.forEach(ann => {
    const key = ann.bound_to + '|' + ((ann.content && ann.content.anchor) || 'default');
    if (!groups[key]) groups[key] = [];
    groups[key].push(ann);
  });

  let svg = '';
  Object.values(groups).forEach(entries => {
    // Sort: N first, then EM, then null-mode (single-source)
    entries.sort((a, b) => {
      const order = { 'N': 0, 'EM': 1, null: 2, undefined: 2 };
      return (order[a.content.mode] || 0) - (order[b.content.mode] || 0);
    });
    let hasN = entries.some(e => e.content.mode === 'N');
    entries.forEach(ann => {
      const host = devMap[ann.bound_to] || reMap[ann.bound_to];
      if (!host) { return; }
      const isEM = ann.content.mode === 'EM';
      const modeOffsetY = (isEM && hasN) ? 26 : 0;  // 26 for bus cascade; diagonal for device
      const anch = _resolveA4Anchor(ann, host, modeOffsetY);
      if (!anch) return;
      svg += renderFcPennant(ann.id, ann.content.fc_amps,
                             anch.x, anch.y, anch.side,
                             ann.content.mode, anch.flip, anch.mirror);
    });
  });

  return svg;
}

// ============================================================
// A-6 KEYNOTE HEXAGONS WITH LEADER LINES
// plus per-sheet keynote legend in bottom-right.
// UPGRADE (Finding 5): 8-way rose candidate search with 3-ring retry
// escalation. Replaces the "always upper-right" logic which could
// collide with adjacent geometry in dense zones (MAIN-GFP, C4S-1-A, GEN-1).
// ============================================================

// A-6 hex-keynote placement candidate generator.
// Walks priority order to find the first non-clashing position.
//
// Leader angles are FIXED at 15° increments: 0°, ±15°, ±30°, ±45°,
// ±60°, ±75°, ±90°. "Do Not" #6 explicitly forbids free-form angles.
//
// Two-sided placement: the hex can sit on EITHER side of the target.
// A `side` parameter ('right' or 'left') determines which flat of the
// hex the horizontal stub enters (left flat at local −19,0 if hex on
// RIGHT of target; right flat at +19,0 if hex on LEFT).
//
// Priority order (mirrored per side):
// Angles: [+45, −45, +30, −30, +60, −60, +15, −15, +75, −75, 0, +90, −90]
// Sides: [right (preferred), left] — right-side placement is preferred
// because the original behavior defaulted to right.
//
// SVG Y is inverted (down = +Y). Spec angle convention: +deg = ABOVE
// horizontal (visually up). So for angle θ:
// dx = cos(θ_rad) [unchanged]
// dy = -sin(θ_rad) [negative because +θ maps to −Y in SVG]
// For side='left', mirror dx: dx = -cos(θ_rad).
//
// anchorX/Y is the CENTER of the bound device; boundW/H is its size.
// `radius` is the center-to-center distance from anchor to hex center.
const A6_ANGLES_PRIORITY = [45, -45, 30, -30, 60, -60, 15, -15, 75, -75, 0, 90, -90];

function _generateA6Candidates(anchorX, anchorY, boundW, boundH, radius) {
  const halfW = boundW / 2;
  const halfH = boundH / 2;
  const hex = DIM.a6_hex_r;
  // Effective center-to-center distance: anchor half-extent + clearance
  // + radius parameter + hex radius. Keeps hex body clear of target bbox.
  const off = radius + DIM.a6_clearance + hex;
  const maxEdge = Math.max(halfW, halfH);
  const r = off + maxEdge;

  const out = [];
  // Right-side placements first (higher preference), then left-side.
  ['right', 'left'].forEach((side, sideIdx) => {
    A6_ANGLES_PRIORITY.forEach((deg, angIdx) => {
      const rad = deg * Math.PI / 180;
      const sx = (side === 'right') ? 1 : -1;
      const dx = sx * Math.cos(rad);
      const dy = -Math.sin(rad);
      out.push({
        angle: deg,                    // numeric degrees
        side:  side,                   // 'right' or 'left'
        cx:    anchorX + r * dx,
        cy:    anchorY + r * dy,
        // Higher pref wins. Right-side wins over left at same angle.
        pref:  (A6_ANGLES_PRIORITY.length - angIdx) * 2 - sideIdx
      });
    });
  });
  return out;
}

// Running per-sheet cache of placed A-6 hexes so later hexes avoid earlier ones.
const _a6PlacedBySheet = {};

function _resolveA6Anchor(ann) {
  const bound = ann.bound_to_type === 'device' ? devMap[ann.bound_to] : reMap[ann.bound_to];
  if (!bound) return null;
  if (ann.bound_to_type === 'device') {
    const g = G[bound.id];
    if (!g) return null;
    const w = symbolWidth(bound) || 70;
    const h = symbolHeight(bound) || 70;
    return { cx: g.x + w / 2, cy: g.y + h / 2, boundW: w, boundH: h, boundId: bound.id };
  }
  // routed_element — R-2 bus bound (a-453 main bus on hospital SLD)
  if (ann.bound_to_type === 'routed_element' && bound.edge_type === 'R-2') {
    const swOwner = TOPO.switchboards.find(s =>
      s.main_bus_id === bound.id || s.secondary_bus_id === bound.id || s.distribution_bus_id === bound.id);
    if (!swOwner) return null;
    // Use approximate switchboard center above main bus.
    // These constants match the original renderHexNote anchor (stable behavior).
    return {
      cx: DIM.sw_text_zone_w + 40 + 600,
      cy: (4800 - DIM.sw_section_h) + DIM.sw_main_bus_offset - 30,
      boundW: 80,  // nominal — bus has effectively no height
      boundH: 20,
      boundId: bound.id
    };
  }
  return null;
}

function renderHexNote(ann) {
  // A-6 hex note rendering is suppressed. Topology data
  // (keynote_number, keynote_text, bound_to) remains intact in TOPO for
  // downstream consumers (Revit translation, keynote schedule export).
  // This is a render-layer suppression only.
  return '';
}

function renderKeynoteLegend(sheetId) {
  // Suppress keynote legend box since A-6 hexes are not
  // rendered. Re-enable together with renderHexNote if hexes come back.
  return '';
}

// ============================================================
// LEVEL LINES
// Dashed horizontal lines at each floor, labeled at the right edge.
// Exclude switchboard-internal types (L0-1, L1-1..L1-4) from Y extent scan
// per failure-journal Class H prevention rule.
// ============================================================
function escapeCollision(lineY, devicesOnSheet, margin) {
  let adjusted = lineY;
  let pass = 0;
  while (pass++ < 4) {
    const hit = devicesOnSheet.find(d => {
      const g = G[d.id]; if (!g) return false;
      const top = g.y;
      const bot = g.y + symbolHeight(d);
      return adjusted > top - margin && adjusted < bot + margin;
    });
    if (!hit) return adjusted;
    adjusted -= margin;  // shift upward, try again
  }
  return adjusted;
}

// ---- Level-line labels (WI-5(b)) — mirrors 07_data/normalized/
// equipment_designation_legend_V1_0_0.json: level_code_labels /
// level_code_pattern. Values are the COMPLETE emitted string (no prefix
// applied). The viewer is self-contained (no runtime fetch) — keep this
// mirror in sync with the legend JSON by hand, like TPL vs
// sld_sheet_templates_V1_0_0.json. ----
const LEVEL_CODE_LABELS = {
  'S': 'LEVEL S', 'B': 'LEVEL B', '1': 'LEVEL 1', '2': 'LEVEL 2',
  '3': 'LEVEL 3', '4': 'LEVEL 4', 'R': 'LEVEL ROOF'
};
const LEVEL_CODE_PATTERN = 'LEVEL {code}';

function renderLevelLines(sheetId) {
  // rewrite per:
  // - Line convention: uniform BELOW equipment cluster (y = maxY + margin)
  // for every floor including Roof; the Roof line sorts above the others
  // only because roof equipment is placed topmost (no minY/above rule).
  // - No midpoint algorithm. Physical separation is guaranteed by
  // chainYAnchors in placeAllChains.
  // - Coincident-Y diagnostic retained as a post-anchor safety check.
  //
  // 
  // - Added POST-PASS PHYSICAL-ORDER ENFORCEMENT. On any sheet where two
  // or more level lines land within MIN_GAP px of each other (S2 is
  // the typical case — Chain B internals stack above their parent,
  // pulling L2/L3 Y's upward into coincidence), the post-pass spreads
  // them to preserve physical-elevation order (R top → 1 bottom) with
  // a guaranteed minimum vertical gap. This is additive: if the first-
  // pass Y's are already well-ordered (S1), the post-pass is a no-op.
  // - Label X-stagger: if adjacent lines are still within LABEL_GAP px
  // after Y enforcement, alternating labels shift inward so text
  // doesn't horizontally overlap.

  // Collect placed devices per floor on this sheet.
  // Data-driven: one bucket per level in LEVEL_ORDER (was hard-coded to the
  // hospital's {R,3,2,1}; that crashed buildings with other floor sets).
  const perFloor = {}; LEVEL_ORDER.forEach(f => { perFloor[f] = []; });
  const sheetDevs = TOPO.devices.filter(d => d.sheet_id === sheetId && G[d.id]);
  sheetDevs.forEach(d => {
    if (LEVEL_EXCLUDE_TYPES.has(d.node_type)) return;
    const floor = LEVEL_MAP[d.designation];
    if (!floor || !perFloor[floor]) {
      if (d.designation && !LEVEL_EXCLUDE_TYPES.has(d.node_type) && LEVEL_MAP[d.designation] === undefined) {
      }
      return;
    }
    perFloor[floor].push(d);
  });

  const bb = bboxOfG(sheetId);
  const x1 = bb.minX - 40;
  const x2 = bb.maxX + 40 + DIM.level_line_label_w;
  const MARGIN = DIM.level_line_y_margin + 20;  // 40 px clearance above/below cluster

  // OFF-030 (rev 1.0.14): the floors this sheet declares in floor_order, so an
  // EMPTY one can still be given a line. `_sheetFloorStackBottomUp` returns []
  // for a sheet with no per-sheet floor_order, and the opt-in list is [] by
  // default, so `_emptyFloorLines` is false on every sheet of the golden.
  const _emptyFloorLines = Array.isArray(EMPTY_FLOOR_LEVEL_LINES)
    && EMPTY_FLOOR_LEVEL_LINES.includes(sheetId);
  const _declaredFloors = _emptyFloorLines
    ? new Set(_sheetFloorStackBottomUp(sheetId))
    : null;

  // FIRST PASS — compute candidate lineY per floor using existing logic
  const candidateY = {};
  for (let i = 0; i < LEVEL_ORDER.length; i++) {
    const floor = LEVEL_ORDER[i];
    const devsHere = perFloor[floor];
    if (devsHere.length === 0) {
      // OFF-030. A storey a riser only PASSES THROUGH has no devices, so the
      // maxBottomY logic below has nothing to measure and the line was dropped —
      // the sheet then draws its top floor immediately above its bottom one and
      // states that the building has two storeys. Second services do this
      // routinely (hosp9 S2: 4P-1-B on L1, 4P-5-B on L5, nothing between).
      //
      // The Y is not invented. __FLOOR_ROW_Y was populated at the top of
      // computeChainYOverrides by the same baseline + per-floor step walk the
      // anchor loops use, and INDEPENDENTLY of anchor-device existence, so
      // `row + boxH('L2-4') + MARGIN` is exactly where a panel standing on this
      // floor would have pushed the line. Verified on hosp9: it reproduces S1's
      // populated lines at 1166 / 2206 / 3246 to the pixel, so S2's empty lines
      // land on S1's rows and the two sheets band identically.
      if (!_emptyFloorLines) continue;
      if (!_declaredFloors.has(floor)) continue;
      const _row = __FLOOR_ROW_Y[floor];
      if (_row === undefined) continue;
      candidateY[floor] = escapeCollision(
        _row + boxH('L2-4') + MARGIN, sheetDevs, DIM.level_line_y_margin);
      continue;
    }

    let lineY;
    // a line ANCHORED to a device edge is intentional contact —
    // exempt it from escapeCollision (the escape walks upward in 20px steps
    // and, against the 140-tall L0-1 box, gave up INSIDE the box at 4780).
    let linePinned = false;
    if (floor === '1' && sheetRole(sheetId) === 'normal') {
      // Level 1 horizontal-run treatment.
      // L1 line anchors to the BOTTOM of the utility transformer pad.
      const utDev = TOPO.devices.find(d => d.node_type === 'L0-1' && d.sheet_id === sheetId);
      if (utDev && G[utDev.id]) {
        // pad bottom = box bottom (was literal T-box 80 + pad 40).
        lineY = G[utDev.id].y + boxH('L0-1');
        linePinned = true;
      } else {
        const maxBottomY = Math.max(...devsHere.map(d => G[d.id].y + symbolHeight(d)));
        lineY = maxBottomY + MARGIN;
      }
    } else if (floor === '1' && sheetRole(sheetId) === 'emergency') {
      // Level 1 on the emergency sheet must sit BELOW the EMSB switchboard envelope
      // and the generator. Switchboard-internal devices are excluded by type
      // from perFloor, so maxBottomY of `devsHere` alone misses the
      // switchboard body — resulting in a line that cuts through the
      // switchboard. Include the switchboard's bottom edge explicitly.
      //
      // this used to recover the envelope bottom by back-deriving it from an
      // L1-1 MAIN BREAKER device (`G[mainBkr].y - sw_main_bus_offset + sw_section_h`), guarded
      // by `if (mainBkr)`. An MLO emergency board (bus_architecture "single", the NEC
      // 700.10(B)(5)(a) default) HAS NO MAIN BREAKER, so there is no L1-1 device, the guard
      // never fired, and the envelope term was silently dropped — the exact failure the comment
      // above says it exists to prevent. maxBottomY then fell back to the generator's bottom
      // (4715), the line landed at 4755, and escapeCollision dragged it a further 80 px up into
      // the N-G bond glyph band, ending at 4675 instead of 4840. Because the whole S2 stack is
      // seeded on candidateY['1'], that 165 px error propagated 1:1 into EVERY level line on the
      // sheet, putting each one 15 px below its row's panel TOP edge — i.e. slicing through the
      // panel body — and putting the L1 line through the switchboard itself.
      //
      // The envelope bottom is a constant (SW_Y is `SW_ENVELOPE_BOTTOM_Y - sw_section_h`, so
      // SW_Y + sw_section_h is just SW_ENVELOPE_BOTTOM_Y). Fold it in unconditionally, exactly
      // as placeATSsAndGenerator already does when it predicts this same line
      // (`const swBottomY = swAnchorY + DIM.sw_section_h; let l1MaxBottom = swBottomY;`) — two
      // implementations of one quantity that disagreed only on an MLO board.
      //
      // Golden-inert: the golden's board HAS an L1-1 (EMSB-MAIN at y=4580), for which the old
      // path yielded 4580 - 60 + 280 = 4800 — identical to SW_ENVELOPE_BOTTOM_Y. Its line stays
      // at 4840 and escapeCollision still misses. This also dissolves a latent bug: the old
      // lookup sat inside a forEach over switchboards but its predicate never referenced `sw`,
      // so with two EM boards on one sheet it folded the same one in N times.
      let maxBottomY = Math.max(...devsHere.map(d => G[d.id].y + symbolHeight(d)));
      if (TOPO.switchboards.some(sw => sw.sheet_id === sheetId)) {
        maxBottomY = Math.max(maxBottomY, SW_ENVELOPE_BOTTOM_Y);
      }
      lineY = maxBottomY + MARGIN;
    } else {
      // Uniform: line BELOW equipment cluster.
      const maxBottomY = Math.max(...devsHere.map(d => G[d.id].y + symbolHeight(d)));
      lineY = maxBottomY + MARGIN;
    }

    // Defensive collision escape against devices (not other level lines).
    // Skipped for device-anchored (pinned) lines — contact is intentional.
    if (!linePinned) lineY = escapeCollision(lineY, sheetDevs, DIM.level_line_y_margin);
    candidateY[floor] = lineY;
  }

  // SECOND PASS — PHYSICAL-ORDER ENFORCEMENT 
  // Walk floors in physical-elevation order (top: Roof, 3, 2, 1: bottom)
  // and enforce monotonically-increasing Y with a minimum gap. Also
  // compute whether labels need X-stagger due to tight Y spacing.
  //
  // E-502 path: on S2 only, bypass the enforcement pass
  // and apply a fixed-pitch stack seeded on L1's first-pass candidate.
  // S1 continues to use the original enforcement logic.
  const MIN_LINE_GAP   = 60;   // px; vertical separation sufficient for distinct label rows
  const LABEL_GAP      = 40;   // px; Y-gap below which labels need X-stagger
  const enforcedY      = {};
  const needsXStagger  = {};   // floor -> bool
  const orderedFloors  = LEVEL_ORDER.filter(f => candidateY[f] !== undefined);

  // the fixed-pitch stack is data-driven: it walks the sheet's
  // own bottom-up floor stack (_sheetFloorStackBottomUp) and also serves
  // s2_pitch_sheets continuation sheets. Sheets with no per-sheet floor_order
  // (the golden and legacy exercise cases) walk the legacy ['1','2','3','R']
  // stack — byte-identical output.
  const _pitchStack = _sheetFloorStackBottomUp(sheetId);
  const _pitchBase  = _pitchStack[0];
  if (_usesS2Pitch(sheetId) && candidateY[_pitchBase] !== undefined) {
    // Fixed-pitch level-line stack for the emergency sheet.
    // The base floor inherits first-pass candidateY. Walk bottom-up
    // subtracting the prescribed pitch at each step.
    enforcedY[_pitchBase] = candidateY[_pitchBase];
    needsXStagger[_pitchBase] = false;
    let anchor = enforcedY[_pitchBase];
    for (const floor of _pitchStack.slice(1)) {
      if (candidateY[floor] === undefined) continue;  // skip unpopulated
      anchor = anchor - (S2_LEVEL_LINE_PITCH[floor] !== undefined ? S2_LEVEL_LINE_PITCH[floor] : 1250);
      enforcedY[floor] = anchor;
      needsXStagger[floor] = false;  // per-floor S2_LEVEL_LINE_PITCH >> LABEL_GAP; no overlap risk
    }
  } else {
    // ORIGINAL PATH — monotonic Y enforcement with minimum gap.
    // Seed: Roof (or topmost populated floor) takes its candidate as-is.
    let prevY = -Infinity;
    for (const floor of orderedFloors) {
      const cand = candidateY[floor];
      const y    = Math.max(cand, prevY + MIN_LINE_GAP);
      enforcedY[floor] = y;
      prevY = y;
    }
    // Flag X-stagger where the enforcement had to push a floor (i.e., its
    // enforced Y is strictly greater than its candidate). These are the
    // floors whose labels are crammed against the label above.
    for (const floor of orderedFloors) {
      needsXStagger[floor] = (enforcedY[floor] - candidateY[floor]) > 0
                          && (enforcedY[floor] - (enforcedY[orderedFloors[orderedFloors.indexOf(floor) - 1]] ?? -Infinity)) < LABEL_GAP + MIN_LINE_GAP;
    }
  }

  // floors with a populated bucket but no enforced row (a
  // level_map floor code missing from this sheet's fixed-pitch stack) were
  // previously "rendered" with undefined Y — an invalid SVG line the browser
  // drops — and their undefined lineYs entries turned the overflow scan's
  // Math.min into NaN, silently suppressing VERTICAL_OVERFLOW_WARNING
  // (first hit: Blue Heron S2, floors 4–10). Flag-never-mitigate:
  // skip them EXPLICITLY and emit a typed warning per dropped floor. On the
  // normal (monotonic) path enforcedY covers every ordered floor, so
  // renderFloors ≡ orderedFloors — golden-identical.
  const renderFloors   = orderedFloors.filter(f => enforcedY[f] !== undefined);
  const _droppedFloors = orderedFloors.filter(f => enforcedY[f] === undefined);
  if (_droppedFloors.length) {
    window.__LAYOUT_WARNINGS = window.__LAYOUT_WARNINGS || [];
    for (const f of _droppedFloors) {
      window.__LAYOUT_WARNINGS.push({
        type: 'LEVEL_ROW_UNMAPPED',
        sheet: sheetId,
        floor: f,
        reason: 'Floor has level_map members on this sheet but no row in the fixed-pitch stack (missing from the sheet\'s floor_order entry); no level line drawn and member devices are not lifted. Add the floor to the per-sheet floor_order (and s2_level_line_pitch / s2_shift_delta).'
      });
    }
  }

  // RENDER
  let svg = '';
  const lineYs = {};
  let staggerToggle = 0;
  for (const floor of renderFloors) {
    const lineY = enforcedY[floor];
    lineYs[floor] = lineY;

    const label = LEVEL_CODE_LABELS[floor] || LEVEL_CODE_PATTERN.replace('{code}', floor);
    // Label X: normally at x2 (far right). If this floor was displaced by
    // enforcement, alternate the label X inward by 80 px to avoid
    // horizontal overlap with the adjacent label. Toggle so consecutive
    // staggered labels sit at different X positions.
    let labelX = x2;
    if (needsXStagger[floor]) {
      labelX = x2 - (staggerToggle % 2 === 0 ? 160 : 80);
      staggerToggle++;
    }

    // Level-line stroke uses text color (NOT cyan linework) per the catalog A-7
    // card and the sidebar legend swatch.
    svg += `<g class="level-line" data-id="level-${floor}" style="cursor:pointer"><line x1="${x1}" y1="${lineY}" x2="${x2 - DIM.level_line_label_w}" y2="${lineY}"
              stroke="var(--sld-text)" stroke-width="1.2"
              stroke-dasharray="${DIM.level_line_dash}" opacity=".55"/><text x="${labelX}" y="${lineY + 4}" text-anchor="end"
              font-family="'Courier New',monospace" font-size="13" font-weight="700"
              fill="var(--sld-text)" opacity=".8">${label}</text></g>`;

    // A-7 level-line geometry capture. When the geometry-export
    // hook is armed (exportGeometry / headless buildGeometry), record the
    // rendered line per schema §14.6: level, label, y, and the line endpoints
    // x_start = bb.minX-40 (== x1, may be negative) and x_end = bb.maxX+40
    // (== the <line> x2, before the label gutter). Not folded into content_area
    // extents — level lines span past the cluster by design. Guarded so normal
    // renders never capture.
    if (window.__GEOM_CAP && window.__GEOM_CAP.levelLines) {
      window.__GEOM_CAP.levelLines.push({
        sheet: sheetId, level: floor, label,
        y: lineY, x_start: x1, x_end: x2 - DIM.level_line_label_w
      });
    }
  }

  // post-anchor diagnostic: chainYAnchors should guarantee each
  // populated floor has a distinct anchor Y. If two floors still collide,
  // HOSPITAL_FLOOR_ANCHOR_S1 is wrong or LEVEL_MAP references a non-anchor
  // device at a collapsed Y.
  const populatedFloors = LEVEL_ORDER.filter(f => perFloor[f].length > 0);
  const anchorYs = populatedFloors.map(f => ({
    floor: f,
    anchorY: Math.min(...perFloor[f].map(d => G[d.id].y))
  }));
  for (let i = 0; i < anchorYs.length; i++) {
    for (let j = i + 1; j < anchorYs.length; j++) {
      if (Math.abs(anchorYs[i].anchorY - anchorYs[j].anchorY) < 20) {
      }
    }
  }

  window.__LEVEL_LINE_Y = lineYs;

  // Emit traceability warnings for the S2 fixed-pitch
  // fixed-pitch level-line stack. Downstream preflight / geometry export can
  // surface these to the schema drift panel. No auto-mitigation; overflow is flagged
  // but not corrected (fixed pitches are authoritative).
  if (sheetRole(sheetId) === 'emergency') {
    window.__LAYOUT_WARNINGS = window.__LAYOUT_WARNINGS || [];
    window.__LAYOUT_WARNINGS.push({
      type: 'LEVEL_LINE_FIXED_PITCH',
      sheet: sheetId,
      reason: 'Fixed-pitch level-line stack; per-floor pitch subtracted bottom-up from L1 (authoritative values in the pitches field).',
      pitches: S2_LEVEL_LINE_PITCH,
      resulting_y: Object.assign({}, lineYs)
    });
    const yValues = Object.values(lineYs);
    if (yValues.length > 0) {
      const minY = Math.min(...yValues);
      if (minY < 0) {
        window.__LAYOUT_WARNINGS.push({
          type: 'VERTICAL_OVERFLOW_WARNING',
          sheet: sheetId,
          min_line_y: minY,
          reason: 'S2 level-line stack pushed topmost line above content area (y<0). Mitigation: relax L1 anchor, reduce px_per_inch, or reduce pitches.'
        });
      }
    }
  }

  return svg;
}

// ============================================================
// BUILD ONE SHEET
// ============================================================
function buildSheet(sheetId) {
  G = {};
  // Intentional skips for compact rendering.
  // OFF-008: patterns come from SHEET_SKIPS[sheetId] — an array
  // of regex sources matched against device designations. The default,
  // {S2: ['[-][23][-]']}, reproduces the legacy hospital behavior exactly:
  // floors 2/3 devices on the EM sheet, every R-1 touching one, and all
  // bound annotations. Office passes {} (no skips).
  const intentionalSkips = new Set();
  const _skipPats = (SHEET_SKIPS && SHEET_SKIPS[sheetId]) || [];
  if (_skipPats.length) {
    const _skipRes = _skipPats.map(p => new RegExp(p));
    const _skipHit = (desig) => !!desig && _skipRes.some(re => re.test(desig));
    TOPO.devices.filter(d => d.sheet_id === sheetId).forEach(d => {
      if (_skipHit(d.designation)) {
        intentionalSkips.add(d.id);
      }
    });
    TOPO.routed_elements.filter(r => r.sheet_id === sheetId).forEach(r => {
      if (!r.start || !r.end) return;
      const srcDev = devMap[r.start.device_id];
      const dstDev = devMap[r.end.device_id];
      const involvesSkip = (srcDev && _skipHit(srcDev.designation))
                        || (dstDev && _skipHit(dstDev.designation));
      if (involvesSkip) {
        intentionalSkips.add(r.id);
        (annByBound[r.id] || []).forEach(a => intentionalSkips.add(a.id));
      }
    });
    // Also skip annotations bound to skipped R-1s
    TOPO.annotations.filter(a => a.sheet_id === sheetId).forEach(a => {
      if (intentionalSkips.has(a.bound_to)) intentionalSkips.add(a.id);
    });
  }

  // OFF-031: a feed-through pair's R-1 (and its A-1/A-2) is deliberately not
  // drawn — the two panels are butted together. Counted as an intentional skip
  // so coverage reports it as such, never as a drop. {} on the golden → no-op.
  TOPO.routed_elements.filter(r => r.sheet_id === sheetId && _isFeedThroughEdge(r)).forEach(r => {
    intentionalSkips.add(r.id);
    (annByBound[r.id] || []).forEach(a => intentionalSkips.add(a.id));
  });

  manifest = new RenderManifest(sheetId, intentionalSkips);
  renderedIds = { _set: new Set(), add(id){this._set.add(id); if(manifest) manifest.rendered(id)}, has(id){return this._set.has(id)}, get size(){return this._set.size} };

  let svg = '';
  // Accessible name for the SVG canvas (SR/AT). Must be the first children
  // of the SVG element per SVG accessibility conventions; we accumulate
  // these into the returned string so they sit at the head of innerHTML.
  const _sheetMeta = TOPO.sheets.find(s => s.sheet_id === sheetId);
  if (_sheetMeta) {
    const _devCount = TOPO.devices.filter(d => d.sheet_id === sheetId).length;
    svg += `<title>${esc(_sheetMeta.title)}</title>`;
    svg += `<desc>Single-line diagram, sheet ${esc(_sheetMeta.sheet_number)}. ${_devCount} devices.</desc>`;
  }
  // FU-0016 step 1 — a sheet may carry MORE THAN ONE lineup.
  // `swList` is every switchboard on this sheet, in topology order; `sw` stays
  // the FIRST one so every single-lineup sheet (all golden sheets, and every
  // project before 2026-08-03) renders byte-identically. Nothing reads swList
  // beyond its length yet — this is the seam, not the feature.
  const swList = TOPO.switchboards.filter(s => s.sheet_id === sheetId);
  const sw = swList[0];
  // OFF-001: continuation-role sheets legitimately have no
  // switchboard — their riser continues from a panel fed on another sheet.
  // All other sheets still require a lineup.
  if (!sw && sheetRole(sheetId) !== 'continuation') return '<text x="100" y="100" fill="white">No switchboard on sheet '+sheetId+'</text>';

  // Switchboard position: anchored to bottom of content area
  // Use a fixed Y baseline per sheet; content grows upward from there
  const SW_Y = SW_ENVELOPE_BOTTOM_Y - DIM.sw_section_h;  // switchboard top
  const MAIN_BUS_Y = SW_Y + DIM.sw_main_bus_offset;
  const SEC_BUS_Y = SW_Y + DIM.sw_sec_bus_offset;
  const DIST_BUS_Y = SW_Y + DIM.sw_dist_bus_offset;  // for MLO variant (EM)

  // EM variant now uses the same two-level bus architecture as NP.
  // Chains attach to the secondary bus in both cases. DIST_BUS_Y serves
  // single-bus boards (bus_architecture "single", e.g. an MLO EM board with
  // only a distribution bus): their chains attach to the distribution bus.
  const _singleBus = !!(sw && sw.bus_architecture === 'single' && sw.distribution_bus_id);
  const chainBusY = _singleBus ? DIST_BUS_Y : SEC_BUS_Y;
  const chainMainBusY = MAIN_BUS_Y;

  // OFF-001: the entire switchboard-lineup region (sections →
  // buses → main breaker → meter → fire pump → utility TX → distribution
  // breakers/N-G bond) is sw-scoped. Declarations consumed by downstream
  // passes (emergency ATS block, __SEC_POS export) are hoisted so they stay
  // in scope; on a continuation sheet they remain empty. No emission-code
  // changes inside the wrap — hospital sheets always have sw, so output is
  // byte-identical there.
  let secs = [], SEC_POS = {}, incSec = null;
  // FU-0016 — ONE LOOP PER LINEUP. `swList` is every switchboard on this sheet.
  // With exactly one (every golden sheet, and every project before 2026-08-03)
  // _lineupDX stays 0 and _li is 0, so the body below is byte-identical to what
  // it was as a plain `if (sw) {` block — that is the inertness argument, and
  // it is checked by G1, not asserted.
  // Only THREE sites inside this block use an absolute X (sx's origin, swText,
  // swLeftEdge); every other coordinate derives from sx or SEC_POS, so
  // offsetting those three moves a whole lineup.
  // Gap between adjacent lineups on one sheet. Only reachable when a sheet
  // carries 2+ switchboards, so it cannot move any existing drawing.
  const LINEUP_GUTTER = (typeof LINEUP_GUTTER_CFG === 'number' ? LINEUP_GUTTER_CFG : 320);
  let _outerSecs = [], _outerSecPos = {}, _outerIncSec = null;
  const _SEC_POS_ALL = {};        // merged across lineups — section ids are unique
  const _LINEUP_BUS_Y = {};       // switchboard id -> its chain bus Y (arch differs per board)
  const _LINEUP_TAP   = {};       // switchboard id -> {x, busY, busIds} incoming bus tap
  let _lineupDX = 0;              // X origin of the lineup being drawn
  for (let _li = 0; _li < swList.length; _li++) {
  const sw = swList[_li];
  const _singleBus = !!(sw && sw.bus_architecture === 'single' && sw.distribution_bus_id);
  const chainBusY = _singleBus ? DIST_BUS_Y : SEC_BUS_Y;
  _LINEUP_BUS_Y[sw.id] = chainBusY;
  // Shadow the outer accumulators so each lineup lays out independently; the
  // outer ones keep lineup 0's values (what every downstream single-lineup
  // consumer already expects) and SEC_POS is merged into _SEC_POS_ALL.
  let secs = [], SEC_POS = {}, incSec = null;
  // --- Sections layout ---
  secs = TOPO.sections.filter(s => s.switchboard_id === sw.id).sort((a,b) => a.order - b.order);
  let sx = DIM.sw_text_zone_w + 40 + _lineupDX;
  secs.forEach(s => {
    let w;
    const bkrDevsInSec = s.device_ids
      .map(did => devMap[did])
      .filter(d => d && (d.node_type === 'L2-1' || d.node_type === 'L2-7'));
    if (s.type === 'distribution' || s.type === 'fire_pump') {
      // topology-aware width: panel-panel pairs widen to panel_S + panel_clearance
      // Pass section id so BREAKER_PITCH_SECTION_MULTIPLIER applies
      w = sectionWidthForBreakers(bkrDevsInSec, s.id);
    } else {
      w = 210;
    }
    SEC_POS[s.id] = { x: sx, w, type: s.type };
    sx += w;
  });

  // Golden-case pattern has contiguous distribution sections. NEC class info
  // is conveyed via a subtle in-label tag rather than a cosmetic gap.

  // Uniform section height across all variants (matches golden case).
  // NEC class info goes into the quiet section label (e.g., "DISTRIBUTION · NEC 700")
  // rather than a colored banner above. Subtle small tag inside the rect.
  secs.forEach(s => {
    const p = SEC_POS[s.id];
    const h = DIM.sw_section_h;
    const y = SW_Y;
    const typeLabel = s.type.toUpperCase().replace('_',' ');
    // Wrap in <g class="section" data-id="sec-NNN"> so tooltip + click-
    // to-copy can resolve. Transparent rect first acts as the hit-target;
    // dashed boundary and labels carry pointer-events="none" so they never
    // intercept events meant for inner devices/feeders/buses (which render
    // later in document order and therefore sit on top in SVG hit testing).
    svg += `<g class="section" data-id="${s.id}" style="cursor:pointer">`;
    svg += `<rect x="${p.x}" y="${y}" width="${p.w}" height="${h}" fill="transparent" pointer-events="all"/>`;
    svg += `<rect x="${p.x}" y="${y}" width="${p.w}" height="${h}" fill="none" stroke="var(--sld-section)" stroke-width="1.2" stroke-dasharray="8,5" opacity=".5" pointer-events="none"/>`;
    // Primary section type label (top-center, same opacity/size as golden case)
    svg += `<text x="${p.x+p.w/2}" y="${y+14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="var(--sld-section)" opacity=".45" pointer-events="none">${esc(typeLabel)}</text>`;
    // Subtle NEC class tag below the type label (no colored banner above)
    if (s.nec_class) {
      svg += `<text x="${p.x+p.w/2}" y="${y+26}" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="600" fill="var(--sld-section)" opacity=".6" pointer-events="none">NEC ${esc(s.nec_class)}</text>`;
    }
    svg += `</g>`;
    // Schema §14.7: L1-2 switchboard-section rects. The engine has
    // always DRAWN these; it just never exported them, so the add-in could not
    // place them. Flat x/y/w/h = the dashed boundary's top-left + size (L1-2 is
    // definitionally top-left anchored, so no anchor_mode). `sheet` is required
    // and comes from the render scope: topology.sections[] carries no sheet_id
    // (schema §9), so without it the add-in cannot filter per sheet. Not fed to
    // ext() — section extents are excluded from content_area, matching the
    // the frozen golden. Guarded so normal renders never capture.
    if (window.__GEOM_CAP && window.__GEOM_CAP.sections) {
      window.__GEOM_CAP.sections.push({
        id: s.id, sheet: sheetId, switchboard_id: s.switchboard_id, type: s.type,
        nec_class: s.nec_class || null, section_tag: s.section_tag || null,
        x: p.x, y, w: p.w, h
      });
    }
  });

  // Switchboard text block — uniform positioning 
  const swTextY = SW_Y + DIM.sw_section_h/2 - 40;
  svg += swText(DIM.sw_text_zone_w + 20 + _lineupDX, swTextY, sw);

  // No multi-source-pattern header is rendered (would convey no
  // information to the reader). Layout pattern is implicit in the geometry.

  // --- Buses ---
  incSec = secs.find(s => s.type === 'incoming');
  const meterSec = secs.find(s => s.type === 'metering');
  const fpSec = secs.find(s => s.type === 'fire_pump');
  const mbSec = secs.find(s => s.type === 'main_breaker');
  const distSecs = secs.filter(s => s.type === 'distribution');

  if (sw.variant === 'NP' && sw.bus_architecture === 'two-level') {
    // Main bus: incoming → main_breaker
    const mainBusStartX = (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x) + DIM.section_margin;
    const mainBusEndX = mbSec ? (SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2) : (SEC_POS[secs[secs.length-1].id].x + SEC_POS[secs[secs.length-1].id].w);
    svg += `<g class="bus" data-id="${sw.main_bus_id}" style="cursor:pointer"><line x1="${mainBusStartX}" y1="${MAIN_BUS_Y}" x2="${mainBusEndX}" y2="${MAIN_BUS_Y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/><line x1="${mainBusStartX}" y1="${MAIN_BUS_Y}" x2="${mainBusEndX}" y2="${MAIN_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.main_bus_stroke}"/></g>`;
    // Secondary bus: main_breaker → last distribution
    if (mbSec && distSecs.length > 0) {
      const secBusStartX = SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2;
      const secBusEndX = SEC_POS[distSecs[distSecs.length-1].id].x + SEC_POS[distSecs[distSecs.length-1].id].w - DIM.section_margin;
      svg += `<g class="bus" data-id="${sw.secondary_bus_id}" style="cursor:pointer"><line x1="${secBusStartX}" y1="${SEC_BUS_Y}" x2="${secBusEndX}" y2="${SEC_BUS_Y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/><line x1="${secBusStartX}" y1="${SEC_BUS_Y}" x2="${secBusEndX}" y2="${SEC_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.secondary_bus_stroke}"/></g>`;
    }
  } else if (_singleBus) {
    // Single-bus board (bus_architecture "single"): one distribution bus at
    // DIST_BUS_Y spanning incoming → last distribution section, carrying the
    // board's distribution_bus_id. Dialect decision (OFF-010):
    // bus_level taxonomy is {main, secondary, distribution}, and the rendered
    // bus data-ids always come from the switchboard's *_bus_id fields.
    // Hospital boards are both "two-level", so this branch is unreachable there.
    const distBusStartX = (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x) + DIM.section_margin;
    const distBusEndX = distSecs.length > 0
      ? (SEC_POS[distSecs[distSecs.length-1].id].x + SEC_POS[distSecs[distSecs.length-1].id].w - DIM.section_margin)
      : (SEC_POS[secs[secs.length-1].id].x + SEC_POS[secs[secs.length-1].id].w - DIM.section_margin);
    svg += `<g class="bus" data-id="${sw.distribution_bus_id}" style="cursor:pointer"><line x1="${distBusStartX}" y1="${DIST_BUS_Y}" x2="${distBusEndX}" y2="${DIST_BUS_Y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/><line x1="${distBusStartX}" y1="${DIST_BUS_Y}" x2="${distBusEndX}" y2="${DIST_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.secondary_bus_stroke}"/></g>`;
  } else if (sw.variant === 'EM') {
    // EM switchboards now render with the SAME two-level architecture
    // as NP boards (topology says bus_architecture: "two-level", with real main
    // bus r-903 and secondary bus r-904). Previous single-bus render ignored the
    // topology and drew only one bus at DIST_BUS_Y. Golden-case convention:
    // main bus spans incoming → main_breaker (x-center)
    // secondary bus spans main_breaker (x-center) → last distribution
    const mainBusStartX = (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x) + DIM.section_margin;
    const mainBusEndX = mbSec ? (SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2) : (SEC_POS[secs[secs.length-1].id].x + SEC_POS[secs[secs.length-1].id].w);
    svg += `<g class="bus" data-id="${sw.main_bus_id}" style="cursor:pointer"><line x1="${mainBusStartX}" y1="${MAIN_BUS_Y}" x2="${mainBusEndX}" y2="${MAIN_BUS_Y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/><line x1="${mainBusStartX}" y1="${MAIN_BUS_Y}" x2="${mainBusEndX}" y2="${MAIN_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.main_bus_stroke}"/></g>`;
    if (mbSec && distSecs.length > 0) {
      const secBusStartX = SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2;
      const secBusEndX = SEC_POS[distSecs[distSecs.length-1].id].x + SEC_POS[distSecs[distSecs.length-1].id].w - DIM.section_margin;
      svg += `<g class="bus" data-id="${sw.secondary_bus_id}" style="cursor:pointer"><line x1="${secBusStartX}" y1="${SEC_BUS_Y}" x2="${secBusEndX}" y2="${SEC_BUS_Y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/><line x1="${secBusStartX}" y1="${SEC_BUS_Y}" x2="${secBusEndX}" y2="${SEC_BUS_Y}" stroke="var(--sld-line)" stroke-width="${DIM.secondary_bus_stroke}"/></g>`;
    }
  }

  // --- Cross-sheet INCOMING onto this sheet's lineup bus ---
  // The DESTINATION half of a cross-sheet pair whose `end` is a bus owned by this
  // sheet's lineup (schema §6 `bus_tap_bi`). Draws the mirror image of the
  // source-side stub in placeAllChains' isCrossSheetSource branch: a riser off the
  // bus tap in the incoming section, terminated by the pair's A-3 FROM-squiggle.
  //
  // Why it has to exist: CV-8 gives an L2-1 breaker NO load-side port, so a feeder
  // into an MLO sub-distribution lineup can only terminate on the bus. The
  // contract has always allowed that (schema §6 endpoint dialect (c)); the
  // renderer only ever drew it as the generator's hardcoded r-040 route, so every
  // other bus-landing feeder was silently dropped with its annotations.
  //
  // Golden-inert: both hospital lineups are fed through DEVICES (ATS source1_in),
  // and the one bus-tap R-1 they do have (r-040) is same-sheet with its source
  // generator on that sheet, so the `srcDev.sheet_id === sheetId` guard below
  // skips it and this loop emits nothing for the golden case.
  if (incSec && SEC_POS[incSec.id]) {
    const _lineupBusIds = new Set(
      [sw.main_bus_id, sw.secondary_bus_id, sw.distribution_bus_id].filter(Boolean));
    const _incBusY = _singleBus ? DIST_BUS_Y : MAIN_BUS_Y;
    const _incX = SEC_POS[incSec.id].x + SEC_POS[incSec.id].w / 2;
    TOPO.routed_elements.forEach(r => {
      if (r.edge_type !== 'R-1' || r.sheet_id !== sheetId) return;
      if (!r.end || !_lineupBusIds.has(r.end.device_id)) return;
      const srcDev = r.start ? devMap[r.start.device_id] : null;
      if (srcDev && srcDev.sheet_id === sheetId) return;   // same-sheet: not an arrival
      const a3 = (annByBound[r.id] || []).find(a => a.annotation_type === 'A-3');
      let txt = (a3 && a3.content && a3.content.text) ? a3.content.text : null;
      if (!txt) {
        const srcSw = srcDev ? TOPO.switchboards.find(s => s.sheet_id === srcDev.sheet_id) : null;
        txt = 'FROM ' + (srcSw ? srcSw.designation : (srcDev ? srcDev.designation : '(cross-sheet)'));
      }
      const stubTopY = _incBusY - DIM.chain_h_min;
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${_incX},${stubTopY} ${_incX},${_incBusY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      svg += `<circle cx="${_incX}" cy="${_incBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      svg += renderSquiggle(_incX, stubTopY, txt, 'above', 'horizontal', a3 ? a3.id : null, r.id);
      if (a3) renderedIds.add(a3.id);
      renderedIds.add(r.id);
    });
  }

  // --- Main breaker / GFP ---
  if (mbSec) {
    const mainBkr = mbSec.device_ids.map(id => devMap[id]).find(d => d && (d.node_type === 'L1-1' || d.node_type === 'L2-1'));
    if (mainBkr) {
      const mbX = SEC_POS[mbSec.id].x + SEC_POS[mbSec.id].w/2;
      if (mainBkr.node_type === 'L1-1') {
        G[mainBkr.id] = { x: mbX, y: MAIN_BUS_Y, secBusY: SEC_BUS_Y };
        svg += renderDevice(mainBkr, G[mainBkr.id]);
      } else {
        // EM main breaker as L2-1 — draw between main bus and dist bus
        G[mainBkr.id] = { x: mbX, y: DIST_BUS_Y };
        svg += `<line x1="${mbX}" y1="${DIST_BUS_Y - DIM.cb_height - 40}" x2="${mbX}" y2="${DIST_BUS_Y - DIM.cb_height}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
        svg += renderDevice(mainBkr, G[mainBkr.id]);
      }
      renderedIds.add(mainBkr.id);
    }
    // SPD-EMSB (d-054) is a chain terminal downstream of CB-01-EM (d-113)
    // in the NEC 700 distribution section (sec-009), matching the E-501 pattern
    // where SPD-MSB (d-020) is fed by CB-01 (d-015) via r-036. placeAllChains
    // handles the L2-1 → L2-6 chain draw automatically (see case at L1272).
  }

  // --- Meter ---
  if (meterSec) {
    const meterDev = meterSec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L1-4');
    if (meterDev) {
      const mx = SEC_POS[meterSec.id].x + SEC_POS[meterSec.id].w/2;
      // spec anchor = top-left of meter box; centered on the section via boxW.
      // Meter Y shifted 5 px north (MAIN_BUS_Y + 25 → +20).
      // Metering section exists only on sw-001 (S1/E-501) so this
      // implicitly scopes to normal power sheet.
      G[meterDev.id] = { x: mx - boxW('L1-4')/2, y: MAIN_BUS_Y + 20, busY: MAIN_BUS_Y };
      svg += renderDevice(meterDev, G[meterDev.id]);
      renderedIds.add(meterDev.id);
    }
  }

  // --- Fire pump breaker (S1 only, taps main bus per NEC 695.4(B)) ---
  if (fpSec) {
    const fpBkr = fpSec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L2-1');
    if (fpBkr) {
      const fbx = SEC_POS[fpSec.id].x + SEC_POS[fpSec.id].w/2;
      // flip_vertical mirrors CB-FP symbol below main bus.
      // Arc/nodes hang down; bus dot anchor unchanged so electrical
      // topology (line_in still taps main bus via r-901) is preserved. Feeder
      // r-019-s1 stub continues to render in its existing cross-sheet chain zone.
      G[fpBkr.id] = { x: fbx, y: MAIN_BUS_Y, flip_vertical: true };
      svg += `<circle cx="${fbx}" cy="${MAIN_BUS_Y}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      svg += renderDevice(fpBkr, G[fpBkr.id]);
      renderedIds.add(fpBkr.id);
    }
  }

  // --- Utility transformer (normal-role sheets only) ---
  // OFF-032 (rev 1.0.19): a COMBINED sheet (role emergency, 2+ lineups) also
  // carries the NP lineup, and that lineup's utility transformer must draw. The
  // FU-0016 _landsHere guard below then keeps it on the lineup it feeds.
  // Golden-inert: every golden sheet has exactly one lineup.
  if (sheetRole(sheetId) === 'normal' || (swList.length > 1 && sw && sw.variant === 'NP')) {
    // OFF-020 (rev 1.0.10): scope the lookup to THIS sheet. The find was
    // global, so a topology with more than one `normal` sheet — two utility
    // services, one lineup each — rendered the FIRST L0-1 on every normal
    // sheet and DROPPED the others along with their service laterals and
    // A-4 tags. Everything else in this block is already sheet-scoped
    // (incSec, SEC_POS, MAIN_BUS_Y), so the missing filter was the only
    // global left. Default-inert: the golden, the 5-story and the clinic each
    // carry exactly one L0-1 on their single normal sheet, where the filtered
    // find returns the same device. Symptom it fixes: "DROPPED device
    // <id> (UTILITY-XFMR-B)" in geometry.layout_warnings.
    // FU-0016: OFF-020 scoped this find to the SHEET, which was right when a
    // sheet meant a lineup. With 2+ lineups per sheet it is not: every lineup
    // found the same L0-1 and drew its own utility transformer, primary feed and
    // TO-UTILITY squiggle. Measured on the merged 3000 A project: FOUR utility
    // transformers on one drawing, one per lineup, three of them fiction.
    // The utility belongs to the lineup its secondary feeder actually lands in,
    // so gate on that. Golden-inert: with one lineup on the sheet the guard is
    // skipped entirely and the find is unchanged.
    let utDev = TOPO.devices.find(d => d.node_type === 'L0-1' && d.sheet_id === sheetId);
    if (utDev && swList.length > 1) {
      const _utR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1'
        && r.start && r.start.device_id === utDev.id);
      const _lineupBusIds = [sw.main_bus_id, sw.secondary_bus_id, sw.distribution_bus_id].filter(Boolean);
      const _landsHere = !!(_utR1 && _utR1.end && (
           _lineupBusIds.indexOf(_utR1.end.device_id) !== -1
        || (devMap[_utR1.end.device_id]
            && secs.some(sec => sec.device_ids.indexOf(_utR1.end.device_id) !== -1))));
      if (!_landsHere) utDev = null;
    }
    if (utDev && incSec) {
      // anchor = drawn-box top-left (168×140 family box). The
      // drawn extent occupies the same footprint as the legacy pad
      // (left edge −200, bottom 4860 on the hospital golden).
      const swLeftEdge = DIM.sw_text_zone_w + 40 + _lineupDX;
      const utX = swLeftEdge - 440;                 // legacy pad left edge
      const utY = 4800 + 60 - boxH('L0-1');         // drawn bottom stays at 4860
      G[utDev.id] = { x: utX, y: utY };
      svg += renderDevice(utDev, G[utDev.id]);
      renderedIds.add(utDev.id);
      // Secondary feeder to incoming bus tap
      const incX = SEC_POS[incSec.id].x + SEC_POS[incSec.id].w/2;
      // Ports on the family-box bottom edge (proportional x estimates —
      // real family port positions unmeasured; schema §14 follow-up).
      const txSecOutX = utX + 112;
      const txSecOutY = utY + boxH('L0-1');
      const jogY = txSecOutY + DIM.equip_stub;
      const incR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === utDev.id);
      const incR1Id = incR1 ? incR1.id : '';
      svg += `<g class="feeder" data-id="${incR1Id}" style="cursor:pointer"><polyline points="${txSecOutX},${txSecOutY} ${txSecOutX},${jogY} ${incX},${jogY} ${incX},${MAIN_BUS_Y+DIM.bus_r_dot}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      svg += `<circle cx="${incX}" cy="${MAIN_BUS_Y}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      // GEOMETRY EXPORT HOOK (no-op unless exportGeometry() runs):
      // the incoming-feeder × main-bus connection dot is drawn INLINE above (a
      // bare pink circle, like the primary feed), so it lives in no export
      // collection and the Revit add-in cannot place the _Connection Dot family
      // at the junction. Capture it as geometry.bus_dots. INCOMING dot only
      // (Mayo scope). the EMERGENCY sheet's incoming dot
      // is captured too (see placeATSsAndGenerator), so the other FOUR bus_r_dot
      // sites stay inline (fire-pump tap, ATS load tap, breaker-top, N-G-bond tee).
      if (window.__GEOM_CAP && window.__GEOM_CAP.busDots) {
        window.__GEOM_CAP.busDots.push({
          // FU-0016: qualify by lineup — 2+ lineups on one sheet each emit an
          // incoming bus dot, and schema §14 requires unique ids. Suffix only when
          // the sheet actually has more than one lineup, so single-lineup sheets
          // (every golden sheet) keep the id they have always had.
          id: 'bd-' + sheetId + (swList.length > 1 ? '-' + sw.id : '') + '-incoming', sheet: sheetId,
          host_device_id: incSec.id, role: 'incoming', x: incX, y: MAIN_BUS_Y
        });
      }
      if (incR1) {
        renderedIds.add(incR1.id);
        svg += renderR1Tags(incR1, incX, jogY - 60, 'right');
      }
      // Primary squiggle "TO UTILITY"
      const primX = utX + 56;
      const sqX = primX - DIM.tag_gap - DIM.equip_stub;
      svg += `<polyline points="${primX},${utY+boxH('L0-1')} ${primX},${jogY} ${sqX},${jogY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/>`;
      // "TO UTILITY" — hardcoded squiggle on 13.2kV primary (no R-1 / no A-3
      // in TOPO). annId passed as null; resolver falls back to derived value
      // via fallbackFeederId. Pre-existing data-model gap.
      // OFF-004 addendum (data-shape-keyed): when the topology DOES
      // carry an A-3 on the incoming feeder (office a-501), use its id + text
      // so the annotation renders and is coverage-tracked. Hospital has none →
      // null/'TO UTILITY' fallback emits byte-identical output.
      const _incA3 = incR1 ? (annByBound[incR1.id] || []).find(a => a.annotation_type === 'A-3') : null;
      const _sqText = (_incA3 && _incA3.content && _incA3.content.text) ? _incA3.content.text : 'TO UTILITY';
      svg += renderSquiggle(sqX, jogY, _sqText, 'left', 'vertical', _incA3 ? _incA3.id : null, incR1Id);
      if (_incA3) renderedIds.add(_incA3.id);
      // GEOMETRY EXPORT HOOK (no-op unless exportGeometry() is
      // running): the primary feed + squiggle above are drawn INLINE (no R-1 /
      // no A-3 in TOPO — the data-model gap noted above), so they exist in no
      // export collection and a geometry consumer (the Revit add-in) renders a
      // bare transformer ("missing primary feed and squiggle"). The
      // squiggle record is captured ONLY on the no-A-3 fallback path — a real
      // A-3 (office a-501 shape) already exports via geometry.annotations and
      // a supplement copy would double-place it.
      if (window.__GEOM_CAP && window.__GEOM_CAP.glyphSupplements) {
        window.__GEOM_CAP.glyphSupplements.push({
          id: 'gs-' + sheetId + (swList.length > 1 ? '-' + sw.id : '') + '-util-feed', sheet: sheetId, kind: 'polyline',
          host_device_id: utDev.id, role: 'utility_primary_feed',
          vertices: [
            { x: primX, y: utY + boxH('L0-1') },
            { x: primX, y: jogY },
            { x: sqX,   y: jogY }
          ]
        });
        if (!_incA3) window.__GEOM_CAP.glyphSupplements.push({
          id: 'gs-' + sheetId + (swList.length > 1 ? '-' + sw.id : '') + '-util-squig', sheet: sheetId, kind: 'squiggle',
          host_device_id: utDev.id, role: 'utility_primary_continuation',
          x: sqX, y: jogY, text: _sqText, text_side: 'left', orient: 'vertical'
        });
      }
    }
  }

  // --- Distribution breakers (and L1-3 N-G Bond) ---
  distSecs.forEach(sec => {
    const p = SEC_POS[sec.id];
    const bkrDevs = sec.device_ids.map(id => devMap[id]).filter(d => d && (d.node_type === 'L2-1' || d.node_type === 'L2-7'));
    const n = bkrDevs.length;
    if (n === 0) return;
    // dynamic pitches per breaker-pair (panel-panel pairs widened)
    // Pass section id so BREAKER_PITCH_SECTION_MULTIPLIER applies
    const pitches = computeBreakerPitches(bkrDevs, sec.id);
    const innerW = pitches.reduce((a, b) => a + b, 0);  // 0 when n===1
    const firstX = p.x + (p.w - innerW) / 2;  // center the breaker train in the section
    let runningX = firstX;
    bkrDevs.forEach((dev, i) => {
      const bx = runningX + (DEVICE_X_OFFSET[dev.id] || 0);
      G[dev.id] = { x: bx, y: chainBusY };
      svg += `<circle cx="${bx}" cy="${chainBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      svg += renderDevice(dev, G[dev.id]);
      renderedIds.add(dev.id);
      if (i < pitches.length) runningX += pitches[i];
    });
    // N-G bond if this section has one
    const ngBond = sec.device_ids.map(id => devMap[id]).find(d => d && d.node_type === 'L1-3');
    if (ngBond) {
      // Bus-clash relief shift.
      // Previous: y = SW_Y + sw_section_h - 130 (= SW_Y + 150) floated 20 px
      // above the secondary bus (SW_Y + sw_sec_bus_offset = SW_Y + 170) and
      // the symbol's internal 0→25 px neutral riser crossed through the bus.
      // Fix: anchor top tick ON the secondary bus so the tap is visually
      // correct per IEEE 315 / NEC 250.24(C) convention. Ground stack was
      // compressed by 20 px in RENDER['L1-3'] to preserve bottom-of-section
      // clearance (~23 px at sw_section_h=280).
      G[ngBond.id] = { x: p.x + p.w - 60, y: SW_Y + DIM.sw_sec_bus_offset };
      svg += renderDevice(ngBond, G[ngBond.id]);
      renderedIds.add(ngBond.id);
    }
  });
  // --- end of one lineup: publish it and advance the X origin ---
  // FU-0016: remember where this lineup's incoming bus tap is, so a feeder
  // arriving from ANOTHER LINEUP ON THIS SHEET can be drawn to it after every
  // lineup has been laid out (breaker positions are not known until then).
  if (incSec && SEC_POS[incSec.id]) {
    _LINEUP_TAP[sw.id] = {
      x: SEC_POS[incSec.id].x + SEC_POS[incSec.id].w / 2,
      left: Object.values(SEC_POS).reduce((m,p) => Math.min(m, p.x), Infinity),
      busY: (_singleBus ? DIST_BUS_Y : MAIN_BUS_Y),
      busIds: [sw.main_bus_id, sw.secondary_bus_id, sw.distribution_bus_id].filter(Boolean),
    };
  }
  Object.assign(_SEC_POS_ALL, SEC_POS);
  if (_li === 0) { _outerSecs = secs; _outerSecPos = SEC_POS; _outerIncSec = incSec; }
  // Right edge of this lineup = the far edge of its last section. Sections are
  // laid left-to-right from sx, so max(x+w) is the edge regardless of order.
  const _lineupRight = Object.values(SEC_POS).reduce((m,p) => Math.max(m, p.x + p.w), 0);
  // OFF-032: placeATSsAndGenerator puts the generator 500 px left of the EM
  // board's first section, i.e. inside this gutter. Widen it ahead of an EM
  // lineup on a sheet that carries a generator so the generator and its label
  // clear the lineup to the left. Only reachable with 2+ lineups.
  const _nextSw = swList[_li + 1];
  const _genGutter = (_nextSw && _nextSw.variant === 'EM'
    && TOPO.devices.some(d => d.node_type === 'L1-5' && d.sheet_id === sheetId)) ? 900 : 0;
  _lineupDX = (_lineupRight - (DIM.sw_text_zone_w + 40)) + Math.max(LINEUP_GUTTER, _genGutter);
  }  // end for each lineup — FU-0016 (was `if (sw)`, OFF-001 switchboard-lineup wrap)
  secs = _outerSecs; SEC_POS = _SEC_POS_ALL; incSec = _outerIncSec;

  // Mark non-visual entities rendered (they're cross-referenced by other structures)
  TOPO.port_assignments.forEach(pa => renderedIds.add(pa.id));
  // OFF-009 hardening: attachments in a foreign dialect (no `id`) must not
  // poison the rendered-id set with `undefined`. Dialect decision:
  // the hospital shape {id, device_id, host_routed_element_id, mode, position}
  // is canonical; schema V1.1 will enforce it.
  TOPO.measurement_attachments.forEach(ma => { if (ma.id !== undefined) renderedIds.add(ma.id); });
  TOPO.cross_sheet_refs.forEach(csr => renderedIds.add(csr.id));
  // R-2 buses rendered visually as the main bus lines above
  TOPO.routed_elements.filter(r => r.sheet_id === sheetId && r.edge_type === 'R-2').forEach(r => renderedIds.add(r.id));

  // --- OFF-001: continuation-sheet entry path ---
  // Entry contract: an R-1 with start === null whose end resolves to an
  // unplaced device on this sheet (office: r-206 → d-208 "4S-1-B"). Place
  // the entry panel at the chain-baseline Y (same formula as
  // computeChainYOverrides, so floor rows align with the source sheet),
  // draw the entry stub into its feed port, and emit the bound A-3
  // squiggle ("FROM …") + R-1 tags. Downstream passes (placeAllChains →
  // subfeeds → … → level lines) then treat the entry panel as a normal
  // parent. Hospital has no continuation-role sheets → unreachable there.
  __ENTRY_LIFT = {};   // OFF-029: per-sheet, read by placeSubFeeds below
  if (sheetRole(sheetId) === 'continuation') {
    const entryX0 = (CONTINUATION_ENTRY_X !== null && CONTINUATION_ENTRY_X !== undefined)
      ? CONTINUATION_ENTRY_X : (DIM.sw_text_zone_w + 440);
    const entryY = SEC_BUS_Y - DIM.chain_h_min - boxH('L2-4');  // chain-baseline panel top (feed_bottom row frozen at SEC_BUS_Y − chain_h_min)
    // entry panels honor their floor row. An entry mapped to an
    // upper floor (e.g. a roof mechanical board continuing onto a high-rise
    // sheet) used to land at the chain baseline, which put the roof board on
    // the bottom row and inverted the level-line stack (the monotonic
    // enforcement then dragged every line below it). On s2_pitch_sheets the
    // lift comes from the fixed-pitch offset; on anchor-row sheets from
    // __FLOOR_ROW_Y (populated by computeChainYOverrides — call it here; it
    // is a pure recomputation and placeAllChains repeats it later).
    // For base-floor entries both paths return the baseline Y unchanged
    // (baselineEqY ≡ entryY by construction).
    computeChainYOverrides(sheetId, SEC_BUS_Y);
    let entryIdx = 0;
    TOPO.routed_elements
      .filter(r => r.sheet_id === sheetId && r.edge_type === 'R-1' && r.start === null && r.end)
      .forEach(r => {
        const dev = devMap[r.end.device_id];
        if (!dev || dev.sheet_id !== sheetId || G[dev.id]) return;
        // honor end.dst_x_offset (same lever placeSubFeeds has).
        const gx = entryX0 + entryIdx * (DIM.panel_slot_S + 300)
                 + ((r.end && r.end.dst_x_offset) || 0);   // pitch if several entries
        entryIdx++;
        let gy = entryY;
        const _fl = (dev.designation != null) ? LEVEL_MAP[dev.designation] : null;
        if (_fl !== undefined && _fl !== null) {
          if (_usesS2Pitch(sheetId)) {
            const _eLift = _s2PitchOffsetFor(sheetId, _fl);
            gy = entryY + _eLift;
            // OFF-029: hand this lift to placeSubFeeds, so a chain headed by
            // this entry panel does not re-pay the stacking baseline. See the
            // note at __ENTRY_LIFT. Only on a pitch sheet — an anchor-row
            // continuation records nothing.
            __ENTRY_LIFT[dev.id] = _eLift;
          }
          else if (__FLOOR_ROW_Y[_fl] !== undefined) gy = __FLOOR_ROW_Y[_fl];
        }
        G[dev.id] = { x: gx, y: gy };
        svg += renderDevice(dev, G[dev.id]);
        renderedIds.add(dev.id);
        // Entry stub feeder into the feed port (feed_top → drop from above).
        // honor end.landing_offset_x (same lever placeSubFeeds
        // has): an entry panel hosting an in-place internal chain has that
        // chain's primary riser on its top-centre, exactly where the default
        // stub lands.
        const cx = gx + symbolWidth(dev) / 2 + ((r.end && r.end.landing_offset_x) || 0);
        const stubTopY = gy - DIM.equip_stub * 3;
        svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${cx}" y1="${stubTopY}" x2="${cx}" y2="${gy}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
        renderedIds.add(r.id);
        svg += renderR1Tags(r, cx, gy - DIM.equip_stub, 'right');
        // A-3 squiggle at the stub head (continuation-from marker)
        const a3 = (annByBound[r.id] || []).find(a => a.annotation_type === 'A-3');
        const squigText = (a3 && a3.content && a3.content.text) ? a3.content.text : ('FROM ' + (r.designation || ''));
        svg += renderSquiggle(cx, stubTopY, squigText, 'above', 'horizontal', a3 ? a3.id : null, r.id);
        if (a3) renderedIds.add(a3.id);
      });
  }

  // --- On the emergency sheet, place ATSs + Generator (BEFORE placeAllChains so Chain C can reference G[ATS]) ---
  if (sheetRole(sheetId) === 'emergency') {
    // OFF-032: on a combined sheet the emergency block (ATSs + generator)
    // belongs to the EM lineup, not to lineup 0. SEC_POS is the merged map here.
    // Golden-inert: one lineup per golden sheet, so _emSw is never chosen.
    const _emSw = (swList.length > 1) ? swList.find(x => x.variant === 'EM') : null;
    const _emSecs = _emSw ? TOPO.sections.filter(x => x.switchboard_id === _emSw.id).sort((a,b) => a.order - b.order) : null;
    const _emInc = _emSecs ? (_emSecs.find(x => x.type === 'incoming') || null) : null;
    if (_emSecs) incSec = _emInc;
    const emStartX = _emSecs
      ? SEC_POS[(_emInc || _emSecs[0]).id].x
      : (incSec ? SEC_POS[incSec.id].x : SEC_POS[secs[0].id].x);
    const incSecX = incSec ? (SEC_POS[incSec.id].x + SEC_POS[incSec.id].w/2) : null;
    // pass uniform section height (no more MLO special case)
    // incSec.id (a topology section id, e.g. sec-007) hosts the incoming bus dot
    // capture inside placeATSsAndGenerator — null when this sheet has no incoming
    // section (dot then not captured; see the hook there).
    svg += placeATSsAndGenerator(sheetId, emStartX, SW_Y, DIM.sw_section_h, incSecX, incSec ? incSec.id : null);
  }

  // --- Place chains from distribution breakers ---
  // FU-0016: map every device to ITS OWN lineup's chain bus Y, so a sheet mixing
  // bus architectures anchors each board's chains correctly. Built from the
  // sections each switchboard owns — a breaker's section is its board.
  // Empty (and therefore inert) on a single-lineup sheet.
  let _busYByDevice = undefined;
  if (swList.length > 1) {
    _busYByDevice = {};
    TOPO.sections.forEach(sec => {
      const y = _LINEUP_BUS_Y[sec.switchboard_id];
      if (y === undefined) return;
      (sec.device_ids || []).forEach(did => { _busYByDevice[did] = y; });
    });
  }
  svg += placeAllChains(sheetId, chainBusY, chainMainBusY, _busYByDevice);

  // FU-0016 — SAME-SHEET BUS LANDING (the run between two lineups on one sheet).
  // A feeder from a breaker in one lineup to ANOTHER lineup's bus, both here.
  // Before multi-lineup sheets existed this could not happen: a bus-landing feeder
  // was ALWAYS cross-sheet, and the destination block above draws those as a stub
  // plus an A-3 "FROM …" squiggle. With both lineups on one sheet there is no
  // sheet to cross, so the run is drawn WHOLE — which is the entire point of
  // combining sheets: a real conductor instead of a pair of continuation markers.
  //
  // 🚩 WITHOUT THIS THE FEEDER MATCHES NOTHING AND IS SILENTLY DROPPED with its
  // NEC-non-negotiable A-1/A-2 — FL-0026's exact failure in its same-sheet
  // variant. Measured on the merged 3000 A project before this existed:
  // 3 feeders + 6 annotations dropped, and the run still printed "0 errors".
  //
  // Golden-inert BY CONSTRUCTION: requires 2+ lineups on one sheet, and every
  // golden sheet has exactly one, so the guard is false and this emits nothing.
  if (swList.length > 1) {
    // The lane must clear EVERY placed box on the sheet, not just the two it
    // joins: it spans from one lineup to another and passes over everything in
    // between. Measured with the lane at bus height instead: through_symbol 48,
    // feeder_x_device 25 — the run drew straight through every panel between the
    // two lineups. Runs are stacked 40 px apart so two of them never share a lane.
    let _busLaneTop = Infinity;
    TOPO.devices.forEach(d => {
      if (d.sheet_id !== sheetId) return;
      const g = G[d.id];
      if (g && typeof g.y === 'number') _busLaneTop = Math.min(_busLaneTop, g.y);
    });
    if (!isFinite(_busLaneTop)) _busLaneTop = SW_Y;
    let _busLaneN = 0;
    TOPO.routed_elements.forEach(r => {
      if (r.edge_type !== 'R-1' || r.sheet_id !== sheetId) return;
      if (!r.start || !r.end || renderedIds.has(r.id)) return;
      const srcDev = devMap[r.start.device_id];
      if (!srcDev || srcDev.sheet_id !== sheetId) return;
      const tapSw = swList.find(w => _LINEUP_TAP[w.id]
        && _LINEUP_TAP[w.id].busIds.indexOf(r.end.device_id) !== -1);
      if (!tapSw) return;
      const tap = _LINEUP_TAP[tapSw.id];
      const sg = G[srcDev.id];
      if (!sg) return;
      // Route: up off the breaker's line-side port, across a lane that clears the
      // bus row, then down onto the destination lineup's incoming tap. Same shape
      // as the cross-sheet stub pair, joined instead of squiggled.
      // 90 px, not 40: the A-1 pill riding one lane must clear the NEXT lane.
      // Measured at 40 — pill "12004" overlapped the lane above it by 1.4 px
      // (tag_feeder_hard 1). The pill is ~31 px tall plus its leader.
      const laneY = _busLaneTop - 140 - (_busLaneN++ * 90);
      const srcY  = sg.y - DIM.cb_height;
      // Enter the destination board FROM ITS LEFT, not by dropping through it.
      // The descent runs in the GUTTER (clear of the board's sections and of its
      // equipment-label block), then comes in at bus-approach height and drops
      // onto the tap. This mirrors how the utility feeds 2MSB-1-A — upstream
      // equipment sits to the LEFT of the board it feeds — which is the drawing
      // convention this repo already uses. Before: a single long vertical down
      // through the destination lineup at tap.x.
      const _gutterX  = tap.left - LINEUP_GUTTER / 2;
      const _approachY = tap.busY - DIM.chain_h_min;
      const pts = `${sg.x},${srcY} ${sg.x},${laneY} ${_gutterX},${laneY} `
                + `${_gutterX},${_approachY} ${tap.x},${_approachY} ${tap.x},${tap.busY}`;
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${pts}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      svg += `<circle cx="${tap.x}" cy="${tap.busY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      renderedIds.add(r.id);
      // A-1/A-2 ride the horizontal lane — the run's longest leg — at its
      // midpoint, the same convention every other horizontal feeder run uses.
      // 🚩 THIS IS NOT COSMETIC: an A-1/A-2 that finds no anchor is DROPPED, and
      // on a feeder these tags are NEC-non-negotiable (FL-0026). Measured before
      // this call existed: the 3 runs drew and their 6 tags still vanished.
      svg += renderR1Tags(r, (sg.x + _gutterX) / 2, laneY, 'right', 'horizontal');
      (annByBound[r.id] || []).forEach(a => {
        if (a.annotation_type === 'A-1' || a.annotation_type === 'A-2') renderedIds.add(a.id);
      });
    });
  }

  // --- Place sub-feeds first so parent panels (e.g., E4B-1-A) have geometry before internal chains look them up ---
