  svg += placeSubFeeds(sheetId);

  // --- Place terminal loads hung directly off an L2-4 sub-dist panel (e.g., clinic ELEV-01) ---
  svg += placeTerminalSubFeeds(sheetId);

  // --- Place internal-breaker Chain B (4S-N-A + E4B-1-X internal CBs) ---
  svg += placeInternalChains(sheetId);

  // --- OFF-031: feed-through partner panels, butted against their host ---
  svg += placeFeedThroughPanels(sheetId);

  // ============================================================
  // FLOATING CLONES (user-requested duplicates of L1 Chain B/C/D)
  // ----------------------------------------------------------------
  // L2 clones: X = L1 (strict match), Y = L1 - 1×riser_step (1200 px up)
  // L3 clones: X = L1 + 50 (offset right), Y = L1 - 2×riser_step (2400 px up)
  // No upstream connection. Internal TX→panel feeder rendered.
  // Primary feeder is a 270 px floating dashed stub (3× equip_stub).
  // ============================================================
  if (sheetId === 'S1') {
    const RISER = DIM.hospital_riser_step_std;  // 1200
    // [src_tx, src_panel, dst_tx, dst_panel, dst_pri_feeder, dst_sec_feeder, x_offset, y_offset_steps]
    const cloneMap = [
      // L2 clones — X strict match, 1 step up
      ['d-029','d-030','d-119','d-120','r-026','r-027', 0,   1],
      ['d-036','d-037','d-121','d-122','r-028','r-029', 0,   1],
      ['d-043','d-044','d-123','d-124','r-030','r-031', 0,   1],
      // L3 clones — X +100 right, 2 steps up
      ['d-029','d-030','d-125','d-126','r-032','r-033', 100, 2],
      ['d-036','d-037','d-127','d-128','r-034','r-035', 100, 2],
      ['d-043','d-044','d-129','d-130','r-036','r-037', 100, 2],
    ];
    cloneMap.forEach(([sTx, sPa, dTx, dPa, dPriF, dSecF, xOff, ySteps]) => {
      if (!G[sTx] || !G[sPa]) return;
      const dstTxDev = devMap[dTx];
      const dstPaDev = devMap[dPa];
      if (!dstTxDev || !dstPaDev) return;

      const yOffset = -RISER * ySteps;
      const dstTxG = { x: G[sTx].x + xOff, y: G[sTx].y + yOffset };
      const dstPaG = { x: G[sPa].x + xOff, y: G[sPa].y + yOffset };
      G[dTx] = dstTxG;
      G[dPa] = dstPaG;

      svg += renderDevice(dstTxDev, dstTxG);
      svg += renderDevice(dstPaDev, dstPaG);
      renderedIds.add(dTx);
      renderedIds.add(dPa);

      // Secondary feeder (TX top → panel bottom)
      const txTopX = dstTxG.x + symbolWidth(dstTxDev)/2;
      const txTopY = dstTxG.y;
      const panelBotY = dstPaG.y + symbolHeight(dstPaDev);
      svg += `<g class="feeder" data-id="${dSecF}" style="cursor:pointer"><line x1="${txTopX}" y1="${txTopY}" x2="${txTopX}" y2="${panelBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      const dSecR1 = reMap[dSecF];
      if (dSecR1) svg += renderR1Tags(dSecR1, txTopX, txTopY - DIM.tag_gap, 'right');
      renderedIds.add(dSecF);

      // Primary feeder stub — 270 px (3× equip_stub) for visual prominence
      // Skip stub render when feeder has been wired to a real
      // upstream source (e.g., F-026/088/090 now sourced from 4S-1-B
      // internal CBs d-131/132/133). placeManualRouteFeeders will emit
      // the connected polyline instead. Detection: feeder.start === null
      // means floating; non-null means connected.
      const dPriR1 = reMap[dPriF];
      const isStillFloating = dPriR1 && dPriR1.start === null;
      if (isStillFloating) {
        const txBotX = dstTxG.x + symbolWidth(dstTxDev)/2;
        const txBotY = dstTxG.y + bodyHeight(dstTxDev);
        const stubLen = DIM.equip_stub * 3;
        svg += `<g class="feeder" data-id="${dPriF}" style="cursor:pointer" stroke-dasharray="6,4"><line x1="${txBotX}" y1="${txBotY}" x2="${txBotX}" y2="${txBotY + stubLen}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
        if (dPriR1) svg += renderR1Tags(dPriR1, txBotX, txBotY + stubLen / 2, 'right');
        renderedIds.add(dPriF);
      }
      // If !isStillFloating, leave dPriF unrendered here — placeManualRouteFeeders
      // will pick it up and emit the connected polyline. Don't add to renderedIds.
    });
  }

  // Manual-route feeders (custom routing for connected feeders
  // whose source CBs are flagged skip_chain_render). Must run AFTER the
  // floating-clones block so destination G[] entries (dTx, dPa) are set.
  svg += placeManualRouteFeeders(sheetId);

  // SPD is placed
  // in the main_breaker section (sec-008) on the line side of EMSB-MAIN,
  // matching typical engineering practice and topology (d-054 is a device_id
  // of sec-008). See the main_breaker block above.

  // --- Fire pump chain: CB-FP goes to cross-sheet squiggle (already handled by placeAllChains) ---
  // On S2, E4A-1-B load_out → fire pump symbol (handled by placeATSsAndGenerator load-side logic)

  // Fault Current pennants (graph-walk, dual-mode for S2)
  // Full coverage: utility TX, both switchboard buses, every L2-2 secondary,
  // every L2-4 panel, every ATS source, generator, and load terminals.
  // S2 runs BOTH normal and emergency traversals; dual-mode nodes show
  // stacked N and EM pennants (pink + orange).

  svg += renderAllFcPennants(sheetId);

  // Level lines — after all placement so G[] is fully populated
  svg += renderLevelLines(sheetId);

  // A-6 hex keynotes + per-sheet legend
  const sheetA6s = TOPO.annotations.filter(a => a.annotation_type === 'A-6' && a.sheet_id === sheetId);
  sheetA6s.forEach(ann => {
    svg += renderHexNote(ann);
    renderedIds.add(ann.id);
  });
  svg += renderKeynoteLegend(sheetId);

  // Sheet bumped from 36x48 to 36x60 to accommodate doubled inter-breaker
  // pitch in S1 distribution sections (sec-005, sec-006).
  // 36x60 content area at 96 px/in: (60-1-5)*96 - 2*(0.25*96) = 5184 - 48 = 5136 px wide, 3312 px tall.

    const devs = TOPO.devices.filter(d => d.sheet_id === sheetId && G[d.id]);

      const xmax = Math.max(...devs.map(d => G[d.id].x + (symbolWidth(d) || DIM.panel_slot_S)));

// a single-point alternative to editing every <g> emission site
// (devices, feeders, buses, sections, etc — ~47 sites). The walker is
// idempotent (early-returns on already-decorated groups) and runs in
// O(N) on each render, which at ~250 groups is negligible.

// Stable shorthand for endpoint resolution (devMap already exists at
// line 8954). When endpoint resolves to a routed_element (bus-tap case),
// fall back to the routed_element's designation.
function _resolveEndpointLabel(refObj) {
  if (!refObj || !refObj.device_id) return '?';
  const id = refObj.device_id;
  if (devMap[id]) return devMap[id].designation || id;
  const r = TOPO.routed_elements.find(x => x.id === id);
  return r ? (r.designation || id) : id;
}

function _labelForDevice(d) {
  const df = d.data_fields || {};
  const desig = d.designation || d.id;
  switch (d.node_type) {
    case 'L0-1': {
      const kva = df.kva_rating ? `${df.kva_rating} kVA` : '';
      const v = (df.primary_voltage && df.secondary_voltage)
        ? `, ${df.primary_voltage} to ${df.secondary_voltage}` : '';
      return `Utility transformer ${desig}${kva ? ', ' + kva : ''}${v}`;
    }
    case 'L1-1': {
      const af = df.af ? `${df.af} AF` : '';
      const at = df.at ? `${df.at} AT` : '';
      const poles = df.poles ? `${df.poles}-pole` : '';
      const trip = df.trip_type ? `, ${df.trip_type}` : '';
      return `Main breaker ${desig}${af||at ? ', ' + [af,at].filter(Boolean).join(' / ') : ''}${poles ? ', ' + poles : ''}${trip}`;
    }
    case 'L1-3': return `Surge protective device ${desig}`;
    case 'L1-4': return `Utility metering ${desig}`;
    case 'L1-5': {
      const kw = df.kw_rating ? `${df.kw_rating} kW` : '';
      const kva = df.kva_rating ? `${df.kva_rating} kVA` : '';
      return `Generator ${desig}${kw||kva ? ', ' + [kw,kva].filter(Boolean).join(' / ') : ''}, NFPA 110 Level 1`;
    }
    case 'L2-1': {
      const af = df.af ? `${df.af} AF` : '';
      const at = df.at ? `${df.at} AT` : '';
      const poles = df.poles ? `${df.poles}-pole` : '';
      const kind = df.kind ? ` (${df.kind})` : '';
      return `Circuit breaker ${desig}${af||at ? ', ' + [af,at].filter(Boolean).join(' / ') : ''}${poles ? ', ' + poles : ''}${kind}`;
    }
    case 'L2-2': {
      const a = df.amps ? `${df.amps} A` : '';
      return `Fused disconnect ${desig}${a ? ', ' + a : ''}`;
    }
    case 'L2-3': {
      const a = df.amps ? `${df.amps} A` : '';
      const poles = df.poles ? `${df.poles}-pole` : '';
      const branch = df.branch ? `, ${df.branch} branch` : '';
      return `Automatic transfer switch ${desig}${a ? ', ' + a : ''}${poles ? ', ' + poles : ''}${branch}`;
    }
    case 'L2-4': {
      const kva = df.kva_rating ? `${df.kva_rating} kVA` : '';
      const v = (df.primary_voltage && df.secondary_voltage)
        ? `, ${df.primary_voltage} to ${df.secondary_voltage}` : '';
      return `Step-down transformer ${desig}${kva ? ', ' + kva : ''}${v}`;
    }
    case 'L2-6': return `Bus-tap point ${desig}`;
    case 'L2-7': {
      const a = df.at ? `${df.at} A` : '';
      const poles = df.poles ? `${df.poles}-pole` : '';
      return `Spare${a ? ' ' + a : ''}${poles ? ', ' + poles : ''}, ${desig}`;
    }
    case 'L3-1': return `Panelboard ${desig}`;
    case 'L3-3': return `Equipment connection ${desig}`;
    default: return `${desig} (${d.node_type})`;
  }
}

function _labelForFeeder(r) {
  const cf = r.calc_fields || {};
  const sets = cf.conductors_per_phase ? `(${cf.conductors_per_phase}) sets of ` : '';
  const cond = cf.conductor_size && cf.conductor_material
    ? `${cf.conductor_size} ${cf.conductor_material}` : '';
  const neut = cf.neutral_size ? ` + ${cf.neutral_size} N` : '';
  const gnd  = cf.ground_size && cf.ground_material
    ? ` + ${cf.ground_size} ${cf.ground_material} G` : '';

  const cs = cf.conduit_size ? ` ${cf.conduit_size}` : '';
  const from = r.start ? ` from ${_resolveEndpointLabel(r.start)}` : '';
  const to   = r.end   ? ` to ${_resolveEndpointLabel(r.end)}` : '';
  return `Feeder ${r.designation || r.id}${sets || cond ? ', ' + sets + cond + neut + gnd : ''}${conduit}${cs}${from}${to}`;
}

function _labelForBus(r) {
  const cf = r.calc_fields || {};
  const sw = TOPO.switchboards.find(s => s.main_bus_id === r.id || s.secondary_bus_id === r.id);
  const level = r.bus_level === 'main' ? 'Main bus' : 'Secondary bus';
  const rating = cf.bus_rating ? `, ${cf.bus_rating} A` : '';
  const desig = sw ? sw.designation : (r.designation || r.id);
  return `${level} ${desig}${rating}`;
}

function _labelForFeederTag(rId) {
  const r = TOPO.routed_elements.find(x => x.id === rId);
  return r ? `Feeder tag ${r.designation || rId}` : `Feeder tag ${rId}`;
}

function _labelForSquiggle(annId) {
  const ann = TOPO.annotations.find(a => a.id === annId);
  if (!ann) return `Cross-sheet stub ${annId}`;
  if (ann.designation) return `Cross-sheet stub ${ann.designation}`;
  if (ann.bound_to) {
    const r = TOPO.routed_elements.find(x => x.id === ann.bound_to);
    if (r) return `Cross-sheet stub for ${r.designation || r.id}`;
  }
  return `Cross-sheet stub ${annId}`;
}

function _labelForSection(secId) {
  const sec = (TOPO.sections || []).find(s => s.id === secId);
  if (!sec) return `Switchboard section ${secId}`;
  const sw = TOPO.switchboards.find(s => s.id === sec.switchboard_id);
  const swDesig = sw ? sw.designation : '?';
  const kind = sec.type ? sec.type.replace(/_/g, ' ') : 'section';
  const nec = sec.nec_class ? `, NEC ${sec.nec_class}` : '';
  return `${swDesig} ${kind} section ${sec.section_tag || secId}${nec}`;
}

function _labelForLevelLine(id) {
  const floor = id.replace(/^level-/, '');
  return floor === 'R' ? 'Roof level marker' : `Level ${floor} marker`;
}

function _labelForFcPennant(annId) {
  const ann = TOPO.annotations.find(a => a.id === annId);
  if (!ann || !ann.content || ann.content.fc_amps == null) return `Available fault current pennant ${annId}`;
  const amps = ann.content.fc_amps.toLocaleString();
  // Resolve bound entity for context
  let boundLbl = '';
  if (ann.bound_to_type === 'device') {
    const d = devMap[ann.bound_to];
    if (d) boundLbl = ` at ${d.designation || d.id}`;
  } else if (ann.bound_to_type === 'routed_element') {
    const r = TOPO.routed_elements.find(x => x.id === ann.bound_to);
    if (r) boundLbl = ` at ${r.designation || r.id}`;
  }
  return `Available fault current ${amps} A RMS${boundLbl}`;

// Dispatch by class. Returns the accessible-name string for a group.
function _synthesizeA11yLabel(g) {
  const cl = g.classList;
  const id = g.dataset.id || '';
  if (cl.contains('dev')) {
    const d = devMap[id];
    return d ? _labelForDevice(d) : `Device ${id}`;
  }
  if (cl.contains('feeder')) {
    const r = TOPO.routed_elements.find(x => x.id === id);
    return r ? _labelForFeeder(r) : `Feeder ${id}`;
  }
  if (cl.contains('bus')) {
    const r = TOPO.routed_elements.find(x => x.id === id);
    return r ? _labelForBus(r) : `Bus ${id}`;
  }
  if (cl.contains('feeder-tag'))   return _labelForFeederTag(id);
  if (cl.contains('squiggle'))     return _labelForSquiggle(id);
  if (cl.contains('section'))      return _labelForSection(id);
  if (cl.contains('level-line'))   return _labelForLevelLine(id);
  if (cl.contains('fc-pennant'))   return _labelForFcPennant(id);
  return '';
}

const A11Y_INTERACTIVE_CLASSES = [
  'dev','feeder','feeder-tag','bus','squiggle','section','level-line','fc-pennant'
];

function applyA11yToInteractiveGroups(svg) {
  const sel = A11Y_INTERACTIVE_CLASSES.map(c => `g.${c}`).join(',');
  const SVG_NS = 'http://www.w3.org/2000/svg';
  svg.querySelectorAll(sel).forEach(g => {
    if (g.hasAttribute('role')) return; // idempotent
    const label = _synthesizeA11yLabel(g);
    if (!label) return;
    g.setAttribute('role', 'img');
    g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', label);
    const title = document.createElementNS(SVG_NS, 'title');
    title.textContent = label;
    g.insertBefore(title, g.firstChild);
  });
}

  if (el.classList.contains('squiggle')) {

    if (fbId) {

    return id;

  // .bus: same lookup as.feeder — both are routed_elements in TOPO.
  if (el.classList.contains('bus')) {

    return re ? (re.designation || id) : id;

  // section_tag prefix is shown when present; falls back to

  // E-502 sections).
  if (el.classList.contains('section')) {
    const sec = sectionMap[id];
    if (!sec) return id;
    const typeLabel = sec.type.toUpperCase().replace(/_/g, ' ');
    const body = sec.nec_class ? `${typeLabel} · NEC ${sec.nec_class}` : typeLabel;

  return id;

document.addEventListener('mouseover', e => {
  const el = findHoverTarget(e.target); if (!el) return;
  const name = tooltipNameFor(el); if (!name) return;
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<div class="tt-title">${esc(name)}</div>`;
  tip.style.display = 'block';
  tip.style.left = (e.clientX + 16) + 'px';

document.addEventListener('mouseout', e => { if (findHoverTarget(e.target)) document.getElementById('tooltip').style.display = 'none'; }, true);

// PAN / ZOOM

let scale = 0.12, panX = 100, panY = 50, dragging = false, dsx, dsy;

function zoomAt(cx, cy, f) {

function resetView() { fitView(); }
function fitView() {

  const sw2 = vb ? vb[2] : NaN, sh = vb ? vb[3] : NaN;

    e.preventDefault();
    e.stopPropagation();
  }
}, true);
wrap.style.cursor = 'grab';

// ============================================================
// KEYBOARD SHORTCUTS (Fix 5, v1.0.0)
// Global keydown handler. Skipped when focus is in a form control
// or when Ctrl/Meta/Alt is held (browser shortcuts win). When focus
// is inside an SVG group with tabindex, Enter/Space are reserved for
// the per-group activation handler (see bindClickToCopy keydown);
// arrow keys still pan globally, which matches the canvas-navigation
// mental model regardless of which group is focused.
// ============================================================
function panBy(dx, dy) { panX += dx; panY += dy; upd(); }
// Zoom-aware arrow-pan step: grow the screen-px step by 1/scale so each
// press covers a consistent slice of the DIAGRAM regardless of zoom,
// capped at one viewport width so min-zoom presses don't teleport.
function panStep(base) {
  const w = document.getElementById('canvas-wrap');
  return Math.min(base / Math.max(scale, MIN_SCALE), w.clientWidth || 800);
}
function nextSheet() {
  const ids = TOPO.sheets.map(s => s.sheet_id);
  const i = ids.indexOf(currentSheet);
  selectSheet(ids[(i + 1) % ids.length]);
}
function prevSheet() {
  const ids = TOPO.sheets.map(s => s.sheet_id);
  const i = ids.indexOf(currentSheet);
  selectSheet(ids[(i - 1 + ids.length) % ids.length]);
}
function selectSheetByIndex(n) {
  const s = TOPO.sheets[n];
  if (s) selectSheet(s.sheet_id);
}

// Single source of truth for shortcut bindings. Lookups try the
// shift-prefixed key first (so Shift+Arrow gets coarse pan), then
// the unshifted key. Help overlay reads this same table to render
// itself, so the doc and the implementation never drift.
const KEYMAP = {
  'ArrowLeft':         { fn: () => panBy(panStep(50), 0),    label: 'Pan left' },
  'ArrowRight':        { fn: () => panBy(-panStep(50), 0),   label: 'Pan right' },
  'ArrowUp':           { fn: () => panBy(0, panStep(50)),    label: 'Pan up' },
  'ArrowDown':         { fn: () => panBy(0, -panStep(50)),   label: 'Pan down' },
  'Shift+ArrowLeft':   { fn: () => panBy(panStep(200), 0),   label: 'Pan left (coarse)' },
  'Shift+ArrowRight':  { fn: () => panBy(-panStep(200), 0),  label: 'Pan right (coarse)' },
  'Shift+ArrowUp':     { fn: () => panBy(0, panStep(200)),   label: 'Pan up (coarse)' },
  'Shift+ArrowDown':   { fn: () => panBy(0, -panStep(200)),  label: 'Pan down (coarse)' },
  '+':                 { fn: zoomIn,                label: 'Zoom in' },
  '=':                 { fn: zoomIn,                label: 'Zoom in (alt)' },
  '-':                 { fn: zoomOut,               label: 'Zoom out' },
  '0':                 { fn: fitView,               label: 'Fit to view' },
  '[':                 { fn: prevSheet,             label: 'Previous sheet' },
  ']':                 { fn: nextSheet,             label: 'Next sheet' },
  '1':                 { fn: () => selectSheetByIndex(0), label: 'Sheet 1 (E-501)' },
  '2':                 { fn: () => selectSheetByIndex(1), label: 'Sheet 2 (E-502)' },
  'c':                 { fn: () => clearClipboard(),  label: 'Clear clipboard' },
  't':                 { fn: toggleTheme,           label: 'Toggle theme' },
  's':                 { fn: () => snapshotToPng(),      label: 'Snapshot PNG (full sheet)' },
  'Shift+S':           { fn: () => snapshotSvgDownload(), label: 'Snapshot SVG (parity artifact)' },
  'l':                 { fn: () => snapshotElementPng(), label: 'Snapshot last-clicked element (close-up PNG)' },
  'v':                 { fn: () => toggleAuditOverlay(), label: 'Toggle geometry-audit overlay (red boxes)' },
  '?':                 { fn: () => showHelpOverlay(), label: 'Show this help' },
  'Escape':            { fn: () => {
                          if (document.getElementById('help-overlay').style.display === 'flex') {
                            hideHelpOverlay();
                          } else if (document.activeElement && document.activeElement.blur) {
                            document.activeElement.blur();
                          }
                        },
                        label: 'Dismiss overlay / blur focus' },
};

function onGlobalKey(e) {
  // Don't hijack form controls (none today, but future-proof) or the
  // sidebar buttons. The sidebar buttons should respond to Enter/Space
  // via their normal browser handlers — not our shortcut table.
  if (e.target.matches && e.target.matches('input, textarea, select, button')) return;
  // Browser shortcuts (Cmd+R, Ctrl+F, etc.) always pass through.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Inside an interactive SVG group: Enter/Space belong to the click-
  // to-copy handler (bindClickToCopy keydown). Arrow keys still pan,
  // which is the desired canvas-navigation behavior.
  const inSvgGroup = e.target.closest && e.target.closest('#sld-svg g[tabindex="0"]');
  if (inSvgGroup && (e.key === 'Enter' || e.key === ' ')) return;
  // Help overlay open: trap Tab inside, Esc closes; let other shortcuts
  // through so the user can dismiss with Esc (already in KEYMAP).
  const overlay = document.getElementById('help-overlay');
  if (overlay && overlay.style.display === 'flex' && e.key === 'Tab') {
    _trapTabInOverlay(e);
    return;
  }
  // Lookup strategy: try the Shift-prefixed form first (so Shift+Arrow gets
  // the coarse-pan binding rather than the fine-pan one), then fall back to
  // the unshifted key. This handles cases where the printed character already
  // implies Shift on a US keyboard — e.key === '?' arrives with shiftKey=true
  // because the user pressed Shift+/, but KEYMAP stores it as just '?'.
  // Same for '+' (Shift+=).
  const shiftedKey = 'Shift+' + e.key;
  const entry = KEYMAP[shiftedKey] || KEYMAP[e.key];
  if (entry && entry.fn) { e.preventDefault(); entry.fn(); }
}

// ---- Help overlay
let _lastFocusBeforeOverlay = null;
function showHelpOverlay() {
  const ov = document.getElementById('help-overlay');
  if (!ov) return;
  _lastFocusBeforeOverlay = document.activeElement;
  // Populate content lazily so it always reflects KEYMAP
  const body = document.getElementById('help-overlay-body');
  if (body) {
    const groups = [
      { title: 'Pan & Zoom', keys: ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Shift+ArrowLeft','+','-','0'] },
      { title: 'Sheets',     keys: ['[',']','1','2'] },
      { title: 'Tools',      keys: ['c','t','s','Shift+S','l','v','?','Escape'] },
    ];
    body.innerHTML = groups.map(g =>
      `<div class="help-group"><h3>${g.title}</h3><dl>` +
      g.keys.map(k => {
        const e = KEYMAP[k];
        return e ? `<dt>${esc(k)}</dt><dd>${esc(e.label)}</dd>` : '';
      }).join('') + `</dl></div>`
    ).join('');
  }
  ov.style.display = 'flex';
  ov.setAttribute('aria-hidden', 'false');
  // Move focus into overlay so screen readers announce the dialog
  const close = document.getElementById('help-overlay-close');
  if (close) close.focus();
}
function hideHelpOverlay() {
  const ov = document.getElementById('help-overlay');
  if (!ov) return;
  ov.style.display = 'none';
  ov.setAttribute('aria-hidden', 'true');
  if (_lastFocusBeforeOverlay && _lastFocusBeforeOverlay.focus) {
    _lastFocusBeforeOverlay.focus();
  }
  _lastFocusBeforeOverlay = null;
}
function _trapTabInOverlay(e) {
  const ov = document.getElementById('help-overlay');
  const focusables = ov.querySelectorAll('button, [tabindex="0"]');
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}

document.addEventListener('keydown', onGlobalKey);

// ============================================================
// SHEET SWITCHING
// ============================================================
function selectSheet(id) {
  currentSheet = id;
  document.querySelectorAll('.sheet-btn').forEach(b => b.classList.toggle('active', b.dataset.sheet === id));
  const sheet = TOPO.sheets.find(s => s.sheet_id === id);
  if (sheet) document.title = `${(TOPO.metadata.heading ? TOPO.metadata.heading + ' SLD' : 'SLD')} — ${sheet.sheet_number} ${sheet.title}`;
  renderCurrentSheet();
}

function renderCurrentSheet() {
  const svgContent = buildSheet(currentSheet);
  const svg = document.getElementById('sld-svg');
  svg.innerHTML = svgContent;
  // Fix 1: Decorate every interactive group with role/tabindex/aria-label
  // and a <title> child. Runs once per render; idempotent.
  applyA11yToInteractiveGroups(svg);
  // Compute extent from SVG bbox (captures feeders and text, not just device anchors)
  const bb = svg.getBBox();
  const pad = 120;
  svg.setAttribute('viewBox', `${bb.x-pad} ${bb.y-pad} ${bb.width+pad*2} ${bb.height+pad*2}`);
  svg.setAttribute('width', bb.width+pad*2);
  svg.setAttribute('height', bb.height+pad*2);
  fitView();
  // Manifest audit
  const audit = manifest.audit();
  const el = document.getElementById('render-cov');
  const cls = audit.ok ? 'ok' : 'miss';
  let cov = `<b>Render Manifest</b><br><span class="${cls}">${audit.rendered}/${audit.total}</span>`;
  if (audit.intentionalSkips > 0) cov += ` <span style="opacity:.6">(+${audit.intentionalSkips} compact-skipped)</span>`;
  if (!audit.ok) {
    const devMiss = audit.misses.filter(m => m.type === 'device').map(m => m.label);
    const reMiss = audit.misses.filter(m => m.type === 're').map(m => m.label);
    const annMiss = audit.misses.filter(m => m.type === 'ann').map(m => m.label);
    if (devMiss.length) cov += `<br><span class="miss">Dev miss: ${devMiss.slice(0,4).join(', ')}${devMiss.length>4?' +'+(devMiss.length-4):''}</span>`;
    if (reMiss.length) cov += `<br><span class="miss">R-1 miss: ${reMiss.slice(0,3).join(', ')}${reMiss.length>3?' +'+(reMiss.length-3):''}</span>`;
    if (annMiss.length) {
      // Pull both ID and label so we can see exactly which annotations failed
      const annMissDetail = audit.misses.filter(m => m.type === 'ann').map(m => `${m.id} (${m.label})`);
      cov += `<br><span class="miss">Ann miss: ${annMissDetail.slice(0,4).join('; ')}${annMissDetail.length>4?' +'+(annMissDetail.length-4):''}</span>`;
    }
  }
  // Fix 4: Topology validation summary
  const issues = window.__topologyIssues || [];
  const errs = issues.filter(i => i.level === 'error');
  const warns = issues.filter(i => i.level === 'warn');
  cov += `<br><br><b>Topology</b>`;
  if (errs.length === 0 && warns.length === 0) {
    cov += `<br><span class="ok">✓ schema ${EXPECTED_SCHEMA}</span>`;
  } else {
    cov += `<br><span class="${errs.length ? 'miss' : 'ok'}">`
        + `${errs.length} error${errs.length===1?'':'s'}, `
        + `${warns.length} warning${warns.length===1?'':'s'}</span>`;
    const shown = errs.slice(0, 3);
    shown.forEach(i => { cov += `<br><span class="miss">• ${esc(i.code)}: ${esc(i.msg)}</span>`; });
    if (errs.length > 3) cov += `<br><span class="miss">  +${errs.length-3} more</span>`;
  }
  el.innerHTML = cov;
  // v1.1.0 — re-assert legend layer visibility. The layer-hide-* classes
  // live on the persistent #sld-svg root (innerHTML replacement above
  // doesn't touch them), but this also covers first load and restores
  // checkbox state after a theme-toggle re-render.
  applyLayerToggles();
  // The innerHTML replacement above wiped any audit overlay;
  // re-audit and re-append while the toggle is on (one run feeds both the
  // overlay and the sidebar panel). Safe from recursion:
  // auditSheet(currentSheet) never triggers a re-render.
  if (auditOverlayOn) {
    const auditRes = auditSheet(currentSheet);
    renderAuditOverlay(svg, auditRes.findings);
    renderAuditPanel(auditRes);
  }
}

// ============================================================
// THEME TOGGLE (dark ↔ light)
// Persists via localStorage. Defaults to dark. Applies before first
// render so the page doesn't flash dark→light on reload.
// ============================================================
const THEME_KEY = 'sld-theme';
function applyStoredTheme() {
  let t = 'dark';
  try { t = localStorage.getItem(THEME_KEY) || 'dark'; } catch(e) {}
  _applyTheme(t);
}
function _applyTheme(t) {
  if (t === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  const btn = document.getElementById('theme-toggle');
  if (btn) {
    btn.textContent = (t === 'light') ? '☀ Light' : '☾ Dark';
    btn.setAttribute('aria-label', (t === 'light') ? 'Switch to dark theme' : 'Switch to light theme');
  }
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  _applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  // Re-render so inline SVG colors (sld-pink, sld-line, etc.) pick up
  // the new CSS-variable values. var(--x) references re-resolve on
  // repaint automatically, so technically not needed for stroke/fill,
  // but explicit re-render ensures any getBBox-dependent sizing stays
  // consistent if a hypothetical future font change affects metrics.
  renderCurrentSheet();
}

// ============================================================
// SIDEBAR UI STATE (v1.1.0)
// Drawer (narrow screens) / collapsible rail (wide screens), per-section
// collapse, and legend layer toggles — all persisted under one
// localStorage key. Every browser API here is guarded: the headless
// snapshot gate (snapshot_html.mjs) boots this script in node:vm with
// no matchMedia and no localStorage.
// ============================================================
const UI_KEY = 'sld-ui';
function loadUi() { try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch (e) { return {}; } }
function saveUi(patch) { try { const u = loadUi(); Object.assign(u, patch); localStorage.setItem(UI_KEY, JSON.stringify(u)); } catch (e) {} }
function isNarrow() { return !!(window.matchMedia && window.matchMedia('(max-width:720px)').matches); }

function setDrawerOpen(open) {
  const app = document.getElementById('app');
  const bd = document.getElementById('sidebar-backdrop');
  const btn = document.getElementById('sidebar-toggle');
  app.classList.toggle('drawer-open', open);
  if (bd) { if (open) bd.removeAttribute('hidden'); else bd.setAttribute('hidden', ''); }
  if (btn) btn.setAttribute('aria-expanded', String(open));
}
function toggleSidebar() {
  const app = document.getElementById('app');
  if (isNarrow()) {
    setDrawerOpen(!app.classList.contains('drawer-open'));
  } else {
    const hidden = app.classList.toggle('sidebar-hidden');
    saveUi({ railCollapsed: hidden });
    const btn = document.getElementById('sidebar-toggle');
    if (btn) btn.setAttribute('aria-expanded', String(!hidden));
  }
}

// ---- Legend layer toggles. View-only by design: the snapshot/export
// paths rebuild markup from buildSheet() into a fresh <svg> and never
// serialize the live #sld-svg root, so exported PNG/SVG artifacts always
// contain every layer regardless of these toggles.
const LAYER_KEYS = ['feeder', 'section', 'squiggle', 'level', 'notes'];
function applyLayerToggles() {
  const svg = document.getElementById('sld-svg');
  const st = loadUi().layers || {};
  LAYER_KEYS.forEach(k => svg.classList.toggle('layer-hide-' + k, st[k] === false));
  document.querySelectorAll('.layer-cb').forEach(cb => {
    cb.checked = st[cb.dataset.layer] !== false;
  });
}

// ============================================================
// CLICK-TO-COPY
// Single click on any device copies its designation to the clipboard
// and shows a 1.2s toast near the cursor. Devices without a designation
// (spares, meters, SDS symbols) fall back to "<node_type> (<kind>)" so the
// user still gets something useful. Clipboard failures (focus lost, insecure
// context) trigger a red error toast so the user knows to retry.
// ============================================================
function showCopyToast(clientX, clientY, text, isError) {
  const t = document.getElementById('copy-toast');
  if (!t) return;
  t.textContent = text;
  t.className = isError ? 'err' : '';
  // Force reflow so re-adding .show restarts the animation on rapid successive clicks
  t.style.left = clientX + 'px';
  t.style.top  = clientY + 'px';
  // Remove and re-add the class to restart the CSS animation
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  // Hide after animation completes
  clearTimeout(showCopyToast._timer);
  showCopyToast._timer = setTimeout(() => { t.classList.remove('show'); }, 1250);
}

function copyTextToClipboard(copyText, clientX, clientY, displayLabel) {
  // displayLabel: optional string shown in the toast in place of copyText
  // itself. Used by the clipboard accumulator so the toast shows a clean
  // "✓ Added: F-014.S1 (3 items)" instead of the full multi-line joined payload.
  // Falls back to copyText so single-item callers continue to work unchanged.
  const toastText = displayLabel || copyText;
  // Legacy execCommand path — works in file:// contexts where the modern
  // Clipboard API is blocked by the secure-context requirement.
  function tryLegacyCopy() {
    try {
      const ta = document.createElement('textarea');
      ta.value = copyText;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, copyText.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  // Strategy: try the modern API first (succeeds on https/localhost); if it
  // rejects (common on file:// in Chrome/Edge), fall through to the legacy
  // execCommand path before reporting failure.
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(copyText)
      .then(() => showCopyToast(clientX, clientY, '✓ Copied: ' + toastText, false))
      .catch(() => {
        if (tryLegacyCopy()) {
          showCopyToast(clientX, clientY, '✓ Copied: ' + toastText, false);
        } else {
          showCopyToast(clientX, clientY, '✗ Copy failed — retry', true);
        }
      });
  } else {
    // Not a secure context, or Clipboard API unavailable — go straight to legacy
    if (tryLegacyCopy()) {
      showCopyToast(clientX, clientY, '✓ Copied: ' + toastText, false);
    } else {
      showCopyToast(clientX, clientY, '✗ Copy failed — retry', true);
    }
  }
}

// ============================================================
// COPY-TEXT RESOLVERS
// Given a clicked SVG <g> element, determine what text to copy and invoke the
// copy pipeline. Each resolver is pure: takes the element, returns null
// (not handled) or a string (the text to copy).
// ============================================================
function resolveCopyTextForElement(el) {
  if (!el || !el.classList || !el.dataset || !el.dataset.id) return null;
  const id = el.dataset.id;

  // Device: look up TOPO.devices and prefer designation, fall back to a label
  if (el.classList.contains('dev')) {
    const dev = TOPO.devices.find(d => d.id === id);
    if (!dev) return null;
    if (dev.designation) return dev.designation;
    // d-018 has designation "SPACE-01" and resolves via the
    // dev.designation branch above.
    const f = dev.data_fields || {};
    const kind = f.kind || f.meter_type || f.sds || f.type || dev.node_type;
    return `${dev.node_type}${kind ? ' (' + kind + ')' : ''}`;
  }

  // Feeder (R-1) or Bus (R-2): look up TOPO.routed_elements, copy designation
  if (el.classList.contains('feeder') || el.classList.contains('bus')) {
    const r = TOPO.routed_elements.find(x => x.id === id);
    return r && r.designation ? r.designation : id;
  }

  // Feeder-tag wrapper (A-1 pills only; A-3 squiggles moved
  // to dedicated `squiggle` class with their own a-NNN identity). data-id
  // is the parent feeder's r-NNN. Tag clicks copy F-NNN — the value that
  // goes into schedule references and RFI threads.
  if (el.classList.contains('feeder-tag')) {
    const r = TOPO.routed_elements.find(x => x.id === id);
    return r && r.designation ? r.designation : id;
  }

  // Squiggle (A-3): data-id is the annotation ID (a-NNN). Resolver reads
  // `designation` from the annotation — format "SQ-F-NNN". Fallback path:
  // if annotation is missing or has no designation, derive from the
  // data-fallback-feeder attribute (used for the hardcoded "TO UTILITY"
  // primary-side squiggle which has no A-3 in TOPO).
  if (el.classList.contains('squiggle')) {
    const ann = TOPO.annotations.find(a => a.id === id);
    if (ann && ann.designation) return ann.designation;
    // Fallback 1: annotation exists but designation wasn't baked
    if (ann && ann.bound_to) {
      const r = TOPO.routed_elements.find(x => x.id === ann.bound_to);
      if (r && r.designation) return 'SQ-' + r.designation;
    }
    // Fallback 2: no annotation (hardcoded squiggle with fallback feeder)
    const fbId = el.dataset.fallbackFeeder;
    if (fbId) {
      const r = TOPO.routed_elements.find(x => x.id === fbId);
      if (r && r.designation) return 'SQ-' + r.designation;
    }
    return id;
  }

  // Level line: data-id is "level-R" or "level-1"/"level-2"/"level-3"
  if (el.classList.contains('level-line')) {
    const floor = id.replace(/^level-/, '');
    return floor === 'R' ? 'ROOF' : `LEVEL ${floor}`;
  }

  // FC pennant: data-id is the a-NNN annotation ID. Return it verbatim
  // (matches a-NNN convention for other annotations).
  if (el.classList.contains('fc-pennant')) {
    return id;  // id = el.dataset.id = 'a-251' etc.
  }

  // Section: data-id is the sec-NNN ID. Copy verbatim — same convention as
  // pennants and hex notes; sec-NNN is the canonical cross-reference key
  // used in TOPO.sections, port_assignments, and downstream schedules. The
  // descriptive label ("DISTRIBUTION · NEC 700") shown in the tooltip is
  // for human reading; the id is what gets pasted into RFI threads.
  if (el.classList.contains('section')) {
    return id;
  }

  return null;
}

// V2: id of the most recently activated (clicked / keyboard-selected)
// element group — consumed by snapshotElementPng (KEYMAP 'l').
let lastClickedElementId = null;

function bindClickToCopy() {
  const svg = document.getElementById('sld-svg');
  if (!svg) return;
  // Shared walk-up + copy logic — used by both click and keydown handlers.
  // For keyboard activation, position is derived from the focused element's
  // bounding rect (no cursor coordinate available).
  function activate(target, clientX, clientY) {
    let el = target;
    while (el && el !== svg) {
      if (el.classList && (
          el.classList.contains('dev') ||
          el.classList.contains('feeder') ||
          el.classList.contains('feeder-tag') ||
          el.classList.contains('squiggle') ||
          el.classList.contains('bus') ||
          el.classList.contains('section') ||
          el.classList.contains('level-line') ||
          el.classList.contains('fc-pennant'))) {
        const text = resolveCopyTextForElement(el);
        if (text) {
          const did = (el.dataset && el.dataset.id) ||
                      (el.getAttribute && el.getAttribute('data-id'));
          if (did) lastClickedElementId = did;
          appendToClipboardList(text, clientX, clientY);
          return true;
        }
      }
      el = el.parentNode;
    }
    return false;
  }
  svg.addEventListener('click', function(e) {
    // Walk up from the clicked node to find the nearest recognized group.
    // Priority is determined by DOM order — whichever matching ancestor is
    // found first wins. Since feeder/bus are lower in z-order than devices
    // (devices render last), clicks on a device glyph that happens to sit
    // over a bus will copy the device, as expected.
    if (activate(e.target, e.clientX, e.clientY)) e.stopPropagation();
  });
  // Fix 1 (v1.0.0) — Keyboard activation. Enter or Space on a focused
  // interactive group triggers the same copy path as a click. Space gets
  // preventDefault so the page doesn't scroll. Coordinates come from the
  // focused element's bounding rect center, which positions the toast
  // sensibly without a cursor position.
  svg.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const focused = e.target.closest('g[tabindex="0"]');
    if (!focused) return;
    e.preventDefault();
    const r = focused.getBoundingClientRect();
    activate(focused, r.left + r.width/2, r.top + r.height/2);
  });
}

// ============================================================
// CLIPBOARD ACCUMULATOR
// ============================================================
// Approach 3: every click on a copyable element appends its resolved text
// to clipboardItems[] AND rewrites the full joined list to the system
// clipboard. The user can paste at any time and get everything they've
// clicked so far. Clear button empties the list (does NOT touch the OS
// clipboard — standard OS behavior is that clipboard contents persist
// until the next copy or paste).
// ============================================================
let clipboardItems = [];

function appendToClipboardList(text, clientX, clientY) {
  clipboardItems.push(text);
  const joined = clipboardItems.join(', ');
  const countLabel = clipboardItems.length === 1
    ? '1 item'
    : `${clipboardItems.length} items`;
  // Mirror full list to system clipboard. Reuses the existing copy
  // helper so all the cross-browser fallbacks (textarea selection,
  // navigator.clipboard, secure-context detection) apply equally here.
  // displayLabel keeps the toast clean (just the most-recent entry +
  // count) instead of dumping the full multi-line payload.
  copyTextToClipboard(joined, clientX, clientY, `${text} (${countLabel})`);
  renderClipboardList();
}

function clearClipboard() {
  clipboardItems = [];
  renderClipboardList();
}

function renderClipboardList() {
  const list = document.getElementById('clip-list');
  const count = document.getElementById('clip-count');
  const clearBtn = document.getElementById('clip-clear');
  if (!list || !count || !clearBtn) return;
  count.textContent = clipboardItems.length === 1
    ? '1 item'
    : `${clipboardItems.length} items`;
  if (clipboardItems.length === 0) {
    list.innerHTML = '<div class="clip-empty">Click any element to add</div>';
    clearBtn.disabled = true;
  } else {
    // Render most-recent-first so users see what they just added without
    // having to scroll. The joined clipboard payload still preserves
    // click order (oldest first) — that's the natural reading order for
    // a paste target.
    const items = clipboardItems.slice().reverse()
      .map(t => `<div class="clip-item" title="${esc(t)}">${esc(t)}</div>`)
      .join('');
    list.innerHTML = items;
    clearBtn.disabled = false;
  }
}

// ============================================================
// GEOMETRY EXPORT  (Revit add-in hand-off)
// ------------------------------------------------------------
// Walks every sheet through buildSheet() (which is what computes the whole
// layout), then harvests:
//   - device anchors          from the live G[] map
//   - feeder / bus polylines  from the rendered SVG markup (g.feeder, g.bus)
//   - A-1 / A-3 positions     from the capture hooks in renderTag/renderSquiggle
// and emits ONE merged "geometry" block matching the C# GeometryBlock schema
// (effective_px_per_inch / content_area / devices / routed_elements /
// annotations / layout_warnings).
//
// IDs are globally unique across sheets, and the Revit pipeline filters each
// placer by sheet_id, so a single merged block is the correct shape for
// topology.Geometry (see SLDPipeline.cs line 37).
//
// Coordinate contract: values stay in SVG pixel space at 96 px/inch. The C#
// CoordinateTransform does px -> feet and the Y-flip using content_area.height_px,
// so height_px MUST be >= the largest y emitted (it is: we set it to maxY).
// ============================================================
function exportGeometry() {
  const round2 = v => Math.round(v * 100) / 100;

  const geometry = {
    effective_px_per_inch: 96,
    content_area: { width_px: 0, height_px: 0 },
    devices: {},
    routed_elements: {},
    annotations: {},
    level_lines: [],
    sections: {},
    equipment_labels: [],
    glyph_supplements: [],
    bus_dots: [],
    layout_warnings: []
  };

  // Running content extents (px). height_px is taken from maxY so the
  // bottom-most element maps to Revit Y = 0 and the diagram stays upright.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const ext = (x, y) => {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  };

  // Harvest feeder/bus path vertices from a sheet's rendered SVG markup.
  // Regex-based (harvestRoutesFromMarkup) — DOMParser doesn't exist under the
  // headless node:vm shim, and the browser + headless paths must agree.
  function harvestRoutes(markup) {
    const routes = harvestRoutesFromMarkup(markup);
    Object.keys(routes).forEach(id => {
      if (!reMap[id]) return;                   // skip unlabeled / non-topology lines
      if (geometry.routed_elements[id]) return; // first occurrence wins
      const verts = routes[id];
      verts.forEach(p => ext(p.x, p.y));
      geometry.routed_elements[id] = {
        path_vertices: verts.map(p => ({ x: round2(p.x), y: round2(p.y) }))
      };
    });
  }

  const savedSheet = currentSheet;
  window.__GEOM_CAP = { ann: {}, levelLines: [], sections: [], equipmentLabels: [], glyphSupplements: [], busDots: [] };   // arm the renderTag / renderSquiggle + level-line + section/equipment-label + glyph-supplement + bus-dot hooks

  try {
    TOPO.sheets.forEach(sheet => {
      const markup = buildSheet(sheet.sheet_id);   // computes layout, fills G[], fires hooks
      // Device anchors from G[]
      TOPO.devices.filter(d => d.sheet_id === sheet.sheet_id).forEach(d => {
        const g = G[d.id];
        if (!g || !isFinite(g.x) || !isFinite(g.y)) return;
        ext(g.x, g.y);
        const dims = exportDims(d.node_type);
        geometry.devices[d.id] = {
          anchor: { x: round2(g.x), y: round2(g.y) },
          w: round2(dims.w), h: round2(dims.h), anchor_mode: dims.anchor_mode
        };
        // Schema §14.1: surface the render-side flip so the Revit
        // add-in can rotate the family 180° (fire-pump breaker). Additive-only:
        // emitted only when truthy, so non-flipped devices are byte-identical.
        if (g.flip_vertical) geometry.devices[d.id].flip_vertical = true;
      });
      // Feeder + bus polylines from markup
      harvestRoutes(markup);
      // DROP REPORT (OFF-012): loud per-entity coverage diff.
      // buildSheet left the sheet's RenderManifest in `manifest`; anything
      // expected-but-unrendered is reported here instead of vanishing
      // silently. Sheets with full coverage add nothing, so golden outputs
      // are unchanged.
      if (manifest) {
        const cov = manifest.audit();
        if (!cov.ok) {
          geometry.layout_warnings.push(
            `sheet ${sheet.sheet_id}: DROPPED ${cov.misses.length} of ${cov.total} expected entities (rendered ${cov.rendered}, intentional skips ${cov.intentionalSkips})`);
          cov.misses.forEach(m => geometry.layout_warnings.push(
            `DROPPED ${m.type} ${m.id} (${m.label}) on ${sheet.sheet_id}`));
        }
      }
    });

    // A-1 / A-3 positions captured during the buildSheet passes above
    Object.keys(window.__GEOM_CAP.ann).forEach(id => {
      if (!anMap[id]) return;                       // only real topology annotations
      const p = window.__GEOM_CAP.ann[id];
      if (!isFinite(p.x) || !isFinite(p.y)) return;
      ext(p.x, p.y);
      const annRec = { x: round2(p.x), y: round2(p.y) };
      // A-1 pill center captured by renderTag (schema §14.1).
      // Deliberately NOT fed to ext(): pill extents are excluded from
      // content_area, matching the golden.
      if (p.pill && isFinite(p.pill.x) && isFinite(p.pill.y)) {
        annRec.pill = { x: round2(p.pill.x), y: round2(p.pill.y) };
      }
      // A-3 resolved squiggle label captured by renderSquiggle
      // (schema §14.1 `label`). Like `pill`, deliberately NOT fed to ext():
      // the drawn text already participates in markup extents; the capture
      // point must not move content_area.
      if (p.label && isFinite(p.label.x) && isFinite(p.label.y)
          && typeof p.label.text === 'string') {
        annRec.label = { x: round2(p.label.x), y: round2(p.label.y),
                         anchor: p.label.anchor, text: p.label.text };
      }
      geometry.annotations[id] = annRec;
    });

    // A-7 level lines captured during the buildSheet passes above
    // (schema §14.6). Ordered array (level codes recur per sheet, so no id key).
    // Deliberately NOT fed to ext(): level-line extents are excluded from
    // content_area, matching the golden.
    geometry.level_lines = window.__GEOM_CAP.levelLines
      .filter(r => isFinite(r.y) && isFinite(r.x_start) && isFinite(r.x_end))
      .map(r => ({
        sheet: r.sheet, level: r.level, label: r.label,
        y: round2(r.y), x_start: round2(r.x_start), x_end: round2(r.x_end)
      }));

    // L1-2 switchboard sections captured during the buildSheet passes above
    // (schema §14.7). ID-KEYED OBJECT, not an array: section ids are
    // unique topology ids (unlike level codes, which recur per sheet), so
    // mirroring geometry.devices/annotations gets the schema-§14 FK check for
    // free. Deliberately NOT fed to ext(): section extents are excluded from
    // content_area, matching the golden.
    window.__GEOM_CAP.sections
      .filter(r => isFinite(r.x) && isFinite(r.y) && isFinite(r.w) && isFinite(r.h))
      .forEach(r => {
        geometry.sections[r.id] = {
          sheet: r.sheet, switchboard_id: r.switchboard_id, type: r.type,
          nec_class: r.nec_class, section_tag: r.section_tag,
          x: round2(r.x), y: round2(r.y), w: round2(r.w), h: round2(r.h)
        };
      });

    // A-8 equipment label blocks captured during the buildSheet passes above
    // (schema §14.8). ORDERED ARRAY, and deliberately NOT merged
    // into geometry.annotations — that dict is FK-validated against
    // topology.annotations[] (schema_rules), and A-8 has no topology instance
    // (derived geometry-only, exactly as A-7 was). Folding it in would push the
    // parity count 94 -> 96 and fail the FK check. Not fed to ext().
    geometry.equipment_labels = window.__GEOM_CAP.equipmentLabels
      .filter(r => isFinite(r.x) && isFinite(r.y))
      .map(r => ({
        sheet: r.sheet, bound_to: r.bound_to, bound_to_type: r.bound_to_type,
        anchor: { x: round2(r.x), y: round2(r.y) },
        align: r.align, line_pitch: r.line_pitch,
        first_line_pitch: r.first_line_pitch,
        label: r.label, lines: r.lines.slice()
      }));

    // Glyph supplements (schema §14.9): engine-drawn connecting
    // linework with NO topology instance — today the utility primary feed
    // polyline + its TO-UTILITY squiggle, drawn inline by the utility block
    // (no R-1 / no A-3 — the pre-existing data-model gap). ORDERED ARRAY
    // carrying its own `sheet` (like equipment_labels; there is no topology
    // id to key by), ids deterministic per sheet. Deliberately NOT fed to
    // ext(): the drawn polyline is not a g.feeder route so it never fed
    // content_area — the export must not move the extents either.
    geometry.glyph_supplements = window.__GEOM_CAP.glyphSupplements
      .filter(r => r.kind === 'polyline'
        ? Array.isArray(r.vertices) && r.vertices.length >= 2 &&
          r.vertices.every(p => isFinite(p.x) && isFinite(p.y))
        : isFinite(r.x) && isFinite(r.y))
      .map(r => r.kind === 'polyline'
        ? { id: r.id, sheet: r.sheet, kind: r.kind,
            host_device_id: r.host_device_id, role: r.role,
            vertices: r.vertices.map(p => ({ x: round2(p.x), y: round2(p.y) })) }
        : { id: r.id, sheet: r.sheet, kind: r.kind,
            host_device_id: r.host_device_id, role: r.role,
            x: round2(r.x), y: round2(r.y), text: r.text,
            text_side: r.text_side, orient: r.orient });

    // Bus connection dots (schema §14.10): the incoming-feeder × bus
    // junction dot, drawn inline and captured above. Same discipline as
    // glyph_supplements — ordered array, per-record `sheet`, NOT fed to ext()
    // (the dot coincides with the existing bus geometry, so the export must not
    // move content_area).
    geometry.bus_dots = window.__GEOM_CAP.busDots
      .filter(r => isFinite(r.x) && isFinite(r.y))
      .map(r => ({ id: r.id, sheet: r.sheet,
        host_device_id: r.host_device_id, role: r.role,
        x: round2(r.x), y: round2(r.y) }));
  } finally {
    delete window.__GEOM_CAP;        // disarm hooks so normal renders don't capture
    renderCurrentSheet();            // restore the live view + G[] to the displayed sheet
    selectSheet(savedSheet);
  }

  geometry.content_area.width_px  = Math.ceil(maxX > -Infinity ? maxX : 0);
  geometry.content_area.height_px = Math.ceil(maxY > -Infinity ? maxY : 0);

  const counts = {
    devices: Object.keys(geometry.devices).length,
    routed_elements: Object.keys(geometry.routed_elements).length,
    annotations: Object.keys(geometry.annotations).length
  };
  geometry.layout_warnings.push(
    `Exported from ${(TOPO.metadata && TOPO.metadata.heading) ? TOPO.metadata.heading + ' viewer' : 'sld_viewer'} at 96px/in: ` +
    `${counts.devices} devices, ${counts.routed_elements} routed, ${counts.annotations} annotations.`);

  const json = JSON.stringify(geometry, null, 2);
  console.log('[exportGeometry] geometry block:', geometry);
  console.log('[exportGeometry] counts:', counts,
              'content_area:', geometry.content_area);

  // Download a ready-to-merge file
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sld_geometry_block.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) { console.warn('[exportGeometry] download failed:', e); }

  // Best-effort copy to clipboard too
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).catch(() => {});
  }

  return geometry;   // also returned so it can be inspected from the console
}

// ============================================================
// SNAPSHOT — shared core (browser button + headless Node CLI)
// ------------------------------------------------------------
// snapshotCore(sheetId, opts) is the single source of truth for what a
// snapshot IS: a standalone, theme-resolved, transform-free SVG document
// of one sheet's full diagram. The browser button/keys and the headless
// tool (04_renderer/snapshot_html.mjs, via window.__snapshot) are thin
// frontends over this one function, so both produce byte-identical SVG.
//
// Constraints that shape this code:
// - No getBBox: bounds must be computable headlessly (node:vm DOM shim),
//   so they come from scanning the generated markup + G[] anchors, with
//   exact monospace text math ('Courier New' advance = 0.6em).
// - No getComputedStyle: theme colors are parsed from this file's own
//   <style> block, so a duplicated palette table can never drift.
// - librsvg (rsvg-convert) cannot resolve CSS var() and renders
//   text-decoration="underline" unreliably; substitution is always done
//   here, and opts.rsvgSafe additionally inlines underline <line>s.
// ============================================================
const SNAPSHOT_PAD = 120;   // must match the live render's viewBox pad (renderCurrentSheet)

function _snapCssText() {
  if (typeof window !== 'undefined' && window.__SLD_CSS_TEXT) return window.__SLD_CSS_TEXT;
  const st = document.querySelector && document.querySelector('style');
  return st ? st.textContent : '';
}

function parseThemeVars(cssText) {
  const themes = { dark: {}, light: {} };
  const blockRe = /:root(\[data-theme="light"\])?\s*\{([^}]*)\}/g;
  let m;
  while ((m = blockRe.exec(cssText))) {
    const target = m[1] ? themes.light : themes.dark;
    const body = m[2].replace(/\/\*[\s\S]*?\*\//g, '');
    const varRe = /--([\w-]+)\s*:\s*([^;}]+)/g;
    let v;
    while ((v = varRe.exec(body))) target['--' + v[1]] = v[2].trim();
  }
  // Light theme only overrides canvas-facing vars; inherit the rest.
  themes.light = Object.assign({}, themes.dark, themes.light);
  return themes;
}

function _snapAttrs(attrStr) {
  const out = {};
  const re = /([a-zA-Z_:][\w:-]*)="([^"]*)"/g;
  let m;
  while ((m = re.exec(attrStr))) out[m[1]] = m[2];
  return out;
}

// Rendered glyph count: strip child tags (tspan etc.), collapse each
// character entity produced by esc() to one character.
function _snapTextLen(content) {
  return content.replace(/<[^>]*>/g, '').replace(/&[a-z]+;|&#\d+;/gi, 'x').length;
}

// ============================================================
// TRANSFORM ALGEBRA for the extent scan (FU-0008, 2026-08-01)
// ------------------------------------------------------------
// 2x3 affine in SVG order: [a,b,c,d,e,f] means
//     x' = a*x + c*y + e ,  y' = b*x + d*y + f
// It exists so measureMarkupExtent can measure a transformed group by its
// REAL children instead of scraping numbers out of its markup string
// (FL-0007). Regex-only, no DOMMatrix, so results are identical in-browser
// and under the node:vm shim — the same rule the rest of this section obeys.
// ============================================================
const _MME_I = [1, 0, 0, 1, 0, 0];

function _mmeMul(m, n) {
  return [
    m[0] * n[0] + m[2] * n[1],
    m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3],
    m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4],
    m[1] * n[4] + m[3] * n[5] + m[5]
  ];
}

// SVG transform-list string -> matrix. Covers every primitive the renderers
// emit (translate / rotate / scale, incl. the rotate(a,cx,cy) and negative
// scale mirror forms the A-4 pennant uses) plus matrix/skew for completeness.
function _mmeTransform(str) {
  let m = _MME_I;
  const re = /(matrix|translate|scale|rotate|skewX|skewY)\s*\(([^)]*)\)/g;
  let t;
  while ((t = re.exec(str || ''))) {
    const a = (t[2].match(/-?\d*\.?\d+(?:[eE][-+]?\d+)?/g) || []).map(parseFloat);
    if (t[1] === 'matrix') {
      if (a.length >= 6) m = _mmeMul(m, [a[0], a[1], a[2], a[3], a[4], a[5]]);
    } else if (t[1] === 'translate') {
      m = _mmeMul(m, [1, 0, 0, 1, a[0] || 0, a[1] || 0]);
    } else if (t[1] === 'scale') {
      const sx = (a[0] === undefined) ? 1 : a[0];
      const sy = (a[1] === undefined) ? sx : a[1];
      m = _mmeMul(m, [sx, 0, 0, sy, 0, 0]);
    } else if (t[1] === 'rotate') {
      const r = (a[0] || 0) * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
      if (a.length >= 3) m = _mmeMul(m, [1, 0, 0, 1, a[1], a[2]]);
      m = _mmeMul(m, [c, s, -s, c, 0, 0]);
      if (a.length >= 3) m = _mmeMul(m, [1, 0, 0, 1, -a[1], -a[2]]);
    } else if (t[1] === 'skewX') {
      m = _mmeMul(m, [1, 0, Math.tan((a[0] || 0) * Math.PI / 180), 1, 0, 0]);
    } else if (t[1] === 'skewY') {
      m = _mmeMul(m, [1, Math.tan((a[0] || 0) * Math.PI / 180), 0, 1, 0, 0]);
    }
  }
  return m;
}

// Point sink under `m`. The identity is returned UNWRAPPED so untransformed
// markup — every sheet with no pennants — walks the exact same float path it
// walked before FU-0008 and cannot drift by a ULP.
function _mmeEmitter(m, ext) {
  if (m === _MME_I) return ext;
  return (x, y) => ext(m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]);
}

// Steps 1-3 of measureMarkupExtent over one markup fragment, expressed in the
// frame `m`. RECURSIVE: a <g> carrying a transform is measured by its own
// children with that transform composed in, so nesting, rotate, mirror and
// scale all compose exactly. Shape/text elements carrying their own transform
// compose too — a child transform ignored is precisely "the recursion missed
// a child".
//
// Rect and text emit all FOUR corners rather than two opposite ones: under
// the identity that is a no-op (the extra pair lies inside the union of the
// other two), and under a rotation two corners are not a bound.
function _mmeScan(markup, m, ext) {
  const emit = _mmeEmitter(m, ext);

  // 1) transformed groups — consumed so their local coords never reach this
  //    frame. Balanced slicing (not a non-greedy </g>) so a nested group
  //    closes at its OWN </g>; the old regex stopped at the first one and
  //    spilled the remainder into the parent frame.
  let rest = '', from = 0;
  const openRe = /<g\b[^>]*>/g;
  let g;
  while ((g = openRe.exec(markup))) {
    if (/\/>$/.test(g[0])) continue;                       // self-closing <g/>: no children
    const tm = /\btransform="([^"]*)"/.exec(g[0]);
    if (!tm) continue;                                     // untransformed: children inherit `m`
    const slice = _sliceBalancedGroupAt(markup, g.index);
    if (!slice) continue;                                  // unbalanced: leave it to the flat scan
    _mmeScan(slice.slice(g[0].length, slice.length - 4), _mmeMul(m, _mmeTransform(tm[1])), ext);
    rest += markup.slice(from, g.index);
    from = g.index + slice.length;
    openRe.lastIndex = from;
  }
  rest += markup.slice(from);

  // 2) text extents — consume so numeric font sizes don't feed the shape scan
  rest = rest.replace(/<text\b([^>]*)>([\s\S]*?)<\/text>/g, (whole, attrs, content) => {
    const at = _snapAttrs(attrs);
    const x = parseFloat(at.x || 0), y = parseFloat(at.y || 0);
    const fs = parseFloat(at['font-size'] || 10);
    const w = _snapTextLen(content) * fs * 0.6;
    const anchor = at['text-anchor'] || 'start';
    const x0 = anchor === 'middle' ? x - w / 2 : (anchor === 'end' ? x - w : x);
    const e = at.transform ? _mmeEmitter(_mmeMul(m, _mmeTransform(at.transform)), ext) : emit;
    const y0 = y - fs * 0.8, y1 = y + fs * 0.25;
    e(x0, y0); e(x0 + w, y0); e(x0 + w, y1); e(x0, y1);
    return '';
  });

  // 3) shapes
  const tagRe = /<(rect|circle|ellipse|line|polyline|polygon|path)\b([^>]*)>/g;
  let t;
  while ((t = tagRe.exec(rest))) {
    const tag = t[1], at = _snapAttrs(t[2]);
    const e = at.transform ? _mmeEmitter(_mmeMul(m, _mmeTransform(at.transform)), ext) : emit;
    if (tag === 'rect') {
      const x = parseFloat(at.x || 0), y = parseFloat(at.y || 0);
      const x1 = x + parseFloat(at.width || 0), y1 = y + parseFloat(at.height || 0);
      e(x, y); e(x1, y); e(x1, y1); e(x, y1);
    } else if (tag === 'circle' || tag === 'ellipse') {
      // Circumscribed box. Exact for the axis-aligned case (all the renderers
      // emit); a conservative over-estimate under rotation, which FU-0008 §2
      // explicitly allows and which is still ~an order of magnitude tighter
      // than the radius it replaced.
      const cx = parseFloat(at.cx || 0), cy = parseFloat(at.cy || 0);
      const rx = parseFloat(at.rx || at.r || 0), ry = parseFloat(at.ry || at.r || 0);
      e(cx - rx, cy - ry); e(cx + rx, cy - ry); e(cx + rx, cy + ry); e(cx - rx, cy + ry);
    } else if (tag === 'line') {
      e(parseFloat(at.x1 || 0), parseFloat(at.y1 || 0));
      e(parseFloat(at.x2 || 0), parseFloat(at.y2 || 0));
    } else if (tag === 'polyline' || tag === 'polygon') {
      const nums = (at.points || '').match(/-?\d+(?:\.\d+)?/g) || [];
      for (let i = 0; i + 1 < nums.length; i += 2) e(parseFloat(nums[i]), parseFloat(nums[i + 1]));
    } else if (tag === 'path') {
      // All emitted paths use absolute "x,y" pairs (M/L/Q); comma-pairs are
      // a safe superset of the true bbox (Q control points may overshoot).
      const pairRe = /(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g;
      let p;
      while ((p = pairRe.exec(at.d || ''))) e(parseFloat(p[1]), parseFloat(p[2]));
    }
  }
}

// Bounds without getBBox. Union of:
//   1. transformed groups (fc-pennants): their real child geometry, mapped
//      through the group's full transform, recursively
//   2. <text> extents via exact monospace math (0.6em advance,
//      0.8em ascent / 0.25em descent, honoring text-anchor)
//   3. shape coordinate attributes (rect/circle/line/polyline/path...)
//   4. G[] device anchors
// opts.noAnchors (V2): skip step 4 — required when measuring a sliced
// group rather than a full sheet, else every device anchor on the sheet
// would be unioned into the slice's extent.
//
// ⚠️ FU-0008 (2026-08-01) REPLACED STEP 1, and the replacement is why every
// pennant-carrying sheet's viewBox moved and G5/G6 were re-blessed. G7 and G9
// do NOT move: the title-block template carries its own byte-copy of the old
// heuristic (dormant — it has no translate-groups to fire on, FL-0024) and the
// symbol catalog never calls this function at all. Step 1 used to bound a
// transformed group by a ±r square where r was the largest NUMBER appearing
// anywhere in that group's markup STRING — so an A-4 fault-current pennant
// reading "41,837A" claimed ±837 px around its anchor and even a digit-free
// one claimed ±700 px off `font-weight="700"`, against true geometry of about
// ±100 px. The `< 10000` clamp was the author's own tell that the scrape was
// picking up non-coordinates. Steps 1-3 now live in _mmeScan, which is the
// same math walked under a transform stack. Full measurement: FL-0007.
function measureMarkupExtent(markup, opts) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const ext = (x, y) => {
    if (!isFinite(x) || !isFinite(y)) return;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  };

  // 1-3) transformed groups (recursive), text, shapes
  _mmeScan(markup, _MME_I, ext);

  // 4) device anchors from the layout globals
  if (!opts || !opts.noAnchors) {
    Object.keys(G).forEach(id => {
      const g = G[id];
      if (g && isFinite(g.x) && isFinite(g.y)) ext(g.x, g.y);
    });
  }

  if (minX === Infinity) return null;
  return { minX, minY, maxX, maxY };
}

// ============================================================
// MARKUP GROUP HELPERS (V2) — regex-only, no DOMParser/querySelector,
// so results are identical in-browser and under the node:vm shim.
// Shared by exportGeometry's route harvest, element snapshots and
// the geometry audit.
// ============================================================

// Balanced <g>...</g> slice starting at the '<g' found at openIdx.
// Token-counts /<g[\s>]|<\/g>/ so nested groups (fc-pennant) close correctly.
function _sliceBalancedGroupAt(markup, openIdx) {
  const re = /<g[\s>]|<\/g>/g;
  re.lastIndex = openIdx;
  let depth = 0, m;
  while ((m = re.exec(markup))) {
    if (m[0] === '</g>') {
      depth--;
      if (depth === 0) return markup.slice(openIdx, m.index + 4);
    } else {
      depth++;
    }
  }
  return null;   // unbalanced markup
}

// Slice the <g ... data-id="dataId" ...> group (with all nested content)
// out of markup. Returns the group's full markup string, or null.
function sliceBalancedGroup(markup, dataId) {
  const marker = 'data-id="' + dataId + '"';
  let from = 0;
  for (;;) {
    const at = markup.indexOf(marker, from);
    if (at === -1) return null;
    from = at + marker.length;
    const open = markup.lastIndexOf('<g', at);
    if (open === -1) continue;
    if (!/^<g[\s>]/.test(markup.slice(open, open + 3))) continue;
    const tagEnd = markup.indexOf('>', open);
    if (tagEnd === -1 || tagEnd < at) continue;   // marker not inside this open tag
    return _sliceBalancedGroupAt(markup, open);
  }
}

// Harvest feeder/bus route vertices from rendered sheet markup.
// Returns { id: [{x,y}, ...] } in document order; first valid occurrence
// of an id wins; entries with fewer than 2 finite vertices are dropped.
// Applies the group's translate(tx,ty) when present (hospital feeders/
// buses emit none, but this keeps the harvester generic).
function harvestRoutesFromMarkup(markup) {
  const routes = {};
  const openRe = /<g\b[^>]*class="(?:feeder|bus)"[^>]*>/g;
  let m;
  while ((m = openRe.exec(markup))) {
    const openTag = m[0];
    const idm = /data-id="([^"]+)"/.exec(openTag);
    if (!idm || routes[idm[1]]) continue;
    const slice = _sliceBalancedGroupAt(markup, m.index);
    if (!slice) continue;
    let tx = 0, ty = 0;
    const tr = /transform="translate\((-?[\d.]+)[,\s]\s*(-?[\d.]+)\)/.exec(openTag);
    if (tr) { tx = parseFloat(tr[1]); ty = parseFloat(tr[2]); }
    let verts = [];
    const poly = /<polyline\b([^>]*)>/.exec(slice);
    if (poly) {
      // SVG allows comma- or space-separated coordinates; consume all
      // numerics pairwise (same approach as measureMarkupExtent's shape scan)
      const nums = (_snapAttrs(poly[1]).points || '').match(/-?\d+(?:\.\d+)?/g) || [];
      for (let i = 0; i + 1 < nums.length; i += 2) {
        verts.push({ x: parseFloat(nums[i]) + tx, y: parseFloat(nums[i + 1]) + ty });
      }
    } else {
      const ln = /<line\b([^>]*)>/.exec(slice);   // buses: 2 identical lines; first works
      if (ln) {
        const at = _snapAttrs(ln[1]);
        verts = [
          { x: parseFloat(at.x1) + tx, y: parseFloat(at.y1) + ty },
          { x: parseFloat(at.x2) + tx, y: parseFloat(at.y2) + ty }
        ];
      }
    }
    verts = verts.filter(p => isFinite(p.x) && isFinite(p.y));
    if (verts.length < 2) continue;
    routes[idm[1]] = verts;
  }
  return routes;
}

// rsvgSafe: librsvg's underline support is unreliable — draw them as
// explicit <line>s using the same monospace math as the extent scan.
// Runs AFTER var() substitution so `fill` is already a concrete color.
function _snapInlineUnderlines(body) {
  return body.replace(/<text\b([^>]*text-decoration="underline"[^>]*)>([\s\S]*?)<\/text>/g,
    (whole, attrs, content) => {
      const at = _snapAttrs(attrs);
      const x = parseFloat(at.x || 0), y = parseFloat(at.y || 0);
      const fs = parseFloat(at['font-size'] || 12);
      const w = _snapTextLen(content) * fs * 0.6;
      const anchor = at['text-anchor'] || 'start';
      const x0 = anchor === 'middle' ? x - w / 2 : (anchor === 'end' ? x - w : x);
      const uy = y + Math.max(1.5, fs * 0.15);
      const color = at.fill || 'currentColor';
      return whole + `<line x1="${x0}" y1="${uy}" x2="${x0 + w}" y2="${uy}" stroke="${color}" stroke-width="1"/>`;
    });
}

function snapshotCore(sheetId, opts) {
  opts = opts || {};
  const theme = opts.theme ||
    ((document.documentElement.getAttribute && document.documentElement.getAttribute('data-theme')) === 'light' ? 'light' : 'dark');
  const pad = (opts.pad != null) ? opts.pad : SNAPSHOT_PAD;
  const warnings = [];
  try {
    const markup = buildSheet(sheetId);
    const coverage = manifest ? manifest.audit() : null;
    if (coverage && !coverage.ok) {
      warnings.push(`coverage: ${coverage.rendered}/${coverage.total} rendered; misses: `
        + coverage.misses.slice(0, 5).map(mm => mm.id).join(', '));
    }
    if (/NO RENDERER/.test(markup)) warnings.push('markup contains NO RENDERER fallback boxes');

    const extent = measureMarkupExtent(markup);
    let vb;
    if (opts.region) {
      vb = { x: opts.region.x, y: opts.region.y, w: opts.region.w, h: opts.region.h };
    } else if (extent) {
      vb = { x: extent.minX - pad, y: extent.minY - pad,
             w: (extent.maxX - extent.minX) + pad * 2, h: (extent.maxY - extent.minY) + pad * 2 };
    } else {
      warnings.push('FATAL: empty markup — no extent computable');
      vb = { x: 0, y: 0, w: 100, h: 100 };
    }

    const vars = parseThemeVars(_snapCssText())[theme] || {};
    let body = markup.replace(/var\((--[\w-]+)\)/g, (mm, name) => (vars[name] !== undefined ? vars[name] : mm));
    if (/var\(/.test(body)) {
      const left = [...new Set(body.match(/var\((--[\w-]+)\)/g) || [])];
      warnings.push('FATAL: unresolved CSS variables: ' + left.join(', '));
    }
    if (opts.rsvgSafe) body = _snapInlineUnderlines(body);

    const bg = vars['--canvas-bg'] || '#1c2438';
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${_r2(vb.x)} ${_r2(vb.y)} ${_r2(vb.w)} ${_r2(vb.h)}"`
      + ` width="${Math.ceil(vb.w)}" height="${Math.ceil(vb.h)}" font-family="'Courier New',monospace">`
      + `<rect x="${_r2(vb.x)}" y="${_r2(vb.y)}" width="${_r2(vb.w)}" height="${_r2(vb.h)}" fill="${bg}"/>`
      + body + `</svg>`;
    return { svg, viewBox: vb, coverage, warnings, theme, sheetId };
  } finally {
    // Restore live view + G[]/manifest globals (exportGeometry pattern).
    // Skippable when capturing the displayed sheet: buildSheet recomputed
    // identical globals and the DOM was never touched — avoiding the
    // re-render preserves the user's pan/zoom.
    if (sheetId !== currentSheet) renderCurrentSheet();
  }
}

// ---- Browser frontends (download to the device's Downloads folder) ----
function _snapDownloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function _snapToast(text, isError) {
  const w = document.getElementById('canvas-wrap');
  const r = w.getBoundingClientRect();
  showCopyToast(r.left + r.width / 2, r.top + 60, text, !!isError);
}

// Parity assertion: the headless bounds math is continuously validated
// against Chrome's ground-truth getBBox on every full-sheet capture.
function _snapParityCheck(r) {
  try {
    const svg = document.getElementById('sld-svg');
    if (!svg || typeof svg.getBBox !== 'function' || r.sheetId !== currentSheet) return;
    const bb = svg.getBBox();
    if (!bb || !isFinite(bb.x)) return;
    const v = r.viewBox;
    if (bb.x < v.x || bb.y < v.y || bb.x + bb.width > v.x + v.w || bb.y + bb.height > v.y + v.h) {
      console.warn('[snapshot] parity: live getBBox exceeds computed bounds', { bbox: bb, viewBox: v });
      _snapToast('⚠ Snapshot bounds may clip — check console', true);
    }
  } catch (e) { /* assertion is best-effort; never block the capture */ }
}

// Snapshot filename prefix, derived from TOPO.metadata (de-hospitalized:
// metadata.slug wins, else heading/project_name slugified, else 'sld').
// The embedded hospital demo (heading "Hospital") yields 'hospital', so
// golden baseline filenames are unchanged.
function _sldSlug() {
  const M = TOPO.metadata || {};
  const s = M.slug || M.heading || M.project_name || 'sld';
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'sld';
}

function snapshotSvgDownload() {
  const r = snapshotCore(currentSheet);
  _snapParityCheck(r);
  const name = `${_sldSlug()}_${r.sheetId}_${r.theme}.svg`;
  _snapDownloadBlob(new Blob([r.svg], { type: 'image/svg+xml' }), name);
  _snapToast('✓ Saved ' + name);
}

// V2: opts.region crops the capture (SVG user units), opts.suffix is
// appended to the filename base. Guarded so a stray Event object (raw
// listener wiring) degrades to a plain full-sheet capture.
function snapshotToPng(opts) {
  opts = (opts && (opts.region || opts.suffix)) ? opts : {};
  const r = snapshotCore(currentSheet, opts.region ? { region: opts.region } : undefined);
  _snapParityCheck(r);
  const fatal = r.warnings.find(w => w.indexOf('FATAL') === 0);
  if (fatal) { _snapToast('✗ ' + fatal, true); console.error('[snapshot]', r.warnings); return; }
  // Adaptive DPI: aim for 2x, capped per-side and by total pixels so
  // canvas allocation never silently fails on mobile.
  const MAX_DIM = 8192, MAX_PIXELS = 33e6;
  const scale = Math.min(2, MAX_DIM / Math.max(r.viewBox.w, r.viewBox.h),
                         Math.sqrt(MAX_PIXELS / (r.viewBox.w * r.viewBox.h)));
  const pw = Math.ceil(r.viewBox.w * scale), ph = Math.ceil(r.viewBox.h * scale);
  const url = URL.createObjectURL(new Blob([r.svg], { type: 'image/svg+xml' }));
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = pw; canvas.height = ph;
      canvas.getContext('2d').drawImage(img, 0, 0, pw, ph);
      canvas.toBlob(blob => {
        if (!blob) { _snapToast('✗ Snapshot failed (canvas memory?)', true); return; }
        const name = `${_sldSlug()}_${r.sheetId}_${r.theme}${opts.suffix || ''}_${pw}x${ph}.png`;
        _snapDownloadBlob(blob, name);
        _snapToast('✓ Saved ' + name);
      }, 'image/png');
    } finally { URL.revokeObjectURL(url); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); _snapToast('✗ Snapshot failed (SVG load)', true); };
  img.src = url;
}

// ============================================================
// ELEMENT CLOSE-UP SNAPSHOT (V2, Feature 1)
// ------------------------------------------------------------
// elementRegion resolves an element's data-id to a padded viewBox rect
// on a given sheet — the same {x,y,w,h} shape snapshotCore's opts.region
// already accepts, so browser and headless (--element) captures share
// the whole existing region path.
// ============================================================
function elementRegion(sheetId, dataId, pad) {
  pad = (pad != null) ? pad : 40;
  try {
    const markup = buildSheet(sheetId);
    const slice = sliceBalancedGroup(markup, dataId);
    if (!slice) return null;
    const ext = measureMarkupExtent(slice, { noAnchors: true });
    if (!ext) return null;
    return { x: ext.minX - pad, y: ext.minY - pad,
             w: (ext.maxX - ext.minX) + pad * 2, h: (ext.maxY - ext.minY) + pad * 2 };
  } finally {
    // buildSheet rewrote G[] — restore the live sheet's globals.
    if (sheetId !== currentSheet) renderCurrentSheet();
  }
}

function snapshotElementPng() {
  if (!lastClickedElementId) {
    _snapToast('✗ Tap an element first, then press L', true);
    return;
  }
  const region = elementRegion(currentSheet, lastClickedElementId);
  if (!region) {
    _snapToast('✗ Element not on this sheet: ' + lastClickedElementId, true);
    return;
  }
  const safeId = String(lastClickedElementId).replace(/[^A-Za-z0-9_-]/g, '_');
  snapshotToPng({ region, suffix: '__el-' + safeId });
}

// Headless entry point — same convention as __sldDebug / __GEOM_CAP.
window.__snapshot = {
  api: 1,
  get slug() { return _sldSlug(); },
  core: snapshotCore,
  sheetIds: () => TOPO.sheets.map(s => s.sheet_id),
  element: elementRegion,   // V2: (sheetId, dataId, pad?) -> {x,y,w,h}|null
};

// ============================================================
// GEOMETRY AUDIT (V2, Feature 2)
// ------------------------------------------------------------
// window.__audit.run(sheetId) machine-checks a sheet's layout from pure
// data + markup regex (getBBox is never called, so results are identical
// in-browser and under the node:vm shim):
//   (a) label_overlap    text boxes of feeder-tag / hex-note groups
//   (b) glyph_collision  device group extents (truthful markup extents,
//                        not G[]+DIM boxes — G anchor semantics vary by
//                        renderer; measured extents don't lie)
//   (c) out_of_frame     groups far outside the device+route cluster
//   (d) feeder_crossing  feeder segments through unrelated device boxes
//   (+) layout_warning   __LAYOUT_WARNINGS emitted by this sheet's build
// Tolerances tuned so the hospital golden case reports zero findings;
// severity 'error' feeds `ok`, 'warn'/'info' are advisory.
// ============================================================
const AUDIT_TUNING = {
  label_tol: -2,      // ignore label-box overlaps up to 2px
  glyph_tol: -6,      // ignore device-extent overlaps up to 6px (shared bus dots)
  frame_pad: 400,     // allowed distance outside the device+route cluster
  feeder_shrink: 4,   // shrink device boxes before segment tests (edge grazing)
  endpoint_r: 8       // endpoint-to-box proximity that marks a box as "own device"
};
