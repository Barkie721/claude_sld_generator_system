// Union of <text> extents inside one group slice — same fixed monospace
// math as measureMarkupExtent (0.6em advance, 0.8/0.25em asc/desc).
function _auditTextExtent(slice) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  slice.replace(/<text\b([^>]*)>([\s\S]*?)<\/text>/g, (whole, attrs, content) => {
    const at = _snapAttrs(attrs);
    const x = parseFloat(at.x || 0), y = parseFloat(at.y || 0);
    const fs = parseFloat(at['font-size'] || 10);
    const w = _snapTextLen(content) * fs * 0.6;
    const anchor = at['text-anchor'] || 'start';
    const x0 = anchor === 'middle' ? x - w / 2 : (anchor === 'end' ? x - w : x);
    if (x0 < minX) minX = x0;
    if (x0 + w > maxX) maxX = x0 + w;
    if (y - fs * 0.8 < minY) minY = y - fs * 0.8;
    if (y + fs * 0.25 > maxY) maxY = y + fs * 0.25;
    return whole;
  });
  if (minX === Infinity) return null;
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// Scan markup for groups of the given classes; box each one.
// boxFn(slice) -> {x,y,w,h}|null decides how a slice is measured.
function _auditScanGroups(markup, classNames, boxFn) {
  const out = [];
  const re = new RegExp('<g\\b[^>]*class="(' + classNames.join('|') + ')"[^>]*>', 'g');
  let m;
  while ((m = re.exec(markup))) {
    const idm = /data-id="([^"]*)"/.exec(m[0]);
    const slice = _sliceBalancedGroupAt(markup, m.index);
    if (!slice) continue;
    const box = boxFn(slice);
    if (!box || !isFinite(box.x) || box.w <= 0 || box.h <= 0) continue;
    out.push({ id: (idm && idm[1]) || '?', cls: m[1], box });
  }
  return out;
}

function _auditExtentBox(slice) {
  const ext = measureMarkupExtent(slice, { noAnchors: true });
  if (!ext) return null;
  return { x: ext.minX, y: ext.minY, w: ext.maxX - ext.minX, h: ext.maxY - ext.minY };
}

// Frame-test box: transform-rooted groups (fc-pennant) get a 1px box at
// their translate anchor.
//
// ⚠️ THE REASON THIS EXISTS IS GONE, AND IT IS KEPT ANYWAY, DELIBERATELY.
// It was written because measureMarkupExtent's step-1 radius heuristic inflated
// such a group to ±max|local coord| — tolerable as a conservative snapshot
// bound, ~1400 px of false positive as an out-of-frame box. FU-0008
// (2026-08-01, rev 1.0.15) replaced that heuristic with a real child scan, so
// _auditExtentBox would now return an honest ~100 px pennant box and this
// special case is no longer NEEDED.
//
// Removing it would change which groups `out_of_frame` reports, and FU-0008 is
// a re-FRAME with no behaviour change: `out_of_frame` had to stay 0 on every
// sheet for that re-bless to mean anything, so the change-set that PROVED it is
// the wrong one to also perturb it in. The 1 px anchor box stays a conservative
// UNDER-estimate, erring toward silence rather than toward a false finding.
// Revisit on its own, with before/after finding counts.
function _auditFrameBox(slice) {
  const tr = /^<g\b[^>]*transform="translate\((-?[\d.]+),\s*(-?[\d.]+)\)/.exec(slice);
  if (tr) return { x: parseFloat(tr[1]), y: parseFloat(tr[2]), w: 1, h: 1 };
  return _auditExtentBox(slice);
}

function _auditUnionBox(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y,
           w: Math.max(a.x + a.w, b.x + b.w) - x,
           h: Math.max(a.y + a.h, b.y + b.h) - y };
}

// Liang-Barsky segment vs (shrunk) AABB — true when the segment passes
// through the box interior, not merely grazes an edge.
function _auditSegHitsBox(px, py, qx, qy, b, shrink) {
  const x0 = b.x + shrink, y0 = b.y + shrink;
  const x1 = b.x + b.w - shrink, y1 = b.y + b.h - shrink;
  if (x1 <= x0 || y1 <= y0) return false;
  let t0 = 0, t1 = 1;
  const dx = qx - px, dy = qy - py;
  const clip = (p, q) => {
    if (p === 0) return q >= 0;
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
    else       { if (r < t0) return false; if (r < t1) t1 = r; }
    return true;
  };
  return clip(-dx, px - x0) && clip(dx, x1 - px) &&
         clip(-dy, py - y0) && clip(dy, y1 - py) && t0 < t1;
}

function _auditPointNearBox(pt, b, r) {
  return pt.x >= b.x - r && pt.x <= b.x + b.w + r &&
         pt.y >= b.y - r && pt.y <= b.y + b.h + r;
}

const _r2 = v => Math.round(v * 100) / 100;
function _auditRoundBox(b) {
  return { x: _r2(b.x), y: _r2(b.y), w: _r2(b.w), h: _r2(b.h) };
}

function auditSheet(sheetId) {
  sheetId = sheetId || currentSheet;
  // Reject unknown / non-string sheet ids. buildSheet() returns a harmless
  // "no switchboard" placeholder for a bogus sheet, so without this guard an
  // audit of e.g. 'S9' would read as a genuinely clean sheet (ok:true, all 0)
  // and the harness would write a false-clean audit.json. Surface it instead.
  if (!TOPO.sheets.some(s => s.sheet_id === sheetId)) {
    return { ok: false, sheetId, error: 'unknown sheet',
      counts: { label_overlap: 0, glyph_collision: 0, out_of_frame: 0,
                feeder_crossing: 0, layout_warnings: 0, dropped_entity: 0 },
      findings: [] };
  }
  const findings = [];
  // Swap in a fresh warnings array so (1) this build's warnings are cleanly
  // attributable and (2) the audit build doesn't grow the live array.
  const savedWarnings = window.__LAYOUT_WARNINGS;
  window.__LAYOUT_WARNINGS = [];
  try {
    const markup = buildSheet(sheetId);
    const buildWarnings = window.__LAYOUT_WARNINGS;

    // ---- boxes ----
    const devBoxes = _auditScanGroups(markup, ['dev'], _auditExtentBox);
    const labelBoxes = _auditScanGroups(markup, ['feeder-tag', 'hex-note'], _auditTextExtent);

    // (a) label-label overlaps
    for (let i = 0; i < labelBoxes.length; i++) {
      for (let j = i + 1; j < labelBoxes.length; j++) {
        const A = labelBoxes[i], B = labelBoxes[j];
        if (A.id === B.id) continue;   // same element's own label parts may abut
        if (_bboxOverlaps(A.box, B.box, AUDIT_TUNING.label_tol)) {
          findings.push({ type: 'label_overlap', severity: 'warn', ids: [A.id, B.id],
            bbox: _auditRoundBox(_auditUnionBox(A.box, B.box)),
            note: `${A.cls} "${A.id}" text overlaps ${B.cls} "${B.id}" text` });
        }
      }
    }

    // (b) device glyph collisions
    for (let i = 0; i < devBoxes.length; i++) {
      for (let j = i + 1; j < devBoxes.length; j++) {
        const A = devBoxes[i], B = devBoxes[j];
        if (A.id === B.id) continue;
        if (_bboxOverlaps(A.box, B.box, AUDIT_TUNING.glyph_tol)) {
          findings.push({ type: 'glyph_collision', severity: 'error', ids: [A.id, B.id],
            bbox: _auditRoundBox(_auditUnionBox(A.box, B.box)),
            note: `device "${A.id}" glyph extent overlaps "${B.id}"` });
        }
      }
    }

    // (c) out-of-frame. No authored sheet frame exists; the meaningful
    // failure is an element orphaned far from the diagram body, so the
    // frame is the device-anchor cluster (bboxOfG) unioned with all route
    // vertices, padded by frame_pad. (A frame from the full-markup extent
    // would be vacuous — nothing can exceed its own union.)
    const routes = harvestRoutesFromMarkup(markup);
    const gb = bboxOfG(sheetId);
    let fMinX = gb.minX, fMinY = gb.minY, fMaxX = gb.maxX, fMaxY = gb.maxY;
    Object.keys(routes).forEach(id => routes[id].forEach(p => {
      if (p.x < fMinX) fMinX = p.x; if (p.x > fMaxX) fMaxX = p.x;
      if (p.y < fMinY) fMinY = p.y; if (p.y > fMaxY) fMaxY = p.y;
    }));
    const P = AUDIT_TUNING.frame_pad;
    const frame = { x: fMinX - P, y: fMinY - P, w: (fMaxX - fMinX) + 2 * P, h: (fMaxY - fMinY) + 2 * P };
    // Reuse dev boxes from the glyph pass: a non-transform-rooted 'dev' slice
    // gets the same box from _auditFrameBox as from _auditExtentBox, so only the
    // transformed/label classes still need their own frame measurement.
    const frameCandidates = devBoxes.concat(_auditScanGroups(
      markup, ['feeder-tag', 'hex-note', 'squiggle', 'fc-pennant'], _auditFrameBox));
    frameCandidates.forEach(c => {
      const b = c.box;
      if (b.x < frame.x || b.y < frame.y ||
          b.x + b.w > frame.x + frame.w || b.y + b.h > frame.y + frame.h) {
        findings.push({ type: 'out_of_frame', severity: 'warn', ids: [c.id],
          bbox: _auditRoundBox(b),
          note: `${c.cls} "${c.id}" extends beyond the content frame (pad ${P})` });
      }
    });

    // (d) feeder-through-device. Buses are excluded — breakers sit on the
    // bus by design. A feeder's own endpoint devices are excluded via
    // endpoint proximity (model: the A-6 obstacle loop).
    const feederIds = new Set();
    let fm;
    const fRe = /<g\b[^>]*class="feeder"[^>]*data-id="([^"]+)"/g;
    while ((fm = fRe.exec(markup))) feederIds.add(fm[1]);
    feederIds.forEach(id => {
      const verts = routes[id];
      if (!verts || verts.length < 2) return;
      const first = verts[0], last = verts[verts.length - 1];
      devBoxes.forEach(d => {
        if (_auditPointNearBox(first, d.box, AUDIT_TUNING.endpoint_r) ||
            _auditPointNearBox(last, d.box, AUDIT_TUNING.endpoint_r)) return;
        for (let i = 0; i + 1 < verts.length; i++) {
          if (_auditSegHitsBox(verts[i].x, verts[i].y, verts[i + 1].x, verts[i + 1].y,
                               d.box, AUDIT_TUNING.feeder_shrink)) {
            findings.push({ type: 'feeder_crossing', severity: 'error', ids: [id, d.id],
              bbox: _auditRoundBox(d.box),
              note: `feeder "${id}" crosses device "${d.id}"` });
            break;
          }
        }
      });
    });

    // (+) layout warnings from this build
    buildWarnings.forEach(w => {
      findings.push({ type: 'layout_warning', severity: 'info',
        ids: w.sheet ? [w.sheet] : [], bbox: null,
        note: (w.type || 'LAYOUT_WARNING') + (w.reason ? ': ' + w.reason : '') });
    });

    // (+) DROP REPORT (OFF-012): every expected-but-unrendered
    // entity is a hard finding — the engine must never drop silently again.
    // Sheets with full coverage (the golden case) add nothing here.
    if (manifest) {
      const cov = manifest.audit();
      cov.misses.forEach(m => {
        findings.push({ type: 'dropped_entity', severity: 'error',
          ids: [m.id], bbox: null,
          note: `DROPPED ${m.type} ${m.id} (${m.label}) on ${sheetId}` });
      });
    }

    const counts = {
      label_overlap: findings.filter(f => f.type === 'label_overlap').length,
      glyph_collision: findings.filter(f => f.type === 'glyph_collision').length,
      out_of_frame: findings.filter(f => f.type === 'out_of_frame').length,
      feeder_crossing: findings.filter(f => f.type === 'feeder_crossing').length,
      layout_warnings: findings.filter(f => f.type === 'layout_warning').length,
      dropped_entity: findings.filter(f => f.type === 'dropped_entity').length
    };
    return {
      ok: findings.every(f => f.severity !== 'error'),
      sheetId, counts, findings
    };
  } finally {
    window.__LAYOUT_WARNINGS = savedWarnings;
    // buildSheet rewrote G[]/manifest — restore the live sheet's globals.
    if (sheetId !== currentSheet) renderCurrentSheet();
  }
}

// ---- audit overlay (live DOM only — never in buildSheet markup, so
// snapshots and exports are unaffected by construction) ----
let auditOverlayOn = false;

function removeAuditOverlay() {
  try {
    const old = document.getElementById('audit-overlay');
    if (old && old.remove) old.remove();
  } catch (e) { /* headless shim */ }
}

function renderAuditOverlay(svg, findings) {
  try {
    if (!svg || typeof document.createElementNS !== 'function') return;
    removeAuditOverlay();
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('id', 'audit-overlay');
    g.setAttribute('pointer-events', 'none');
    let inner = '';
    findings.forEach(f => {
      if (!f.bbox) return;
      inner += `<rect x="${f.bbox.x}" y="${f.bbox.y}" width="${f.bbox.w}" height="${f.bbox.h}"`
             + ` fill="none" stroke="#FF3333" stroke-width="2" stroke-dasharray="6 4"/>`;
    });
    g.innerHTML = inner;
    svg.appendChild(g);
  } catch (e) { console.warn('[audit] overlay failed:', e); }
}

// Human-readable findings list in the sidebar (Render Manifest style) —
// the on-device counterpart of audit.json, so Check shows WHAT was found,
// not just how many.
const AUDIT_PANEL_MAX_ROWS = 10;
function renderAuditPanel(res) {
  const el = document.getElementById('audit-panel');
  if (!el) return;
  const sevGlyph = { error: '✗', warn: '⚠', info: 'ℹ' };
  const sevClass = { error: 'miss', warn: 'warn', info: '' };
  let html = `<b>Geometry Audit</b> — ${esc(res.sheetId)}<br>`;
  if (!res.findings.length) {
    html += `<span class="ok">✓ clean — no findings</span>`;
  } else {
    const worst = res.findings.some(f => f.severity === 'error') ? 'miss'
                : res.findings.some(f => f.severity === 'warn') ? 'warn' : 'ok';
    html += `<span class="${worst}">${res.findings.length} finding(s)</span>`;
    res.findings.slice(0, AUDIT_PANEL_MAX_ROWS).forEach(f => {
      const g = sevGlyph[f.severity] || 'ℹ';
      const c = sevClass[f.severity] || '';
      const ids = f.ids && f.ids.length ? ` [${f.ids.join(', ')}]` : '';
      html += `<br><span class="${c}">${g}</span> ${esc(f.type)}: ${esc(f.note + ids)}`;
    });
    if (res.findings.length > AUDIT_PANEL_MAX_ROWS) {
      html += `<br>+${res.findings.length - AUDIT_PANEL_MAX_ROWS} more — see audit.json`;
    }
  }
  el.innerHTML = html;
  el.style.display = '';
}

function hideAuditPanel() {
  const el = document.getElementById('audit-panel');
  if (el) el.style.display = 'none';
}

function toggleAuditOverlay() {
  auditOverlayOn = !auditOverlayOn;
  if (!auditOverlayOn) {
    removeAuditOverlay();
    hideAuditPanel();
    _snapToast('Audit overlay off');
    return;
  }
  const res = auditSheet(currentSheet);
  renderAuditOverlay(document.getElementById('sld-svg'), res.findings);
  renderAuditPanel(res);
  const boxed = res.findings.filter(f => f.bbox).length;
  _snapToast(res.findings.length
    ? `${res.ok ? '⚠' : '✗'} Audit: ${res.findings.length} finding(s), ${boxed} boxed`
    : '✓ Audit clean', !res.ok);
  console.log('[audit]', res);
}

// Headless entry point — additive, same convention as __snapshot.
window.__audit = { api: 1, run: auditSheet };

// ============================================================
// SHEET FRAME / TITLE BLOCK (Phase B) — ported VERBATIM from
// 01_inputs/templates/titleblock_template_30x42_V1_0_0.html, the CANONICAL
// title-block source (the hospital_titleblock_30x42_V1_0_0.html design of
// record is a frozen reference; its data now lives in
// 01_inputs/hospital_titleblock_data_V1_0_0.json).
// Renames vs the template — and nothing else: esc -> tbEsc, r2 -> tbR2.
// The viewer's own esc() (renderer section) does NOT escape '"' and
// coerces null differently; the template's copies are required so the
// derivation gate (04_renderer/check_titleblock_derivation.mjs) stays
// byte-equal against the design of record. Template-only pieces (its
// TOPO, TB global, buildDrawingAreaMarker, sheet assembly, snapshot
// core, init IIFE) are intentionally NOT ported.
// ============================================================

// ---- Sheet template (mirrors 07_data/normalized/sld_sheet_templates_V1_0_0.json) ----
const TPL = {
  name: 'Arch E1 — 30×42 (42in w × 30in h, landscape)',
  paper_w_in: 42.0, paper_h_in: 30.0, orientation: 'landscape',
  border_in: 0.5, content_margin_in: 0.25,
  title_block: { width_in: 5.0, side: 'right', includes_revision_block: true },
  zones: { cols: 8, rows: 6, convention: 'ASME_Y14.1' }
};

// ---- TB geometry: every px constant derived from TPL at px_per_inch.
// Phase 2 layout code composes diagrams into TB.drawingArea. ----
function computeTB(tpl, ppi) {
  const W = tpl.paper_w_in * ppi, H = tpl.paper_h_in * ppi;
  const B = tpl.border_in * ppi;              // border inset band (zone band)
  const M = tpl.content_margin_in * ppi;      // content margin inside border
  const TBW = tpl.title_block.width_in * ppi; // title strip width
  const strip = { x: W - B - TBW, y: B, w: TBW, h: H - 2 * B };
  return {
    page: { w: W, h: H },
    band: B,
    border: { x: B, y: B, w: W - 2 * B, h: H - 2 * B },
    strip,
    drawingArea: { x: B + M, y: B + M, w: strip.x - M - (B + M), h: H - 2 * B - 2 * M }
  };
}

// ---- helpers ----
function tbEsc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const tbR2 = v => Math.round(v * 100) / 100;

// Deterministic monospace fit: shrink in 2px steps to minFs, then
// ellipsize. Width math must match measureMarkupExtent (0.6em advance).
function tbFit(text, maxW, fs, minFs) {
  const s = String(text == null || text === '' ? '---' : text);
  let f = fs;
  while (f - 2 >= (minFs || fs) && s.length * f * 0.6 > maxW) f -= 2;
  const maxChars = Math.max(1, Math.floor(maxW / (f * 0.6)));
  const out = s.length <= maxChars ? s : s.slice(0, maxChars - 1) + '…';
  return { text: out, fs: f };
}

// Word-wrap to maxLines at fixed fs; last line ellipsized on overflow.
function tbWrap(text, maxW, fs, maxLines) {
  const maxChars = Math.max(1, Math.floor(maxW / (fs * 0.6)));
  const words = String(text == null || text === '' ? '---' : text).split(/\s+/);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (t.length <= maxChars) cur = t;
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    lines[maxLines - 1] = lines[maxLines - 1].slice(0, maxChars - 1) + '…';
  }
  return lines.map(l => l.length <= maxChars ? l : l.slice(0, maxChars - 1) + '…');
}

function tbText(x, y, str, fs, o) {
  o = o || {};
  return `<text x="${tbR2(x)}" y="${tbR2(y)}" font-size="${fs}" fill="${o.fill || 'var(--sld-text)'}"`
    + (o.anchor ? ` text-anchor="${o.anchor}"` : '')
    + (o.weight ? ` font-weight="${o.weight}"` : '')
    + `>${tbEsc(str)}</text>`;
}
function tbLine(x1, y1, x2, y2, sw, o) {
  o = o || {};
  return `<line x1="${tbR2(x1)}" y1="${tbR2(y1)}" x2="${tbR2(x2)}" y2="${tbR2(y2)}" stroke="${o.stroke || 'var(--sld-line)'}" stroke-width="${sw}"`
    + (o.dash ? ` stroke-dasharray="${o.dash}"` : '') + `/>`;
}
function tbRect(x, y, w, h, sw, o) {
  o = o || {};
  return `<rect x="${tbR2(x)}" y="${tbR2(y)}" width="${tbR2(w)}" height="${tbR2(h)}" fill="${o.fill || 'none'}" stroke="${o.stroke || 'var(--sld-line)'}" stroke-width="${sw}"`
    + (o.dash ? ` stroke-dasharray="${o.dash}"` : '') + (o.opacity ? ` opacity="${o.opacity}"` : '') + `/>`;
}

// ============================================================
// buildTitleBlock(tpl, meta, sheetMeta, opts) -> '<g class="sheet-frame">…</g>'
// sheetMeta: { sheet_number, title, index (1-based), count }
// This function (plus computeTB) is the Phase 2 graduation unit.
// ============================================================
function buildTitleBlock(tpl, meta, sheetMeta, opts) {
  const tb = computeTB(tpl, meta.px_per_inch || 96);
  const d = (meta.title_block || {});
  // show_placeholders=false renders missing fields blank (production
  // sheets); the default '---' flags missing data during review.
  const ph = d.show_placeholders !== false;
  const val = v => (v == null || v === '') ? (ph ? '---' : '') : String(v);
  let s = `<g class="sheet-frame">`;

  // Page-extent sentinel: invisible full-page rect so measureMarkupExtent
  // reports exactly 0,0 -> page.w,page.h and pad-0 snapshots are the page.
  s += `<rect x="0" y="0" width="${tb.page.w}" height="${tb.page.h}" fill="none" stroke="none"/>`;

  // Trim edge (inset 2px so its stroke isn't clipped by the viewBox) + border
  s += tbRect(2, 2, tb.page.w - 4, tb.page.h - 4, 1.2, { stroke: 'var(--sld-feeder)' });
  s += tbRect(tb.border.x, tb.border.y, tb.border.w, tb.border.h, 3);

  // ---- Zone ticks (ASME Y14.1): numbers right-to-left top/bottom,
  // letters bottom-to-top left/right, drawn in the border band ----
  const zc = (tpl.zones && tpl.zones.cols) || 8, zr = (tpl.zones && tpl.zones.rows) || 6;
  const zw = tb.page.w / zc, zh = tb.page.h / zr;
  for (let i = 1; i < zc; i++) {
    const x = i * zw;
    s += tbLine(x, 0, x, tb.band, 1.5, { stroke: 'var(--sld-feeder)' });
    s += tbLine(x, tb.page.h - tb.band, x, tb.page.h, 1.5, { stroke: 'var(--sld-feeder)' });
  }
  for (let i = 0; i < zc; i++) {
    const cx = i * zw + zw / 2, label = String(zc - i);
    s += tbText(cx, 30, label, 16, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    s += tbText(cx, tb.page.h - 18, label, 16, { anchor: 'middle', fill: 'var(--sld-feeder)' });
  }
  const rowLetters = 'ABCDEFGHIJ';
  for (let j = 1; j < zr; j++) {
    const y = j * zh;
    s += tbLine(0, y, tb.band, y, 1.5, { stroke: 'var(--sld-feeder)' });
    s += tbLine(tb.page.w - tb.band, y, tb.page.w, y, 1.5, { stroke: 'var(--sld-feeder)' });
  }
  for (let j = 0; j < zr; j++) {
    const cy = j * zh + zh / 2 + 6, label = rowLetters[zr - 1 - j];
    s += tbText(tb.band / 2, cy, label, 16, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    s += tbText(tb.page.w - tb.band / 2, cy, label, 16, { anchor: 'middle', fill: 'var(--sld-feeder)' });
  }

  // ---- Plot stamp, bottom zone band. Width-capped at 180px so it always
  // clears the zone-8 digit centered at x=252. ----
  {
    const stampSrc = d.plot_stamp || (val(sheetMeta.sheet_number) + ' · ' + val(d.issue_date || meta.created_date));
    const stamp = tbFit(stampSrc, 180, 10, 10);
    s += tbText(56, tb.page.h - tb.band / 2 + 4, stamp.text, 10, { fill: 'var(--sld-feeder)' });
  }

  // ---- Title strip frame. Cell y-boundaries (fixed heights; the general
  // notes cell flexes to absorb the remainder so edits self-balance). ----
  const X = tb.strip.x, W = tb.strip.w, Y0 = tb.strip.y, Y1 = Y0 + tb.strip.h;
  const CX = X + W / 2, LX = X + 16, RX = X + W - 16;
  const hFirm = 240, hSeal = 336, hRev = 368, hProj = 480, hMgmt = 288, hTitle = 192, hNum = 240;
  const hNotes = tb.strip.h - (hFirm + hSeal + hRev + hProj + hMgmt + hTitle + hNum);
  const yFirm = Y0, ySeal = yFirm + hFirm, yRev = ySeal + hSeal, yNotes = yRev + hRev,
        yProj = yNotes + hNotes, yMgmt = yProj + hProj, yTitle = yMgmt + hMgmt, yNum = yTitle + hTitle;
  s += tbLine(X, Y0, X, Y1, 3);   // strip left edge (heavy, like the border)
  // Major cell separators: heavier than internal rules for hierarchy.
  [ySeal, yRev, yNotes, yProj, yMgmt, yTitle, yNum].forEach(y => { s += tbLine(X, y, X + W, y, 2.5); });

  // ---- Cell 1: firm / logo (stack vertically centered) ----
  {
    const name = tbFit(val(d.firm_name), W - 32, 24, 18);
    const addrs = (d.firm_address_lines || []).slice(0, 3);
    const lines = [];
    lines.push({ off: 0, t: name.text, fs: name.fs, o: { anchor: 'middle', weight: 700 } });
    lines.push({ off: 30, t: tbFit(val(d.firm_tagline), W - 32, 12, 12).text, fs: 12, o: { anchor: 'middle', fill: 'var(--sld-feeder)' } });
    let off = 74;
    addrs.forEach(a => { lines.push({ off, t: tbFit(a, W - 32, 13, 13).text, fs: 13, o: { anchor: 'middle' } }); off += 24; });
    if (d.firm_phone) { lines.push({ off, t: tbFit(d.firm_phone, W - 32, 13, 13).text, fs: 13, o: { anchor: 'middle' } }); off += 24; }
    const lastOff = lines[lines.length - 1].off;
    const stackH = lastOff + 23;               // 19 first-line ascent + ~4 last-line descent
    const b0 = yFirm + (hFirm - stackH) / 2 + 19;
    lines.forEach(l => { s += tbText(CX, b0 + l.off, l.t, l.fs, l.o); });
  }

  // ---- Cell 2: PE seal (square + caption centered as one group) ----
  {
    const sq = 240, capGap = 34;
    const groupH = sq + capGap + 3;
    const sy = ySeal + (hSeal - groupH) / 2, sx = CX - sq / 2;
    s += tbRect(sx, sy, sq, sq, 1.2, { stroke: 'var(--sld-feeder)', dash: '6,4' });
    s += tbText(CX, sy + sq / 2 - 12, 'NOT FOR', 20, { anchor: 'middle', weight: 700, fill: 'var(--sld-em)' });
    s += tbText(CX, sy + sq / 2 + 20, 'CONSTRUCTION', 20, { anchor: 'middle', weight: 700, fill: 'var(--sld-em)' });
    s += tbText(CX, sy + sq + capGap, 'PROFESSIONAL ENGINEER SEAL', 12, { anchor: 'middle', fill: 'var(--sld-feeder)' });
  }

  // ---- Cell 3: revision table — REVISIONS caption band, header row,
  // 6 ruled rows filled bottom-up (rev 1 in the bottom row) ----
  {
    const yCap = yRev, yHead = yRev + 40, yRows = yRev + 80;
    const cNo = X + 48, cDate = X + 144;   // col edges: NO 48px, DATE 96px, DESC 336px
    s += tbText(CX, yCap + 27, 'REVISIONS', 14, { anchor: 'middle', weight: 700 });
    s += tbLine(X, yHead, X + W, yHead, 1.2);
    s += tbText(X + 24, yHead + 27, 'NO', 14, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    s += tbText((cNo + cDate) / 2, yHead + 27, 'DATE', 14, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    s += tbText((cDate + X + W) / 2, yHead + 27, 'DESCRIPTION', 14, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    s += tbLine(X, yRows, X + W, yRows, 1.2);
    for (let i = 1; i < 6; i++) s += tbLine(X, yRows + i * 48, X + W, yRows + i * 48, 1.2);
    // Column rules span header + rows only (caption band stays clear).
    s += tbLine(cNo, yHead, cNo, yNotes, 1.2);
    s += tbLine(cDate, yHead, cDate, yNotes, 1.2);
    (d.revisions || []).slice(0, 6).forEach((rv, i) => {
      const ry = yRows + (5 - i) * 48 + 31;   // bottom-up: rev 1 in the bottom row
      s += tbText(X + 24, ry, val(rv.no), 14, { anchor: 'middle' });
      s += tbText((cNo + cDate) / 2, ry, tbFit(val(rv.date), 88, 12, 12).text, 12, { anchor: 'middle' });
      s += tbText(cDate + 8, ry, tbFit(val(rv.description), W - 152, 12, 12).text, 12);
    });
  }

  // ---- Cell 4: general notes (flex height) ----
  {
    s += tbText(LX, yNotes + 32, 'GENERAL NOTES', 14, { weight: 700 });
    const notes = (d.notes || []);   // template: no auto NEC note — cell starts empty
    let ny = yNotes + 64;
    const maxY = yProj - 14;
    notes.forEach((n, i) => {
      const lines = tbWrap(n, W - 60, 13, 4);
      lines.forEach((l, k) => {
        if (ny > maxY) return;
        s += tbText(LX + (k === 0 ? 0 : 28), ny, (k === 0 ? (i + 1) + '. ' : '') + l, 13);
        ny += 22;
      });
      ny += 6;
    });
  }

  // ---- Cell 5: project block (stack vertically centered) ----
  {
    const nameLines = tbWrap(val(meta.project_name), W - 32, 20, 3);
    const addrs = (d.project_address_lines || []).slice(0, 3);
    const lines = [];
    lines.push({ off: 0, t: 'CLIENT', fs: 12, o: { fill: 'var(--sld-feeder)' } });
    lines.push({ off: 30, t: tbFit(val(d.client), W - 32, 16, 12).text, fs: 16, o: { weight: 700 } });
    lines.push({ off: 74, t: 'PROJECT', fs: 12, o: { fill: 'var(--sld-feeder)' } });
    let off = 106;
    nameLines.forEach(l => { lines.push({ off, t: l, fs: 20, o: { weight: 700 } }); off += 28; });
    off += 6;
    addrs.forEach(a => { lines.push({ off, t: tbFit(a, W - 32, 13, 13).text, fs: 13, o: {} }); off += 22; });
    const lastOff = lines[lines.length - 1].off;
    const stackH = lastOff + 14;               // 10 first-line ascent + ~4 last-line descent
    const b0 = yProj + (hProj - stackH) / 2 + 10;
    lines.forEach(l => { s += tbText(LX, b0 + l.off, l.t, l.fs, l.o); });
  }

  // ---- Cell 6: management grid (6 label/value rows) ----
  {
    const cMid = X + 176;
    s += tbLine(cMid, yMgmt, cMid, yTitle, 1.2);
    for (let i = 1; i < 6; i++) s += tbLine(X, yMgmt + i * 48, X + W, yMgmt + i * 48, 1.2);
    const rows = [
      ['DRAWN BY', val(d.drawn_by || meta.created_by)],
      ['CHECKED BY', val(meta.checked_by)],
      ['APPROVED BY', val(d.approved_by)],
      ['ISSUE DATE', val(d.issue_date || meta.created_date)],
      ['PROJECT NO', val(meta.project_number)],
      ['SCALE', val(d.scale || 'NONE')]
    ];
    rows.forEach((rw, i) => {
      const ry = yMgmt + i * 48 + 30;
      s += tbText(LX, ry, rw[0], 12, { fill: 'var(--sld-feeder)' });
      s += tbText(cMid + 12, ry, tbFit(rw[1], W - 192 - 24, 14, 12).text, 14);
    });
  }

  // ---- Cell 7: sheet title ----
  {
    const lines = tbWrap(String(val(sheetMeta.title)).toUpperCase(), W - 32, 20, 3);
    const lineH = 30, blockTop = yTitle + hTitle / 2 - (lines.length - 1) * lineH / 2 + 7;
    lines.forEach((l, i) => { s += tbText(CX, blockTop + i * lineH, l, 20, { anchor: 'middle', weight: 700 }); });
  }

  // ---- Cell 8: sheet number (pair nudged up for optical centering) ----
  {
    const num = tbFit(val(sheetMeta.sheet_number), W - 48, 96, 56);
    s += tbText(CX, yNum + 134, num.text, num.fs, { anchor: 'middle', weight: 700, fill: 'var(--sld-line)' });
    if (sheetMeta.index && sheetMeta.count) {
      s += tbText(CX, yNum + 190, 'SHEET ' + sheetMeta.index + ' OF ' + sheetMeta.count, 16, { anchor: 'middle', fill: 'var(--sld-feeder)' });
    }
  }

  s += `</g>`;
  return s;
}

// ============================================================
// PAGE COMPOSITION (Phase B2) — pageCore(sheetId, opts)
// composes one sheet's diagram into the Arch E1 page: canvas background,
// the diagram wrapped in a single translate+scale group, then the sheet
// frame + title block drawn LAST (overplots any residual extent-scan
// overshoot at the drawing-area edge). The layout engine is NEVER
// re-anchored — golden hospital geometry stays frozen; composition is a
// pure page-build-time wrapper transform:
//   target  = TB.drawingArea inset by PAGE_INNER_PAD per side
//   s       = min(1, target.w/extW, target.h/extH) floored to 4 decimals
//             (fit guaranteed despite rounding; capped at 1 so a small
//             diagram never balloons its line weights/text relative to
//             the fixed-size title block)
//   tx, ty  = target origin + centering offset − s·extent.min
// opts: { theme, meta, rsvgSafe } — opts.meta is a metadata overlay
// (e.g. 01_inputs/hospital_titleblock_data_V1_0_0.json .metadata_overlay)
// shallow-merged over TOPO.metadata, overlay wins per key.
// Result shape matches snapshotCore plus a `transform: {s,tx,ty}` record.
// ============================================================
const PAGE_INNER_PAD = 24;   // 0.25in inside drawingArea — absorbs the regex extent scan's small overshoots

function pageCore(sheetId, opts) {
  opts = opts || {};
  const theme = opts.theme ||
    ((document.documentElement.getAttribute && document.documentElement.getAttribute('data-theme')) === 'light' ? 'light' : 'dark');
  const warnings = [];
  try {
    const markup = buildSheet(sheetId);
    const coverage = manifest ? manifest.audit() : null;
    if (coverage && !coverage.ok) {
      warnings.push(`coverage: ${coverage.rendered}/${coverage.total} rendered; misses: `
        + coverage.misses.slice(0, 5).map(mm => mm.id).join(', '));
    }
    if (/NO RENDERER/.test(markup)) warnings.push('markup contains NO RENDERER fallback boxes');

    const meta = Object.assign({}, TOPO.metadata, opts.meta || {});
    // Auto NEC note — the ONE behavioral line the hospital design of record
    // adds over the canonical template. It lives here in the compose layer
    // (engine policy, keyed on nec_edition presence) so buildTitleBlock
    // stays template-verbatim and data files never carry a derivable string.
    const dTB = meta.title_block || {};
    const tbMeta = Object.assign({}, meta, {
      title_block: Object.assign({}, dTB, {
        notes: (meta.nec_edition ? ['DESIGNED PER NEC ' + meta.nec_edition + '.'] : []).concat(dTB.notes || [])
      })
    });

    const tb = computeTB(TPL, meta.px_per_inch || 96);
    const target = {
      x: tb.drawingArea.x + PAGE_INNER_PAD, y: tb.drawingArea.y + PAGE_INNER_PAD,
      w: tb.drawingArea.w - 2 * PAGE_INNER_PAD, h: tb.drawingArea.h - 2 * PAGE_INNER_PAD
    };

    const extent = measureMarkupExtent(markup);
    let composed = '', transform = null;
    if (extent) {
      const extW = Math.max(1, extent.maxX - extent.minX), extH = Math.max(1, extent.maxY - extent.minY);
      const s = Math.min(1, Math.floor(Math.min(target.w / extW, target.h / extH) * 1e4) / 1e4);
      const tx = tbR2(target.x + (target.w - s * extW) / 2 - s * extent.minX);
      const ty = tbR2(target.y + (target.h - s * extH) / 2 - s * extent.minY);
      transform = { s, tx, ty };
      composed = `<g class="composed-sld" transform="translate(${tx}, ${ty}) scale(${s})">` + markup + `</g>`;
    } else {
      warnings.push('FATAL: empty markup — no extent computable');
    }

    const sheets = TOPO.sheets || [];
    const idx = sheets.findIndex(sh => sh.sheet_id === sheetId);
    const sheet = idx >= 0 ? sheets[idx] : {};
    const sheetMeta = { sheet_number: sheet.sheet_number, title: sheet.title, index: idx + 1, count: sheets.length };

    // frame kept raw (var() refs unresolved) — byte-compared against the
    // design of record by 04_renderer/check_titleblock_derivation.mjs.
    const frame = buildTitleBlock(TPL, tbMeta, sheetMeta, {});
    const page = composed + frame;

    const vars = parseThemeVars(_snapCssText())[theme] || {};
    let body = page.replace(/var\((--[\w-]+)\)/g, (mm, name) => (vars[name] !== undefined ? vars[name] : mm));
    if (/var\(/.test(body)) {
      const left = [...new Set(body.match(/var\((--[\w-]+)\)/g) || [])];
      warnings.push('FATAL: unresolved CSS variables: ' + left.join(', '));
    }
    if (opts.rsvgSafe) body = _snapInlineUnderlines(body);

    const vb = { x: 0, y: 0, w: tb.page.w, h: tb.page.h };
    const bg = vars['--canvas-bg'] || '#1c2438';
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}"`
      + ` width="${Math.ceil(vb.w)}" height="${Math.ceil(vb.h)}" font-family="'Courier New',monospace">`
      + `<rect x="0" y="0" width="${_r2(vb.w)}" height="${_r2(vb.h)}" fill="${bg}"/>`
      + body + `</svg>`;
    return { svg, viewBox: vb, coverage, warnings, theme, sheetId, transform, frame };
  } finally {
    // Restore live view + G[]/manifest globals — same contract as
    // snapshotCore (exportGeometry pattern).
    if (sheetId !== currentSheet) renderCurrentSheet();
  }
}
window.__snapshot.page = pageCore;   // additive key; __snapshot.api stays 1

// ============================================================
// INIT
// ============================================================
(function init() {
  applyStoredTheme();       // apply theme BEFORE first render
  // Sheet buttons are data-driven from TOPO.sheets (chrome fix —
  // they were hardcoded to S1/S2 and a 4-sheet topology's continuation
  // sheets were invisible in the browser). Generated BEFORE the .sheet-btn
  // click wiring below so the handlers attach to every button. Display
  // strips the boilerplate "SINGLE-LINE DIAGRAM —" title prefix.
  const _shList = document.getElementById('sheet-list');
  if (_shList) {
    _shList.innerHTML = TOPO.sheets.map((s, i) =>
      `<button type="button" class="sheet-btn${i === 0 ? ' active' : ''}" data-sheet="${esc(s.sheet_id)}">` +
      `<span class="sh-num">${esc(s.sheet_number || s.sheet_id)}</span>` +
      `<span class="sh-desc">${esc(String(s.title || '').replace(/^SINGLE-LINE DIAGRAM\s*[—-]\s*/i, ''))}</span>` +
      `</button>`).join('');
  }
  // Fix 4: Run topology validation once. Result is consulted by
  // renderCurrentSheet() on every render to keep the render-coverage
  // panel in sync (e.g. after theme toggle re-render).
  window.__topologyIssues = validateTopology();
  const st = document.getElementById('stats-body');
  st.innerHTML = `
    <div class="stat-row"><span>Devices</span><span class="val">${TOPO.devices.length}</span></div>
    <div class="stat-row"><span>Routed</span><span class="val">${TOPO.routed_elements.length}</span></div>
    <div class="stat-row"><span>Annotations</span><span class="val">${TOPO.annotations.length}</span></div>
    <div class="stat-row"><span>Switchboards</span><span class="val">${TOPO.switchboards.length}</span></div>
    <div class="stat-row"><span>Cross-sheet</span><span class="val">${TOPO.cross_sheet_refs.length}</span></div>`;
  // Data-driven branding from TOPO.metadata (display only — no geometry).
  // Graceful fallbacks so a missing field never leaves stale placeholder text.
  const M = TOPO.metadata || {};
  document.getElementById('app-heading').textContent = (M.heading ? M.heading + ' SLD' : (M.project_name || 'SLD'));
  document.getElementById('app-version').textContent = M.schema_version ? 'v' + M.schema_version : '';
  document.getElementById('project-facts').innerHTML =
    esc(M.project_name || '') + (M.facts && M.facts.length ? '<br>' + M.facts.map(esc).join('<br>') : '');
  // Wire up control buttons (replaces inline onclick handlers).
  document.querySelectorAll('.sheet-btn').forEach(b =>
    b.addEventListener('click', () => {
      selectSheet(b.dataset.sheet);
      // On the narrow layout the drawer covers the canvas — close it so
      // the user immediately sees the sheet they picked.
      if (isNarrow()) setDrawerOpen(false);
    }));
  document.getElementById('clip-clear').addEventListener('click', clearClipboard);
  document.getElementById('zoom-in-btn').addEventListener('click', zoomIn);
  document.getElementById('zoom-out-btn').addEventListener('click', zoomOut);
  document.getElementById('fit-btn').addEventListener('click', fitView);
  document.getElementById('reset-btn').addEventListener('click', resetView);
  document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
  document.getElementById('export-geom-btn').addEventListener('click', exportGeometry);
  document.getElementById('snapshot-btn').addEventListener('click', () => snapshotToPng());
  // Composed-page PNG download (chrome-only). Defined INSIDE the init IIFE so
  // gen_engine.mjs strips it — the compiled engine module stays byte-identical.
  // Mirrors snapshotToPng's raster/download tail but sources the SVG from
  // pageCore (diagram + title-block frame). No `meta` -> pageCore falls back to
  // TOPO.metadata (renders the title-block placeholders when fields are absent).
  function pageToPng() {
    const r = pageCore(currentSheet, {});
    const fatal = r.warnings.find(w => w.indexOf('FATAL') === 0);
    if (fatal) { _snapToast('✗ ' + fatal, true); console.error('[page]', r.warnings); return; }
    const MAX_DIM = 8192, MAX_PIXELS = 33e6;
    const scale = Math.min(2, MAX_DIM / Math.max(r.viewBox.w, r.viewBox.h),
                           Math.sqrt(MAX_PIXELS / (r.viewBox.w * r.viewBox.h)));
    const pw = Math.ceil(r.viewBox.w * scale), ph = Math.ceil(r.viewBox.h * scale);
    const url = URL.createObjectURL(new Blob([r.svg], { type: 'image/svg+xml' }));
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = pw; canvas.height = ph;
        canvas.getContext('2d').drawImage(img, 0, 0, pw, ph);
        canvas.toBlob(blob => {
          if (!blob) { _snapToast('✗ Page PNG failed (canvas memory?)', true); return; }
          const name = `${_sldSlug()}_${r.sheetId}_${r.theme}__page_${pw}x${ph}.png`;
          _snapDownloadBlob(blob, name);
          _snapToast('✓ Saved ' + name);
        }, 'image/png');
      } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); _snapToast('✗ Page PNG failed (SVG load)', true); };
    img.src = url;
  }
  document.getElementById('page-dl-btn').addEventListener('click', () => pageToPng());
  document.getElementById('element-snap-btn').addEventListener('click', () => snapshotElementPng());
  document.getElementById('audit-btn').addEventListener('click', () => toggleAuditOverlay());
  // Fix 5: Help overlay close button (also closable via Esc; clicks
  // outside the card also dismiss the overlay).
  const helpOv = document.getElementById('help-overlay');
  const helpClose = document.getElementById('help-overlay-close');
  if (helpClose) helpClose.addEventListener('click', hideHelpOverlay);
  if (helpOv) helpOv.addEventListener('click', e => { if (e.target === helpOv) hideHelpOverlay(); });
  // v1.1.0 — sidebar drawer/rail toggle, backdrop, collapsible sections,
  // and legend layer toggles.
  document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-backdrop').addEventListener('click', () => setDrawerOpen(false));
  const ui = loadUi();
  if (ui.railCollapsed && !isNarrow()) {
    document.getElementById('app').classList.add('sidebar-hidden');
    document.getElementById('sidebar-toggle').setAttribute('aria-expanded', 'false');
  }
  document.querySelectorAll('.sidebar-section[data-sec]').forEach(sec => {
    if (ui.sections && ui.sections[sec.dataset.sec]) {
      sec.classList.add('collapsed');
      const head = sec.querySelector('.sec-head');
      if (head) head.setAttribute('aria-expanded', 'false');
    }
  });
  // Delegated: collapse/expand a section when its header is tapped.
  document.addEventListener('click', e => {
    const head = e.target.closest && e.target.closest('.sec-head');
    if (!head) return;
    const sec = head.closest('.sidebar-section');
    if (!sec) return;
    const collapsed = sec.classList.toggle('collapsed');
    head.setAttribute('aria-expanded', String(!collapsed));
    const u = loadUi(), s = u.sections || {};
    s[sec.dataset.sec || ''] = collapsed;
    saveUi({ sections: s });
  });
  // Delegated: legend layer checkboxes.
  document.addEventListener('change', e => {
    const cb = e.target;
    if (!cb.classList || !cb.classList.contains('layer-cb')) return;
    const u = loadUi(), layers = u.layers || {};
    layers[cb.dataset.layer] = cb.checked;
    saveUi({ layers: layers });
    applyLayerToggles();
  });
  // Fold posture change (cover <-> inner screen): close any open drawer so
  // it can't strand as a fixed overlay, and restore the persisted rail
  // state for the wide layout.
  if (window.matchMedia) {
    const mq = window.matchMedia('(max-width:720px)');
    const onLayoutChange = () => {
      setDrawerOpen(false);
      document.getElementById('app').classList.toggle(
        'sidebar-hidden', !mq.matches && !!loadUi().railCollapsed);
    };
    if (mq.addEventListener) mq.addEventListener('change', onLayoutChange);
    else if (mq.addListener) mq.addListener(onLayoutChange);
  }
  // Render initial sheet via selectSheet so document.title gets set on first load.
  selectSheet(currentSheet);
  bindClickToCopy();       // enable click-to-copy on device groups
  renderClipboardList();   // initialize empty clipboard panel
})();
</script>
</body>
