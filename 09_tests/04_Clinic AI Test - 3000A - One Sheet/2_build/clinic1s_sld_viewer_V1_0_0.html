      }
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L2-2') {
      // Chain B head: breaker → transformer primary_in
      // Reserve xfmr_ground_clearance below TX for the ground symbol stack
      // txY = frozen legacy TX-anchor row (anchored on secBusY − cb_slot_h,
      // not the CB box top, so the row survives a CB box retune). The TX
      // body bottom (primary_in, feeder terminus) is pinned to txBotY; the
      // anchor rides the body height.
      const txY = (secBusY - DIM.cb_slot_h) - DIM.tag_gap - DIM.equip_gap - DIM.xfmr_ground_clearance;
      const txBotY = txY + DIM.xfmr_slot_S;  // primary_in row (frozen)
      G[dstDev.id] = { x: bx - symbolWidth(dstDev)/2, y: txBotY - bodyHeight(dstDev) };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${bx}" y1="${topY}" x2="${bx}" y2="${txBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      renderedIds.add(dstDev.id);
      // Secondary → panel
      const secR1 = TOPO.routed_elements.find(r2 => r2.edge_type === 'R-1' && r2.start && r2.start.device_id === dstDev.id && r2.start.port === 'secondary_out');
      if (secR1 && secR1.end) {
        const secP = devMap[secR1.end.device_id];
        if (secP && secP.sheet_id === sheetId) {
          // Secondary panel feed_bottom pinned to the frozen row (gaps above
          // the legacy TX-anchor row txY); anchor rides the box height. The
          // secondary feeder runs from the TX body TOP (its placed anchor).
          const spBotY = txY - DIM.tag_gap - DIM.equip_gap - DIM.equip_stub;
          const spY = spBotY - symbolHeight(secP);
          G[secP.id] = { x: bx - symbolWidth(secP)/2, y: spY };
          svg += renderDevice(secP, G[secP.id]);
          svg += `<g class="feeder" data-id="${secR1.id}" style="cursor:pointer"><line x1="${bx}" y1="${G[dstDev.id].y}" x2="${bx}" y2="${spBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
          renderedIds.add(secP.id);
          svg += renderR1Tags(secR1, bx, txY - DIM.equip_gap / 2, 'right');  // midpoint of TX→panel zone, was magic txY-30
          renderedIds.add(secR1.id);
        }
      }
    } else if (dstDev.node_type === 'L2-6') {
      // Chain E: breaker → SPD line_in
      const lineInY = secBusY - DIM.chain_h_min;  // ≡ legacy topY − chain_h_min + cb_height
      // SPD box bottom-center pinned to the line_in row (was literal 31/26).
      G[dstDev.id] = { x: bx - symbolWidth(dstDev)/2, y: lineInY - symbolHeight(dstDev) };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${bx}" y1="${topY}" x2="${bx}" y2="${lineInY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L3-1') {
      // Chain D: breaker → Fire Pump (motor + starter box)
      // OFF-019: port-anchor conformance + OFF-016 reach, mirroring Chain A
      // above and Chain F below (both already corrected for this exact defect).
      //
      // RENDER['L3-1'] treats g as the TL of the MEASURED 24×32 motor family, so
      // the load_in port is g + (12, 32) = box bottom-centre. The legacy code
      // here set G.x = bx (bbox TL ON the feeder → the symbol sat 12 px EAST of
      // it, feeder tangent to its left edge) and stopped the feeder at eqY − 26,
      // i.e. 26 px ABOVE the box top — so the run passed the symbol on its left
      // and terminated in empty space, never touching load_in. Observed on the
      // 3-story clinic: 4FP-1-A box x 770-794 against a feeder at x 770, the
      // feeder ending at y 4208 with the box at 4234-4266.
      //
      // The golden never exercised this branch — its only L3-1 (E4FP-1-A) is fed
      // from an ATS load_out (F-053), which goes through the already-corrected
      // placeATSsAndGenerator path. That is why the bug outlived OFF-013, and it
      // is why this change is gate-inert: no golden edge reaches here.
      //
      // Now: the box centres on the feeder, the feeder terminates ON load_in,
      // and the landing row is the shared chain terminus (secBusY − chain_h_min)
      // — the same row every Chain-A panel lands on — instead of the ad-hoc −12.
      // chain_dst_x_offset {dx, jog_y} now reaches Chain D as well, so a fire
      // pump can fan out of its breaker instead of running plumb up the lineup.
      // OFF-022 (rev 1.0.11): FIRE-PUMP BREAKER EXIT PORT.
      // `topY = secBusY − cb_height` assumes an upright breaker sitting on the
      // SECONDARY bus. A fire-pump breaker taps the MAIN bus per NEC 695.4(B) and
      // is drawn flip_vertical (RENDER['L2-1'] flip = −1: link, nodes and arc hang
      // BELOW the bus dot), so its far-end port is at busY + cb_height, not
      // secBusY − cb_height. Starting the run at topY put it 21 px below the glyph
      // on the 9-story hospital and drew the feeder straight back up through
      // CB-FP's arc and nodes.
      //
      // The correct shape already exists for the cross-sheet case (the r-019-s1
      // branch above): leave the flipped port going DOWN a short stub, jog WEST
      // clear of the glyph, then rise. West is the free side — the arc bulges to
      // cx − cb_arc_offset (13 px) and the amps/poles text sits at cx + 12, so a
      // 40 px west jog clears the ink by 27 px. Reuse the same two literals here
      // and land the rise directly on the pump so no top return jog is needed:
      // the pump column moves west with the riser rather than the riser jogging
      // back east into it.
      //
      // GOLDEN-INERT: the only device that ever carries flip_vertical is the
      // fire-pump breaker (set at the fpSec block in buildSheet), and the golden's
      // CB-FP feeds CROSS-SHEET — its r-019-s1 returns from the isCrossSheetSource
      // branch long before Chain D. No golden edge reaches this line with a
      // flipped source.
      const _fpSrcG   = G[r.start.device_id] || {};
      const _fpFlip   = !!_fpSrcG.flip_vertical;
      const FP_JOG_DX  = 40;   // westward jog, matches the r-019-s1 route
      const FP_SHORT_STUB = 20;
      // Far-end port of the breaker glyph: busY − flip*cb_height. cb_height
      // (44.37) is exactly link + r_bus + r_node + node_spacing + r_node, i.e.
      // bus dot to the outer edge of the far node — the same quantity the
      // r-019-s1 branch spells out term by term.
      const _fpExitY  = _fpFlip ? (_fpSrcG.y + DIM.cb_height) : topY;
      const _fpDstX  = _fpFlip ? (bx - FP_JOG_DX + _cdx) : (bx + _cdx);   // OFF-016
      const _fpTermY = secBusY - DIM.chain_h_min;         // load_in port row
      G[dstDev.id] = { x: _fpDstX - symbolWidth(dstDev)/2, y: _fpTermY - symbolHeight(dstDev) };
      svg += renderDevice(dstDev, G[dstDev.id]);
      if (_fpFlip) {
        // down off the flipped port → west past the glyph → up to load_in.
        const _fpJogBotY = _fpExitY + FP_SHORT_STUB;
        svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${bx},${_fpExitY} ${bx},${_fpJogBotY} ${_fpDstX},${_fpJogBotY} ${_fpDstX},${_fpTermY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
        _chainTagX = _fpDstX;
        _chainTagY = (_fpJogBotY + _fpTermY) / 2;
      } else if (_cdx === 0) {
        svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${bx}" y1="${topY}" x2="${bx}" y2="${_fpTermY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      } else {
        svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${bx},${topY} ${bx},${_cdxJogY} ${_fpDstX},${_cdxJogY} ${_fpDstX},${_fpTermY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
        _chainTagX = _fpDstX;
        _chainTagY = (_cdxJogY + _fpTermY) / 2;
      }
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L3-3') {
      // Chain F: breaker → Equipment Connection
      // OFF-013: port-anchor conformance, mirroring the ATS load_out L3-3 branch
      // in placeATSsAndGenerator (which was corrected for this exact defect).
      // RENDER['L3-3'] treats g as the TL of a 54×54 bbox, so circle center =
      // g + (27,27) and the load_in port = g + (27,54) = circle bottom-center.
      // The legacy code here set G.x = bx (bbox TL ON the feeder → circle center
      // 27 px EAST of it, feeder tangent to the circle's left edge) and stopped
      // the feeder at G.y (the bbox TOP — 54 px past load_in, so the line was
      // drawn straight through the circle and out the other side). Observed on
      // the 5-story hospital's BOILER-1: symbol centre x 2247 against a feeder
      // at x 2220.
      // Now centred: circle center = bx, load_in lands on the feeder top, and
      // the feeder terminus Y is unchanged so the chain row does not move.
      const _r33 = 27;                          // circle radius (54 px bbox)
      const fyTop = secBusY - DIM.chain_h_min;  // ≡ legacy eqY — the load_in port Y
      G[dstDev.id] = { x: bx - _r33, y: fyTop - 2 * _r33 };
      svg += renderDevice(dstDev, G[dstDev.id]);
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${bx}" y1="${topY}" x2="${bx}" y2="${fyTop}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      renderedIds.add(dstDev.id);
    } else if (dstDev.node_type === 'L2-3' && r.end.port === 'source1_in' && G[dstDev.id]) {
      // OFF-032: same-sheet NORMAL source (combined NP+EM sheet). Lands on the
      // source1 port. Each feeder gets its own lane in a band ABOVE the source2
      // tier band (nearest the ATS row), which the source2 jogs are pushed below
      // (see _s1LaneCount). The left-most ATS takes the lane nearest the ATS row,
      // so its run ends before it can cross a later one's riser; what remains is
      // one crossing per source2 drop the run passes under, which is
      // topologically unavoidable with both ports on the ATS bottom edge.
      // Golden-inert: no golden breaker feeds an ATS on its own sheet.
      const atsS1X = G[dstDev.id].x + ATS_PORT_S1_X;
      const atsS1Y = G[dstDev.id].y + boxH('L2-3');
      const _s1 = sheetR1s.filter(x => x.end && x.end.port === 'source1_in' && x.start
        && devMap[x.end.device_id] && G[x.end.device_id] && devMap[x.start.device_id]
        && devMap[x.start.device_id].sheet_id === sheetId)
        .sort((a, b) => G[a.end.device_id].x - G[b.end.device_id].x);
      const laneY = atsS1Y + 60 + _s1.indexOf(r) * JOG_TIER_SPACING;
      svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${bx},${topY} ${bx},${laneY} ${atsS1X},${laneY} ${atsS1X},${atsS1Y}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      svg += renderR1Tags(r, bx, topY - DIM.tag_gap, 'right');
      renderedIds.add(r.id);
      return;
    } else if (dstDev.node_type === 'L2-3') {
      // Chain C on S2: breaker → ATS source2_in (normal-side feed on NP sheet handled as cross-sheet)
      // Only draw if ATS is on this sheet (which it is for S2 hospital)
      if (G[dstDev.id]) {
        // ATS source2_in end position — spec port (105, 200) relative to ATS top-left
        // Literal 60 (symbol-internal stub) NOT DIM.ats_stub_bottom (SP-scaled composition gap)
        // source2 lands on the family-box bottom edge (no external
        // stub);.20: port x FAMILY-MEASURED via ATS_PORT_S2_X (was a
        // proportional estimate — the §14 per-port follow-up landed for ATS).
        const atsSrc2X = G[dstDev.id].x + ATS_PORT_S2_X;
        const atsSrc2Y = G[dstDev.id].y + boxH('L2-3');
        // PATCH (A+B): Aligned feeders (breaker X == port X) render as
        // straight verticals, bypassing the tier band. Non-aligned feeders use
        // direction-aware tier assignment computed in the pre-pass.
        if (atsSrc2Aligned[r.id]) {
          // Straight vertical — port X == breaker X, no jog needed.
          // Single line from breaker line_in up to source2 port.
          svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><line x1="${bx}" y1="${topY}" x2="${bx}" y2="${atsSrc2Y}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
        } else {
          const tierIdx = (atsSrc2Tiers[r.id] !== undefined) ? atsSrc2Tiers[r.id] : 0;
          const TIER_CLEARANCE = 60;
          // OFF-032: below the same-sheet source1 lane band, when there is one
          // (0 on every golden sheet).
          const jogTierBase = atsSrc2Y + TIER_CLEARANCE + _s1LaneCount * JOG_TIER_SPACING;
          let jogY = jogTierBase + tierIdx * JOG_TIER_SPACING;
          // Per-feeder jogY south-shift values (E-502 only).
          // r-047 (CB-03-EM → E4A-1-A.source2) horizontal jog shifts +80 px
          // south per design direction.
          // Vertical endpoints at breaker line_in and ATS source2_in stay fixed —
          // only the horizontal crossover drops. Map is keyed by feeder id;
          // extend if additional overrides are needed.
          // r-042 is intentionally absent here — it takes tier 0
          // (smallest jog) and must stay above the E4A horizontals.
          const ATS_SRC2_JOGY = { 'r-052': -35, 'r-047': 80 };
          if (ATS_SRC2_JOGY[r.id] !== undefined) {
            jogY += ATS_SRC2_JOGY[r.id];
          }
          // Alignment group — collinear horizontal jogs across multiple feeders.
          // Group members lock their horizontal jogY to the group anchor's jogY so
          // they form a single continuous horizontal line on the drawing.
          // Anchor's jogY is computed normally (tier + per-feeder shift); members
          // (excluding anchor) overwrite their jogY to match.
          // Group: F-054 (anchor) + F-060, F-062 — NEC 701/702 source2 row.
          // r-064 (F-064) is deliberately NOT a member — a shared
          // lane requires disjoint x-spans, and
          // F-062 (x 2110→2307.5) and F-064 (x 2270→2727.5) overlap collinearly
          // at the anchor lane (Ramiro-flagged feeder-on-feeder). F-064 takes
          // its natural pre-pass tier (jogY 4072, one lane below the row) — zero
          // crossings; pulling r-062 instead would cut F-064's lane at x=2307.5.
          const ATS_SRC2_ALIGN_GROUPS = {
            'eor-grp-043': { anchor: 'r-054', members: ['r-060','r-062'] }
          };
          if (!window.__atsSrc2AnchorY) window.__atsSrc2AnchorY = {};
          for (const gKey in ATS_SRC2_ALIGN_GROUPS) {
            const grp = ATS_SRC2_ALIGN_GROUPS[gKey];
            if (r.id === grp.anchor) {
              window.__atsSrc2AnchorY[gKey] = jogY;
            } else if (grp.members.indexOf(r.id) !== -1 && window.__atsSrc2AnchorY[gKey] !== undefined) {
              jogY = window.__atsSrc2AnchorY[gKey];
            }
          }
          // L-path: breaker → tier Y → ATS X → UP into source2 stub from below
          svg += `<g class="feeder" data-id="${r.id}" style="cursor:pointer"><polyline points="${bx},${topY} ${bx},${jogY} ${atsSrc2X},${jogY} ${atsSrc2X},${atsSrc2Y}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
        }
        // Tags just above breaker (same position regardless of routing)
        svg += renderR1Tags(r, bx, topY - DIM.tag_gap, 'right');
        renderedIds.add(r.id);
      }
      return;  // already rendered
    } else {
      return;
    }

    // Feeder tags for this R-1 (OFF-016: _chainTag* is the bus-adjacent default
    // unless a chain_dst_x_offset route moved the pills onto the long rise).
    svg += renderR1Tags(r, _chainTagX, _chainTagY, 'right');
    renderedIds.add(r.id);
  });

  return svg;
}

// ============================================================
// CONTINUOUS INTERNAL-CHAIN PITCH
// Single source of truth for the horizontal pitch between sibling
// internal-chain columns (CB-B ↔ CB-C ↔...). Both placeInternalChains
// (the row itself) and placeSubFeeds (the fan-out layer above) consult
// this function so the two layers stay width-consistent.
//
// Formula:
// pitch(n) = max(baseSpacing, panel_slot_S + 2*tagExtension * step(n))   [frozen spacing]
// where step(n) linearly interpolates 0→1 over n ∈ [2,3]
// and saturates at 1 for n >= 3.
//
// Preserves legacy buckets at the integer boundaries:
// n <= 1: 220 (unused in practice; single chain doesn't need spread)
// n == 2: 220 (was baseSpacing; matches legacy)
// n == 3: 320 (was wideSpacing; matches legacy)
// n >= 4: 320 + 100*(n-3) (NEW — linear growth beyond legacy ceiling)
//
// The n>=4 case is a preventative extension — E-502 does not exercise it
// today, but lab/hotel golden-case topologies with more internals would
// have triggered the old hard cap.
// ============================================================
function _internalChainPitch(n) {
  const baseSpacing  = DIM.panel_slot_S + 80;              // 220 (frozen spacing)
  const tagExtension = 90;
  const wideSpacing  = DIM.panel_slot_S + 2 * tagExtension; // 320 (frozen spacing)
  if (n <= 2) return baseSpacing;
  if (n === 3) return wideSpacing;
  return wideSpacing + 100 * (n - 3);
}

// ============================================================
// PLACE SUB-FEEDS — panel feed_bottom → panel feed_top
// Mirrors lab golden's placeRiser but as horizontal stagger
// For hospital: 4M-R-A → 4M-R-B/4M-R-C, E4S-1-X → E4B-1-X, etc.
// ============================================================
function placeSubFeeds(sheetId) {
  let svg = '';
  // OFF-003: multi-round fixpoint. Each round scans for
  // R-1 sub-feed edges whose parent is already placed and hasn't been
  // consumed yet; children placed in round N become eligible parents in
  // round N+1 (riser spines). Default SUBFEED_MAX_DEPTH = 1 → exactly one
  // round with an empty processedEdges set — the scan filter chain and
  // iteration order are verbatim, so hospital output is byte-identical.
  const processedEdges = new Set();
  // OFF-021 (rev 1.0.11): SUB-FEED CHAIN FLOOR-OFFSET COMPOUNDING.
  // `childY = parentBotY + 120` is read off the parent's ALREADY-PLACED Y, but
  // _s2FloorYOffset returns an ABSOLUTE offset from the sheet's base floor. On a
  // multi-round riser chain (subfeed_max_depth > 1) the child therefore inherits
  // its parent's lift AND adds its own on top, so each hop grows by exactly one
  // storey pitch — the 9-deep Life Safety chain on the 9-story hospital ran
  // 142 → 2,592 px, 18.3:1.
  //
  // Fix: record, per device this pass places, the absolute lift it received, and
  // subtract the parent's recorded lift from the child. Derivation, with Y0 the
  // unlifted baseline and lift(d) = Y(d) − Y0(d):
  //   childY = Y(p) + bodyH + 120 = childY0 + lift(p)
  //   want   Y(c) = childY0 + off(c)   →   Y(c) = childY − lift(p) + off(c)
  //   hence  lift(c) = off(c)          (the child's own absolute offset)
  // so the table below only ever stores _s2FloorYOffset(child) itself.
  //
  // GOLDEN-INERT BY CONSTRUCTION. _DEF_SUBFEED_DEPTH = 1, so there is exactly one
  // round; and within a round a destination is never also a source (the scan
  // requires G[src] to exist and returns early on `if (G[dstDev.id]) return`), so
  // _sfLift is still empty at every read. Every golden sub-feed parent is on the
  // base floor besides. _parentLift is therefore always 0 on the golden.
  //
  // Floor-anchored children are deliberately NOT recorded: floor_anchors is
  // forbidden on an emergency sheet, and _s2FloorYOffset returns 0 whenever
  // !_usesS2Pitch(sheetId), so on an anchored sheet every offset is already 0 and
  // there is nothing to compound.
  // OFF-029: seed with the lifts buildSheet's continuation-entry path already
  // applied, so an entry panel reads as a lifted sub-feed destination and its
  // chain's first hop takes the same OFF-028 baseline drop as every later hop.
  // `{}` on every non-continuation sheet and on every anchor-row continuation —
  // i.e. always `{}` on the golden. See the note at __ENTRY_LIFT.
  const _sfLift = Object.assign({}, __ENTRY_LIFT);
  for (let _sfRound = 1; _sfRound <= SUBFEED_MAX_DEPTH; _sfRound++) {
  // Group sub-feeds by parent device.
  // OFF-004: src/dst node types and start ports are config-driven
  // (SUBFEED_SRC_TYPES / SUBFEED_DST_TYPES / SUBFEED_START_PORTS). The
  // defaults reproduce the legacy literals exactly (['L2-4'] / ['L2-4'] /
  // ['feed_bottom','feed_top']), so hospital scans are unchanged. Lateral
  // starts (feed_left / feed_right) collect into their own parent map and
  // render in a separate beside-the-parent pass below.
  const byParent = {};
  const byParentLat = {};
  const crossExits = [];   // panel-start cross-sheet source halves
  TOPO.routed_elements.filter(r => r.edge_type === 'R-1' && r.sheet_id === sheetId).forEach(r => {
    if (processedEdges.has(r.id)) return;
    if (!r.start || !r.end) return;
    const srcDev = devMap[r.start.device_id];
    const dstDev = devMap[r.end.device_id];
    if (!srcDev || !dstDev) return;
    if (!SUBFEED_SRC_TYPES.includes(srcDev.node_type) || !SUBFEED_DST_TYPES.includes(dstDev.node_type)) return;
    if (!SUBFEED_START_PORTS.includes(r.start.port)) return;
    if (_isFeedThroughEdge(r)) return;   // OFF-031: placed by placeFeedThroughPanels
    if (!G[srcDev.id]) return;
    // a sub-feed-shaped R-1 whose destination lives on ANOTHER
    // sheet is the source half of a cross-sheet riser pair (e.g. a low-rise
    // board feeding its high-rise continuation board). The scan used to
    // swallow it as a regular sub-feed and PLACE the off-sheet destination on
    // this sheet — a phantom duplicate of a device that renders on its own
    // sheet via the continuation entry path. Route it to the cross-sheet exit
    // renderer below instead (exit stub + A-3 TO-squiggle + R-1 tags, the
    // panel-start analogue of placeAllChains' breaker-start isCrossSheetSource
    // branch). The golden and the legacy exercise cases have no panel-start
    // cross-sheet R-1s, so their scans are unchanged.
    if (dstDev.sheet_id !== sheetId) {
      crossExits.push({ r, src: srcDev, dst: dstDev });
      processedEdges.add(r.id);
      return;
    }
    // OFF-004: never re-place a destination an earlier pass already placed
    // (e.g. a Chain-B panel: CB→TX→panel renders in placeAllChains, and the
    // TX's secondary_out edge must not relocate the panel). Hospital subfeed
    // destinations are placed only here, so this guard is a no-op there.
    if (G[dstDev.id]) return;
    const _map = (r.start.port === 'feed_left' || r.start.port === 'feed_right') ? byParentLat : byParent;
    if (!_map[srcDev.id]) _map[srcDev.id] = [];
    _map[srcDev.id].push({r, src:srcDev, dst:dstDev});
  });

  const _sfGroups = Object.values(byParent);
  const _latGroups = Object.values(byParentLat);

  // render panel-start cross-sheet exits (see scan note above):
  // a short rise off the parent's top edge, offset east of top-centre so it
  // clears an incoming top feeder, terminated by the pair's A-3 TO-squiggle.
  crossExits.forEach(({ r, src, dst }) => {
    const pg = G[src.id];
    const w = symbolWidth(src);
    // end.landing_offset_x overrides the default +55 exit offset. On a parent
    // with a sub-feed fan the only jog-free vertical lane is DEAD CENTRE
    // (between the two middle exit slots) — the default +55 lands inside the
    // east-running jog spans. Parents without a fan keep the +55 default.
    const exitX = pg.x + w / 2

    // SLOT-FROZEN (same missed-retune defect as exitPitchSF in
    // placeSubFeeds). symbolWidth(L2-4) shrank 140 → 64, so a
    // 2-exit fan (C4B-1-A, C4B-2-A) collapsed to 21.3 px pitch at the panel
    // top. Frozen slot width restores the documented 46.7 px.
    // per-parent override (EXIT_PITCH_OVERRIDES) — 4S-1-B combs
    // use a fixed 10 px pitch to match the manual-route right-edge rhythm.
    const exitPitch = EXIT_PITCH_OVERRIDES[parent.designation] !== undefined
      ? EXIT_PITCH_OVERRIDES[parent.designation]
      : slotWidth(parent) / (n + 1);

    cbs.forEach((cb, i) => {
      renderedIds.add(cb.id);  // internal CB has no visible symbol
      const cbR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === cb.id);
      if (!cbR1 || !cbR1.end) return;
      const tx = devMap[cbR1.end.device_id];
      if (!tx || tx.node_type !== 'L2-2') return;

      // PER-CHILD COLUMN NUDGE for Chain B siblings that need
      // lateral clearance for neighbor FC pennants.
      // Look up the downstream 2L panel early (we already dereference it
      // later for the secondary feed). If its designation is keyed in the
      // table, shift this child's entire chain column (TX + primary feeder
      // landing X + secondary feeder X + 2L panel + all tags + pennants)
      // by the specified amount. The feeder exit point (exitX at parent
      // top) is independent of cbX, so the parent attach stays put — only
      // the horizontal jog lengthens to absorb the shift.
      //
      // E2L-*-C FC pennant tails clash with E2L-*-B panel
      // right edges. Shift all three C-column chains +25 px right.
      // Applied to C2P-1-B, C2P-2-B, and C2P-3-B
      // (same geometric pattern on L1 and L3).
      const _peekSecR1 = TOPO.routed_elements.find(r =>
        r.edge_type === 'R-1' && r.start && r.start.device_id === tx.id
        && r.start.port === 'secondary_out');
      const _peek2L = _peekSecR1 && _peekSecR1.end ? devMap[_peekSecR1.end.device_id] : null;
      const CHAIN_COLUMN_NUDGE = {
        'C2P-1-B': 25,  // clear C2L-1-A FC pennant tail
        'C2P-2-B': 25,  // clear C2L-2-A FC pennant tail
        'C2P-3-B': 25,  // clear C2L-3-A FC pennant tail
        // Mayo: straighten F-066 — E4B-1-A's CB exits on the
        // −10 lateralNudge lane (−707.5) but the TX column sat at panel
        // center (−697.5) → a 10 px jog in F-066. Shift the whole
        // E4T-1-A/F-067/E2L-1-A column onto the exit lane; the jog
        // degenerates and the chain is one straight vertical. Reaches the
        // exercise-case mirrors (same E4B-1-A lateralNudge, same jog) —
        // designation-keyed, surfaced and accepted like the 4S-1-B
        // precedent.
        'E2L-1-A': -10,
      };
      // OFF-017: config-extensible, same reasoning as OFF-014 for the exit itself.
      // The E2L-1-A entry above straightens ONE chain of ONE project, but the defect
      // recurs on every branch panel that takes an internal_chain_exit_nudge: the
      // exit moves onto a lane and the TX column stays on panel centre, leaving a
      // jog exactly as wide as the nudge. Measured on the 5-story hospital: C4B-1-A
      // and O4B-1-A both carry a -10 exit nudge and both drew a 10 px kink in their
      // primary feeder (F-466, F-491), while that project's own E4B-1-A inherited
      // the straightening by designation collision. Config wins over the table.
      // Default {} -> the golden reads the four hardcoded entries verbatim.
      const _ccNudgeCfg = _peek2L && CHAIN_COLUMN_NUDGE_CFG[_peek2L.designation];
      const columnNudge = (_ccNudgeCfg !== undefined && _ccNudgeCfg !== null)
        ? _ccNudgeCfg
        : ((_peek2L && CHAIN_COLUMN_NUDGE[_peek2L.designation]) || 0);

      const cbX = startX + i*spacing + columnNudge;  // column X for this internal chain
      G[tx.id] = { x: cbX - symbolWidth(tx)/2, y: txY };
      svg += renderDevice(tx, G[tx.id]);
      renderedIds.add(tx.id);

      // Feeder from parent top (per-chain exit X) → TX primary_in (bottom center of TX)
      // L-path: from parent top up to chain-bottom Y, across to cbX, up into TX
      // LATERAL NUDGE, SCOPED TO E4B-1-A ONLY.
      // Targeted shift: move the internal riser on
      // E4B-1-A to the left side of the panel so the E4B-1-A→E4T-1-A feeder
      // clears the incoming E4S-1-A→E4B-1-A sub-feed on E-502. All other
      // panels retain their original centered exit geometry.
      // −35 → −10 (Ramiro five-panel spacing batch): the quarter
      // slot was tuned to the earlier wide boxes; −10 puts the riser one
      // manual-rhythm lane left of the top-center incoming (same 10 px lane
      // as every rider edge since an earlier rev) and shrinks the jog to the TX
      // column from 35 to 10 px (jog Y sits ~155 px above the incoming
      // horizontal — no collinear continuation, verified on geometry).
      // OFF-014: config-extensible. The hardcoded E4B-1-A entry above fixes ONE
      // panel of ONE project, but the defect is structural and recurs on every
      // branch panel whose incoming sub-feed lands feed_bottom from a parent
      // ABOVE it: the incoming is drawn through the box to the bottom edge (the
      // bottom-entry-terminus convention, i.e. it acts as the panel's internal
      // bus) while the internal tap rises from the top edge — both on the panel
      // centreline, so they run collinear between the incoming's jog row and the
      // panel top. Measured on the 5-story hospital: 30 px of doubled line on
      // C4B-1-A and O4B-1-A, which carry the same arrangement as E4B-1-A but
      // are not in the hardcoded check. (That project's own E4B-1-A shares the
      // golden's designation and so inherited the fix by accident — the same
      // designation-collision hazard OFF-011 documents.)
      // layout_config.internal_chain_exit_nudge extends/overrides; config wins.
      // Default {} → the golden reads the hardcoded entry verbatim.
      const _icNudgeCfg = INTERNAL_CHAIN_EXIT_NUDGE_CFG[parent.designation];
      const lateralNudge = (_icNudgeCfg !== undefined)
        ? _icNudgeCfg
        : ((parent.designation === 'E4B-1-A') ? -10 : 0);
      const exitX = parentTopX + (i - (n - 1) / 2) * exitPitch + lateralNudge;
      const txPrimX = G[tx.id].x + symbolWidth(tx)/2;
      const txPrimY = G[tx.id].y + bodyHeight(tx);  // TX bottom-center = primary_in
      // JOG Y LOWERED 20 px (user request)
      // Was: txPrimY + equip_stub (90). Then: txPrimY + equip_stub + 20 (110).
      // JOG Y is +40 (130) below the bus.
      // JOG Y additional +30, continued
      // clearance from TX ground symbol). Now: txPrimY + equip_stub + 70 (160).
      // Applies to ALL transformer primary feeders on E-501 and E-502 via this
      // shared code path. Pushes horizontal segment and tag pill further from
      // TX bottom. Verified no collision with parent panel top — remaining
      // clearance to parentTopY is still ~247 px on tightest chain.
      // WIDE-GROUP JOG STAGGER: for internal-chain groups of 4+
      // columns, every horizontal jog previously shared ONE Y — sibling jogs
      // drew collinear (Kestrel Ridge 4S-1-B, 10 columns: F-307/F-309 overlap
      // for ~490 px, connectivity unreadable). Stagger each column's jog by
      // +14 px per index so runs cross perpendicular instead of coinciding.
      // Guarded n >= 4: the hospital golden's largest in-place group is n=3
      // (4S-1-B A/B/C; D–H are skip_chain_render), so golden output is
      // byte-identical (gated: run_layout --gate 0.0000 px + acceptance).
      // Worst case n=10: jogs span +126 px, still ~121 px clear of the
      // parent panel top on the tightest chain.
      const jogY = txPrimY + DIM.equip_stub + 70 + (n >= 4 ? i * 14 : 0);  // horizontal jog Y
      svg += `<g class="feeder" data-id="${cbR1.id}" style="cursor:pointer"><polyline points="${exitX},${parentTopY} ${exitX},${jogY} ${txPrimX},${jogY} ${txPrimX},${txPrimY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      // PRIMARY TAG ON FEEDER (matches placeSubFeeds horizontal-orient pattern)
      // anchor was (txPrimX, txPrimY + tag_gap=180) — 90 px BELOW the jog,
      // in empty space where no feeder exists. Tick-and-leader pointed at nothing.
      //
      // n >= 2: horizontal jog segment exists (non-zero length). Place horizontal-orient
      // tag at jog midpoint, matching placeSubFeeds.
      // n == 1: exitX == txPrimX (degenerate jog, zero-length). Centered-on-jog tag
      // would sit on the single vertical feeder column. Fall back to vertical-
      // orient right-side tag on the post-jog leg at its midpoint.
      // shifted down 20 to track with the lowered jog.
      // Shifted down +40 total to track with the jog.
      // Shifted down +70 total to track with the jog.
      // Keeps n=1 tag aligned with n>=2 siblings and clear of TX ground.
      // keep the A-1 pill out of the TX-primary FC pennant band.
      // The flipped EM pennant sweeps down-right from just below the TX
      // (~117 px at -30°); its tail lands exactly where these pills sat —
      // the above-jog pill (n>=2: C4B-1-A/C4B-2-A corner pills on F-072/076)
      // and the right-side pill (n==1: F-068/070/084 straight drops).
      // n>=2 → hang the pill UNDER the jog (pillBelowDefault; jog-to-parent
      // clearance is ~247 px, legs flank the pill by >11 px on the narrowest
      // 99 px jog). n==1 → pill LEFT of the wire (empty air; also the Revit
      // tag family's default leader side, so fewer 180° flips in the add-in).
      if (n >= 2) {
        svg += renderR1Tags(cbR1, (exitX + txPrimX) / 2, jogY, 'right', 'horizontal', true);
      } else {
        svg += renderR1Tags(cbR1, txPrimX, txPrimY + DIM.equip_stub / 2 + 70, 'left');
      }
      renderedIds.add(cbR1.id);

      // Secondary: TX secondary_out (top center of TX) → 2L panel feed_top
      const secR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.start && r.start.device_id === tx.id && r.start.port === 'secondary_out');
      if (secR1 && secR1.end) {
        const panel = devMap[secR1.end.device_id];
        if (panel && panel.sheet_id === sheetId) {
          G[panel.id] = { x: cbX - symbolWidth(panel)/2, y: panelY };
          svg += renderDevice(panel, G[panel.id]);
          renderedIds.add(panel.id);
          // Secondary feeder: TX top center → panel bottom center (vertical straight line)
          const txTopX = cbX;
          const txTopY = G[tx.id].y;
          const panelBotY = panelY + symbolHeight(panel);
          svg += `<g class="feeder" data-id="${secR1.id}" style="cursor:pointer"><line x1="${txTopX}" y1="${txTopY}" x2="${txTopX}" y2="${panelBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
          svg += renderR1Tags(secR1, txTopX, txTopY - DIM.tag_gap, 'right');
          renderedIds.add(secR1.id);
        }
      }
    });
  });

  return svg;
}

// ============================================================
// PLACE MANUAL-ROUTE FEEDERS — 6-feeder packed layout
// ============================================================
// Custom polyline emitter for feeders that:
//   (a) start at an internal CB tagged with skip_chain_render
//   (b) end at a device whose X/Y is already established by another
//       placement mechanism (e.g., floating L2/L3 transformer clones)
//
// GEOMETRY: 5-vertex right-side approach polyline
// (Layout includes 3 additional L3 feeders (F-032/094/096) packed
// into the right margin alongside F-026/088/090. L2 spacing tightened
// from 40 px → 30 px verticals and 35 px → 20 px entries to make room.
// L2 cluster on top half of 4S-1-B right edge; L3 cluster on bottom half.)
//
// Each polyline starts at L2 TX primary_in (TX bottom-center), drops DOWN
// to a Level-2 corridor positioned BELOW the L2 primary FC pennant, then
// traverses RIGHT past the L1 chain horizontal extent, descends DOWN on
// the right margin past the L1 chain vertical extent, and finally enters
// 4S-1-B from its RIGHT EDGE at staggered Y positions.
//
//   V1: (txPrimX,  txPrimY)    ← exit L2 TX primary_in (TX bottom)
//   V2: (txPrimX,  tagLineY)   ← drop down to corridor Y (below pennant)
//   V3: (lateralX, tagLineY)   ← traverse RIGHT (TAG pill sits above this segment)
//   V4: (lateralX, entryY)     ← drop DOWN on right margin past L1 chain
//   V5: (rightEdgeX, entryY)   ← enter 4S-1-B right edge
//
// Earlier routing used a 6-vertex polyline that exited 4S-1-B's feed_top, jogged
// laterally past L1 chain edges, rose to a corridor above L1, and dropped
// to L2 TX. That approach left the polylines co-linear with L1 secondary
// feeders at txPrimX columns and the corridor sat very close to L1 panel
// tops (only 23 px clearance for F-028), reading visually as collisions.
//
// Current routing RISES from 4S-1-B's
// right edge through clear right-margin columns up to a corridor BELOW
// each pennant, then enters its respective L2 TX primary_in. The tag
// pill is anchored at the L2 TX pennant apex X, placing it visually
// "below the primary FC pennant of its respective transformer."
//
// All routing parameters are encoded in MANUAL_OVERRIDE_ROUTES below.
// Geometry verified collision-free against:
//   - L1 TX boxes (4T-1-B/C/D), L1 panel boxes (2P-1-B/C/D)
//   - L2 TX boxes (4T-2-B/C/D), L2 panel boxes (2P-2-B/C/D)
//   - L1 primary feeders, L1 secondary feeders, L2 secondary feeders
//   - All 12 FC pennant body bboxes (L1+L2, primary+secondary)
//   - Inter-feeder collisions among F-026, F-028, F-030
//   - Tag pill collisions with all of the above
//
// IMPORTANT: The internal CBs (d-131/132/133) remain semantically attached
// to 4S-1-B via pa-050/051/052 with port "feed_top". The right-side
// visual entry is purely a rendering choice — internal CBs by definition
// sit INSIDE the panel, so the visual entry point is rendering-only.
// ============================================================
function placeManualRouteFeeders(sheetId) {
  let svg = '';

  // Per-feeder routing table — 6-feeder packed layout
  // Routing notes:
  //   - L2 verticals tightened: lateralX 480/520/560 → 480/510/540 (30 px spacing)
  //   - L2 entries tightened:   entryY 35/70/105 → 20/40/60 (20 px spacing)
  //   - Added 3 new L3 feeders: F-032/094/096 from L3 floor band (4T-3-B/C/D)
  //   - L3 verticals at lateralX 570/600/630 (continues 30 px spacing)
  //   - L3 entries at entryY 80/100/120 (continues 20 px spacing, bottom half of right edge)
  //   - L2 cluster on TOP half of 4S-1-B right edge, L3 cluster on BOTTOM half
  //
  // Coordinates are RELATIVE OFFSETS:
  //   tagLineY_rel: offset from parent TOP Y (more negative = higher above parent)
  //                 Tag pill renders ABOVE this line (at fy-63 to fy-32 in horizontal orient).
  //                 The corridor for this feeder is at this Y.
  //                 L2 corridors: -1308 / -1340 / -1372 (just below L2 primary FC pennant).
  //                 L3 corridors: -2508 / -2540 / -2572 (just below L3 primary FC pennant).
  //   lateralX_abs: absolute offset from parent center X for the right-margin DOWN run.
  //                 Must be > L3 chain rightmost edge (490) + clearance.
  //                 480/510/540 (L2) + 570/600/630 (L3), 30 px spacing.
  //   entryY_rel:   offset from parent TOP Y where the polyline enters 4S-1-B's right edge.
  //                 Range: 0 to panel_S (140) — positive = inside 4S-1-B vertical extent.
  //                 20/40/60 (L2 top half) + 80/100/120 (L3 bottom half), 20 px spacing.
  //
  // Tags positioned at TX pennant apex X + 40 (shifted +40 right with the verticals).
  // Tag pills sit slightly OFFSET to the right of pennant rather than directly below.
  //
  // Stagger logic (per floor):
  //   Within each floor, the OUTERMOST source TX (longest horizontal traversal) gets the
  //   DEEPEST corridor below pennant. The INNERMOST (rightmost source TX) gets the
  //   SHALLOWEST corridor (closest to its pennant). This stagger order prevents
  //   intermediate feeders' V1-V2 verticals from blocking outer feeders' V2-V3 horizontals.
  //
  //   L2 stagger: F-026 (outermost, deepest -1308) → F-028 → F-030 (innermost, -1372)
  //   L3 stagger: F-032 (outermost, deepest -2508) → F-034 → F-036 (innermost, -2572)
  const MANUAL_OVERRIDE_ROUTES = {
    // === L2 feeders (cluster on TOP half of 4S-1-B right edge) ===
    // F-026 → 4T-2-B (leftmost L2 TX). Corridor deepest below pennant.
    // entryY_rel spacing 10px for tighter horizontal exit rows.
    // Entire cluster shifted down +10 px (rows now 30–80).
    // lateralX_abs spacing 15px AND cluster shifted right
    //         (anchor 480→510, +30 px) to preserve 20 px clearance from L3 chain
    //         rightmost edge (490). Cluster width compresses 150px→75px.
    'F-026': { tagLineY_rel: -1308, lateralX_abs: 510, entryY_rel:  30 },
    // F-028 → 4T-2-C (center L2 TX). Middle corridor depth.
    'F-028': { tagLineY_rel: -1340, lateralX_abs: 525, entryY_rel:  40 },
    // F-030 → 4T-2-D (rightmost L2 TX). Corridor closest to its pennant.
    'F-030': { tagLineY_rel: -1372, lateralX_abs: 540, entryY_rel:  50 },
    // === L3 feeders (clustered in top region) ===
    // F-032 → 4T-3-B (leftmost L3 TX, X=-220). Corridor deepest below L3 pennant.
    'F-032': { tagLineY_rel: -2508, lateralX_abs: 555, entryY_rel:  60 },
    // F-034 → 4T-3-C (center L3 TX, X=+100). Middle L3 corridor.
    'F-034': { tagLineY_rel: -2540, lateralX_abs: 570, entryY_rel:  70 },
  };

  // Discover feeders with skip_chain_render source CB
  const overrides = TOPO.routed_elements.filter(r =>
    r.sheet_id === sheetId
    && r.edge_type === 'R-1'
    && r.start && r.start.device_id
    && (() => {
      const cb = devMap[r.start.device_id];
      return cb && cb.data_fields && cb.data_fields.skip_chain_render
             && cb.data_fields.internal_to;
    })()
  );

  if (overrides.length === 0) return svg;

  // ==========================================================
  // GENERIC FLOOR-BANDED COLUMNS
  // Skip-chain feeders WITHOUT a MANUAL_OVERRIDE_ROUTES entry and WITHOUT
  // pre-placed destination geometry (the hospital clones set G[] earlier;
  // its five routed feeders hit the table — golden never reaches this path)
  // are placed data-driven: the TX+panel column moves to the floor band
  // named by LEVEL_MAP[tx.designation] (Y from __FLOOR_ROW_Y), one distinct
  // lane per column on the parent's LEFT side, feeder = side-exit L-route.
  // First consumer: Kestrel Ridge 4S-1-B floor columns (KR-D11).
  // ==========================================================
  const _genericCols = [];
  {
    const floorIdx = {};
    Object.keys(__FLOOR_ROW_Y).forEach((f, i) => { floorIdx[f] = i; });
    overrides.forEach(r => {
      if (MANUAL_OVERRIDE_ROUTES[r.designation]) return;
      if (!r.end) return;
      const tx = devMap[r.end.device_id];
      if (!tx || tx.sheet_id !== sheetId || G[tx.id]) return;
      const floor = LEVEL_MAP ? LEVEL_MAP[tx.designation] : null;
      if (floor == null || __FLOOR_ROW_Y[floor] === undefined) return;
      _genericCols.push({ rid: r.id, floor, desig: tx.designation });
    });
    // BASE-floor columns sort LAST (outermost lane). A base-floor
    // column's take-off DESCENDS (its TX top sits at the baseline row, below
    // the parent-edge exit), so on an inner lane its vertical would be swept
    // by every outer sibling's take-off horizontal. Sheets without base-floor
    // banded pairs (Mayo's floors 2/3) sort exactly as before.
    const _gcBase = _sheetFloorStackBottomUp(sheetId)[0];
    _genericCols.sort((a, b) => ((a.floor === _gcBase ? 1 : 0) - (b.floor === _gcBase ? 1 : 0))
      || (floorIdx[a.floor] - floorIdx[b.floor])
      || (a.desig < b.desig ? -1 : 1));
  }
  const _genericLane = {};
  _genericCols.forEach((c, k) => { _genericLane[c.rid] = k; });

  overrides.forEach(cbR1 => {
    const cb = devMap[cbR1.start.device_id];
    const parentDesig = cb.data_fields.internal_to;
    const parent = TOPO.devices.find(d => d.designation === parentDesig
      && d.sheet_id === sheetId);
    if (!parent || !G[parent.id]) return;

    // Mark CB as rendered (no visible symbol)
    renderedIds.add(cb.id);

    if (!cbR1.end) return;
    const txDev = devMap[cbR1.end.device_id];
    if (!txDev || txDev.sheet_id !== sheetId) return;

    const route = MANUAL_OVERRIDE_ROUTES[cbR1.designation];
    if (!route) {
      // Generic floor-banded placement. Legacy behavior for
      // anything unqualified (already placed / unmapped): silent return,
      // exactly as before.
      if (_genericLane[cbR1.id] === undefined) return;
      const k = _genericLane[cbR1.id];
      const pg2 = G[parent.id];
      const pCX = pg2.x + symbolWidth(parent) / 2;
      const pTopY = pg2.y;
      // In-place cluster extent for this parent (columns drawn by
      // placeInternalChains) — generic lanes start left of it.
      const nIn = TOPO.devices.filter(d => d.node_type === 'L2-1'
        && d.data_fields && d.data_fields.internal_to === parentDesig
        && !d.data_fields.skip_chain_render && d.sheet_id === sheetId).length;
      const inExtent = nIn > 0 ? (nIn * _internalChainPitch(nIn)) / 2 + 110 : DIM.panel_slot_S / 2 + 110;  // frozen spacing
      const laneX = pCX - (inExtent + 130 + k * 220);
      const rowY = __FLOOR_ROW_Y[_genericCols[k].floor];
      // Exact in-place chain vertical geometry, re-anchored to the floor row:
      // TX top at the floor row; 2P panel above by the in-place TX↔panel gap.
      // colGapToBot = in-place TX.y − panel feed_bottom row (frozen gaps).
      const colGapToBot = DIM.tag_gap + DIM.equip_gap + DIM.equip_stub;
      const txY2 = rowY;
      G[txDev.id] = { x: laneX - symbolWidth(txDev) / 2, y: txY2 };
      svg += renderDevice(txDev, G[txDev.id]);
      renderedIds.add(txDev.id);
      // Side-exit L-route: parent LEFT edge → horizontal to the lane →
      // vertical rise into TX primary_in. Entry Y staggered down the edge.
      const entryY2 = pTopY + 20 + k * 12;
      const txPrimX2 = laneX;
      const txPrimY2 = txY2 + bodyHeight(txDev);
      svg += `<g class="feeder" data-id="${cbR1.id}" style="cursor:pointer">`
           + `<polyline points="${pg2.x},${entryY2} ${laneX},${entryY2} ${laneX},${txPrimY2}" `
           + `fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" `
           + `stroke-linejoin="miter"/></g>`;
      // on a DESCENDING column (base-floor band: the TX
      // primary port sits below the take-off, so the lane vertical runs
      // DOWN) the legacy anchor (laneX, parentTop−170) is not on the
      // conductor and the tag floats. Anchor it on the take-off horizontal
      // instead, midway between this lane and the next lane in.
      if (txPrimY2 >= entryY2) {
        svg += renderR1Tags(cbR1, laneX + 110, entryY2, 'right', 'horizontal');
      } else {
        svg += renderR1Tags(cbR1, laneX, pTopY - DIM.tag_gap - 130, 'right');
      }
      renderedIds.add(cbR1.id);
      // Secondary chain: TX secondary_out → 2P panel above (in-place idiom).
      const secR1 = TOPO.routed_elements.find(r2 => r2.edge_type === 'R-1'
        && r2.start && r2.start.device_id === txDev.id && r2.start.port === 'secondary_out');
      if (secR1 && secR1.end) {
        const secP = devMap[secR1.end.device_id];
        if (secP && secP.sheet_id === sheetId && !G[secP.id]) {
          const spBotY = txY2 - colGapToBot;  // panel feed_bottom row (frozen)
          const spY = spBotY - symbolHeight(secP);
          G[secP.id] = { x: laneX - symbolWidth(secP) / 2, y: spY };
          svg += renderDevice(secP, G[secP.id]);
          renderedIds.add(secP.id);
          svg += `<g class="feeder" data-id="${secR1.id}" style="cursor:pointer">`
               + `<line x1="${laneX}" y1="${txY2}" x2="${laneX}" y2="${spBotY}" `
               + `stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
          svg += renderR1Tags(secR1, laneX, txY2 - DIM.equip_gap / 2, 'right');
          renderedIds.add(secR1.id);
        }
      }
      return;
    }
    if (!G[txDev.id]) return;

    // Resolve absolute coordinates
    const pg = G[parent.id];
    const parentCenterX = pg.x + symbolWidth(parent) / 2;
    const parentTopY = pg.y;
    const parentRightEdgeX = pg.x + symbolWidth(parent);  // 4S-1-B right edge
    const txG = G[txDev.id];
    const txPrimX = txG.x + symbolWidth(txDev) / 2;       // L2 TX bottom-center (primary_in)
    const txPrimY = txG.y + bodyHeight(txDev);            // L2 TX bottom Y

    const tagLineY = parentTopY    + route.tagLineY_rel;
    const lateralX = parentCenterX + route.lateralX_abs;
    const entryY   = parentTopY    + route.entryY_rel;

    // 5-vertex polyline (right-side approach)
    const pts = [
      `${txPrimX},${txPrimY}`,         // V1: exit L2 TX primary_in
      `${txPrimX},${tagLineY}`,        // V2: drop to corridor Y
      `${lateralX},${tagLineY}`,       // V3: traverse right (tag here)
      `${lateralX},${entryY}`,         // V4: drop down right margin
      `${parentRightEdgeX},${entryY}`, // V5: enter 4S-1-B right edge
    ].join(' ');

    svg += `<g class="feeder" data-id="${cbR1.id}" style="cursor:pointer">`
         + `<polyline points="${pts}" fill="none" `
         + `stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" `
         + `stroke-linejoin="miter"/></g>`;

    // A-1 tag on the corridor (V2-V3 horizontal segment).
    // Tag X = pennant apex X + 40 (shifted right with the verticals).
    // Pill does not sit directly below pennant — offset 40 px to the right.
    // Pill renders ABOVE the corridor line at fy-63 to fy-32 in horizontal orient.
    // With tagLineY values -1308/-1340/-1372, pill tops sit at -1371/-1403/-1435,
    // all below pennant body bottom (-1440 in screen coords; pill_top_Y > -1440
    // means pill is LOWER on screen than pennant bottom). ✓
    const tagX = txPrimX + symbolWidth(txDev) / 2 + DIM.tx_fc_lateral_offset + 40;
    svg += renderR1Tags(cbR1, tagX, tagLineY, 'right', 'horizontal');
    renderedIds.add(cbR1.id);
  });

  return svg;
}

// ============================================================
// PLACE RISER — floors 2/3 emergency chains
// Mirrors 7-story golden's placeRiser (lines 1639-1744)
// Each floor steps UP from previous (lower Y), with floor module beside it
// ============================================================
function placeRiser(sheetId, homePanelDesig, subDesigs) {
  let svg = '';
  const homePanel = TOPO.devices.find(d => d.designation === homePanelDesig);
  if (!homePanel || !G[homePanel.id]) return svg;
  const hg = G[homePanel.id];
  let prevCX = hg.x + symbolWidth(homePanel)/2;
  let prevTopY = hg.y;

  subDesigs.forEach((sd, fi) => {
    const subDev = TOPO.devices.find(d => d.designation === sd);
    if (!subDev) return;
    // If the floor BELOW (previous panel in walk) has internal TX chains,
    // bump riser gap by xfmr_ground_clearance so this floor's panel clears the
    // ground-symbol stack of the transformer above the floor below.
    const prevDesig = fi === 0 ? homePanelDesig : subDesigs[fi-1];
    const prevHasInternalTX = TOPO.devices.some(d =>
      d.node_type === 'L2-2' &&
      TOPO.routed_elements.some(r => r.edge_type==='R-1' && r.start && r.start.device_id && r.end && r.end.device_id === d.id &&
        devMap[r.start.device_id] && devMap[r.start.device_id].data_fields &&
        devMap[r.start.device_id].data_fields.internal_to === prevDesig));
    const riserBump = prevHasInternalTX ? DIM.xfmr_ground_clearance : 0;
    // Grow upward
    // Bottom-anchored: the riser panel's feed_bottom row is frozen relative
    // to the previous panel's top; the anchor rides the box height.
    const subBotY = prevTopY - DIM.chain_h_min - DIM.riser_gap - riserBump + DIM.panel_slot_S;
    const subY = subBotY - symbolHeight(subDev);
    const subX = prevCX - symbolWidth(subDev)/2;
    G[subDev.id] = { x: subX, y: subY };
    svg += renderDevice(subDev, G[subDev.id]);
    // Riser feeder: from upstream panel top to new panel bottom
    const riserR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.end && r.end.device_id === subDev.id && r.sheet_id === sheetId);
    const riserR1Id = riserR1 ? riserR1.id : '';
    svg += `<g class="feeder" data-id="${riserR1Id}" style="cursor:pointer"><line x1="${prevCX}" y1="${prevTopY}" x2="${prevCX}" y2="${subBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
    renderedIds.add(subDev.id);

    // Riser R-1 tags
    if (riserR1) {
      svg += renderR1Tags(riserR1, prevCX, prevTopY - DIM.tag_gap, 'right');
      renderedIds.add(riserR1.id);
    }

    prevCX = subX + symbolWidth(subDev)/2;
    prevTopY = subY;
  });
  return svg;
}

// ============================================================
// PLACE ATS + GENERATOR on S2 — Multi-ATS / per-class EMSB topology
// ============================================================
/**
 * 7 ATSes, each fed by a per-class EMSB breaker (source2) and a per-class
 * NP breaker (source1). Each ATS load_out feeds a downstream E4S/O4S
 * sub-distribution panel.
 *
 * The ATS row sits BETWEEN the EMSB (below) and the E4S/O4S panels
 * (above), which mirrors power flow:
 *     EMSB ─▲─ ATS.source2
 *     ATS.load_out ─▲─ E4S/O4S ─▲─ E4B...
 * Placing ATSes above the EMSB keeps the upward power-flow convention
 * coherent for all 7 ATSes and their per-class EMSB feeders.
 */
function placeATSsAndGenerator(sheetId, emSwbdStartX, swAnchorY, sectionH, incSecX, incSecId) {
  if (sheetRole(sheetId) !== 'emergency') return '';
  let svg = '';

  // Find all ATSes on the emergency sheet; order by NEC class (700 → 701 → 702) then by designation.
  // NEC_COLOR keys '700'/'701'/'702' drive both this ordering and section grouping.
  const atsDevs = TOPO.devices.filter(d => d.sheet_id === sheetId && d.node_type === 'L2-3');
  function atsNecClass(a) {
    const raw = (a.data_fields && a.data_fields.nec_class) || '';
    const s = (NEC_CLASS_ALIASES && NEC_CLASS_ALIASES[raw] != null) ? NEC_CLASS_ALIASES[raw] : raw;
    // NFPA-99 branch prose carries no article digits,
    // so without this map the regex never matches and the sort falls through
    // to alphabetical. Numeric-string classes (e.g. Kestrel Ridge '700') and
    // nec_class_aliases resolve before this map and are unaffected.
    const prose = { 'LIFE SAFETY': '700', 'CRITICAL': '701', 'EQUIPMENT': '702', 'OPTIONAL STANDBY': '999' }[String(s)];
    if (prose) return prose;
    const m = String(s).match(/7(00|01|02)/);
    return m ? m[0] : '999';
  }
  // OFF-026 (rev 1.0.11): EXPLICIT ATS ORDER.
  // atsNecClass can only ever return '700', '701', '702' or '999', so a lineup
  // whose Life Safety ATS and all three Critical-branch ATSs are NEC 700 collapses
  // to one class and the tiebreak falls through to alphabetical — which put
  // C4A-1-A/B/C west of LS4A-1-A on the 9-story hospital, ahead of the branch they
  // are supposed to follow. No nec_class_aliases entry can fix that: the classes
  // are genuinely equal. This key states the row order directly.
  // Listed designations take the leading slots in the order given; anything
  // unlisted keeps the legacy sort and follows. Default [] → the legacy sort
  // verbatim, so the golden's frozen ATS order is untouched.
  const _atsOrder = Array.isArray(ATS_ORDER_CFG) ? ATS_ORDER_CFG : [];
  const _atsRank = d => {
    const i = _atsOrder.indexOf(d.designation || '');
    return i === -1 ? Number.MAX_SAFE_INTEGER : i;
  };
  const ordered = atsDevs.slice().sort((a, b) => {
    const ra = _atsRank(a), rb = _atsRank(b);
    if (ra !== rb) return ra - rb;                 // OFF-026; equal (both unranked) on the golden
    const ca = atsNecClass(a), cb = atsNecClass(b);
    if (ca !== cb) return ca < cb ? -1 : 1;
    return (a.designation || '') < (b.designation || '') ? -1 : 1;
  });

  // EM switchboard now uses two-level bus architecture.
  // ATS source2 feeders (r-040..r-046) land on the secondary bus where
  // the EM-CB-* breakers live, not the old single dist bus.
  const emBusY = swAnchorY + DIM.sw_sec_bus_offset;

  // ATS Y: above EMSB top by ats_vert_gap (888 px)
  // Provides legible spacing between EMSB and
  // ATS row. See DIM.ats_vert_gap comment block for full context.
  const atsY = swAnchorY - DIM.ats_vert_gap;

  // ==========================================================
  // Stage 2: topology-aware ATS pitch (recursive)
  //
  // Each ATS has a subtree rooted at its load_out. The widest row of that
  // subtree determines how much horizontal space the ATS cluster occupies
  // above the ATS row. Spacing between adjacent ATSs must accommodate the
  // sum of the left-ATS's right-extent and the right-ATS's left-extent,
  // plus clearance and any NEC-class group gap.
  //
  // cc(child) recurses into Variant-G grandchildren. When a child
  // (e.g., C4B-1-A, 400A) fans out into multiple TX+panel pairs via
  // feed_bottom sub-feeds, the true X-extent under that child is the width
  // of the grandchild row, not the child body. Without recursion the
  // heuristic underestimates this by ~400-600 px per dense child, causing
  // adjacent ATS clusters (E4S-1-A / C4S-1-A and C4S-1-A / EQ4S-1-A) to
  // collide.
  //
  // Recursion cap: ATS_EXTENT_MAX_DEPTH = 3 (ATS -> L1 sub-dist -> L2 -> L3).
  // Beyond that the walker emits a layout_warnings entry and falls back to
  // the heuristic — surfaces a warning rather than silently truncating.
  // ==========================================================
  const _atsExtentWarnings = [];
  const ATS_EXTENT_MAX_DEPTH = 3;

  function _atsSubtreeExtent(ats) {
    const loadR1 = TOPO.routed_elements.find(r =>
      r.edge_type === 'R-1' && r.sheet_id === ats.sheet_id &&
      r.start && r.start.device_id === ats.id && r.start.port === 'load_out');
    if (!loadR1 || !loadR1.end) return { left: DIM.ats_slot_S/2, right: DIM.ats_slot_S/2 };
    const sub = devMap[loadR1.end.device_id];
    if (!sub) return { left: DIM.ats_slot_S/2, right: DIM.ats_slot_S/2 };
    if (sub.node_type !== 'L2-4') {
      // Fire pump / equipment connection - just the body below the ATS
      return { left: DIM.ats_slot_S/2, right: DIM.ats_slot_S/2 };
    }
    // Sub-dist panel is centered on the ATS. What we return is the half-width
    // of the widest row in its subtree, clamped to at least panel_S/2.
    const sub_w = _panelSubtreeExtent(sub, 1, new Set([sub.id]));
    const half = Math.max(DIM.panel_slot_S / 2, sub_w / 2);
    return { left: half, right: half };
  }

  // Full-width extent of the widest horizontal row in the subtree rooted at
  // `panel`. Returns total width (not half-width). Caller centers on panel X.
  //
  // Recursion: at each level, compute per-child contributions by recursing
  // into the child's own subtree. Same pitch math at every level so a dense
  // grandchild row contributes its full width, not just the child-body width.
  function _panelSubtreeExtent(panel, depth, visited) {
    const PANEL_HALF = DIM.panel_slot_S / 2;
    const TAG_PILL = 30;                          // A-1/A-2 horizontal tag allowance
    const SIBLING_PITCH_MIN = DIM.panel_slot_S + 60;   // 200; matches Stage 1 floor

    // Depth guard — emit warning and return a conservative heuristic width.
    if (depth > ATS_EXTENT_MAX_DEPTH) {
      _atsExtentWarnings.push({
        kind: 'ats_extent_depth_cap',
        panel: panel.designation || panel.id,
        depth: depth,
        note: 'Subtree deeper than ATS_EXTENT_MAX_DEPTH - pitch may under-estimate actual width.'
      });
      return _panelHeuristicWidth(panel);
    }

    // Variant-G children: R-1 from a sub-feed start port -> another L2-4.
    //
    // OFF-010: which start ports count is config-driven (ATS_EXTENT_PORTS).
    // This walker hardcoded 'feed_bottom' while placeSubFeeds has accepted the
    // config-driven SUBFEED_START_PORTS (default ['feed_bottom','feed_top'])
    // since OFF-004 — so the two disagree about what a sub-feed IS, and every
    // upward feed_top riser is invisible to the extent math. A topology whose
    // risers all exit feed_top reads as a row of LEAF panels, the ATS pitch
    // solver packs the clusters to the heuristic minimum, and adjacent ATS
    // subtrees interleave (measured on the 5-story hospital: EQ and O clusters
    // packed to 420 px pitch carrying 1000-1400 px wide fans → 3 crossings).
    //
    // Default ['feed_bottom'] = exact legacy behavior, because the HOSPITAL
    // GOLDEN ITSELF trips this: its S2 has four feed_top sub-feeds (F-050,
    // F-045, F-058, F-056) that the walker does not count, so its frozen ATS
    // spacing is built on an under-count. Correcting the default would move
    // the oracle's geometry (G1 red) — that is a deliberate re-freeze
    // decision, not a silent bug fix. Opt in per project instead.
    const childEdges = TOPO.routed_elements.filter(r =>
      r.edge_type === 'R-1' && r.sheet_id === panel.sheet_id &&
      r.start && r.start.device_id === panel.id &&
      ATS_EXTENT_PORTS.includes(r.start.port) &&
      r.end && devMap[r.end.device_id] && devMap[r.end.device_id].node_type === 'L2-4'
    );
    const children = childEdges.map(r => devMap[r.end.device_id]);

    if (children.length === 0) {
      // Leaf panel (or transformer-chain terminus). Use internal-breaker heuristic.
      return _panelHeuristicWidth(panel);
    }

    // Per-child contribution: recurse. Each contribution is {left, right} where
    // left = width from child's center to its subtree's leftmost extent,
    // right = same on the right + tag pill allowance.
    function childContrib(child) {
      if (visited.has(child.id)) {
        // Cycle guard - should never happen in a valid topology, but defensive.
        _atsExtentWarnings.push({
          kind: 'ats_extent_cycle',
          panel: child.designation || child.id,
          note: 'Cycle detected in sub-feed graph; treating as leaf.'
        });
        return { left: PANEL_HALF, right: PANEL_HALF };
      }
      const nextVisited = new Set(visited);
      nextVisited.add(child.id);
      const sub_w = _panelSubtreeExtent(child, depth + 1, nextVisited);
      const half = Math.max(PANEL_HALF, sub_w / 2);
      return { left: half, right: half + TAG_PILL };
    }

    const contribs = children.map(childContrib);
    const pitches = [];
    for (let i = 0; i < contribs.length - 1; i++) {
      const need = contribs[i].right + contribs[i+1].left + DIM.panel_clearance;
      pitches.push(Math.max(SIBLING_PITCH_MIN, need));
    }
    // OFF-015: honour end.dst_x_offset.
    // placeSubFeeds lays the fan out on these same cumulative pitches and THEN shifts each
    // child by its own dst_x_offset. So a fan that has been deliberately compacted occupies
    // less width than the pitch walk alone predicts, and the ATS pitch solver — which spaces
    // whole clusters on this number — keeps reserving the un-compacted width. The emergency
    // sheet then stays wider than its own content and the source-2 feeders run further than
    // they need to (measured: F-442 and F-484 at ~2050 px each).
    //
    // Model the shifted centres and take the real span. With every dst_x_offset absent this is
    // PROVABLY the legacy expression: each pitch is >= right_i + left_{i+1} + clearance, so
    // (rel_i − left_i) is non-decreasing and (rel_i + right_i) is non-decreasing, putting the
    // min at i=0 and the max at i=n−1 — i.e. left_0 + innerW + right_{n−1}. Golden-inert twice
    // over: its only two dst_x_offset sub-feeds (F-011, F-005) are on S1, and this walker runs
    // on the emergency sheet only.
    const innerW = pitches.reduce((a,b) => a+b, 0);
    let _cum = 0;
    const rel = contribs.map((c, i) => {
      if (i > 0) _cum += pitches[i-1];
      const end = childEdges[i].end;
      const dx = (end && typeof end.dst_x_offset === 'number') ? end.dst_x_offset : 0;
      return _cum + dx;
    });
    const totalW = Math.max(...rel.map((x, i) => x + contribs[i].right))
                 - Math.min(...rel.map((x, i) => x - contribs[i].left));
    return totalW;
  }

  // Fallback width when a panel has no Variant-G children. Uses the original
  // internal-breaker heuristic - a proxy for the TX+secondary chain row
  // width that renders directly below a panel with internal CBs.
  function _panelHeuristicWidth(panel) {
    const ic = TOPO.devices.filter(d =>
      d.node_type === 'L2-1' && d.data_fields &&
      d.data_fields.internal_to === panel.designation &&
      d.sheet_id === panel.sheet_id).length;
    if (ic >= 3) return 460;     // 2 * 230
    if (ic === 2) return 390;    // 180 + 210
    if (ic === 1) return 280;    // panel_S + small
    return DIM.panel_slot_S;     // 140 (frozen spacing)
  }


  // Compute cumulative ATS X positions using per-pair topology-aware pitches.
  // ATS-cluster clearance: minimum 40 px plus NEC class group gap where applicable.
  const ATS_CLUSTER_CLEARANCE = 40;
  const groupGap = DIM.nec_group_gap;
  const extents = ordered.map(a => _atsSubtreeExtent(a));

  // Per-pair pitch = left.right_extent + right.left_extent + clearance (+ group gap if class change)
  // Floor at the legacy atsSpacing so sparse clusters keep normal density.
  const atsSpacing = DIM.ats_slot_S + 280;   // legacy 420 (used as floor; frozen spacing)
  const pitches = [];
  for (let i = 0; i < ordered.length - 1; i++) {
    const left = ordered[i], right = ordered[i+1];
    const lc = atsNecClass(left), rc = atsNecClass(right);
    const extra = (lc !== rc) ? groupGap : 0;
    const need = extents[i].right + extents[i+1].left + ATS_CLUSTER_CLEARANCE + extra;
    pitches.push(Math.max(atsSpacing, need));
  }

  // Total width from ATS-row leftmost edge to rightmost edge
  const leftPad  = extents[0].left;
  const rightPad = extents[extents.length - 1].right;
  const innerW   = pitches.reduce((a,b) => a+b, 0);
  const totalATSWidth = leftPad + innerW + rightPad;

  const emCenterX = emSwbdStartX + 800;
  const atsStartCenter = emCenterX - totalATSWidth / 2 + leftPad;

  // Track per-class bounding X range for banner rendering.
  const groupBounds = {};  // classKey → { x1, x2 }
  // Stage 2: ATS X positions derived from per-pair pitches computed above.
  // Each ATS center sits at atsStartCenter + sum(pitches[0..i-1]).
  // The per-pair pitch already accounts for the NEC class group-gap where
  // classes differ, so we do NOT add groupGap inside the loop.
  const atsCenters = [atsStartCenter];
  for (let i = 0; i < pitches.length; i++) {
    atsCenters.push(atsCenters[i] + pitches[i]);
  }

  ordered.forEach((ats, i) => {
    const cls = atsNecClass(ats);
    let ax = atsCenters[i] - symbolWidth(ats)/2;  // top-left X from center X
    // Per-ATS X offset (see ATS_X_OFFSET).
    // Applied AFTER pitch solver so other ATSes keep their solved positions;
    // the gap to the right neighbor simply widens by |offset|. Downstream
    // subtree inherits the shift automatically via atsLoadX = G[ats.id].x + 70.
    const xOffset = (ATS_X_OFFSET[ats.designation] || 0);
    if (xOffset !== 0) {
      ax += xOffset;
    }
    // box top sits where the legacy load stub ended (atsY − 30),
    // so the load-side feeder terminus — and every panel row derived from it
    // — stays exactly on its legacy row while the box shrinks to 72×72.
    const ay = atsY - 30;
    G[ats.id] = { x: ax, y: ay };
    svg += renderDevice(ats, G[ats.id]);
    renderedIds.add(ats.id);

    // Track group bounds for banner
    if (!groupBounds[cls]) groupBounds[cls] = { x1: ax, x2: ax + symbolWidth(ats) };
    else groupBounds[cls].x2 = ax + symbolWidth(ats);

    // Cross-sheet source1 squiggle BELOW ATS (normal source arriving from NP sheet)
    // source1 marker on the family-box bottom edge (no external
    // stub);.20: port x FAMILY-MEASURED via ATS_PORT_S1_X (was a
    // proportional estimate — the §14 per-port follow-up landed for ATS).
    // short entry feeder below the port — the squiggle used to
    // sit directly ON the box-bottom edge (its curl clipped the ATS outline).
    // The stub is a real feeder group, so harvestRoutes exports the s2-half's
    // path_vertices (add-in then draws it, matching the OFF-001 continuation
    // entry stubs). Length is ATS_SOURCE1_ENTRY_STUB — see that constant for
    // the clearance budget that caps it.
    const s1X = ax + ATS_PORT_S1_X;
    const s1Y = ay + boxH('L2-3');
    const destR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1'
      && r.sheet_id === sheetId
      && r.end && r.end.device_id === ats.id
      && r.end.port === 'source1_in');
    // OFF-032: a normal-source feeder whose breaker is on THIS sheet is drawn
    // whole by Chain C — no continuation stub, no FROM-squiggle. Golden-inert:
    // every golden source-1 feeder starts on the other sheet.
    const _s1SameSheet = !!(destR1 && destR1.start && devMap[destR1.start.device_id]
      && devMap[destR1.start.device_id].sheet_id === sheetId);
    if (destR1 && !_s1SameSheet) {
      const a3 = (annByBound[destR1.id] || []).find(a => a.annotation_type === 'A-3');
      const squigText = a3 ? a3.content.text : `FROM 4MDP-1-A`;
      const s1StubY = s1Y + ATS_SOURCE1_ENTRY_STUB;
      svg += `<g class="feeder" data-id="${destR1.id}" style="cursor:pointer"><line x1="${s1X}" y1="${s1Y}" x2="${s1X}" y2="${s1StubY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      // label LEFT of the curl, on the squiggle row. A centered
      // below-label (±47 px at stub+28) was crossed by the ATS's own
      // source-2 riser (port +36) at 16 of the 21 live sites and sat on
      // the shallowest jog-tier row (port +60), forcing per-case dx
      // entries. The band west of the stub at squiggle height is clean at
      // every site in all 3 cases (risers are east; EMSB gutter verticals
      // start below the tier rows) — one uniform rule, no case tables.
      svg += renderSquiggle(s1X, s1StubY, squigText, 'left', 'horizontal', a3 ? a3.id : null, destR1.id);
      if (a3) renderedIds.add(a3.id);
      renderedIds.add(destR1.id);
      (annByBound[destR1.id] || []).forEach(a => renderedIds.add(a.id));
    }
  });

  // `groupBounds` is computed above (used for ATS placement bookkeeping).
  // Per-section NEC tags inside the EMSB distribution section rects
  // ("NEC 700" style inside section boxes) carry the NEC class info.

  // Surface any ATS extent-walker warnings (depth cap / cycle).
  // These fire when the Variant-G sub-tree under an ATS exceeds the recursion
  // cap or contains a cycle — both indicate that the computed ATS pitch may
  // under-estimate actual width. Warnings surface in the schema drift panel.
  _atsExtentWarnings.forEach(w => {
  });

  // For backward-compat with downstream "ordered.forEach" consumers (load_out, gen feeder), we keep
  // `ordered` as-is — it's now the canonical ATS sequence used below.

  // === Generator placement ===
  // Gen feeds EMSB main bus directly (r-040: GEN -> EM main bus r-903 bus_tap_bi)
  // Place gen to the LEFT of the EMSB, with gen_out feeder rising to MAIN bus incoming tap
  const gen = TOPO.devices.find(d => d.node_type === 'L1-5' && d.sheet_id === sheetId);
  if (gen) {
    const genX = emSwbdStartX - 500;
    // uniform section height: center gen vertically relative to switchboard
    const genY = swAnchorY + DIM.sw_section_h/2 - DIM.gen_r;
    G[gen.id] = { x: genX, y: genY };
    svg += renderDevice(gen, G[gen.id]);
    renderedIds.add(gen.id);

    // Gen feeder: gen_out → EMSB MAIN bus incoming tap (r-040 end = r-903 bus_tap_bi)
    const genR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.sheet_id === sheetId
      && r.start && r.start.device_id === gen.id && r.start.port === 'gen_out');
    if (genR1) {
      // gen_out at bottom of gen circle (per L1-5 spec port): center + (0, gen_r) then stub 20 below
      const genOutX = genX + DIM.gen_r;
      const genOutY = genY + 2*DIM.gen_r + 20;  // after stub
      // OFF-010: gen_out may feed an ATS source2_in directly
      // (ATS-upstream-of-board pattern) instead of the hospital's
      // gen → EMSB main-bus tap. Route: short rail below the gen, across to a
      // lane LEFT of the board, up to the source2 feeder row, right to the
      // source2 endpoint (spec port (105,200) → feeder end at ats.y+ats_S+60,
      // same convention as the Chain-C source2 feeders). Hospital gen feeders
      // all end at a bus tap, so this branch is unreachable for the golden case.
      const _src2Ats = (genR1.end && genR1.end.port === 'source2_in') ? devMap[genR1.end.device_id] : null;
      if (_src2Ats && G[_src2Ats.id]) {
        const src2X = G[_src2Ats.id].x + ATS_PORT_S2_X;  // family-measured port x
        const src2Y = G[_src2Ats.id].y + boxH('L2-3');
        const railY = genOutY + 30;
        const laneX = emSwbdStartX - 150;
        svg += `<g class="feeder" data-id="${genR1.id}" style="cursor:pointer"><polyline points="${genOutX},${genOutY} ${genOutX},${railY} ${laneX},${railY} ${laneX},${src2Y} ${src2X},${src2Y}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
        svg += renderR1Tags(genR1, genOutX, genOutY + 40, 'right');
        renderedIds.add(genR1.id);
      } else {
      // Route: down from gen_out to a low rail, right to incoming bus tap X, up to MAIN bus Y
      const incX = (incSecX != null ? incSecX : emSwbdStartX + 100);
      // tap the MAIN bus, not the old single dist bus
      const mainBusY = swAnchorY + DIM.sw_main_bus_offset;

      // jogY placed 30 px BELOW the Level 1 annotation line
      // direction. Level 1 line renders in a later pass (renderLevelLines) but
      // its Y is deterministic: max of (L1 equipment maxBottomY, switchboard
      // envelope bottom) + MARGIN. Replicate that calculation here so the
      // F-040 horizontal run is pinned 30 px below where the L1 line WILL land.
      // MARGIN mirrors renderLevelLines: level_line_y_margin + 20 = 40 px.
      const L1_MARGIN = DIM.level_line_y_margin + 20;
      const L1_OFFSET_BELOW = 30;  // horizontal run 30 px below L1 line
      const swBottomY = swAnchorY + DIM.sw_section_h;
      // Scan L1-tagged placed devices (use LEVEL_MAP to stay consistent
      // with renderLevelLines' perFloor bucket; switchboard-internal types
      // are excluded by LEVEL_EXCLUDE_TYPES just like the level-line pass).
      let l1MaxBottom = swBottomY;
      TOPO.devices.forEach(d => {
        if (d.sheet_id !== sheetId) return;
        if (LEVEL_EXCLUDE_TYPES.has(d.node_type)) return;
        if (LEVEL_MAP[d.designation] !== '1') return;
        const gdev = G[d.id];
        if (!gdev) return;
        const bottomY = gdev.y + symbolHeight(d);
        if (bottomY > l1MaxBottom) l1MaxBottom = bottomY;
      });
      const L1_Y = l1MaxBottom + L1_MARGIN;
      const jogY = L1_Y + L1_OFFSET_BELOW;

      svg += `<g class="feeder" data-id="${genR1.id}" style="cursor:pointer"><polyline points="${genOutX},${genOutY} ${genOutX},${jogY} ${incX},${jogY} ${incX},${mainBusY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
      svg += `<circle cx="${incX}" cy="${mainBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
      // GEOMETRY EXPORT HOOK: the emergency board's
      // generator/EMSB × main-bus incoming dot is drawn inline here and
      // exported the same way as the NORMAL sheet's incoming dot.
      // Capture it as geometry.bus_dots, mirroring the normal-incoming hook.
      // Gated on incSecId: when there is no incoming section, incX uses the
      // emSwbdStartX+100 fallback and there is no valid section id to host the
      // dot — both validator twins require host_device_id ∈ topology sections, so
      // the push must be skipped rather than emit an orphan.
      if (incSecId != null && window.__GEOM_CAP && window.__GEOM_CAP.busDots) {
        window.__GEOM_CAP.busDots.push({
          id: 'bd-' + sheetId + '-incoming', sheet: sheetId,
          host_device_id: incSecId, role: 'incoming', x: incX, y: mainBusY
        });
      }
      // Tags on the gen feeder — anchor near middle of the vertical drop
      // (genOutY → jogY). The vertical run is now much longer; place tag at
      // genOutY + 40 to keep it near the top (close to the generator).
      const genTagY = genOutY + 40;
      svg += renderR1Tags(genR1, genOutX, genTagY, 'right');
      renderedIds.add(genR1.id);
      }
    }
  }

  // === ATS load_out feeders → E4S/O4S panels ===
  // Each ATS load_out stub goes UP, then to an emergency sub-distribution panel placed above it
  ordered.forEach(ats => {
    const loadR1 = TOPO.routed_elements.find(r => r.edge_type === 'R-1' && r.sheet_id === sheetId
      && r.start && r.start.device_id === ats.id && r.start.port === 'load_out');
    if (!loadR1 || !loadR1.end) return;
    const dst = devMap[loadR1.end.device_id];
    const atsLoadX = G[ats.id].x + boxW('L2-3')/2;  // load_out on the box top-center
    // feeders terminate ON the family-box edge (no external stub).
    // Combined with the ay = atsY − 30 anchor shift this lands on the exact
    // legacy stub-end Y, keeping the load-side rows frozen.
    const atsLoadY = G[ats.id].y;
    if (!dst) {
      // OFF-010: a load_out endpoint may name a ROUTED-ELEMENT id —
      // a bus tap (dialect decision: R-2 bus ids are first-class endpoints,
      // mirroring the incoming-service r-203-style utility→main-bus tap).
      // Route the load feeder up from the stub, across to the board's incoming
      // lane, and down onto the bus. Every hospital load_out resolves in
      // devMap, so this branch is unreachable for the golden case.
      const busRe = reMap[loadR1.end.device_id];
      if (busRe && busRe.edge_type === 'R-2') {
        const busY = swAnchorY + (busRe.bus_level === 'distribution' ? DIM.sw_dist_bus_offset
                     : busRe.bus_level === 'main' ? DIM.sw_main_bus_offset : DIM.sw_sec_bus_offset);
        const dropX = (incSecX !== null && incSecX !== undefined) ? incSecX : atsLoadX;
        const clearY = atsLoadY - 60;
        svg += `<g class="feeder" data-id="${loadR1.id}" style="cursor:pointer"><polyline points="${atsLoadX},${atsLoadY} ${atsLoadX},${clearY} ${dropX},${clearY} ${dropX},${busY}" fill="none" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}" stroke-linejoin="miter"/></g>`;
        svg += `<circle cx="${dropX}" cy="${busY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
        // Tag anchors ON the short 60px riser (its midpoint), not tag_gap above
        // it — tag_gap exceeds the riser length here, which floated the pill in
        // empty air above the horizontal rail (office S3 review finding).
        svg += renderR1Tags(loadR1, atsLoadX, (atsLoadY + clearY) / 2, 'right');
        renderedIds.add(loadR1.id);
      }
      return;
    }

    if (dst.node_type === 'L2-4') {
      // Panel above ATS
      // Panel feed_bottom pinned to the frozen row (gap chain above the ATS
      // load stub); the anchor rides the box height.
      const panelBotY = atsLoadY - DIM.tag_gap - DIM.equip_gap - DIM.equip_stub;
      const panelY = panelBotY - symbolHeight(dst);
      G[dst.id] = { x: atsLoadX - symbolWidth(dst)/2, y: panelY };
      svg += renderDevice(dst, G[dst.id]);
      renderedIds.add(dst.id);
      svg += `<g class="feeder" data-id="${loadR1.id}" style="cursor:pointer"><line x1="${atsLoadX}" y1="${atsLoadY}" x2="${atsLoadX}" y2="${panelBotY}" stroke="var(--sld-feeder)" stroke-width="${DIM.feeder_stroke}"/></g>`;
      svg += renderR1Tags(loadR1, atsLoadX, atsLoadY - DIM.tag_gap, 'right');
      renderedIds.add(loadR1.id);
    } else if (dst.node_type === 'L3-1') {
      // L3-1 Fire Pump placement fix (port-anchor conformance).
