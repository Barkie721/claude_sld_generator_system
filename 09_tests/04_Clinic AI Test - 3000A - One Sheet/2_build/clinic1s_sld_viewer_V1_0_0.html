<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLD Viewer</title>
<meta name="description" content="Single-line diagram viewer">
<meta name="issue-date" content="2026-07-16">
<meta name="revision" content="1.0.19">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>⚡</text></svg>">
<style>
:root{
  /* Dark palette. SLD symbol colors (--sld-line/pink/section/em) tuned for
     readability on dark canvas. */
  --bg:#161c2e;--bg-panel:#1d2638;--bg-card:#243049;--border:#324666;
  --text:#d4dce8;--text-dim:#7d8fab;--accent:#00e5ff;
  --canvas-bg:#1c2438;
  --sld-line:#00FFFF;--sld-feeder:#8899aa;--sld-pink:#FF69B4;
  --sld-section:#39FF14;--sld-text:#FFFFFF;
  --sld-tag-bg:rgba(0,229,255,0.12);--sld-tag-border:rgba(0,229,255,0.5);
  --sld-em:#FFAA00;
  /* A-4 fault-current pennant color */
  --sld-fc:#FF3333;
  /* NEC class colors */
  --sld-nec700:#E85A5A;
  --sld-nec701:#E8A845;
  --sld-nec702:#5AC87A;
  --sld-hex:#FFD54F;
  --sld-panel-bg:#1d2638;
}
/* Light theme. Cool off-white canvas (~3% blue tint) reduces glare vs.
   pure white. --sld-feeder uses a cool mid-gray on light canvas to keep
   feeders distinct from buses. Sidebar, controls, schema panel, tooltip
   stay dark (drafting-surface-only light mode). */
:root[data-theme="light"]{
  --canvas-bg:#eef2f8;
  --sld-line:#0a1424;--sld-feeder:#5a6680;--sld-pink:#b82d61;
  --sld-section:#2a8a2f;--sld-text:#0a1424;
  --sld-tag-bg:rgba(10,20,36,0.06);--sld-tag-border:rgba(10,20,36,0.45);
  --sld-em:#b25900;
  /* A-4 fault-current pennant color on light canvas */
  --sld-fc:#CC0000;
  --sld-nec700:#b83d3d;
  --sld-nec701:#a87200;
  --sld-nec702:#2e7c3f;
  --sld-hex:#c49000;
}
/* Theme transition — canvas only (SVG inherits CSS-variable changes) */
#canvas-wrap{transition:background-color .15s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Courier New',monospace;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#app{display:flex;height:100vh}
#sidebar{width:260px;min-width:260px;background:var(--bg-panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
#sidebar h1{font-size:13px;padding:16px 14px 8px;color:var(--accent);letter-spacing:1px;text-transform:uppercase}
.sidebar-section{padding:10px 14px;border-top:1px solid var(--border)}
.sidebar-section h2{font-size:11px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sheet-btn{display:block;width:calc(100% - 20px);margin:4px 10px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text);font:12px 'Courier New',monospace;cursor:pointer;text-align:left;transition:all .15s}
.sheet-btn:hover{border-color:var(--accent);background:#172033}
.sheet-btn.active{border-color:var(--accent);background:rgba(0,229,255,.08);color:var(--accent)}
.sh-num{font-weight:700}.sh-desc{display:block;font-size:10px;color:var(--text-dim);margin-top:3px}
.stat-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
.stat-row .val{color:var(--accent);font-weight:700}
.legend-item{display:flex;align-items:center;gap:8px;font-size:10px;padding:3px 0}
.legend-swatch{width:20px;height:3px;border-radius:1px}
/* In light mode, the SLD ink variables flip to near-black/muted. The
 sidebar chrome stays dark, so ink-on-dark-sidebar is unreadable.
 Wrap each swatch in a mini white "paper" patch matching the canvas
 so the swatch reads accurately. */
:root[data-theme="light"] .legend-swatch{box-shadow:0 0 0 3px #ffffff;margin:0 3px}
.controls{padding:10px 14px;border-top:1px solid var(--border)}
.ctrl-btn{display:inline-block;padding:5px 10px;margin:2px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:10px 'Courier New',monospace;cursor:pointer;transition:all .15s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.render-cov{font-size:10px;color:var(--text-dim);padding:8px 14px;border-top:1px solid var(--border)}
.render-cov .ok{color:#39ff14;font-weight:700}
.render-cov .miss{color:#ff4444;font-weight:700}
.render-cov .warn{color:#ffb347;font-weight:700}
#canvas-wrap{flex:1;position:relative;overflow:hidden;background:var(--canvas-bg)}
#canvas-wrap svg{position:absolute;top:0;left:0;transform-origin:0 0}
#tooltip{display:none;position:fixed;z-index:999;background:#0e1420ee;border:1px solid var(--accent);border-radius:6px;padding:10px 14px;font:11px 'Courier New',monospace;color:var(--text);max-width:340px;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
/* Click-to-copy toast — appears near cursor for ~1.2s after a device click.
   Positioned by JS (transform is used to shift above cursor and allow the
   CSS fade animation to remain composable with the positional transform). */
#copy-toast{display:none;position:fixed;z-index:1000;background:#0e1420ee;border:1px solid var(--accent);border-radius:4px;padding:6px 10px;font:11px 'Courier New',monospace;color:var(--accent);pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.5);transform:translate(-50%,-100%);white-space:nowrap}
#copy-toast.err{border-color:#ff4444;color:#ff4444}
#copy-toast.show{display:block;animation:copy-toast-fade 1.2s ease-out forwards}
@keyframes copy-toast-fade{
  0%{opacity:0;transform:translate(-50%,-80%)}
  15%{opacity:1;transform:translate(-50%,-100%)}
  75%{opacity:1;transform:translate(-50%,-100%)}
  100%{opacity:0;transform:translate(-50%,-110%)}
}
/* Clickable element cursor hint — pointer on every copyable group */
#sld-svg g.dev, #sld-svg g.feeder, #sld-svg g.bus, #sld-svg g.squiggle, #sld-svg g.section, #sld-svg g.level-line, #sld-svg g.fc-pennant{cursor:pointer}
/* Fix 1 (v1.0.0) — Keyboard focus indicator for interactive SVG groups.
   SVG `outline` rendering is inconsistent across engines; use drop-shadow
   filters so the ring scales with the SVG transform and reads cleanly in
   both themes. Hidden by default (focus-visible only fires on keyboard
   focus, not click focus). */
#sld-svg g[tabindex="0"]:focus { outline: none; }
#sld-svg g[tabindex="0"]:focus-visible {
  filter: drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 6px var(--accent));
}
#tooltip .tt-title{color:var(--accent);font-weight:700;margin-bottom:4px}
#zoom-ind{position:absolute;bottom:12px;right:12px;background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font:10px 'Courier New',monospace;color:var(--text-dim)}
/* Clipboard accumulator panel — each click on a copyable element appends
   to a running list shown here; the joined list is mirrored to the system
   clipboard on every update so the user can paste at any time. */
#clipboard-section .clip-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#clipboard-section .clip-count{color:var(--accent);font-weight:700;font-size:10px}
#clipboard-section .clip-list{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;background:var(--bg-card);padding:4px 6px;margin-bottom:6px;font-size:10px;line-height:1.5}
#clipboard-section .clip-empty{color:var(--text-dim);font-style:italic;padding:2px 0}
#clipboard-section .clip-item{color:var(--text);padding:1px 0;font-family:'Courier New',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clipboard-section .clip-clear{display:block;width:100%;padding:5px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:10px 'Courier New',monospace;cursor:pointer;transition:all .15s}
#clipboard-section .clip-clear:hover{border-color:#ff4444;color:#ff4444}
#clipboard-section .clip-clear:disabled{opacity:.4;cursor:not-allowed}
#clipboard-section .clip-clear:disabled:hover{border-color:var(--border);color:var(--text-dim)}
/* Fix 5 (v1.0.0) — Keyboard shortcut help overlay. Centered modal with
   semi-opaque backdrop. Hidden by default; '?' toggles. Focus is trapped
   while open and restored on close. */
#help-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(10,15,25,0.82);align-items:center;justify-content:center;padding:20px}
#help-overlay-card{background:var(--bg-panel);border:1px solid var(--accent);border-radius:8px;padding:20px 24px;max-width:560px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.6)}
#help-overlay-card h2{font-size:14px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#help-overlay-close{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text-dim);font:11px 'Courier New',monospace;padding:3px 8px;cursor:pointer}
#help-overlay-close:hover,#help-overlay-close:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
#help-overlay-body{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;font-size:11px}
#help-overlay-body .help-group h3{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:3px}
#help-overlay-body dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
#help-overlay-body dt{color:var(--accent);font-weight:700;font-family:'Courier New',monospace;white-space:nowrap}
#help-overlay-body dd{color:var(--text)}
/* ============================================================
   v1.1.0 — Responsive sidebar, collapsible sections, layer toggles,
   touch navigation. Appended as an override block so the original
   rules above stay greppable.
   ============================================================ */
body{overscroll-behavior:none}
/* Touch gestures are handled in JS (pointer events); stop the browser
   from claiming them for scroll/pinch-page-zoom. */
#canvas-wrap{touch-action:none}
/* Sections become cards with tappable collapse headers */
.sidebar-section{padding:0;border:1px solid var(--border);border-radius:8px;margin:6px 8px;background:var(--bg-card)}
.sec-head{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;min-height:40px;background:transparent;border:0;color:var(--text-dim);font:11px 'Courier New',monospace;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;text-align:left}
.sec-head h2{margin:0}
.sec-head .head-meta{margin-left:auto}
.sec-head .chev{font-size:10px;transition:transform .15s}
.sec-head:hover h2,.sec-head:hover .chev{color:var(--accent)}
.sec-body{padding:0 12px 10px}
.sidebar-section.collapsed .sec-body{display:none}
.sidebar-section.collapsed .chev{transform:rotate(-90deg)}
.ver-tag{font-size:9px;color:var(--text-dim);padding:0 14px 8px;margin-top:-8px}
/* sheet-btn margins were tuned for the old flush sections; inside cards
   use the card's own padding */
.sheet-btn{width:100%;margin:4px 0}
/* Legend layer toggles */
label.legend-item{cursor:pointer}
.layer-cb{accent-color:var(--accent);width:14px;height:14px;flex:none;margin:0}
/* Hidden layers: visibility (NOT display) — renderCurrentSheet() computes
   the viewBox from getBBox(), which excludes display:none subtrees and
   would warp the fit. visibility also disables pointer events, so hidden
   layers can't be hovered or click-copied. */
#sld-svg.layer-hide-feeder g.feeder,#sld-svg.layer-hide-feeder g.feeder-tag,
#sld-svg.layer-hide-section g.section,
#sld-svg.layer-hide-squiggle g.squiggle,
#sld-svg.layer-hide-level g.level-line,
#sld-svg.layer-hide-notes g.hex-note,#sld-svg.layer-hide-notes g.fc-pennant{visibility:hidden}
/* Sidebar toggle (hamburger) — floats over the canvas in every layout */
#sidebar-toggle{position:absolute;top:10px;left:10px;z-index:60;width:42px;height:42px;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--accent);font-size:18px;cursor:pointer;transition:border-color .15s}
#sidebar-toggle:hover{border-color:var(--accent)}
/* Wide layout: hamburger collapses the rail entirely */
#app.sidebar-hidden #sidebar{display:none}
#sidebar-backdrop{display:none}
/* Narrow layout (Fold cover screen / phone portrait): off-canvas drawer */
@media (max-width:720px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:100;width:min(84vw,320px);min-width:0;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 32px rgba(0,0,0,.5)}
  #app.drawer-open #sidebar{transform:none}
  /* the drawer overrides the desktop rail-collapse state */
  #app.sidebar-hidden #sidebar{display:flex}
  #sidebar-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5)}
  #help-overlay-body{grid-template-columns:1fr}
  #help-overlay-card{padding:14px 16px;max-height:85vh}
}
/* Comfortable touch targets on narrow or coarse-pointer devices */
@media (max-width:720px),(pointer:coarse){
  .ctrl-btn{min-height:40px;font-size:12px;padding:8px 12px}
  .sheet-btn{min-height:44px;font-size:13px}
  .sec-head{min-height:44px;font-size:12px}
  .sec-head h2{font-size:12px}
  .legend-item{min-height:36px;font-size:12px}
  .layer-cb{width:18px;height:18px}
  #zoom-ind{font-size:12px;padding:6px 12px}
}
</style>
</head>
<body>
<div id="app">
<div id="sidebar">
  <h1 id="app-heading">SLD</h1>
  <div id="app-version" class="ver-tag"></div>
  <div class="sidebar-section" data-sec="project">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Project</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <div id="project-facts" style="font-size:10px;color:var(--text-dim);line-height:1.5"></div>
    </div>
  </div>
  <div class="sidebar-section" data-sec="sheets">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Sheets</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <!-- Sheet buttons are generated from TOPO.sheets by init() (they
         were once hardcoded to S1/S2, which made a 4-sheet topology's
         continuation sheets unreachable in the browser). -->
    <div class="sec-body" id="sheet-list"></div>
  </div>
  <div class="sidebar-section" id="stats-section" data-sec="stats">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Composition</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body" id="stats-body"></div>
  </div>
  <div class="sidebar-section" id="clipboard-section" data-sec="clipboard">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Clipboard</h2>
      <span class="head-meta clip-count" id="clip-count">0 items</span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <div class="clip-list" id="clip-list"></div>
      <button type="button" class="clip-clear" id="clip-clear" disabled>Clear</button>
    </div>
  </div>
  <div class="sidebar-section" data-sec="legend">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Legend / Layers</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body" id="legend-body">
      <div class="legend-item"><div class="legend-swatch" style="background:var(--sld-line);height:3px"></div>Main bus 2.5pt</div>
      <div class="legend-item"><div class="legend-swatch" style="background:var(--sld-line);height:2px"></div>Secondary bus 2.0pt</div>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="feeder" checked><div class="legend-swatch" style="background:var(--sld-feeder);height:1.5px"></div>Feeders 1.5pt</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="section" checked><div class="legend-swatch" style="background:var(--sld-section)"></div>Section boundaries</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="squiggle" checked><div class="legend-swatch" style="background:var(--sld-pink)"></div>Bus tees / squiggles</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="level" checked><div class="legend-swatch" style="background:var(--sld-text)"></div>Level lines</label>
      <label class="legend-item"><input type="checkbox" class="layer-cb" data-layer="notes" checked><div class="legend-swatch" style="background:var(--sld-hex)"></div>Notes &amp; FC pennants</label>
    </div>
  </div>
  <div class="sidebar-section" data-sec="controls">
    <button type="button" class="sec-head" aria-expanded="true">
      <h2>Controls</h2><span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="sec-body">
      <button type="button" class="ctrl-btn" id="zoom-in-btn">Zoom +</button>
      <button type="button" class="ctrl-btn" id="zoom-out-btn">Zoom −</button>
      <button type="button" class="ctrl-btn" id="fit-btn">Fit</button>
      <button type="button" class="ctrl-btn" id="reset-btn">Reset</button>
      <button type="button" class="ctrl-btn" id="theme-toggle" title="Toggle light/dark theme" aria-label="Switch to light theme">☾ Dark</button>
      <button type="button" class="ctrl-btn" id="export-geom-btn" title="Export computed geometry as a JSON 'geometry' block for the Revit add-in">⤓ Export Geometry</button>
      <button type="button" class="ctrl-btn" id="snapshot-btn" title="Save a clean PNG of this sheet (full diagram, ignores pan/zoom). Shift+S saves the SVG parity artifact.">📷 Snapshot</button>
      <button type="button" class="ctrl-btn" id="page-dl-btn" title="Save a clean PNG of the composed Arch E1 sheet (diagram + title-block frame; ignores pan/zoom).">🗎 Page PNG</button>
      <button type="button" class="ctrl-btn" id="element-snap-btn" title="Save a cropped PNG of the last-clicked element (tap an element first; key: L)">🔍 Element</button>
      <button type="button" class="ctrl-btn" id="audit-btn" title="Run the geometry audit and toggle red finding boxes (key: V)">✓ Check</button>
    </div>
  </div>
  <div class="render-cov" id="render-cov"></div>
  <div class="render-cov" id="audit-panel" style="display:none"></div>
</div>
<div id="canvas-wrap">
  <svg id="sld-svg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="zoom-ind">100%</div>
  <button type="button" id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
</div>
<div id="sidebar-backdrop" hidden></div>
</div>
<div id="tooltip" role="tooltip" aria-hidden="true"></div>
<div id="copy-toast" role="status" aria-live="polite" aria-atomic="true"></div>
<!-- Fix 5 (v1.0.0): Keyboard shortcut help overlay. Toggle with '?'. -->
<div id="help-overlay" role="dialog" aria-modal="true" aria-labelledby="help-overlay-title" aria-hidden="true">
  <div id="help-overlay-card">
    <h2 id="help-overlay-title">
      Keyboard Shortcuts
      <button type="button" id="help-overlay-close" aria-label="Close help">Close (Esc)</button>
    </h2>
    <div id="help-overlay-body"><!-- populated by showHelpOverlay() --></div>
  </div>
</div>

<script>
// ============================================================
// SLD Viewer — branding is data-driven from TOPO.metadata (heading/facts)
// Schema: sld_topology/v1 | NEC 2023 | Sheet template: 36x48
// ============================================================
// TOPOLOGY
// ============================================================
const TOPO = {
  "$schema": "sld_topology/v1",
  "metadata": {
    "schema_version": "1.0.0",
    "project_name": "Clinic AI Test — 3000 A Service",
    "created_date": "2026-10-20",
    "slug": "clinic1s",
    "heading": "Clinic AI Test",
    "facts": [
      "3000 A service, 480Y/277V 3PH 4W, 2500 kVA utility transformer (derived)",
      "20,000 SF outpatient clinic — one storey, NEC 517",
      "1000 kW generator; LS 225 A / Critical 400 A / Equipment 1200 A ATSs",
      "No fire pump"
    ],
    "created_by": "AI Compositor",
    "checked_by": null,
    "revised_date": null,
    "nec_edition": "2023",
    "sheet_template": "30x42",
    "px_per_inch": 96,
    "data_layer_versions": {
      "sld_sheet_templates": "V1_0_0",
      "feeder_schedule": "V1_0_0",
      "3_phase_transformer_feeder_schedule": "V1_0_0",
      "transformer_impedance": "V1_0_0",
      "equipment_designation_legend": "V1_0_0",
      "nec_standard_ratings": "V1_0_0"
    },
    "compositor_halts": [
      {
        "id": "HALT-001",
        "topic": "Feeder distances",
        "text": "COMPOSITOR_HALT: feeder distances not provided (T3-EOR). No voltage-drop calculation performed; no A-5 tags. Fault current below each bus is NOT attenuated for feeder impedance — the 56.5 kA service value is a conservative bound for every 480 V normal-side device, and the 208 V values are infinite-primary-bus bounds.",
        "nec_reference": "NEC 210.19(A) IN / 215.2(A)(1) IN",
        "blocks": "Voltage-drop calculation · A-5 tags · per-device fault current"
      },
      {
        "id": "HALT-002",
        "topic": "Utility fault current + transformer impedance — DERIVED, not confirmed",
        "text": "COMPOSITOR_HALT: utility available fault current and the utility transformer nameplate were not provided. Derived on a worst-case basis: 2500 kVA (next standard size above the 2494 kVA a 3000 A / 480 V service needs), %Z 5.75 less the IEEE C57.12.00 -7.5% tolerance = 5.319%, infinite primary bus: 3007 A / 0.05319 = 56,535 A sym, so 65 kAIC. No motor contribution. The utility letter and transformer nameplate must confirm before AIC ratings are released for procurement.",
        "nec_reference": "NEC 110.9 / 110.24",
        "blocks": "AIC ratings released for procurement · DV-4 bus bracing verified against utility data"
      },
      {
        "id": "HALT-003",
        "topic": "Connected-load schedule / service adequacy",
        "text": "COMPOSITOR_HALT: no connected-load or panel schedule was provided (T3-EOR). Every panel rating not stated by the owner is a Tier-2 default and no NEC 220 / 517 demand calculation was performed. Note the stated 3000 A service is 125 VA/SF on 20,000 SF — roughly 4-8x a typical outpatient clinic. Live feeder trips total 2920 A on the 3000 A bus.",

// ============================================================
// TOPOLOGY VALIDATION (v1.0.0)
// Runtime check that catches reference-integrity drift, schema-version
// mismatches, and (when window.__sldDebug is true) advisory calc-field
// gaps. Runs once at init; result on window.__topologyIssues. Reference
// checks are zero-cost (Sets); calc-field hints are gated behind a debug
// flag because the current TOPO has them sparsely populated by design —
// flooding the render-coverage panel with ~90 warnings on every load
// would defeat the purpose of the panel.
// ============================================================
const EXPECTED_SCHEMA = '1.0.0';
const KNOWN_PRIOR_SCHEMAS = [];

function validateTopology() {
  const issues = [];
  const err  = (code, msg) => issues.push({ level: 'error', code, msg });
  const warn = (code, msg) => issues.push({ level: 'warn',  code, msg });

  // ---- Schema version
  const sv = TOPO.metadata && TOPO.metadata.schema_version;
  if (!sv) {
    err('SCHEMA_MISSING', 'metadata.schema_version is missing');
  } else if (sv === EXPECTED_SCHEMA) {
    // ok
  } else if (KNOWN_PRIOR_SCHEMAS.indexOf(sv) !== -1) {
    warn('SCHEMA_PRIOR', `schema ${sv} is a known prior version (expected ${EXPECTED_SCHEMA})`);
  } else {
    err('SCHEMA_UNKNOWN', `schema ${sv} not recognized (expected ${EXPECTED_SCHEMA})`);
  }

  // ---- Build resolver sets
  const devIds = new Set(TOPO.devices.map(d => d.id));
  const reIds  = new Set(TOPO.routed_elements.map(r => r.id));
  const swIds  = new Set((TOPO.switchboards || []).map(s => s.id));
  const secIds = new Set((TOPO.sections || []).map(s => s.id));
  const sheetIds = new Set(TOPO.sheets.map(s => s.sheet_id));

  // ---- Routed element endpoints (skip null starts/ends — buses are null by design)
  // Endpoint IDs are nominally device IDs but the data also includes
  // bus-tap cases where a feeder terminates directly into a routed_element
  // (e.g. r-040 → r-903 bus). Treat those as warn (resolvable, just not
  // in the collection the field name implies), and only error on truly
  // unresolved IDs.
  TOPO.routed_elements.forEach(r => {
    if (r.start && r.start.device_id) {
      if (devIds.has(r.start.device_id)) { /* ok */ }
      else if (reIds.has(r.start.device_id)) {
        warn('RE_START_BUSTAP', `${r.id}: start.device_id "${r.start.device_id}" resolves to a routed_element, not a device (bus-tap)`);
      } else {
        err('RE_START_ORPHAN', `${r.id}: start.device_id "${r.start.device_id}" not found in devices or routed_elements`);
      }
    }
    if (r.end && r.end.device_id) {
      if (devIds.has(r.end.device_id)) { /* ok */ }
      else if (reIds.has(r.end.device_id)) {
        warn('RE_END_BUSTAP', `${r.id}: end.device_id "${r.end.device_id}" resolves to a routed_element, not a device (bus-tap)`);
      } else {
        err('RE_END_ORPHAN', `${r.id}: end.device_id "${r.end.device_id}" not found in devices or routed_elements`);
      }
    }
  });

  // ---- Annotation bound_to (devices ∪ routed_elements ∪ switchboards ∪ sections)
  TOPO.annotations.forEach(a => {
    if (!a.bound_to) return;
    const resolved =
      devIds.has(a.bound_to) ||
      reIds.has(a.bound_to)  ||
      swIds.has(a.bound_to)  ||
      secIds.has(a.bound_to);
    if (!resolved) {
      err('ANN_BOUND_ORPHAN', `${a.id}: bound_to "${a.bound_to}" not found in any entity collection`);
    }
  });

  // ---- Cross-sheet refs
  (TOPO.cross_sheet_refs || []).forEach(cs => {
    if (!reIds.has(cs.source_routed_element_id)) {
      err('XS_SRC_ORPHAN', `${cs.id}: source_routed_element_id "${cs.source_routed_element_id}" not found`);
    }
    if (!reIds.has(cs.dest_routed_element_id)) {
      err('XS_DEST_ORPHAN', `${cs.id}: dest_routed_element_id "${cs.dest_routed_element_id}" not found`);
    }
    if (!sheetIds.has(cs.source_sheet)) {
      err('XS_SRC_SHEET', `${cs.id}: source_sheet "${cs.source_sheet}" not in TOPO.sheets`);
    }
    if (!sheetIds.has(cs.dest_sheet)) {
      err('XS_DEST_SHEET', `${cs.id}: dest_sheet "${cs.dest_sheet}" not in TOPO.sheets`);
    }
    if (cs.source_sheet === cs.dest_sheet) {
      err('XS_SAME_SHEET', `${cs.id}: source_sheet equals dest_sheet ("${cs.source_sheet}")`);
    }
  });

  // ---- Sheet partitioning sanity (every entity's sheet_id is known)
  const checkSheet = (collection, label) => {
    (collection || []).forEach(e => {
      if (e.sheet_id && !sheetIds.has(e.sheet_id)) {
        err('SHEET_UNKNOWN', `${label} ${e.id}: sheet_id "${e.sheet_id}" not in TOPO.sheets`);
      }
    });
  };
  checkSheet(TOPO.devices, 'device');
  checkSheet(TOPO.routed_elements, 'routed_element');
  checkSheet(TOPO.annotations, 'annotation');
  checkSheet(TOPO.switchboards, 'switchboard');

  // ---- Calc-field expectation hints (advisory; debug-gated)
  // Today's TOPO has calc_fields sparsely populated by design — emitting
  // these by default would flood the panel with ~90 warnings. Enable with
  // window.__sldDebug = true and reload to surface them.
  if (typeof window !== 'undefined' && window.__sldDebug === true) {
    TOPO.devices.forEach(d => {
      const df = d.data_fields || {}, cf = d.calc_fields || {};
      if (d.node_type === 'L0-1' && df.kva_rating && cf.fla == null) {
        warn('CALC_FLA_MISSING', `${d.id} (${d.designation}): xfmr has kva_rating but no calc_fields.fla`);
      }
      if (d.node_type === 'L1-1' && df.at && cf.aic_required == null) {
        warn('CALC_AIC_MISSING', `${d.id} (${d.designation}): main has at-rating but no calc_fields.aic_required`);
      }
    });
    TOPO.routed_elements.forEach(r => {
      const cf = r.calc_fields || {};
      if (r.edge_type === 'R-1' && cf.conductors_per_phase != null && cf.ampacity == null) {
        warn('CALC_AMPACITY_MISSING', `${r.id} (${r.designation}): feeder has conductors_per_phase but no calc_fields.ampacity`);
      }
    });
  }

  return issues;
}

// ============================================================
// WIDTH-CONTRIBUTION MODEL
// ============================================================
// Every CB contributes a left-side and right-side half-width at the 208V row.
// The real clash driver isn't the CB body — it's whatever the CB eventually
// feeds below it. Chain B with internal sub-chains contributes the WIDEST
// downstream footprint because each internal column is ±110 from parent
// center and carries a 140-wide 208V panel (±70 from column).
//
// Contribution table:
// Bus-row only (no panel below) → 70 (CB body half)
// Chain A (single panel below) → 70 (panel half-width, centered on CB)
// Chain B (single TX → panel) → 70 (same footprint as Chain A)
// Chain B-internal, n=2 subchains → 180 (internal column offset ±110 +
// panel half ±70 = 180 from CB)
// Chain B-internal, n=3 subchains → 230 (uses wideSpacing=320: ±160 + 70)
// Chain B-internal, n=1 subchain → 70 (no spread)
// With tag-pill budget on TX primary feeder, add 30 (pill sticks right):
// right-side contribution adds +30 if chain has a TX primary tag
//
// The pitch between adjacent CBs =
// max(breaker_pitch_min, left.right_contrib + right.left_contrib + panel_clearance)
// ============================================================

// For a parent sub-distribution panel (L2-4 fed from a bus CB), how many
// internal TX sub-chains does it carry? Returns 0 if it's not a sub-dist
// panel with internals.
function _internalSubChainCount(parentPanel) {
  if (!parentPanel || parentPanel.node_type !== 'L2-4') return 0;
  return TOPO.devices.filter(d =>
    d.node_type === 'L2-1' &&
    d.data_fields && d.data_fields.internal_to === parentPanel.designation &&
    d.sheet_id === parentPanel.sheet_id
  ).length;
}

// Given a bus-row CB, return {left, right} half-width contributions in px.
// Symmetric (left == right) except for the TX primary A-1 tag-pill budget
// applied on the right side only.
function _cbWidthContribution(cbDev) {
  const TAG_PILL_BUDGET = 30;    // A-1 tag pill + leader on TX primary feeder
  const PANEL_HALF = DIM.panel_slot_S / 2;                         // 70 (frozen spacing)
  const INTERNAL_N2_CONTRIB = 110 + PANEL_HALF;                    // 180
  const INTERNAL_N3_CONTRIB = 160 + PANEL_HALF;                    // 230 (wideSpacing/2 + panel half)

  if (!cbDev || cbDev.node_type !== 'L2-1') {
    return { left: PANEL_HALF, right: PANEL_HALF };
  }
  // Internal CBs don't live on the bus row; width contribution only applies
  // at the bus row. Caller should have already filtered these out.
  if (cbDev.data_fields && cbDev.data_fields.internal_to) {
    return { left: PANEL_HALF, right: PANEL_HALF };
  }

  // Find the R-1 where this CB is the source
  const r1 = TOPO.routed_elements.find(r =>
    r.edge_type === 'R-1' && r.start &&
    r.start.device_id === cbDev.id && r.start.port === 'line_in');
  if (!r1 || !r1.end) {
    // CB that feeds nothing tangible (edge case) — just CB body
    return { left: PANEL_HALF, right: PANEL_HALF };
  }
  const dst = devMap[r1.end.device_id];
  if (!dst) return { left: PANEL_HALF, right: PANEL_HALF };

  // Chain A: direct panel below CB — panel half-width
  if (dst.node_type === 'L2-4') {
    const n = _internalSubChainCount(dst);
    if (n >= 3) {
      return { left: INTERNAL_N3_CONTRIB, right: INTERNAL_N3_CONTRIB + TAG_PILL_BUDGET };
    }
    if (n === 2) {
      return { left: INTERNAL_N2_CONTRIB, right: INTERNAL_N2_CONTRIB + TAG_PILL_BUDGET };
    }
    // SUB-FEED PARENT SAFETY MARGIN
    // If this L2-4 is a parent with feed_bottom→L2-4 sub-feeds (like 4M-R-A
    // feeding 4M-R-B/C), its downstream fan-out occupies more horizontal
    // footprint than a pure terminal panel. Add +20 px to each side so the
    // breaker-pitch calculator reserves extra air. Internal-chain parents
    // already handled via INTERNAL_N2/N3 paths above.
    const hasSubFeedsToPanels = TOPO.routed_elements.some(rr =>
      rr.edge_type === 'R-1' &&
      rr.start && rr.start.device_id === dst.id && rr.start.port === 'feed_bottom' &&
      rr.end && devMap[rr.end.device_id] && devMap[rr.end.device_id].node_type === 'L2-4'
    );
    const SUBFEED_SAFETY = hasSubFeedsToPanels ? 20 : 0;
    // n<=1: Chain A-like single-panel footprint (plus optional safety margin)
    return { left: PANEL_HALF + SUBFEED_SAFETY, right: PANEL_HALF + SUBFEED_SAFETY };
  }

  // Chain B head: CB → TX → single panel. Panel half-width.
  if (dst.node_type === 'L2-2') {
    return { left: PANEL_HALF, right: PANEL_HALF + TAG_PILL_BUDGET };
  }

  // Everything else (ATS, SPD, motor, controller) — CB body only
  return { left: PANEL_HALF, right: PANEL_HALF };
}

// True if the given bus-row CB feeds an ATS (L2-3) downstream.
// Used by computeBreakerPitches to anchor ATS-feeding breakers in place
// when a section has a pitch multiplier — gaps adjacent to or between
// ATS-feeders retain base pitch, preserving cs-001..cs-007 cross-sheet
// alignment with E-502 ATS subtrees on S2.
function _feedsATS(cb) {
  if (!cb || cb.node_type !== 'L2-1') return false;
  if (cb.data_fields && cb.data_fields.internal_to) return false;
  const r1 = TOPO.routed_elements.find(r =>
    r.edge_type === 'R-1' && r.start &&
    r.start.device_id === cb.id && r.start.port === 'line_in');
  if (!r1 || !r1.end) return false;
  const dst = devMap[r1.end.device_id];
  return !!(dst && dst.node_type === 'L2-3');
}

// Per-pair pitch between consecutive bus-row breakers.
// Optional sectionId argument enables BREAKER_PITCH_SECTION_MULTIPLIER
// (E-501 distribution density adjustment). The multiplier is applied
// ONLY when neither neighbor in a pair feeds an ATS — this anchors the ATS
// breakers' on-sheet X to preserve cs-001..cs-007 cross-sheet alignment with
// E-502 (which is intentionally untouched). Cascade: section width grows via
// sectionWidthForBreakers(); switchboard X-accumulator (sx += w) shifts
// downstream sections; bus extents follow SEC_POS; downstream chains follow
// CB X via the G[] position registry. 4S-1-B manual-route polylines use
// lateralX_abs *relative to parent center X*, so they follow d-115 automatically.
function computeBreakerPitches(devs, sectionId) {
  const out = [];
  const mult = (sectionId && BREAKER_PITCH_SECTION_MULTIPLIER[sectionId]) || 1;
  for (let i = 0; i < devs.length - 1; i++) {
    const a = _cbWidthContribution(devs[i]);
    const b = _cbWidthContribution(devs[i + 1]);
    const needed = a.right + b.left + DIM.panel_clearance;
    const basePitch = Math.max(DIM.breaker_pitch_min, needed);
    const atsAdjacent = _feedsATS(devs[i]) || _feedsATS(devs[i + 1]);
    // L2-7 placeholders (spare/space) are non-functional symbols with no
    // downstream chain — they don't need the wide-pitch breathing room the
    // section multiplier was designed to give panel-feeding breakers.
    // Suppress mult when either neighbor is L2-7 so trailing placeholder
    // tails compact to base pitch (matches CB-12↔CB-13 spacing pattern).
    const placeholderAdjacent = devs[i].node_type === 'L2-7' || devs[i + 1].node_type === 'L2-7';
    const applyMult = mult > 1 && !atsAdjacent && !placeholderAdjacent;
    out.push(applyMult ? basePitch * mult : basePitch);
  }
  return out;
}

// Section width sized for N breakers with dynamic inter-pitches, plus
// edge padding sized to contain the leftmost and rightmost extents.
// Optional sectionId argument propagated to computeBreakerPitches.
function sectionWidthForBreakers(devs, sectionId) {
  if (devs.length === 0) return 210;
  const pitches = computeBreakerPitches(devs, sectionId);
  const innerW = pitches.reduce((a, b) => a + b, 0);  // 0 when n===1
  // Edge padding: leftmost CB's left-contrib + rightmost CB's right-contrib
  const leftPad  = _cbWidthContribution(devs[0]).left;
  const rightPad = _cbWidthContribution(devs[devs.length - 1]).right;
  const total = leftPad + innerW + rightPad + 2 * DIM.section_margin;
  return Math.max(total, 210);
}

// ============================================================
// BOUNDING BOX REGISTRY (for A-6 placement)
// Rebuilt per-sheet from placed G[] entries. We don't instrument every
// renderer call site — we derive bboxes at A-6 placement time from the G
// anchor + symbolWidth/symbolHeight helpers that already exist in this file.
// ============================================================
function _collectSheetBBoxes(sheetId, excludeIds) {
  const exclude = new Set(excludeIds || []);
  const bboxes = [];
  TOPO.devices.forEach(d => {
    if (d.sheet_id !== sheetId) return;
    if (exclude.has(d.id)) return;
    if (!G[d.id]) return;
    // Skip auxiliary symbols (don't block A-6 over them)
    if (['L2-7'].includes(d.node_type)) return;
    const w = symbolWidth(d) || 0;
    const h = symbolHeight(d) || 0;
    if (w <= 0 || h <= 0) return;
    bboxes.push({ id: d.id, kind: 'device', x: G[d.id].x, y: G[d.id].y, w, h });
  });
  return bboxes;
}

function _bboxOverlaps(a, b, tolerance) {
  const t = tolerance || 0;
  return !(a.x + a.w + t <= b.x ||
           b.x + b.w + t <= a.x ||
           a.y + a.h + t <= b.y ||
           b.y + b.h + t <= a.y);
}

const devMap = {}; TOPO.devices.forEach(d => devMap[d.id] = d);
const reMap = {}; TOPO.routed_elements.forEach(r => reMap[r.id] = r);
const anMap = {}; TOPO.annotations.forEach(a => anMap[a.id] = a);
const sectionMap = {}; (TOPO.sections || []).forEach(s => sectionMap[s.id] = s);
// Reverse lookup — device_id → parent section's section_tag (e.g. "SEC-3").
// Used by tooltipNameFor() to append the section tag to device hover labels.
// Built by walking each section's device_ids[] array. Devices not mounted in
// any section (e.g., generators, ATS units, downstream panels) yield undefined
// here and the tooltip falls back to the bare designation.
const deviceToSectionTag = {};
(TOPO.sections || []).forEach(s => {
  if (!s.section_tag) return;
  (s.device_ids || []).forEach(did => { deviceToSectionTag[did] = s.section_tag; });
});
const annByBound = {};
TOPO.annotations.forEach(a => {
  if (!annByBound[a.bound_to]) annByBound[a.bound_to] = [];
  annByBound[a.bound_to].push(a);
});

function _sheetFloorStackBottomUp(sheetId) {

// Role 'emergency' always does (unchanged); a continuation sheet opts in via

// cannot be role 'emergency' — that role requires a switchboard on the sheet).

// module-scope core of _s2FloorYOffset (extracted so the
// continuation-entry block can lift entry panels to their floor row too).
// Cumulative pitch from the sheet's base floor up to `floor`, plus that
// floor's SHIFT_DELTA. Legacy stack + hospital defaults reproduce the old
// literal branches exactly: '2' → −P2+D2, '3' → −(P2+P3)+D3, 'R' → −(P2+P3+PR)+DR.
function _s2PitchOffsetFor(sheetId, floor) {
  if (floor === undefined || floor === null) return 0;
  const stack = _sheetFloorStackBottomUp(sheetId);
  const idx = stack.indexOf(floor);
  if (idx <= 0) return 0;                     // base floor (or unknown) — no lift
  const P = S2_LEVEL_LINE_PITCH;
  const D = S2_SHIFT_DELTA;
  let acc = 0;
  for (let k = 1; k <= idx; k++) acc += (P[stack[k]] !== undefined ? P[stack[k]] : 1250);
