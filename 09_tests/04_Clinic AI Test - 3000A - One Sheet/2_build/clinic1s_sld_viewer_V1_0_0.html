  const b = EXPORT_BOX_OVERRIDE[t] || BOX[t] || BOX.__default;
  return { w: b.w, h: b.h, anchor_mode: ANCHOR_MODE[t] || 'top_left' };
}
function symbolHeight(d) { return boxH(d.node_type); }
function symbolWidth(d) { return boxW(d.node_type); }
// BOX now carries drawn body heights everywhere (the L2-2
// ground-clearance budget moved to spacing), so body height ≡ box height.
function bodyHeight(d) { return symbolHeight(d); }
// SLOT resolver (.0-A): frozen copy of the legacy symbol-width
// switch, used ONLY for spacing/pitch/subtree-extent allocation. Never
// retune these values to family dims — they define layout rhythm, not
// drawn boxes.
function slotWidth(d) {
  switch (d.node_type) {
    case 'L2-4': return DIM.panel_slot_S;
    case 'L2-2': return DIM.xfmr_slot_S;
    case 'L2-3': return DIM.ats_slot_S;
    case 'L1-5': return 110;
    case 'L2-6': return 62;
    case 'L3-1': return 47;
    case 'L3-3': return 54;
    default: return 80;
  }
}
function bboxOfG(sheetId) {
  const devs = TOPO.devices.filter(d => d.sheet_id === sheetId && G[d.id]);
  if (devs.length === 0) return { minX: 0, maxX: 3000, minY: 0, maxY: 4800 };
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  devs.forEach(d => {
    const g = G[d.id];
    const w = symbolWidth(d);
    const h = symbolHeight(d);
    if (g.x < minX) minX = g.x;
    if (g.y < minY) minY = g.y;
    if (g.x + w > maxX) maxX = g.x + w;
    if (g.y + h > maxY) maxY = g.y + h;
  });
  return { minX, maxX, minY, maxY };
}

// ============================================================
// ACCESSORS for my schema's annotation content
// ============================================================
function getTagText(ann) {
  if (!ann || !ann.content) return '';
  return ann.content.tag_text || ann.content.callout_text || ann.content.text || '';
}

// ============================================================
// STATE
// ============================================================
let G = {};
let currentSheet = 'S1';

// ============================================================
// MANIFEST — strict 1:1, no fake-marking
// ============================================================
class RenderManifest {
  constructor(sheetId, intentionalSkips) {
    this.expected = new Map();
    this.intentionalSkips = new Set(intentionalSkips || []);
    this.done = new Set();
    TOPO.devices.filter(d => d.sheet_id === sheetId && !this.intentionalSkips.has(d.id))
      .forEach(d => this.expected.set(d.id, {type:'device', obj:d, label:d.designation||d.node_type}));
    TOPO.routed_elements.filter(r => r.sheet_id === sheetId && r.edge_type === 'R-1' && !this.intentionalSkips.has(r.id))
      .forEach(r => this.expected.set(r.id, {type:'re', obj:r, label:r.designation || r.id}));
    TOPO.annotations.filter(a => a.sheet_id === sheetId && !this.intentionalSkips.has(a.id))
      .forEach(a => this.expected.set(a.id, {type:'ann', obj:a, label:a.annotation_type+' on '+a.bound_to}));
  }
  rendered(id) {
    // Only count rendered events for IDs in the expected set — no inflation from non-visual entities
    if (this.expected.has(id)) this.done.add(id);
  }
  audit() {
    const misses = [];
    for (const [id, meta] of this.expected) { if (!this.done.has(id)) misses.push({id, ...meta}); }
    return {
      total: this.expected.size,
      rendered: this.done.size,
      ok: misses.length === 0,
      misses,
      intentionalSkips: this.intentionalSkips.size,
    };
  }
}
let manifest = null;
let renderedIds = {
  _set: new Set(),
  add(id) { this._set.add(id); if (manifest) manifest.rendered(id); },
  has(id) { return this._set.has(id); },
  get size() { return this._set.size; }
};

function esc(t) { return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function orthoPath(x1, y1, x2, y2, bias) {
  if (x1 === x2 || y1 === y2) return `${x1},${y1} ${x2},${y2}`;
  if (bias === 'h-first') return `${x1},${y1} ${x2},${y1} ${x2},${y2}`;
  return `${x1},${y1} ${x1},${y2} ${x2},${y2}`;
}

// ============================================================
// DEVICE RENDERERS
// ============================================================
const RENDER = {};

RENDER['__fallback__'] = (d, g) => {
  const cx = g.x||0, cy = g.y||0;
  let s = `<g class="dev" data-id="${d.id}">`;
  s += `<rect x="${cx-30}" y="${cy-20}" width="60" height="40" fill="none" stroke="#FF4444" stroke-width="2" stroke-dasharray="5,3"/>`;
  s += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="700" fill="#FF4444">NO RENDERER</text>`;
  s += `<text x="${cx}" y="${cy+8}" text-anchor="middle" font-family="'Courier New',monospace" font-size="7" fill="#FF4444">${esc(d.node_type)}</text>`;
  s += `</g>`;
  return s;
};

function renderDevice(dev, geom) {
  const fn = RENDER[dev.node_type];
  if (fn) return fn(dev, geom);
  return RENDER['__fallback__'](dev, geom);
}

// L2-1 Circuit Breaker symbol renderer.
// Anchor at bus_out dot. Text fields: amps (12px bold, underlined) + poles (12px bold, ~14px below).
// Designation is NOT rendered on the breaker per spec — it lives on the panel schedule.
// flip_vertical=true mirrors arc/nodes BELOW the bus dot (for CB-FP
// cleanup — topology-preserving, feeder routing unchanged).
RENDER['L2-1'] = (d, g) => {
  const cx = g.x, by = g.y;
  const flip = g.flip_vertical ? -1 : 1;  // +1 = arc above bus, -1 = arc below bus
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  s += `<circle cx="${cx}" cy="${by}" r="${DIM.cb_r_bus}" fill="var(--sld-pink)"/>`;
  // all base breaker linework at 3.0pt per spec
  s += `<line x1="${cx}" y1="${by - flip*DIM.cb_r_bus}" x2="${cx}" y2="${by - flip*(DIM.cb_link_length+DIM.cb_r_bus)}" stroke="var(--sld-line)" stroke-width="3"/>`;
  const lY = by - flip*(DIM.cb_link_length + DIM.cb_r_node + DIM.cb_r_bus);
  const uY = lY - flip*DIM.cb_node_spacing;
  const mid = (uY + lY) / 2;
  s += `<circle cx="${cx}" cy="${lY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<path d="M${cx},${lY} Q${cx-DIM.cb_arc_offset},${mid} ${cx},${uY}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${cx}" cy="${uY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  const df = d.data_fields || {};
  const amps = df.at ? `${df.at}A` : (df.af ? `${df.af}A` : '');
  const poles = df.poles ? `${df.poles}P` : '';
  // Spec: amps bold underlined at upper line, poles bold ~14px below. 12px throughout.
  if (amps)  s += `<text x="${cx+DIM.cb_text_gap}" y="${mid-2}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(amps)}</text>`;
  if (poles) s += `<text x="${cx+DIM.cb_text_gap}" y="${mid+12}" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="var(--sld-text)">${esc(poles)}</text>`;
  // Spare canvas label is simplified to "SPARE" only. Designation is
  // retained in TOPO data and remains addressable via hover tooltip and
  // click-to-copy; the canvas label intentionally omits it. This branch
  // covers all E-501 spares uniformly. Triggers when kind === 'spare';
  // d.designation guard preserved defensively.
  if (df.kind === 'spare' && d.designation) {
    s += `<text x="${cx}" y="${uY-14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">SPARE</text>`;
  }
  s += `</g>`;
  return s;
};

// L1-1 GFP — bridges main bus (g.y) and secondary bus (g.secBusY)
RENDER['L1-1'] = (d, g) => {
  const cx = g.x, topBusY = g.y, botBusY = g.secBusY;
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  s += `<circle cx="${cx}" cy="${topBusY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
  const bkrTopY = topBusY + DIM.cb_link_length + DIM.cb_r_node;
  const bkrBotY = bkrTopY + DIM.cb_node_spacing;
  const midY = (bkrTopY + bkrBotY) / 2;
  // base breaker circles + link lines bumped from 1.5pt to 3.0pt per spec (L1-1 inherits L2-1 stroke weights)
  s += `<circle cx="${cx}" cy="${bkrTopY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // arc stroke 3.0pt per spec (inherited from L2-1)
  s += `<path d="M${cx},${bkrTopY} Q${cx-DIM.cb_arc_offset},${midY} ${cx},${bkrBotY}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${cx}" cy="${bkrBotY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${cx}" y1="${topBusY+DIM.bus_r_dot}" x2="${cx}" y2="${bkrTopY-DIM.cb_r_node}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${cx}" y1="${bkrBotY+DIM.cb_r_node}" x2="${cx}" y2="${botBusY}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${cx}" cy="${botBusY}" r="${DIM.cb_r_bus}" fill="var(--sld-pink)"/>`;
  // GFP box per spec — gfp_w=24 (was 26), position centered at (cx-24, midY)
  // so left edge at cx-36 (was cx-42), right edge at cx-12 (was cx-16). Stroke 3.0pt (was 1.5).
  const gfpW = 24, gfpH = 14, gfpX = cx-36, gfpY = midY-gfpH/2;
  s += `<rect x="${gfpX}" y="${gfpY}" width="${gfpW}" height="${gfpH}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // GFP label — spec: bold 8px centered (was 7px)
  s += `<text x="${gfpX+gfpW/2}" y="${midY+3}" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" font-weight="700" fill="var(--sld-text)">GFP</text>`;
  // Upper sensing line: straight horizontal from GFP box right edge to arc deepest point, + endpoint dot
  const upperSenseX = cx - DIM.cb_arc_offset;
  s += `<line x1="${gfpX+gfpW}" y1="${midY}" x2="${upperSenseX}" y2="${midY}" stroke="var(--sld-line)" stroke-width="1.2" stroke-dasharray="4,3"/>`;
  s += `<circle cx="${upperSenseX}" cy="${midY}" r="1.2" fill="var(--sld-line)" opacity="0.7"/>`;
  // Lower sensing: L-path from GFP box BOTTOM CENTER down, then right to vertical-link midpoint, + endpoint dot
  const linkMidY = (bkrBotY+DIM.cb_r_node+botBusY)/2;
  s += `<line x1="${gfpX+gfpW/2}" y1="${gfpY+gfpH}" x2="${gfpX+gfpW/2}" y2="${linkMidY}" stroke="var(--sld-line)" stroke-width="1.2" stroke-dasharray="4,3"/>`;
  s += `<line x1="${gfpX+gfpW/2}" y1="${linkMidY}" x2="${cx}" y2="${linkMidY}" stroke="var(--sld-line)" stroke-width="1.2" stroke-dasharray="4,3"/>`;
  s += `<circle cx="${cx}" cy="${linkMidY}" r="1.2" fill="var(--sld-line)" opacity="0.7"/>`;
  // Data fields: amps bold underlined 12px, poles bold 12px below. No designation line (spec).
  const df = d.data_fields || {};
  const amps = df.at ? `${df.at}A` : (df.af ? `${df.af}A` : '');
  const poles = df.poles ? `${df.poles}P` : '3P';
  s += `<text x="${cx+14}" y="${midY-2}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(amps)}</text>`;
  s += `<text x="${cx+14}" y="${midY+12}" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="var(--sld-text)">${esc(poles)}</text>`;
  s += `</g>`;
  return s;
};

// L1-3 N-G Bond symbol renderer.
// Floats inside rightmost distribution section. NO external text label per spec.
//
// Bus-clash fix. Anchor Y snapped to secondary bus Y.
// Added 12 px riser stub between bus and symbol.
// FULLY DETACH the symbol from the bus. The N-G bond
// is now rendered as a pure keynote-style floating indicator inside the
// rightmost distribution section, with NO drawn connection to the bus. The
// electrical tap is understood by convention per NEC 250.30(A)(1) and IEEE
// 315 — the symbol's presence within the SDS section declares the bond,
// connection drawing is not required.
//
// Anchor Y (g.y) still resolves to the secondary bus Y so the placement logic
// can continue to use the bus as the reference point; the symbol body floats
// 20 px below the bus. Deterministic layout engine should treat g.y as the
// bus reference, not the drawn symbol top.
//
// Internal compaction: neutral riser 25→20 px, SDS→ground leader 30→25 px.
// Net symbol height: 77 px (from top tick to ellipse).
//
// Interior landmarks (relative to by = secondary_bus_Y):
// by+0: bus tap reference (no drawn element — pure anchor)
// by+0→+20: empty airspace (floating gap)
// by+20: top tick + neutral tap dot
// by+20→+40: neutral riser (compressed 25→20)
// by+40: SDS bar + ground-bond dot
// by+40→+65: ground leader (compressed 30→25)
// by+65: first ground-rake tick
// by+77: second ground-rake tick
// by+89: third ground-rake tick
// by+97: ground ellipse
// Total symbol height: 77 px. Bottom clearance in section: 13 px.
RENDER['L1-3'] = (d, g) => {
  const bx = g.x, by = g.y;
  const gap = 20;  // floating gap from bus; no connecting line
  const top = by + gap;
  let s = `<g class="dev" data-id="${d.id}">`;
  // Top tick + neutral tap dot (symbol body starts here — no connection to bus above)
  s += `<line x1="${bx-22}" y1="${top}" x2="${bx+22}" y2="${top}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${bx}" cy="${top}" r="5" fill="var(--sld-pink)"/>`;
  // Neutral riser + SDS dot
  s += `<line x1="${bx}" y1="${top}" x2="${bx}" y2="${top+20}" stroke="var(--sld-line)" stroke-width="2"/>`;
  s += `<circle cx="${bx}" cy="${top+20}" r="5" fill="var(--sld-pink)"/>`;
  // SDS separator bar
  s += `<line x1="${bx-20}" y1="${top+20}" x2="${bx+20}" y2="${top+20}" stroke="var(--sld-line)" stroke-width="2.5"/>`;
  // Ground leader
  s += `<line x1="${bx}" y1="${top+20}" x2="${bx}" y2="${top+45}" stroke="var(--sld-line)" stroke-width="2"/>`;
  // Ground rake
  s += `<line x1="${bx-22}" y1="${top+45}" x2="${bx+22}" y2="${top+45}" stroke="var(--sld-line)" stroke-width="2"/>`;
  s += `<line x1="${bx-16}" y1="${top+57}" x2="${bx+16}" y2="${top+57}" stroke="var(--sld-line)" stroke-width="2"/>`;
  s += `<line x1="${bx-10}" y1="${top+69}" x2="${bx+10}" y2="${top+69}" stroke="var(--sld-line)" stroke-width="2"/>`;
  s += `<ellipse cx="${bx}" cy="${top+77}" rx="4" ry="2.5" fill="var(--sld-line)"/>`;
  s += `</g>`;
  return s;
};

// L1-4 Utility Meter symbol renderer.
// Anchor: top-left of meter box (g.x, g.y). Square S=47. Inner circle r=14.
// Riser 13px from box top to fork point; J-hook jaws curl back toward the box.
// All linework 3.0pt. M label: 12px bold, centered in circle.
RENDER['L1-4'] = (d, g) => {
  const bx = g.x, by = g.y;       // box top-left per spec
  const W = boxW('L1-4');         // 36×36 family box (internals ×36/47)
  const cx = bx + W/2;            // box center X (for inner circle, riser, label)
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // Meter box — spec stroke 3.0pt
  s += `<rect x="${bx}" y="${by}" width="${W}" height="${W}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Inner circle r=11 centered — 3.0pt
  s += `<circle cx="${cx}" cy="${by+W/2}" r="11" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // "M" label — 10px bold
  s += `<text x="${cx}" y="${by+W/2+3.5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" font-weight="700" fill="var(--sld-text)">M</text>`;
  // Riser from box top (y=0) to fork point (y=-10) — spec 3.0pt
  s += `<line x1="${cx}" y1="${by}" x2="${cx}" y2="${by-10}" stroke="var(--sld-line)" stroke-width="3"/>`;
  // J-hook jaws curling BACK toward the box, both originating at fork point — spec 3.0pt, rounded linecap
  const fy = by - 10;
  s += `<path d="M${cx},${fy} C${cx},${fy-2.3} ${cx-3},${fy-6.1} ${cx-5.4},${fy-7.7} C${cx-7.7},${fy-9.2} ${cx-10.7},${fy-7.7} ${cx-12.3},${fy-4.6}" fill="none" stroke="var(--sld-line)" stroke-width="3" stroke-linecap="round"/>`;
  s += `<path d="M${cx},${fy} C${cx},${fy-2.3} ${cx+3},${fy-6.1} ${cx+5.4},${fy-7.7} C${cx+7.7},${fy-9.2} ${cx+10.7},${fy-7.7} ${cx+12.3},${fy-4.6}" fill="none" stroke="var(--sld-line)" stroke-width="3" stroke-linecap="round"/>`;
  // VIEWER EXTENSION: continuation riser from jaw fork up to main bus + bus tee dot
  // (Not in spec symbol definition — added by composition layer.)
  if (g.busY !== undefined) {
    s += `<line x1="${cx}" y1="${fy-9.2}" x2="${cx}" y2="${g.busY}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<circle cx="${cx}" cy="${g.busY}" r="${DIM.bus_r_dot}" fill="var(--sld-pink)"/>`;
  }
  s += `</g>`;
  return s;
};

// L1-5 Generator symbol renderer.
// color/fill conventions: cyan linework, white text, transparent circle fill, 3.0pt strokes.
// Generator symbol: circle with "G", single gen_out port at bottom center.
RENDER['L1-5'] = (d, g) => {
  const cx = g.x + DIM.gen_r, cy = g.y + DIM.gen_r, R = DIM.gen_r;
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // transparent fill, cyan stroke 3.0pt per system convention (was amber 2.5pt with opaque fill)
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // "G" label — white per system convention (was amber), 30px preserved for visual weight
  s += `<text x="${cx}" y="${cy+10}" text-anchor="middle" font-family="'Courier New',monospace" font-size="30" font-weight="700" fill="var(--sld-text)">G</text>`;
  // gen_out stub down — spec port at bottom center
  s += `<line x1="${cx}" y1="${cy+R}" x2="${cx}" y2="${cy+R+20}" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Data fields to the right — .9: the stack is an A-8 equipment-label
  // block (deviceEquipText — line 1 bold, steps 20/18, was w600 at 16px steps)
  // and exports a bound_to_type:"device" record so the add-in places the
  // _E_SLD_Equipment-info family here instead of a TextNote stack (Mayo).
  // kw/kva stay COMBINED on one line — the family has only
  // three Line slots after the label.
  const df = d.data_fields || {};
  const txtX = cx + R + 10;
  const shown = [
    d.designation || 'GEN',
    df.kw ? `${df.kw}KW / ${df.kva||''}KVA` : '',
    df.voltage || ''
  ].filter(Boolean);
  s += deviceEquipText(d, txtX, cy - 22, shown);
  // NFPA 110 classification line: not rendered (informational; see keynotes).
  // Data retained in TOPO.devices[d-052].data_fields.nfpa_level for schedule output.
  s += `</g>`;
  return s;
};

// L2-4 Panelboard symbol renderer.
// Anchor: top-left. Square S=140, solid outline 3.0pt, transparent fill.
// Text positions per spec: name at (70, 32), lines at (70, 60/82/104).
// All text INSIDE the box, centered on x = S/2 = 70.
RENDER['L2-4'] = (d, g) => {
  const px = g.x, py = g.y;
  const W = boxW('L2-4'), H = boxH('L2-4');  // 64×88 family box
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // Box: transparent fill, 3.0pt stroke (spec)
  s += `<rect x="${px}" y="${py}" width="${W}" height="${H}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Panel name — centered on the box, 12px bold underlined
  if (d.designation) s += `<text x="${px+W/2}" y="${py+18}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(d.designation)}</text>`;
  const df = d.data_fields || {};
  // Lines 1–3 — 12px regular weight, compressed to the 88px family box
  const lines = [];
  if (df.voltage) lines.push(df.voltage);
  if (df.mlo) lines.push('MLO');
  else if (df.mcb) lines.push('MCB');
  if (df.rating) lines.push(df.rating);
  const lineYs = [34, 49, 64];
  // 11px: a 9-char voltage string (208Y/120V) must fit the 64px family box.
  lines.slice(0,3).forEach((ln, i) => {
    s += `<text x="${px+W/2}" y="${py+lineYs[i]}" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="var(--sld-text)">${esc(ln)}</text>`;
  });
  // VIEWER EXTENSION — floor badge from designation pattern (not in spec; kept per user decision)
  if (d.designation) {
    const parts = d.designation.split('-');
    if (parts.length >= 2) {
      const lv = parts[1];
      // OFF-024 (rev 1.0.11): '9' added. The list stopped at '8' for no reason
      // beyond the 5-storey golden never needing more, so every Level-9 panel on
      // a taller building silently lost its badge while its neighbours kept
      // theirs — a gap that reads as "this panel has no floor". Golden impact is
      // zero: no golden device has designation part[1] === '9'. This one IS ink,
      // so only the G5/G6 PNG baselines can prove it — never run the suite with
      // --no-png after this change.
      if (['B','1','2','3','4','5','6','7','8','9','R'].includes(lv)) {
        const bl = lv === 'B' ? 'B' : lv === 'R' ? 'R' : 'L'+lv;
        s += `<rect x="${px+W-30}" y="${py+H-20}" width="26" height="18" rx="3" fill="rgba(57,255,20,0.12)" stroke="rgba(57,255,20,0.4)" stroke-width="0.6"/>`;
        s += `<text x="${px+W-17}" y="${py+H-6}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="700" fill="var(--sld-section)" opacity=".7">${bl}</text>`;
      }
    }
  }
  s += `</g>`;
  return s;
};

// L2-2 LV Transformer symbol renderer.
// Anchor: top-left of T-box (g.x, g.y). Square S=47. L-path exits LEFT wall at vertical center.
// Ground stack: three decreasing-width lines + filled ellipse earth dot.
RENDER['L2-2'] = (d, g) => {
  const tx = g.x, ty = g.y;
  const W = boxW('L2-2'), H = boxH('L2-2');  // 49.17×35 family box
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // T-box: transparent fill, 3.0pt stroke
  s += `<rect x="${tx}" y="${ty}" width="${W}" height="${H}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // "T" label: centered on the box (font ≈ H × 0.5)
  s += `<text x="${tx+W/2}" y="${ty+H/2+6.5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" font-weight="700" fill="var(--sld-text)">T</text>`;

  // L-path ground: exits left wall at vertical center, drops into the
  // ground-clearance spacing zone below the box (engine-only cosmetic —
  // the family bbox excludes the ground stack).
  s += `<line x1="${tx}" y1="${ty+H/2}" x2="${tx-19}" y2="${ty+H/2}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${tx-19}" y1="${ty+H/2}" x2="${tx-19}" y2="${ty+H+9}" stroke="var(--sld-line)" stroke-width="3"/>`;

  // Earth ground lines — widths 17/12/8, spacing 6, all 3.0pt
  s += `<line x1="${tx-27}" y1="${ty+H+9}" x2="${tx-10}" y2="${ty+H+9}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${tx-25}" y1="${ty+H+15}" x2="${tx-13}" y2="${ty+H+15}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${tx-23}" y1="${ty+H+21}" x2="${tx-15}" y2="${ty+H+21}" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Earth ground ellipse (filled, rx=2, ry=1.2)
  s += `<ellipse cx="${tx-19}" cy="${ty+H+24}" rx="2" ry="1.2" fill="var(--sld-line)"/>`;

  // Text to the right — 12px per spec, text_gap = 8
  const df = d.data_fields || {};
  const textX = tx + W + 8;
  if (d.designation) {
    s += `<text x="${textX}" y="${ty+14}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(d.designation)}</text>`;
    if (df.kva)    s += `<text x="${textX}" y="${ty+30}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.kva)}KVA</text>`;
    if (df.config) s += `<text x="${textX}" y="${ty+44}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.config)}</text>`;
  }
  s += `</g>`;
  return s;
};

// L2-3 ATS symbol renderer.
// Anchor: top-left of ATS box (g.x, g.y). Square S=140 with 3 nodes r=10.
// Throw line is EDGE-to-EDGE (not center-to-center) between upper node and active source.
// CRITICAL: stubs are symbol-internal geometry (literal 30/60), NOT scaled by SP.
// DIM.ats_stub_top (90) / DIM.ats_stub_bottom (180) are SP-scaled values used
// by the composition layer for cross-sheet feeder landing zones — they must NOT
// be used inside this renderer.
RENDER['L2-3'] = (d, g) => {
  const ax = g.x, ay = g.y;
  const S = boxW('L2-3');  // 72×72 family box (internals scaled ×72/140)
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // Box: transparent fill, 3.0pt stroke
  s += `<rect x="${ax}" y="${ay}" width="${S}" height="${S}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Three nodes r=5, 3.0pt stroke: load (top center, y=14.4), source1/source2
  // on the bottom band at the family-measured port x's (see
  // ATS_PORT_S1_X / ATS_PORT_S2_X).
  s += `<circle cx="${ax+36}" cy="${ay+14.4}" r="5" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${ax+ATS_PORT_S1_X}" cy="${ay+55.5}" r="5" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<circle cx="${ax+ATS_PORT_S2_X}" cy="${ay+55.5}" r="5" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Throw line edge-to-edge (upper to source1/normal) — 3.0pt
  const dx1 = ATS_PORT_S1_X-36, dy1 = 55.5-14.4, len = Math.sqrt(dx1*dx1+dy1*dy1);
  const ex1 = 36 + dx1*5/len, ey1 = 14.4 + dy1*5/len;
  const ex2 = ATS_PORT_S1_X - dx1*5/len, ey2 = 55.5 - dy1*5/len;
  s += `<line x1="${ax+ex1}" y1="${ay+ey1}" x2="${ax+ex2}" y2="${ay+ey2}" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Stubs — .0: internal only, terminating ON the box edges (the
  // family bbox has no external stubs; feeders land on the box edge).
  // port x's are family-MEASURED.
  s += `<line x1="${ax+36}" y1="${ay+9.4}"  x2="${ax+36}" y2="${ay}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${ax+ATS_PORT_S1_X}" y1="${ay+60.5}" x2="${ax+ATS_PORT_S1_X}" y2="${ay+S}" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<line x1="${ax+ATS_PORT_S2_X}" y1="${ay+60.5}" x2="${ax+ATS_PORT_S2_X}" y2="${ay+S}" stroke="var(--sld-line)" stroke-width="3"/>`;
  // Text to the right — 12px per spec
  const df = d.data_fields || {};
  const textX = ax + S + 8;
  if (d.designation) s += `<text x="${textX}" y="${ay+20}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(d.designation)}</text>`;
  if (df.continuous_rating) s += `<text x="${textX}" y="${ay+38}" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="var(--sld-text)">${df.continuous_rating}A</text>`;
  if (df.poles) s += `<text x="${textX}" y="${ay+54}" font-family="'Courier New',monospace" font-size="12" font-weight="700" fill="var(--sld-text)">${df.poles}-POLE</text>`;
  // The catalog L2-3 card (visual master) draws no nec_class label line
  // and no in-box LS/CR/EQ/OS abbreviation badge, and the engine matches
  // the card — neither is drawn here. nec_class remains fully
  // load-bearing for ATS ORDERING (atsNecClass) and section
  // grouping — it is simply not drawn.
  s += `</g>`;
  return s;
};

// L2-6 SPD symbol renderer.
// 62×26 rect, transparent fill, 3.0pt stroke. "SPD" label centered at (31, 18), font-size 11 bold.
RENDER['L2-6'] = (d, g) => {
  const W = boxW('L2-6'), H = boxH('L2-6');  // 36×15 family box
  let s = `<g class="dev" data-id="${d.id}">`;
  s += `<rect x="${g.x}" y="${g.y}" width="${W}" height="${H}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<text x="${g.x+W/2}" y="${g.y+11}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" font-weight="700" fill="var(--sld-text)">SPD</text>`;
  s += `</g>`;
  return s;
};

// L2-7 Spare / Space symbol renderer.
// All base breaker elements at 3.0pt. Label "SPARE" / "SPACE" at 12px weight 600.
RENDER['L2-7'] = (d, g) => {
  const cx = g.x, by = g.y;
  const df = d.data_fields || {};
  const isSpare = df.kind === 'spare';
  let s = `<g class="dev" data-id="${d.id}">`;
  s += `<circle cx="${cx}" cy="${by}" r="${DIM.cb_r_bus}" fill="var(--sld-pink)"/>`;
  if (isSpare) {
    s += `<line x1="${cx}" y1="${by-DIM.cb_r_bus}" x2="${cx}" y2="${by-DIM.cb_link_length-DIM.cb_r_bus}" stroke="var(--sld-line)" stroke-width="3"/>`;
    const lY = by-DIM.cb_link_length-DIM.cb_r_node-DIM.cb_r_bus;
    const uY = lY-DIM.cb_node_spacing;
    s += `<circle cx="${cx}" cy="${lY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
    s += `<path d="M${cx},${lY} Q${cx-DIM.cb_arc_offset},${(lY+uY)/2} ${cx},${uY}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
    s += `<circle cx="${cx}" cy="${uY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
    s += `<text x="${cx}" y="${uY-14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">SPARE</text>`;
  } else {
    const lY = by-DIM.cb_link_length-DIM.cb_r_node-DIM.cb_r_bus;
    s += `<line x1="${cx}" y1="${by-DIM.cb_r_bus}" x2="${cx}" y2="${lY+DIM.cb_r_node}" stroke="var(--sld-line)" stroke-width="3"/>`;
    s += `<circle cx="${cx}" cy="${lY}" r="${DIM.cb_r_node}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
    s += `<text x="${cx}" y="${lY-14}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">SPACE</text>`;
  }
  s += `</g>`;
  return s;
};

// L0-1 Utility Transformer symbol renderer.
// Open-path T-box (top + sides only, no fill), pad rect 3.0pt, clearance dashed green 1.5pt.
RENDER['L0-1'] = (d, g) => {
  // drawn bbox = BOX['L0-1'] (168×140 family box), anchored at
  // its own top-left — the pad does not overhang west of the anchor.
  // T-box (140 wide) centered over the full-width pad; dashed clearance
  // hangs below the box (engine-only cosmetic, outside the family bbox).
  const x = g.x, y = g.y;
  const BW = boxW('L0-1'), BH = boxH('L0-1');   // 168 × 140
  const oh = (BW - 140) / 2;                    // 14 — pad overhang each side
  const W = 140, tH = 93, padH = BH - tH;       // T-box 140×93, pad 47
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;
  // T-box: open path (top + sides only), transparent fill per spec
  s += `<path d="M${x+oh},${y+tH} L${x+oh},${y} L${x+oh+W},${y} L${x+oh+W},${y+tH}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<text x="${x+BW/2}" y="${y+60}" text-anchor="middle" font-family="'Courier New',monospace" font-size="36" font-weight="700" fill="var(--sld-text)">T</text>`;
  s += `<rect x="${x}" y="${y+tH}" width="${BW}" height="${padH}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;
  s += `<path d="M${x},${y+BH} L${x},${y+BH+60} L${x+BW},${y+BH+60} L${x+BW},${y+BH}" fill="none" stroke="var(--sld-section)" stroke-width="1.5" stroke-dasharray="12,6"/>`;
  const tx2 = x+BW+15;
  const df = d.data_fields || {};
  // Text per spec: 12px bold (was 11/10)
  s += `<text x="${tx2}" y="${y+20}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">UTILITY TRANSFORMER</text>`;
  if (df.kva_rating) s += `<text x="${tx2}" y="${y+38}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.kva_rating)}KVA</text>`;
  if (df.primary_voltage) s += `<text x="${tx2}" y="${y+54}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.primary_voltage)}-${esc(df.secondary_voltage||'')}</text>`;
  s += `<text x="${tx2}" y="${y+70}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${df.wires||4}W, ${df.phases||3}PH</text>`;
  s += `</g>`;
  return s;
};

// L3-1 Fire Pump symbol renderer.
// Anchor (g.x, g.y): TOP-LEFT of the MEASURED 24×32 family bbox.
// Compound symbol: motor circle (top) + starter box
// with an X (bottom), two arm slashes drawn BEFORE the circle so its opaque
// fill occludes their inner ends. The legacy 47px symbol is uniformly scaled
// (k) into the box; load_in port = bottom-center = (g.x+12, g.y+32). Arm/box
// internal proportions are UNMEASURED first-pass — Trip fine-tune.
RENDER['L3-1'] = (d, g) => {
  // Legacy symbol lived in starter-box-TL coords with visual bbox
  // x∈[-5,52], y∈[-38,47] (width 57, height 85). Map that into the 24×32 box.
  const k = 32 / 85;                 // fit legacy visual height 85 → 32
  const padX = 1.25;                 // center the ~21.5px-wide symbol in 24
  const X = ox => g.x + (ox + 5) * k + padX;
  const Y = oy => g.y + (oy + 38) * k;
  const SW = 1.5;                    // scaled stroke
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;

  // Arms FIRST so circle occludes inner ends. Legacy: left (−5,−36)→(7,−22),
  // right (42,−13)→(52,−1).
  s += `<line x1="${X(-5)}" y1="${Y(-36)}" x2="${X(7)}" y2="${Y(-22)}" stroke="var(--sld-line)" stroke-width="${SW}"/>`;
  s += `<line x1="${X(42)}" y1="${Y(-13)}" x2="${X(52)}" y2="${Y(-1)}" stroke="var(--sld-line)" stroke-width="${SW}"/>`;

  // Motor circle — opaque fill (canvas background) to occlude arm inner ends
  const cx = X(23.5), cy = Y(-19), r = 19 * k;
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--canvas-bg)" stroke="var(--sld-line)" stroke-width="${SW}"/>`;
  s += `<text x="${cx}" y="${cy + 3}" text-anchor="middle" font-family="'Courier New',monospace" font-size="${(19 * k).toFixed(1)}" font-weight="700" fill="var(--sld-text)">F</text>`;

  // Starter box + X (legacy box [0,47]²)
  const bx = X(0), by = Y(0), S = 47 * k;
  s += `<rect x="${bx}" y="${by}" width="${S}" height="${S}" fill="none" stroke="var(--sld-line)" stroke-width="${SW}"/>`;
  s += `<line x1="${bx}" y1="${by}" x2="${bx + S}" y2="${by + S}" stroke="var(--sld-line)" stroke-width="${SW}"/>`;
  s += `<line x1="${bx + S}" y1="${by}" x2="${bx}" y2="${by + S}" stroke="var(--sld-line)" stroke-width="${SW}"/>`;

  // Text fields to the right — font unscaled for legibility..9: the
  // stack is an A-8 equipment-label block (deviceEquipText — line 1 bold,
  // steps 20/18, was uniform 14) and exports a bound_to_type:"device" record
  // (Mayo). FLA and LRA SHARE one line: the _E_SLD_Equipment-info
  // family has exactly three Line slots after the label, and hp + fla/lra +
  // voltage_phase fills them. Old 5-line 14px stack and this 4-line 20/18 one
  // both end 56px below the first baseline — same vertical extent.
  const df = d.data_fields || {};
  const textX = bx + S + 6;
  const flaLra = [df.fla ? `${df.fla} FLA` : '', df.lra ? `${df.lra} LRA` : '']
    .filter(Boolean).join(' / ');
  const shown = [
    d.designation || '',
    df.hp ? `${df.hp}HP` : '',
    flaLra,
    df.voltage_phase || ''
  ].filter(Boolean);
  s += deviceEquipText(d, textX, g.y + 8, shown);

  s += `</g>`;
  return s;
};

// L3-3 Equipment Connection symbol renderer.
// Anchor: CENTER of circle. Circle (r=27) with inscribed INVERTED triangle
// (flat top, point down). No text inside the symbol — all data fields to the right.
// Port: load_in at (0, 27) — bottom center of circle.
//
// NOTE: Incoming `g` is the anchor the layout engine writes. Current layout
// writes top-left of a 38×54 rect for this symbol. To preserve existing
// placement while conforming to spec anchor semantics, we shift the drawing
// center to (g.x + 27, g.y + 27) — center of a 54×54 bounding box starting
// at g. If layout later writes circle-center directly, remove the shift.
RENDER['L3-3'] = (d, g) => {
  const cx = g.x + 27;      // circle center X (from layout's top-left anchor)
  const cy = g.y + 27;      // circle center Y
  const r = 27;
  let s = `<g class="dev" data-id="${d.id}" style="cursor:pointer">`;

  // Circle
  s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;

  // Inscribed inverted triangle — flat top, point down
  // Spec vertices relative to center: (−21, −13), (21, −13), (0, 24)
  const p1 = `${cx-21},${cy-13}`;  // top-left
  const p2 = `${cx+21},${cy-13}`;  // top-right
  const p3 = `${cx},${cy+24}`;     // bottom apex
  s += `<polygon points="${p1} ${p2} ${p3}" fill="none" stroke="var(--sld-line)" stroke-width="3"/>`;

  // Text to the right per spec — dynamic line spacing stacks populated fields tightly.
  // Designation always at top. Subsequent fields render only if present, advancing
  // the line cursor by LINE_H each time. Order: kw, HP, FLA, voltage_phase.
  const df = d.data_fields || {};
  const textX = cx + r + 13;  // text_gap = 13 per spec
  const LINE_H = 16;
  if (d.designation) {
    s += `<text x="${textX}" y="${cy-8}" font-family="'Courier New',monospace" font-size="12" font-weight="700" text-decoration="underline" fill="var(--sld-text)">${esc(d.designation)}</text>`;
  }
  let lineY = cy + 8;
  if (df.kw)             { s += `<text x="${textX}" y="${lineY}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.kw)}KW</text>`;            lineY += LINE_H; }
  if (df.hp)             { s += `<text x="${textX}" y="${lineY}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.hp)}HP</text>`;            lineY += LINE_H; }
  if (df.fla)            { s += `<text x="${textX}" y="${lineY}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.fla)} FLA</text>`;        lineY += LINE_H; }
  if (df.voltage_phase)  { s += `<text x="${textX}" y="${lineY}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(df.voltage_phase)}</text>`;  lineY += LINE_H; }

  s += `</g>`;
  return s;
};

// ============================================================
// TAG RENDERING
// ============================================================
// OFF-023 (rev 1.0.11): pillDx / pillDy move ONLY the pill — its rect, its text
// and the far end of its leader. The tick stays at (fx, fy), on the feeder.
// a1_tag_placement's existing `dx`/`dy` are applied to fx/fy in renderR1Tags
// BEFORE this function is called, so they slide tick + leader + pill together;
// sliding a tag ALONG its own feeder is legitimate drafting, but sliding one
// ACROSS it detaches the tick and leaves it floating in whitespace (25 such
// ticks on the 9-story hospital's E-501). The leader becomes a short slant to
// the displaced pill, which is the standard drafting answer for a tag that has
// to sit off its own run.
// Precedent: A3_TEXT_PLACEMENT already separates a squiggle's text from its
// squiggle in exactly this way.
// Both default to 0, so every existing call renders byte-identically.
function renderTag(ann, fx, fy, side, orient, parentFeederId, pillBelow, pillDx, pillDy) {
  const pdx = (typeof pillDx === 'number') ? pillDx : 0;
  const pdy = (typeof pillDy === 'number') ? pillDy : 0;
  // GEOMETRY EXPORT HOOK (no-op unless exportGeometry() is running).
  // Capture the A-1 tag's feeder attach point (fx,fy) keyed by annotation id
  // so the Revit add-in can place the A-1 family there. Purely additive.
  // the per-branch hooks below add the pill CENTER (`pill`) so the
  // add-in can register the family's pill to where the viewer draws it.
  if (window.__GEOM_CAP && ann && ann.id) window.__GEOM_CAP.ann[ann.id] = { x: fx, y: fy };
  const txt = getTagText(ann);
  const textLen = txt.length;
  const w = textLen<=4 ? 76 : (textLen<=5 ? 90 : (textLen<=8 ? 108 : Math.min(160, textLen*11)));
  let s = '';
  if (orient === 'horizontal') {
    s += `<line x1="${fx-8}" y1="${fy+10}" x2="${fx+8}" y2="${fy-10}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    // pill_below (via a1_tag_placement) mirrors the pill to hang
    // UNDER the horizontal segment — for hook tags whose above-position lands
    // in a level-line corridor. Default (false) = legacy above-placement.
    const pillY = pillBelow ? fy + 32 : fy - 32 - 31;
    // OFF-023: pill origin = the legacy origin plus the displacement. Adding a
    // literal 0 is exact in IEEE-754, so the pdx/pdy === 0 path emits the same
    // strings the legacy expressions did.
    const pillCx = fx + pdx, pillTy = pillY + pdy;
    // GEOMETRY EXPORT HOOK: pill CENTER, schema §14.1 `pill`.
    if (window.__GEOM_CAP && ann && ann.id) window.__GEOM_CAP.ann[ann.id].pill = { x: pillCx, y: pillTy + 15.5 };
    s += `<line x1="${fx}" y1="${fy}" x2="${pillCx}" y2="${pillBelow ? pillTy : pillTy + 31}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${pillCx-w/2}" y="${pillTy}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${pillCx}" y="${pillTy+20}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  } else if (side === 'right') {
    s += `<line x1="${fx-10}" y1="${fy+8}" x2="${fx+10}" y2="${fy-8}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    const pillX = fx+32+pdx, pillCy = fy+pdy;    // OFF-023
    // GEOMETRY EXPORT HOOK: pill CENTER, schema §14.1 `pill`.
    if (window.__GEOM_CAP && ann && ann.id) window.__GEOM_CAP.ann[ann.id].pill = { x: pillX + w/2, y: pillCy };
    s += `<line x1="${fx}" y1="${fy}" x2="${pillX}" y2="${pillCy}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${pillX}" y="${pillCy-15.5}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${pillX+w/2}" y="${pillCy+5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  } else {
    s += `<line x1="${fx-10}" y1="${fy+8}" x2="${fx+10}" y2="${fy-8}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    const px = fx-32-w+pdx, pillCy = fy+pdy;     // OFF-023
    // GEOMETRY EXPORT HOOK: pill CENTER, schema §14.1 `pill`.
    if (window.__GEOM_CAP && ann && ann.id) window.__GEOM_CAP.ann[ann.id].pill = { x: px + w/2, y: pillCy };
    s += `<line x1="${fx}" y1="${fy}" x2="${px+w}" y2="${pillCy}" stroke="var(--sld-line)" stroke-width="1.5"/>`;
    s += `<rect x="${px}" y="${pillCy-15.5}" width="${w}" height="31" rx="15.5" ry="15.5" fill="var(--sld-tag-bg)" stroke="var(--sld-tag-border)" stroke-width="1.2"/>`;
    s += `<text x="${px+w/2}" y="${pillCy+5}" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="var(--sld-text)">${esc(txt)}</text>`;
  }
  renderedIds.add(ann.id);
  // Wrap the entire tag (tick + leader + pill + text) in a feeder-tag group
  // so it inherits the parent feeder's name on hover.
  const wrapId = parentFeederId || '';
  return `<g class="feeder-tag" data-id="${wrapId}" style="cursor:pointer">${s}</g>`;
}

function renderR1Tags(r, fx, fy, side, orient, pillBelowDefault) {
  let svg = '';
  // layout_config.a1_tag_placement extends/overrides the table
  // (adds the pill_below option alongside dy / force_orient).
  // pillBelowDefault — call-site default for horizontal-orient
  // pill side (per-feeder table/config entries still win where present).
  // Used by placeInternalChains TX-primary jog tags: the above-jog pill sat
  // in the down-sweeping EM fault-current pennant's tail band.
  const ov = (A1_TAG_PLACEMENT_CFG[r.designation] !== undefined)
    ? A1_TAG_PLACEMENT_CFG[r.designation]
    : A1_TAG_PLACEMENT[r.designation];
  let pillBelow = !!pillBelowDefault;
  // OFF-023: pill-only displacement. `dx`/`dy` move the whole tag (tick, leader
  // and pill) — correct when sliding a tag ALONG its own feeder, wrong when
  // moving it ACROSS one, because the tick leaves the line. `pill_dx`/`pill_dy`
  // move the pill alone and stretch the leader to it. Both default to 0.
  let pillDx = 0, pillDy = 0;
  if (ov) {
    if (ov.force_orient) orient = ov.force_orient;
    if (ov.side) side = ov.side;  // per-feeder side override ('left'|'right')
    if (ov.dx) fx += ov.dx;
    if (ov.dy) fy += ov.dy;
    if (ov.pill_below) pillBelow = true;
    if (typeof ov.pill_dx === 'number') pillDx = ov.pill_dx;
    if (typeof ov.pill_dy === 'number') pillDy = ov.pill_dy;
  }
  const a1s = [], a2s = [];
  (annByBound[r.id] || []).forEach(ann => {
    if (ann.annotation_type === 'A-1') a1s.push(ann);
    else if (ann.annotation_type === 'A-2') a2s.push(ann);
  });
  let off = 0;
  a1s.forEach(ann => {
    if (orient === 'horizontal') { svg += renderTag(ann, fx+off, fy, side, 'horizontal', r.id, pillBelow, pillDx, pillDy); off += 100; }
    else { svg += renderTag(ann, fx, fy-off, side, undefined, r.id, undefined, pillDx, pillDy); off += 40; }
  });
  // A-2 callouts: when paired with an A-1 they are indexed only (full schedule
  // available via tooltip on the A-1 pill). When no A-1 is present, render the
  // A-2 inline as the canonical callout glyph per sld_system_model §A-2:
  // half-circle D-loop (r=10, left bulge, rotated 30° CW) + diameter line at
  // the feeder crossing, single diagonal leader to (30,-48), 16px stub,
  // left-aligned text. All callout linework uses text color, NOT cyan. Used
  // for service-entrance and other feeders where the conductor schedule itself
  // is the visible label rather than a feeder schedule reference number.
  if (a1s.length === 0 && a2s.length > 0) {
    const m = (side === 'left') ? -1 : 1;  // mirror leader/stub/text; D-loop stays left-bulge per spec
    const anchor = (side === 'left') ? 'end' : 'start';
    a2s.forEach((ann, i) => {
      const txt = (ann.content && ann.content.callout_text) || '';
      svg += `<g class="feeder-tag" data-id="${r.id}" style="cursor:pointer">`;
      if (i === 0) {
        // rotate() carried per-element (no nested <g>) and the half-circle drawn
        // as two Q segments, NOT an "A" arc: emitted paths must use absolute
        // x,y comma-pairs only (M/L/Q) — the measureMarkupExtent/clash_sweep
        // bbox parsers pair every comma-pair, so arc radii/flags poison boxes.
        svg += `<path d="M${fx},${fy-10} Q${fx-10},${fy-10} ${fx-10},${fy} Q${fx-10},${fy+10} ${fx},${fy+10}" fill="none" stroke="var(--sld-text)" stroke-width="1.2" transform="rotate(30, ${fx}, ${fy})"/>`;
        svg += `<line x1="${fx}" y1="${fy-10}" x2="${fx}" y2="${fy+10}" stroke="var(--sld-text)" stroke-width="1.2" transform="rotate(30, ${fx}, ${fy})"/>`;
        svg += `<line x1="${fx}" y1="${fy}" x2="${fx + m*30}" y2="${fy-48}" stroke="var(--sld-text)" stroke-width="1.2"/>`;
        svg += `<line x1="${fx + m*30}" y1="${fy-48}" x2="${fx + m*46}" y2="${fy-48}" stroke="var(--sld-text)" stroke-width="1.2"/>`;
      }
      svg += `<text x="${fx + m*50}" y="${fy - 44 + (i * 16)}" text-anchor="${anchor}" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(txt)}</text>`;
      svg += `</g>`;
      renderedIds.add(ann.id);
    });
  } else {
    // A-2 paired with an A-1: indexed only (visible in tooltip via the pill)
    a2s.forEach(ann => renderedIds.add(ann.id));
  }
  return svg;
}

// A-3 Squiggle
// Emits <g class="squiggle" data-id="a-NNN"> where a-NNN is the
// annotation ID. Click-to-copy returns the annotation's `designation` field
// (format "SQ-F-NNN"). For the hardcoded "TO UTILITY" primary-side squiggle
// (no R-1 / no A-3 in TOPO), annId is null — resolver falls back to deriving
// SQ- + fallbackFeederId.
function renderSquiggle(x, y, text, textSide, orient, annId, fallbackFeederId) {
  // GEOMETRY EXPORT HOOK (no-op unless exportGeometry() is running).
  // Capture the A-3 squiggle anchor (x,y) keyed by annotation id. Purely additive.
  if (window.__GEOM_CAP && annId) window.__GEOM_CAP.ann[annId] = { x: x, y: y };
  let s = '';
  const hs = 20, amp = 16;
  const o = orient || 'horizontal';
  if (o === 'vertical') {
    s += `<path d="M${x},${y-hs} C${x+amp},${y-hs} ${x+amp},${y-hs/2} ${x},${y} C${x-amp},${y+hs/2} ${x-amp},${y+hs} ${x},${y+hs}" fill="none" stroke="var(--sld-pink)" stroke-width="2.5" stroke-linecap="round"/>`;
    if (textSide === 'left') s += `<text x="${x-28}" y="${y+4}" text-anchor="end" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else s += `<text x="${x+28}" y="${y+4}" text-anchor="start" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    // GEOMETRY EXPORT HOOK (schema §14.1 `label`): the RESOLVED
    // squiggle-label anchor — x/y mirror the <text> x/y above (y is the SVG
    // BASELINE of the 12px label), anchor mirrors text-anchor, text is the raw
    // (un-escaped) label string. Capture-only: emission above is untouched.
    if (window.__GEOM_CAP && annId) {
      window.__GEOM_CAP.ann[annId].label = (textSide === 'left')
        ? { x: x - 28, y: y + 4, anchor: 'end',   text: text }
        : { x: x + 28, y: y + 4, anchor: 'start', text: text };
    }
  } else {
    s += `<path d="M${x-hs},${y} C${x-hs},${y+amp} ${x-hs/2},${y+amp} ${x},${y} C${x+hs/2},${y-amp} ${x+hs},${y-amp} ${x+hs},${y}" fill="none" stroke="var(--sld-pink)" stroke-width="2.5" stroke-linecap="round"/>`;
    // per-squiggle label override (A3_TEXT_PLACEMENT, keyed by
    // the A-3's designation) — side flips above/below, dx slides the
    // middle-anchored label off the vertical stub. Callsite behavior is
    // unchanged for squiggles without a table entry.
    // layout_config.a3_text_placement extends/overrides the
    // table (same contract as a1_tag_placement) — per-CASE entries belong
    // in the case's config, not the shared engine table, because A-3
    // designation series can collide across cases (the same SQ-F-30x-S2
    // designation can recur in different buildings with different needs).
    const _a3des = (annId && anMap[annId]) ? anMap[annId].designation : null;
    const _a3ov = _a3des
      ? ((A3_TEXT_PLACEMENT_CFG[_a3des] !== undefined)
          ? A3_TEXT_PLACEMENT_CFG[_a3des]
          : A3_TEXT_PLACEMENT[_a3des]) || null
      : null;
    const _ts = (_a3ov && _a3ov.side) || textSide;
    const _tx = x + ((_a3ov && _a3ov.dx) || 0);
    const _tdy = (_a3ov && _a3ov.dy) || 0;  // extra vertical offset after the side rule
    // 'left'/'right' side labels for horizontal-orient squiggles
    // (end-/start-anchored beside the curl, vertically centered on it — the
    // same convention the vertical-orient branch uses). A middle-anchored
    // below-label on a vertical entry stub reaches ±47 px and gets crossed
    // by the ATS's own source-2 riser 36 px east; a side label clears every
    // riser and stays off the jog-tier rows entirely.
    if (_ts === 'left') s += `<text x="${_tx-28}" y="${y+4+_tdy}" text-anchor="end" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else if (_ts === 'right') s += `<text x="${_tx+28}" y="${y+4+_tdy}" text-anchor="start" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else if (_ts === 'above') s += `<text x="${_tx}" y="${y-24+_tdy}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    else s += `<text x="${_tx}" y="${y+28+_tdy}" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" font-weight="600" fill="var(--sld-text)">${esc(text)}</text>`;
    // GEOMETRY EXPORT HOOK (schema §14.1 `label`): the RESOLVED
    // squiggle-label anchor AFTER the side/override rules above (engine
    // A3_TEXT_PLACEMENT + layout_config.a3_text_placement) — this is why the
    // add-in never mirrors those tables. x/y mirror the emitted <text> x/y
    // (y is the SVG BASELINE), anchor mirrors text-anchor, text is the raw
    // (un-escaped) label string. Capture-only: emission above is untouched.
    if (window.__GEOM_CAP && annId) {
      window.__GEOM_CAP.ann[annId].label =
          _ts === 'left'  ? { x: _tx - 28, y: y + 4 + _tdy,  anchor: 'end',    text: text }
        : _ts === 'right' ? { x: _tx + 28, y: y + 4 + _tdy,  anchor: 'start',  text: text }
        : _ts === 'above' ? { x: _tx,      y: y - 24 + _tdy, anchor: 'middle', text: text }
        :                   { x: _tx,      y: y + 28 + _tdy, anchor: 'middle', text: text };
    }
  }
  // data-id: prefer annotation ID (canonical). Fallback to feeder ID as a
  // hint for the resolver's derivation path (see resolveCopyTextForElement).
  const wrapId = annId || fallbackFeederId || '';
  const extraAttr = (!annId && fallbackFeederId) ? ` data-fallback-feeder="${fallbackFeederId}"` : '';
  return `<g class="squiggle" data-id="${wrapId}"${extraAttr} style="cursor:pointer">${s}</g>`;
}

// Switchboard text (right-aligned, left of lineup)
function swText(x, y, sw) {
  let s = '';
  const df = sw.data_fields || {};
  // `df.aic` is not part of the block — there is no References/AIC line:
  // it is neither drawn nor exported (the capture below shares this array
  // by design).
  const lines = [sw.designation, df.rating||'', df.voltage||'', df.wires||''];
  const shown = lines.filter(Boolean);
  // Declared before the capture below so the exported pitches and the drawn
  // ones are the SAME constants — the §14.8 contract cannot drift from the
  // render by construction. See the style block further down for the values'
  // provenance (the catalog L1-2 card).
  const LINE_PITCH = 18, FIRST_LINE_PITCH = 20;
  // Schema §14.8: A-8 equipment label block. Captured HERE rather
  // than at the call site so `label`/`lines` are the POST-COMPACTION array by
  // construction — swText drops blank fields, so a blank `rating` slides
  // `voltage` up a slot, while the Revit family has FIXED slots. Exporting the
  // resolved list is what makes viewer and Revit agree, and it dodges the
  // known-unsolved blank-write bug (add-in CLAUDE.md: a " " write still renders
  // as unset, so the family's authored sample prints anyway).
  // `label` = the bold+underlined first line (family `Label Panel Name`);
  // `lines` = the remaining lines (family `Line N Text`), encoding
  // swText's real style break at i===0. Four named keys only
  // (designation/rating/voltage/wires — no aic) — never a generic
  // data_fields dump (an exercise case's sw-101 carried data_fields.ser, which
  // swText ignores). Anchor is the first line's baseline right-end, hence
  // align:"end". Not fed to ext(). Guarded so normal renders never capture.
  if (window.__GEOM_CAP && window.__GEOM_CAP.equipmentLabels) {
    window.__GEOM_CAP.equipmentLabels.push({
      sheet: sw.sheet_id, bound_to: sw.id, bound_to_type: 'switchboard',
      x, y, align: 'end',
      // the step is NON-UNIFORM. `line_pitch` keeps its
      // meaning — the step between successive lines — and `first_line_pitch`
      // carries the wider label->line-1 step the catalog specifies. A consumer
      // places `label` at y, `lines[0]` at y + first_line_pitch, and
      // `lines[i>0]` at y + first_line_pitch + i*line_pitch. Two scalars rather
      // than an array: this is the actual rule, and it stays correct under
      // compaction (which changes how MANY lines show, never the steps).
      line_pitch: LINE_PITCH, first_line_pitch: FIRST_LINE_PITCH,
      label: shown[0] || '', lines: shown.slice(1)
    });
  }
  // The label block follows the CATALOG's L1-2 card,
  // which is the visual master (Mayo's decision 7 — "adopted
  // wholesale"). It differs from a plain 11px stack THREE ways, not one:
  //   line 0  13px bold underlined  ->  12px bold underlined
  //   line 1  11px normal, step 18  ->  12px BOLD,   step 20
  //   line 2+ 11px normal, step 18  ->  12px normal, step 18
  // i.e. 12px throughout, the first step widened to 20, all later steps 18.
  // (there is no 5th `aic` line — the catalog card never had one.)
  // `text-anchor="end"` and the
  // `lines.filter(Boolean)` compaction above are deliberately UNCHANGED.
  // Font family stays 'Courier New',monospace — the catalog says `monospace`,
  // but decision 7 scoped this to size/weight/underline/step only.
  // (LINE_PITCH / FIRST_LINE_PITCH are declared above the capture block.)
  shown.forEach((line, i) => {
    const style = i===0 ? 'font-weight:700;text-decoration:underline;font-size:12px'
                : i===1 ? 'font-weight:700;font-size:12px'
                :         'font-size:12px';
    const dy = i===0 ? 0 : FIRST_LINE_PITCH + (i-1)*LINE_PITCH;
    s += `<text x="${x}" y="${y+dy}" text-anchor="end" font-family="'Courier New',monospace" fill="var(--sld-text)" style="${style}">${esc(line)}</text>`;
  });
  return s;
}

// Device-bound A-8 equipment-label block. Same visual grammar as
// swText — line 0 bold+underlined, line 1 bold, 12px, steps 20 then 18 — but
// START-anchored: the stack sits to the RIGHT of a device glyph and grows
// rightward, so the anchor is the FIRST LINE'S BASELINE AT ITS LEFT END and
// the record exports align:"start" (switchboard blocks stay "end"). The
// capture lives HERE for the same reason swText's does: `shown` is the
// caller's POST-COMPACTION array, so the exported label/lines match the drawn
// ones by construction. Emitters today: RENDER['L1-5'] (generator) and
// RENDER['L3-1'] (fire pump) — their side text is an A-8 block
// so the add-in places the _E_SLD_Equipment-info family instead of TextNote
// stacks. Not fed to ext(). Guarded so normal renders never capture.
function deviceEquipText(d, x, y, shown) {
  if (!shown.length) return '';
  let s = '';
  const LINE_PITCH = 18, FIRST_LINE_PITCH = 20;
  if (window.__GEOM_CAP && window.__GEOM_CAP.equipmentLabels) {
    window.__GEOM_CAP.equipmentLabels.push({
      sheet: d.sheet_id, bound_to: d.id, bound_to_type: 'device',
      x, y, align: 'start',
      line_pitch: LINE_PITCH, first_line_pitch: FIRST_LINE_PITCH,
      label: shown[0] || '', lines: shown.slice(1)
    });
  }
  // ATTRIBUTE-form styling (not swText's style-form): the snapshot layer's
  // rsvgSafe underline inliner (_snapInlineUnderlines) only matches
  // text-decoration="underline" as an attribute, so attribute form is what
  // keeps the designation underline drawn in rsvg PNGs — exactly as the old
  // L1-5/L3-1 attribute-form stacks did. (swText's style-form underline is
  // NOT inlined — pre-existing, out of scope here.) Rendered look is
  // identical in-browser either way.
  shown.forEach((line, i) => {
    const wt = i <= 1 ? ' font-weight="700"' : '';
    const deco = i === 0 ? ' text-decoration="underline"' : '';
    const dy = i===0 ? 0 : FIRST_LINE_PITCH + (i-1)*LINE_PITCH;
    s += `<text x="${x}" y="${y+dy}" font-family="'Courier New',monospace" font-size="12"${wt}${deco} fill="var(--sld-text)">${esc(line)}</text>`;
  });
  return s;
}

// ============================================================
// CHAIN Y OVERRIDES
// Returns a map { device_id: overrideY } for S1 Chain A sub-dist anchors
// that must land at distinct floor Y. Floors index 0..N-1 from top:
// index 0 (Roof) is placed highest, index N-1 (Level 1) at default skyline.
// Empty map on non-S1 sheets — no-op.
//
// Cascades: placeSubFeeds and placeInternalChains read parent Y from G[]
// at render time, so moving the anchor moves the whole floor module
// (siblings below, internal chains above). Feeder from CB to panel_top
// stretches within its own X column — no cross-column collisions.
// ============================================================
function computeChainYOverrides(sheetId, secBusY) {
  const overrides = {};
  // reset the per-sheet floor-row Y map (populated below when the
  // sheet has a floor order; consumed by placeManualRouteFeeders' generic
  // floor-banded column branch).
  __FLOOR_ROW_Y = {};
  // OFF-005: per-sheet floor order. The legacy flat-array form
  // is defined as ≡ {S1: array} — anchoring applies on S1 only, exactly the
  // hospital behavior. The object form ({sheetId: [floors top→down]})
  // resolves per sheet, so continuation/emergency sheets can carry their
  // own floor stacks. Sheets with no entry return the empty map (legacy).
  const _foConf = HOSPITAL_FLOOR_ORDER_S1;
  const _floorOrder = Array.isArray(_foConf)
    ? (sheetId === 'S1' ? _foConf : null)
    : ((_foConf && _foConf[sheetId]) || null);
  if (!_floorOrder) return overrides;

  // per-sheet floor anchors. The legacy flat form
  // ({floor: designation}) applies on every sheet — the device lookup below
  // filters by sheet_id, so behavior is byte-identical to the prior build. The
  // object-of-sheets form ({sheetId: {floor: designation}}) resolves per
  // sheet, so a riser-split continuation sheet (Blue Heron S1A: the west
  // riser spans the SAME floor codes as S1's east riser) can carry its own
  // anchor set. Sheets with no entry get no anchors. Form detection: every
  // value is an object ⇒ per-sheet.
  const _anchorsFor = (conf) => {
    if (!conf) return {};
    const vals = Object.values(conf);
    const perSheet = vals.length > 0 && vals.every(v => v && typeof v === 'object');
    return perSheet ? (conf[sheetId] || {}) : conf;
  };
  const _FA      = _anchorsFor(HOSPITAL_FLOOR_ANCHOR_S1);
  const _FA_MECH = _anchorsFor(HOSPITAL_FLOOR_ANCHOR_S1_MECH);

  const topY = secBusY - DIM.cb_height;
  // ≡ legacy topY − chain_h_min + cb_height − panel_S (the cb_height terms
  // cancel). Anchored on secBusY so the row is independent of the CB box;
  // boxH('L2-4') keeps the panel BOTTOM edge (feeder terminus) on the frozen
  // row secBusY − chain_h_min whatever the panel box height is.
  const baselineEqY = secBusY - DIM.chain_h_min - boxH('L2-4');

  // Two-tier step — Roof→L3 uses hospital_riser_step_roof (accounts
  // for 4M-R-B/C siblings placed by placeSubFeeds at parent_bottom + 260px);
  // L3→L2 and L2→L1 use hospital_riser_step_std. Walk the floor order from
  // bottom (L1 at baseline) upward, accumulating the correct step per pair.
  //
  // HOSPITAL_FLOOR_ORDER_S1 is top-down: [R, 3, 2, 1]. We walk in reverse
  // (bottom-up) so L1 gets offset 0, then each step up accumulates.
  const floorsBottomUp = [..._floorOrder].reverse();  // hospital S1: [1, 2, 3, R]
  // per-floor row Y, independent of anchor-device existence —
  // the same baseline+step walk the anchor loop below performs.
  {
    let _fOff = 0;
    floorsBottomUp.forEach((floor, idx) => {
      if (idx > 0) _fOff += (floor === 'R') ? DIM.hospital_riser_step_roof : DIM.hospital_riser_step_std;
      __FLOOR_ROW_Y[floor] = baselineEqY - _fOff;
    });
  }
  let cumulativeOffset = 0;

  floorsBottomUp.forEach((floor, idx) => {
    const desig = _FA[floor];
    if (!desig) return;
    const dev = TOPO.devices.find(d => d.designation === desig && d.sheet_id === sheetId);
    if (!dev) {
      return;
    }

    // idx=0 is L1 (bottom, baseline, offset=0)
    // idx=1 is L2: step from L1 uses standard
    // idx=2 is L3: step from L2 uses standard
    // idx=3 is Roof: step from L3 uses roof step
    if (idx > 0) {
      const isRoofStep = (floor === 'R');
      const stepSize = isRoofStep ? DIM.hospital_riser_step_roof : DIM.hospital_riser_step_std;
      cumulativeOffset += stepSize;
    }

    overrides[dev.id] = baselineEqY - cumulativeOffset;
  });

  // Mechanical branch floor stack (parallel to 4L stack).
  // Walks HOSPITAL_FLOOR_ANCHOR_S1_MECH using the same baseline + step math.
  // Floors 1/2/3 only (no Roof entry in the M map — see comment above).
  // Independent cumulativeOffset so the M stack baselines from L1 cleanly,
  // matching the 4L cumulativeOffset pattern.
  // OFF-006: mech floors derive from the anchor map instead of a
  // hardcoded list. Hospital: mech map has floors 1/2/3 and floorsBottomUp is
  // [1,2,3,R] → yields exactly ['1','2','3'] (legacy identical).
